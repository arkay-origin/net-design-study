<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0c0b10"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ENSLD Study"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ENSLD 300-420 Study Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centred study column — deck controls on top, a single card, grade buttons pinned under it. Black field, tan type, red reserved for "review again" and the active marker. */
:root{
  /* Palette taken from the slide deck: blue-black ground, pale khaki wordmark, brass-gold tagline, orange-red badge field, multicam olive */
  --bg:#0c0b10; --panel:#15141b; --line:#2a2833;
  --tan:#d9d7b0; --tan-dim:#bfa152; --ink:#ebe8dc; --muted:#8d8a7c;
  --red:#d9561f; --red-soft:#33190f; --ok:#8f9d4c;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --label:"Saira","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 84px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:2.3rem;letter-spacing:.03em;text-transform:uppercase;color:var(--tan);margin:0;line-height:1;text-wrap:balance}
h1 span{color:var(--red)}
.tally{font-family:var(--mono);font-size:.8rem;color:var(--muted);display:flex;gap:14px;font-variant-numeric:tabular-nums}
.tally b{color:var(--ink);font-weight:500}
.tally .k b{color:var(--ok)} .tally .r b{color:var(--red)}
.label{font-family:var(--label);font-weight:500;text-transform:uppercase;letter-spacing:.28em;font-size:.72rem;color:var(--tan-dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .82rem var(--body);background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:5px 9px;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--bg);background:var(--tan);border-color:var(--tan)}
.chip:hover{border-color:var(--tan-dim)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{font:500 .82rem var(--body);background:transparent;color:var(--muted);border:0;padding:6px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--tan)}
.tool{font:500 .82rem var(--body);background:transparent;color:var(--tan);border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer}
.tool:hover{border-color:var(--tan-dim)}
.tool.danger{color:var(--muted)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tan);width:0;transition:width .3s}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--tan);border-radius:4px;padding:22px 22px 20px;min-height:280px;display:flex;flex-direction:column;gap:14px;cursor:pointer;outline:none}
.card:focus-visible{box-shadow:0 0 0 2px var(--tan)}
.card.flipped{border-top-color:var(--red)}
.meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.meta .st-r{color:var(--red)} .meta .st-k{color:var(--ok)}
.q{font-size:1.2rem;font-weight:500;line-height:1.4;color:var(--ink);text-wrap:pretty;margin:0}
.hint{margin-top:auto;font-size:.82rem;color:var(--muted)}
.ans{display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--line);padding-top:14px}
.ans ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ans li{padding-left:16px;position:relative;font-weight:600;color:var(--tan)}
.ans li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;background:var(--red)}
.why,.note{margin:0;font-size:.93rem;color:var(--ink);max-width:65ch}
.why b,.note b{font-family:var(--label);font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:.68rem;color:var(--tan-dim);margin-right:6px}
.note{background:var(--red-soft);border-left:2px solid var(--red);padding:8px 10px;border-radius:2px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade button{font:700 1.05rem var(--display);text-transform:uppercase;letter-spacing:.08em;padding:12px;border-radius:3px;cursor:pointer;border:1px solid}
.again{background:transparent;color:var(--red);border-color:var(--red)}
.again:hover{background:var(--red-soft)}
.got{background:var(--tan);color:var(--bg);border-color:var(--tan)}
.got:hover{filter:brightness(1.08)}
.grade button:disabled{opacity:.35;cursor:default}
.nav{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.nav button{background:none;border:0;color:var(--tan-dim);font:500 .82rem var(--body);cursor:pointer;padding:4px 0}
.done{text-align:center;padding:40px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.done h2{font-family:var(--display);text-transform:uppercase;color:var(--tan);margin:0;font-size:1.6rem}
.done p{margin:0;color:var(--muted)}
.keys{font-size:.75rem;color:var(--muted);text-align:center}
.keys kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:2px;padding:0 4px;color:var(--tan-dim)}

.views{display:flex;border:1px solid var(--tan-dim);border-radius:3px;overflow:hidden}
.views button{font:700 .95rem var(--display);text-transform:uppercase;letter-spacing:.1em;background:transparent;color:var(--tan);border:0;padding:8px 14px;cursor:pointer}
.views button+button{border-left:1px solid var(--tan-dim)}
.views button[aria-pressed="true"]{background:var(--tan);color:var(--bg)}
.search{width:100%;font:400 .95rem var(--body);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:9px 11px}
.search:focus{outline:2px solid var(--tan);outline-offset:0;border-color:var(--tan)}
.search::placeholder{color:var(--muted)}
.gsec{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.gsec h2{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:1.45rem;color:var(--tan);margin:18px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-wrap:balance}
.gsec h2 small{font:500 .75rem var(--mono);color:var(--muted);letter-spacing:0;white-space:nowrap}
.cheat{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tan-dim);border-radius:3px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.cheat b{font-family:var(--label);font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:.68rem;color:var(--tan-dim);margin-right:6px}
.tblwrap{overflow-x:auto}
.cheat table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
.cheat th,.cheat td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--line)}
.cheat th{color:var(--tan-dim);font-weight:600}
.gq{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.gq:last-child{border-bottom:0}
.gq h3{margin:0;font-size:1.05rem;font-weight:500;line-height:1.45;color:var(--ink);display:flex;gap:10px}
.gq h3 .n{font:500 .8rem var(--mono);color:var(--red);padding-top:3px;flex:none;min-width:2.2em}
.gq .ans{border-top:0;padding-top:0;padding-left:calc(2.2em + 10px)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.top{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font:600 .8rem var(--body);background:var(--panel);color:var(--tan);border:1px solid var(--line);border-radius:3px;padding:8px 10px;cursor:pointer}
@media (max-width:480px){.gq .ans{padding-left:0}}
.dia{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:10px 8px;overflow-x:auto}
.dia svg{display:block;width:100%;min-width:300px;height:auto;max-height:420px}
.d-box{fill:none;stroke:var(--line);stroke-width:1.2}.d-boxa{fill:var(--panel)}
.d-rt{fill:var(--panel);stroke:var(--tan);stroke-width:1.4}.d-x{stroke:var(--tan);stroke-width:1.2;fill:none}
.d-ln{stroke:var(--tan-dim);stroke-width:1.4;fill:none}.d-dash{stroke-dasharray:4 3}.d-red{stroke:var(--red)}
.d-arh{fill:var(--red)}.d-redt{fill:var(--red)}
.d-t{fill:var(--ink);font:500 10px var(--body)}.d-s{fill:var(--muted);font:400 9px var(--body)}
.d-h{fill:var(--tan-dim);font:500 9px var(--label);letter-spacing:.16em}
.d-cloud{fill:var(--panel);stroke:var(--muted);stroke-width:1}
.d-sep{stroke:var(--line);stroke-width:1}
.d-tun{fill:var(--tan-dim);fill-opacity:.35;stroke:var(--tan-dim)}
.d-fw{fill:var(--panel);stroke:var(--red);stroke-width:1.4}
.d-blk{fill:none;stroke:var(--red);stroke-width:2}.d-blkl{stroke:var(--red);stroke-width:2}
.test{border-top:1px solid var(--line);padding-top:10px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}.test p{margin:0}.test b{font-family:var(--label);font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:.66rem;color:var(--tan-dim)}
.book{font-size:.88rem;display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:3px;padding:12px 14px}
.book .lbl{font-family:var(--label);font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:.66rem;color:var(--tan-dim)}
.book ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--ink)}
.book ul li::marker{color:var(--red)}
.book .rl{display:flex;flex-direction:column;gap:3px;font:500 .78rem var(--mono);color:var(--muted)}
.ref{margin:0;font:500 .74rem var(--mono);color:var(--muted)}
.ref b{font-family:var(--label);font-weight:500;letter-spacing:.18em;text-transform:uppercase;font-size:.62rem;color:var(--tan-dim);margin-right:6px}
.srcnote{margin:0;font-size:.82rem;color:var(--muted)}
.chip.bk{border-style:dashed}
.spick{display:flex;flex-direction:column;gap:12px;width:100%;flex:1 1 100%}
.sgh{display:flex;justify-content:space-between;align-items:baseline;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:0 0 4px;margin-bottom:6px;cursor:pointer;font-family:var(--label);font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:.7rem;color:var(--tan-dim)}
.sgh[aria-pressed="true"]{color:var(--tan)}
.sgn{font-family:var(--mono);letter-spacing:0;font-size:.72rem}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.sgrid .chip{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:8px 10px;min-height:38px}
.sgrid .chip .cn{opacity:.6;font-family:var(--mono);font-size:.75rem}

.srctag{display:inline-block;vertical-align:middle;margin-left:6px;font:500 .62rem var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--tan-dim);border:1px solid var(--line);border-radius:2px;padding:1px 5px}

.mgrp{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.secnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hit{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;color:var(--ink);font:500 .97rem/1.45 var(--body);cursor:pointer}
.hit .n{font:500 .8rem var(--mono);color:var(--red);padding-top:3px;flex:none;min-width:2.2em}
.hit .hans{display:block;font-weight:600;color:var(--tan);font-size:.88rem;margin-top:3px}
.fold{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tan-dim);border-radius:3px;padding:0 14px;font-size:.92rem}
.fold.bk{border-left-color:var(--red)}
.fold>summary{cursor:pointer;list-style:none;padding:11px 0;font-family:var(--label);font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:.72rem;color:var(--tan-dim)}
.fold>summary::-webkit-details-marker,.gq>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:" +";color:var(--muted)}.fold[open]>summary::after{content:" –"}
.fold[open]{padding-bottom:14px;display:flex;flex-direction:column;gap:10px}
details.gq>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:8px}
details.gq .tapr{padding-left:calc(2.2em + 10px);font-size:.8rem;color:var(--muted)}
details.gq[open] .tapr{display:none}
details.gq[open]>summary{margin-bottom:10px}
details.gq.flash{background:var(--red-soft);transition:background .4s}
button:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
@media (max-width:480px){h1{font-size:1.6rem}.q{font-size:1.08rem}.card{padding:18px 16px}.keys{display:none}}
/* ----- practice test ----- */
.tpanel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tpanel h2{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:1.3rem;color:var(--tan);margin:0}
.tsub{margin:0;font-size:.85rem;color:var(--muted)}
.weak{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) 3.2em;gap:4px 10px;align-items:center;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%}
.wrow:last-child{border-bottom:0}
.wrow .nm{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .pc{font:500 .8rem var(--mono);text-align:right;color:var(--tan);font-variant-numeric:tabular-nums}
.wrow .pc.lo{color:var(--red)}
.wrow .wb{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.wrow .wb i{display:block;height:100%;background:var(--tan)}
.wrow .wb i.lo{background:var(--red)}
.wrow .dt{grid-column:1/-1;font:500 .7rem var(--mono);color:var(--muted)}
button.wrow:hover .nm{color:var(--tan)}
.go{font:700 1.05rem var(--display);text-transform:uppercase;letter-spacing:.08em;padding:12px 16px;border-radius:3px;cursor:pointer;background:var(--tan);color:var(--bg);border:1px solid var(--tan)}
.go:disabled{opacity:.35;cursor:default}
.go.alt{background:transparent;color:var(--tan)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.btnrow>*{flex:1 1 140px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:400 .97rem/1.45 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:10px 12px;cursor:pointer}
.opt .bx{flex:none;width:18px;height:18px;margin-top:2px;border:1.5px solid var(--muted);display:grid;place-items:center;font:600 .7rem var(--mono);color:var(--bg)}
.opt.radio .bx{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--tan)}
.opt[aria-pressed="true"] .bx{background:var(--tan);border-color:var(--tan)}
.opt.ok{border-color:var(--ok);background:rgba(143,157,76,.12)}
.opt.ok .bx{background:var(--ok);border-color:var(--ok)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.bad .bx{background:var(--red);border-color:var(--red)}
.opt:disabled{cursor:default;color:var(--ink)}
.pick{margin:0;font:500 .72rem var(--label);letter-spacing:.2em;text-transform:uppercase;color:var(--tan-dim)}
.verdict{font:700 1.2rem var(--display);text-transform:uppercase;letter-spacing:.06em;margin:0}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--red)}
.score{font:700 3.2rem var(--display);color:var(--tan);line-height:1;margin:0}
.miss{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.miss:last-child{border-bottom:0}
.miss .mq{font-weight:500;margin:0}
.miss .yp{margin:0;color:var(--red);font-size:.86rem}
.miss ul{margin:0;padding-left:16px;color:var(--tan);font-weight:600}
@media (max-width:480px){.views button{padding:8px 9px;font-size:.86rem;letter-spacing:.06em}}
.cfold>summary{display:flex;align-items:baseline;gap:10px;font-size:.78rem;letter-spacing:.14em;color:var(--tan)}
.cfold>summary::after{margin-left:auto}
.cfold .cn{font:500 .75rem var(--mono);color:var(--red);letter-spacing:0}
.cfold .cc{font:500 .68rem var(--mono);color:var(--muted);letter-spacing:0;text-transform:none;white-space:nowrap}
.terms{margin:0;display:flex;flex-direction:column}
.terms>div{display:grid;grid-template-columns:minmax(7.5em,32%) 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.terms dt{font-weight:600;color:var(--tan);font-size:.9rem}
.terms dd{margin:0;font-size:.92rem;color:var(--ink)}
.clist{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:.82rem}
.ctip{margin:4px 0 0;padding:10px 12px;background:var(--red-soft);border-left:3px solid var(--red);font-size:.9rem}
.ctip b{display:block;font:500 .66rem var(--label);text-transform:uppercase;letter-spacing:.22em;color:var(--red);margin-bottom:3px}
.cq{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.cq .mq{margin:0;font-weight:500}
@media (max-width:480px){.terms>div{grid-template-columns:1fr;gap:2px}}
.views{display:grid;grid-template-columns:repeat(4,auto)}
.views button+button{border-left:1px solid var(--tan-dim)}
@media (max-width:560px){.views{grid-template-columns:1fr 1fr;width:100%}.views button:nth-child(3){border-left:0}.views button:nth-child(n+3){border-top:1px solid var(--tan-dim)}}
.seg{flex-wrap:wrap}
.star{background:none;border:0;padding:0 2px;margin-left:6px;font-size:1.05rem;line-height:1;color:var(--muted);cursor:pointer;vertical-align:baseline}
.star[aria-pressed="true"]{color:var(--red)}
.star:hover{color:var(--tan)}
.foot{border-top:1px solid var(--line);padding-top:16px;margin-top:8px}
.foot .btnrow>*{flex:1 1 160px}
.sumq{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line);font-size:.92rem}
.sumq .mq{margin:0;font-weight:500}
.sumq ul{margin:0;padding-left:16px;color:var(--tan);font-weight:600}
.trend{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.trend i{flex:1;max-width:36px;background:var(--tan-dim);border-radius:2px 2px 0 0;position:relative}
.trend i.lo{background:var(--red)}
.trend i span{position:absolute;top:-16px;left:0;right:0;text-align:center;font:500 .66rem var(--mono);color:var(--muted)}
.ltabs{display:flex;border:1px solid var(--tan-dim);border-radius:3px;overflow:hidden}
.ltabs button{flex:1;font:600 .9rem var(--display);text-transform:uppercase;letter-spacing:.08em;padding:9px 10px;background:none;color:var(--tan);border:0;cursor:pointer}
.ltabs button+button{border-left:1px solid var(--tan-dim)}
.ltabs button[aria-pressed="true"]{background:var(--tan);color:var(--bg)}
.lsn{display:flex;flex-direction:column;gap:14px;overflow-wrap:anywhere;min-width:0}
.lsn h2{margin:0}
.lsn .lmeta{font:500 .72rem var(--mono);color:var(--muted)}
.lsn h3.lh{margin:0;font:700 1.35rem/1.2 var(--display);color:var(--ink);text-transform:none;letter-spacing:.01em}
.lsn p.lp{margin:0;font-size:1rem;line-height:1.6}
.lsn ul.lu{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.55}

  "notes": [
   "Dual stack is the recommended transition method. Tunnels (manual, 6to4, 6rd, ISATAP, DS-Lite) and translation (NAT64/DNS64) fill gaps.",

   "Security: RA Guard blocks rogue router advertisements, SEND/CGA secures ND with certificates, and the IPv6 policy must match the existing IPv4 policy. Tunnels have no built-in security, so add IPsec."

rformance."}, {"n": 34, "dom": "WAN", "q": "An SD-WAN edge behind NAT must establish secure overlay connectivity. Which two items are particularly relevant?", "o": ["NAT traversal and supported transport connectivity", "Correct controller/validator reachability", "Disable all certificates", "Use only STP", "Require a public address on every LAN endpoint"], "c": [0, 1], "why": "Onboarding and tunnel establishment depend on NAT handling and reachability to control components."}, {"n": 35, "dom": "WAN", "q": "A company requires private high-capacity optical transport between data centers across a metropolitan area. Which technology is most closely associated with wavelength multiplexing?", "o": ["DWDM", "NHRP", "PIM-SM", "VRRP"], "c": [0], "why": "DWDM carries many wavelengths over one fibre pair, giving very high private capacity between sites in a metro area."}, {"n": 36, "dom": "Network Services", "q": "A WAN edge must smooth traffic bursts to a contracted rate while minimizing unnecessary drops. Which QoS action is preferred?", "o": ["Shaping", "Policing", "BPDU Guard", "Route reflection"], "c": [0], "why": "Shaping buffers bursts and controls egress transmission rate."}, {"n": 37, "dom": "Network Services", "q": "A service provider must enforce a strict traffic contract and immediately drop or remark excess packets. Which mechanism applies?", "o": ["Policing", "Shaping only", "LISP", "NSSA"], "c": [0], "why": "Policing enforces the configured rate without buffering excess traffic."}, {"n": 38, "dom": "Network Services", "q": "Voice packets must receive strict priority under congestion. Which queuing feature is commonly selected?", "o": ["LLQ", "WRED only", "FIFO only", "RPF"], "c": [0], "why": "LLQ provides a priority queue, typically with policing safeguards."}, {"n": 39, "dom": "Network Services", "q": "Which marking is commonly recommended for voice bearer traffic?", "o": ["DSCP EF (46)", "DSCP CS0 (0)", "AF11 (10)", "CS1 (8)"], "c": [0], "why": "Expedited Forwarding EF 46 is commonly used for voice bearer."}, {"n": 40, "dom": "Network Services", "q": "A company wants scalable differentiated traffic treatment without per-flow resource reservations. Which model fits?", "o": ["DiffServ", "IntServ with RSVP per flow", "STP", "PIM bidirectional"], "c": [0], "why": "DiffServ applies class-based treatment using markings."}, {"n": 41, "dom": "Network Services", "q": "A multicast receiver joins a specific (S,G) channel and the design must avoid an RP. Which model should be selected?", "o": ["SSM", "ASM shared tree only", "MSDP RP discovery", "PIM bidirectional only"], "c": [0], "why": "Source-specific multicast uses source/group subscriptions without an RP."}, {"n": 42, "dom": "Network Services", "q": "A PIM-SM multicast packet arrives on an interface that is not the expected path toward its source. What should occur?", "o": ["RPF check fails and packet is discarded", "Packet is always flooded", "Packet becomes a unicast packet", "RP is automatically removed"], "c": [0], "why": "RPF checks prevent multicast loops and unwanted duplicate forwarding."}, {"n": 43, "dom": "Network Services", "q": "A PIM-SM Any-Source Multicast design uses a shared tree. Which node acts as its root?", "o": ["Rendezvous Point", "DR in OSPF", "BGP route reflector", "LACP actor"], "c": [0], "why": "The RP roots the shared tree in PIM-SM ASM."}, {"n": 44, "dom": "Network Services", "q": "A network must remain manageable when its production routing plane is unavailable. Which management approach best supports this goal?", "o": ["Dedicated out-of-band management", "In-band management only", "SNMP over production default route only", "No separate management access"], "c": [0], "why": "An independent OOB network provides a separate management path."}, {"n": 45, "dom": "Network Services", "q": "A company wants its operations traffic isolated from user traffic using a separate routing instance. Which solution is most appropriate?", "o": ["Management VRF", "Single shared default VRF", "Disable SSH", "Increase DSCP for all user traffic"], "c": [0], "why": "A management VRF gives operations traffic its own routing table, separate from user traffic, even when it shares the same physical network."}, {"n": 46, "dom": "Automation", "q": "A design calls for a vendor-neutral YANG model maintained by an industry community for network interfaces. Which model family is most appropriate?", "o": ["OpenConfig", "Cisco proprietary YANG only", "MST", "OSPF LSAs"], "c": [0], "why": "OpenConfig is a vendor-neutral set of YANG models written by an operator-led industry group. IETF models are standards-body models, and native models are vendor-specific."}, {"n": 47, "dom": "Automation", "q": "An automation application needs transactional network configuration operations over SSH using XML RPCs. Which protocol fits?", "o": ["NETCONF", "RESTCONF using JSON only", "SNMP traps", "TFTP"], "c": [0], "why": "NETCONF uses XML-encoded RPCs, commonly over SSH TCP 830."}, {"n": 48, "dom": "Automation", "q": "An application uses HTTPS methods to read and change YANG-modeled resources. Which interface best matches?", "o": ["RESTCONF", "LACP", "IS-IS", "BFD"], "c": [0], "why": "RESTCONF exposes YANG data through HTTP methods."}, {"n": 49, "dom": "Automation", "q": "Telemetry should notify a collector when an operational value changes rather than only at fixed intervals. Which subscription mode fits?", "o": ["On-change", "Periodic only", "Syslog disabled", "Static polling once per day"], "c": [0], "why": "On-change telemetry emits updates when subscribed state changes, subject to implementation."}, {"n": 50, "dom": "Automation", "q": "A controller needs streaming model-driven telemetry over a gRPC-based network management interface. Which protocol is most appropriate?", "o": ["gNMI", "TACACS+", "STP", "NHRP"], "c": [0], "why": "gNMI runs over gRPC and handles both configuration and streaming model-driven telemetry."}],DOMS=['Routing','Campus','WAN','Network EXAM.forEach(e=>{BYID['mock#'+e.n]={id:'mock#'+e.n,sec:e.dom,num:e.n,q:e.q,a:e.c.map(k=>e.o[k]),why:e.why,note:'',src:'Mock exam',mc:{o:e.o,c:e.c},mock:true}});
T.mocks=T.mocks||[];

let tTick=null;
function fmtT(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+':'+String(s).padStart(2,'0')}
let tArmed=false;
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const NUMW=['','one','two','three','four','five','six'];

function secStats(name){
  const cs=CARDS.filter(c=>c.sec===name);let ok=0,seen=0,tested=0,tOk=0;
  cs.forEach(c=>{const h=T.hist[c.id];
    if(h){seen++;tested++;if(h.last)ok++,tOk++}
    else if(S.marks[c.id]){seen++;if(S.marks[c.id]==='k')ok++}});
  return {name,total:cs.length,ok,seen,tested,tOk,pct:cs.length?Math.round(ok/cs.length*100):0};
}
function weakList(){return DATA.map(s=>secStats(s.name)).sort((a,b)=>(!a.seen)-(!b.seen)||a.pct-b.pct||a.seen-b.seen)}

function tStart(ids,fb,mock){
  if(!ids.length)return;
  T.showRes=false;
  T.cur={fb,i:0,done:false,mock:!!mock,started:Date.now(),deadline:mock?Date.now()+MOCKMIN*60000:null,qs:ids.map(id=>{const c=BYID[id];
    return c.mc.order?{id,o:shuf(c.a.map((_,k)=>k)),sel:[],res:null}:{id,o:shuf(c.mc.o.map((_,k)=>k)),sel:[],res:null}})};

}
function tPickIds(secs,count){let p=shuf(POOL.filter(c=>secs.includes(c.sec)).map(c=>c.id));return count==='all'?p:p.slice(0,count)}

function tEnd(){ // finish a run; unanswered questions count as wrong in a mock
  const r=T.cur;if(!r||r.done)return;
  if(r.mock){r.qs.forEach(x=>{if(x.res===null)x.res=false});
    const by={};r.qs.forEach(x=>{const d=BYID[x.id].sec;by[d]=by[d]||[0,0];by[d][1]++;if(x.res)by[d][0]++});
    T.mocks.push({at:Date.now(),ok:r.qs.filter(x=>x.res).length,n:r.qs.length,used:Math.min(Date.now(),r.deadline)-r.started,by})}
  else r.qs=r.qs.filter(q=>q.res!==null);
  r.done=true;T.showRes=!!r.qs.length;if(!r.qs.length)T.cur=null;tSave();tRender();goTo(0);
}

function tRender(){

function isRight(c,x){
  if(c.mc.order)return x.sel.length===c.a.length&&x.sel.every((k,i)=>k===i);
  const want=c.mc.c.slice().sort().join(),got=x.sel.slice().sort().join();return want===got;
}
function tSubmit(){
  const r=T.cur,x=r.qs[r.i],c=BYID[x.id];if(x.res!==null)return;
  x.res=isRight(c,x);
  if(!c.mock){const h=T.hist[c.id]||{n:0,c:0};h.n++;if(x.res)h.c++;h.last=x.res?1:0;T.hist[c.id]=h}
  if(r.fb==='exam')tNext();else{tSave();tRender()}
}
function tNext(){const r=T.cur;r.i++;if(r.i>=r.qs.length){r.i=r.qs.length-1;return tEnd()}tSave();tRender();goTo(0)}

function tQuestion(v){
  const r=T.cur,x=r.qs[r.i],c=BYID[x.id],shown=x.res!==null&&r.fb==='instant';

  if(c.mc.order){
    body=`<p class="pick">Tap the steps in order</p><div class="opts">${x.o.map(k=>{const p=x.sel.indexOf(k);
      const cls=shown?(p===k?' ok':' bad'):'';
      return `<button type="button" class="opt${cls}" data-k="${k}" aria-pressed="${p>=0}" ${shown?'disabled':''}><span class="bx">${p>=0?p+1:''}</span><span>${esc(c.a[k].replace(/^\d+\.\s*/,''))}</span></button>`}).join('')}</div>`;
  }else{
    body=`<p class="pick">${multi?'Pick '+NUMW[need]:'Pick one'}</p><div class="opts">${x.o.map(k=>{const on=x.sel.includes(k),cor=c.mc.c.includes(k);
      const cls=shown?(cor?' ok':on?' bad':''):'';
      return `<button type="button" class="opt${multi?'':' radio'}${cls}" data-k="${k}" aria-pressed="${on}" ${shown?'disabled':''}><span class="bx">${shown&&cor?'✓':''}</span><span>${esc(c.mc.o[k])}</span></button>`}).join('')}</div>`;
  }
  const ready=x.sel.length===need;
  v.innerHTML=`
  <div class="tally"><span><b>${r.i+1}</b> of ${r.qs.length}</span><span>${r.mock?`Mock exam · <b id="tClock">${fmtT(r.deadline-Date.now())}</b> left`:r.fb==='exam'?'Exam style':'Feedback after each'}</span></div>
  <div class="bar"><i style="width:${r.i/r.qs.length*100}%"></i></div>
  <div class="card" style="cursor:default;min-height:0">
    <div class="meta"><span>${esc(SHORT[c.sec]||c.sec)} · Q${c.num}${c.src&&!r.mock?' · '+esc(c.src):''}</span>${c.mock?'':starBtn(c.id)}</div>
    <p class="q">${esc(c.q)}</p>
    ${c.dia?`<div class="dia">${c.dia}</div>`:''}
    ${body}
    ${shown?`<div class="ans"><p class="verdict ${x.res?'ok':'bad'}">${x.res?'Correct':'Not quite'}</p>
      ${c.mc.order?`<ul>${c.a.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}
      ${c.why?`<p class="why"><b>Why</b>${esc(c.why)}</p>`:''}${c.note?`<p class="note"><b>Wording note</b>${esc(c.note)}</p>`:''}${c.ref?`<p class="ref"><b>Cert Guide</b>${refTxt(c.ref)}</p>`:''}</div>`:''}
  </div>
  <div class="btnrow">${shown?`<button type="button" class="go" id="tN">${r.i+1<r.qs.length?'Next question':'See results'}</button>`
    :`<button type="button" class="go" id="tS" ${ready?'':'disabled'}>${r.fb==='exam'?(r.i+1<r.qs.length?'Submit and next':'Submit and finish'):'Check answer'}</button>`}</div>
  <div class="nav"><button type="button" id="tQuit">End test now</button><span>${c.mc.order?'':`Keys 1–${x.o.length} pick · Enter submits`}</span></div>`;

    else if(multi){x.sel=x.sel.includes(k)?x.sel.filter(y=>y!==k):(x.sel.length<need?[...x.sel,k]:x.sel)}
    else x.sel=[k];

function tResults(v){

  const missed=qs.filter(x=>!x.res);
  v.innerHTML=`
  <div class="tpanel" style="align-items:flex-start">

const LESSONS={"Exploring Multicast with PIM-SM": {"mins": 14, "intro": "PIM sparse mode is the multicast routing protocol you'll actually design with. This lesson walks through how a receiver joins, how the RP connects sources to receivers, the switch to the shortest path, the multicast routing table, and the two important variants: SSM and BIDIR-PIM.", "parts": [{"h": "PIM-SM: nothing until asked", "b": [{"p": "PIM sparse mode assumes nobody wants a group's traffic until someone asks. A rendezvous point (RP) is the meeting place: sources register with it, receivers join toward it."}, {"dia": "<svg viewBox=\"0 0 360 204\" role=\"img\" aria-label=\"PIM-SM: the last-hop router joins the shared tree at the RP, the source registers, the RP joins toward the source, then the last hop switches to the shortest-path tree\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><line class=\"d-ln\" x1=\"80\" y1=\"120\" x2=\"180\" y2=\"40\"/><line class=\"d-ln\" x1=\"180\" y1=\"40\" x2=\"280\" y2=\"120\"/><line class=\"d-ln d-dash\" x1=\"90\" y1=\"120\" x2=\"270\" y2=\"120\"/><line class=\"d-ln\" x1=\"56\" y1=\"120\" x2=\"70\" y2=\"120\"/><line class=\"d-ln\" x1=\"290\" y1=\"120\" x2=\"304\" y2=\"120\"/><circle class=\"d-rt\" cx=\"180\" cy=\"40\" r=\"10\"/><path class=\"d-x\" d=\"M175 37h10M175 43h10\"/><circle class=\"d-rt\" cx=\"80\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M75 117h10M75 123h10\"/><circle class=\"d-rt\" cx=\"280\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M275 117h10M275 123h10\"/><rect class=\"d-rt\" x=\"4\" y=\"111\" width=\"52\" height=\"18\" rx=\"3\"/><text class=\"d-s\" x=\"30\" y=\"124\" text-anchor=\"middle\">Source<\/text><rect class=\"d-rt\" x=\"304\" y=\"111\" width=\"52\" height=\"18\" rx=\"3\"/><text class=\"d-s\" x=\"330\" y=\"124\" text-anchor=\"middle\">Receiver<\/text><text class=\"d-t\" x=\"180\" y=\"20\" text-anchor=\"middle\">RP<\/text><text class=\"d-t\" x=\"80\" y=\"146\" text-anchor=\"middle\">First hop<\/text><text class=\"d-t\" x=\"280\" y=\"146\" text-anchor=\"middle\">Last hop (DR)<\/text><circle class=\"d-rt\" cx=\"244\" cy=\"66\" r=\"8\"/><text class=\"d-s\" x=\"244\" y=\"70\" text-anchor=\"middle\">1<\/text><text class=\"d-s\" x=\"258\" y=\"62\">(*,G) join to RP<\/text><circle class=\"d-rt\" cx=\"116\" cy=\"66\" r=\"8\"/><text class=\"d-s\" x=\"116\" y=\"70\" text-anchor=\"middle\">2<\/text><text class=\"d-s\" x=\"102\" y=\"54\" text-anchor=\"end\">register<\/text><circle class=\"d-rt\" cx=\"138\" cy=\"92\" r=\"8\"/><text class=\"d-s\" x=\"138\" y=\"96\" text-anchor=\"middle\">3<\/text><text class=\"d-s\" x=\"20\" y=\"86\">RP: (S,G) join<\/text><text class=\"d-s\" x=\"20\" y=\"100\">toward source<\/text><circle class=\"d-rt\" cx=\"180\" cy=\"110\" r=\"8\"/><text class=\"d-s\" x=\"180\" y=\"114\" text-anchor=\"middle\">4<\/text><text class=\"d-s\" x=\"180\" y=\"172\" text-anchor=\"middle\">4 · SPT switchover: last hop joins the source directly (dashed)<\/text><text class=\"d-s\" x=\"180\" y=\"196\" text-anchor=\"middle\">Default SPT threshold 0: switch to the source tree on the first packet<\/text><\/svg>"}, {"ul": ["A receiver sends an IGMP join. Its designated router (DR), the last-hop router, doesn't know the source yet, so it sends a (*,G) join toward the RP. That builds the shared tree.", "When the source starts sending, its first-hop router registers it with the RP (wrapping the first packets in Register messages).", "The RP sends an (S,G) join toward the source, so traffic flows natively from the source to the RP and down the shared tree.", "Once traffic exceeds the SPT threshold, the last-hop router sends an (S,G) join directly toward the source and switches to the shortest-path tree, bypassing the RP. On Cisco the threshold defaults to 0: switch as soon as the first packet arrives. Set to infinity, routers stay on the shared tree."]}, {"check": [10, 1, 2, 13]}]}, {"h": "The multicast routing table", "b": [{"p": "Each entry has an incoming interface (IIF), the RPF interface toward the source or RP, and an outgoing interface list (OIL) of interfaces with downstream receivers."}, {"p": "A (*,G) entry is the parent of any (S,G) entries for the same group. It can only be deleted when no child (S,G) entry exists and its OIL is empty (null)."}, {"check": [15, 3]}]}, {"h": "SSM: no RP at all", "b": [{"p": "In Source-Specific Multicast, the receiver names both the source and the group it wants, using IGMPv3. The last-hop router sends an (S,G) join straight toward that source. There's no RP and no shared tree."}, {"ul": ["It uses the reserved range 232.0.0.0/8.", "A stream is identified by the (source, group) channel, so a unique group address is no longer necessary: two sources can reuse the same group.", "Ideal for well-known sources and broadcast-style applications (IPTV, market data)."]}, {"check": [11, 4, 5, 17]}]}, {"h": "BIDIR-PIM: everyone sends", "b": [{"p": "Bidirectional PIM suits many-to-many applications, such as conferencing, where each participant is both a sender and a receiver. Traffic flows up and down one shared tree rooted at the RP. It never switches to source trees, so routers keep no per-source state, which scales well with many sources."}, {"p": "Without source trees, BIDIR can't use normal RPF to stop loops. Instead, one Designated Forwarder (DF) is elected on each link. The DF is the only router that:"}, {"ul": ["forwards packets travelling downstream onto the link, and", "picks up upstream packets from the link and forwards them toward the RP."]}, {"p": "The DF is the router with the best unicast routing metric to the RP (IP address only breaks ties). The election uses four messages:"}, {"tbl": [["Message", "When"], ["Offer", "Routers advertise their metric to the RP during the election"], ["Winner", "The elected DF announces itself (or reasserts after a change)"], ["Backoff", "The current DF hears a better offer and tells the challenger it will step aside"], ["Pass", "The old DF hands the role to the better router"]]}, {"p": "Two scenarios from the course's DF election case study:"}, {"ul": ["If the DF's own metric gets worse, it sends three Winner messages, giving a router with a better path the chance to respond with an Offer.", "If a router that isn't the DF hears an offer with a better metric, it assumes it has lost and backs off. Only the current DF answers with Backoff and Pass."]}, {"check": [0, 6, 12, 7, 14, 8, 18, 9, 16]}]}, {"h": "Key takeaways", "b": [{"ul": ["PIM-SM: last-hop DR sends (*,G) join to the RP; the source's first hop registers; the RP sends (S,G) join toward the source; then SPT switchover (threshold default 0).", "IIF = toward the source; OIL = toward receivers. (*,G) goes only when it has no (S,G) children and a null OIL.", "SSM: IGMPv3, 232.0.0.0/8, (S,G) join straight to the source, no RP, group needn't be unique.", "BIDIR-PIM: many-to-many, shared tree only, a DF per link chosen by unicast metric to the RP. Offer, Winner, Backoff, Pass. A worse DF metric triggers three Winner messages."]}, {"tip": "Common traps: the RP, not the receiver, first joins toward the source. Infinity, not 0, keeps traffic on the shared tree. BIDIR still has an RP."}]}], "verified": [["PIM-SM (RFC 7761): RP gathers sender info; receivers join via IGMP and their DR; senders register via first-hop router", "p. 336"], ["PIM DR sends join, prune and register messages", "p. 337"], ["Shared trees start through the RP and routers then optimize to remove unnecessary hops", "p. 335–336"], ["BIDIR-PIM (RFC 5015) builds bidirectional shared trees and never builds an SPT", "p. 338"], ["SSM (RFC 3569) builds SPTs only, no RP; suited to well-known sources", "p. 338"], ["IGMPv3 provides the extensions SSM needs", "p. 332"]], "course": ["Default SPT threshold 0 and the infinity setting", "(*,G) deletion conditions; IIF and OIL", "232.0.0.0/8 and non-unique group addresses in SSM", "Designated Forwarder role, election by unicast metric, and the Offer/Winner/Backoff/Pass messages", "DF Election case study (three Winner messages)"]}, "Exploring QoS": {"mins": 16, "intro": "QoS doesn't add bandwidth. It decides who goes first when there isn't enough. This lesson covers the three QoS models, how traffic is identified and marked, the DSCP values worth knowing, shaping versus policing, queuing, dropping, the 8- and 12-class models, and WAN efficiency.", "parts": [{"h": "Why QoS, and the three models", "b": [{"p": "When a link is congested, packets wait in queues or get dropped. Voice and video suffer badly from delay, jitter (varying delay) and loss; a file transfer barely notices. QoS lets you protect the sensitive traffic. It's for momentary congestion. For chronic congestion, add bandwidth."}, {"tbl": [["Model", "How it works", "Analogy"], ["Best effort", "No special treatment; first in, first out", "Ordinary post"], ["IntServ", "Each application reserves bandwidth end to end with RSVP before sending. Guaranteed, but every device keeps per-flow state, so it scales poorly.", "A private courier booked in advance"], ["DiffServ", "Packets are marked into classes at the edge; each hop gives each class a per-hop behaviour (PHB). Scales well, so it's the common choice.", "A parcel service: overnight, two-day, ground"]]}, {"p": "WAN design is driven by three performance measures that QoS protects: response time, throughput and reliability."}, {"check": [12, 13, 5, 0, 18]}]}, {"h": "Classification and marking", "b": [{"p": "Classification identifies what traffic is (by port, address, or by application with NBAR, which uses deep packet inspection). Marking writes a value into the packet so later devices don't have to work it out again. Do both as close to the source as possible, at the access edge or trust boundary."}, {"p": "Markings live in several places, all called traffic descriptors:"}, {"ul": ["CoS: 3 bits in the 802.1Q/802.1p Ethernet tag (Layer 2).", "IP precedence: the old top 3 bits of the IP ToS byte.", "DSCP: the top 6 bits of the IPv4 ToS byte or the IPv6 Traffic Class byte.", "MPLS EXP (traffic class): 3 bits in the MPLS label."]}, {"dia": "<svg viewBox=\"0 0 360 144\" role=\"img\" aria-label=\"The ToS or Traffic Class byte: the top six bits are DSCP, the bottom two are ECN, and the top three were the old IP precedence\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"8\" y=\"14\" text-anchor=\"start\">IPv4 ToS / IPv6 TRAFFIC CLASS BYTE<\/text><rect class=\"d-box d-boxa\" x=\"40\" y=\"26\" width=\"34\" height=\"28\" rx=\"3\"/><text class=\"d-s\" x=\"57\" y=\"44\" text-anchor=\"middle\">7<\/text><rect class=\"d-box d-boxa\" x=\"76\" y=\"26\" width=\"34\" height=\"28\" rx=\"3\"/><text class=\"d-s\" x=\"93\" y=\"44\" text-anchor=\"middle\">6<\/text><rect class=\"d-box d-boxa\" x=\"112\" y=\"26\" width=\"34\" height=\"28\" rx=\"3\"/><text class=\"d-s\" x=\"129\" y=\"44\" text-anchor=\"middle\">5<\/text><rect class=\"d-box d-boxa\" x=\"148\" y=\"26\" width=\"34\" height=\"28\" rx=\"3\"/><text class=\"d-s\" x=\"165\" y=\"44\" text-anchor=\"middle\">4<\/text><rect class=\"d-box d-boxa\" x=\"184\" y=\"26\" width=\"34\" height=\"28\" rx=\"3\"/><text class=\"d-s\" x=\"201\" y=\"44\" text-anchor=\"middle\">3<\/text><rect class=\"d-box d-boxa\" x=\"220\" y=\"26\" width=\"34\" height=\"28\" rx=\"3\"/><text class=\"d-s\" x=\"237\" y=\"44\" text-anchor=\"middle\">2<\/text><rect class=\"d-box\" x=\"256\" y=\"26\" width=\"34\" height=\"28\" rx=\"3\"/><text class=\"d-s\" x=\"273\" y=\"44\" text-anchor=\"middle\">1<\/text><rect class=\"d-box\" x=\"292\" y=\"26\" width=\"34\" height=\"28\" rx=\"3\"/><text class=\"d-s\" x=\"309\" y=\"44\" text-anchor=\"middle\">0<\/text><path class=\"d-ln\" d=\"M40 60 v6 h214 v-6\"/><text class=\"d-t\" x=\"147\" y=\"82\" text-anchor=\"middle\">DSCP (6 bits, 0–63)<\/text><path class=\"d-ln\" d=\"M256 60 v6 h70 v-6\"/><text class=\"d-t\" x=\"291\" y=\"82\" text-anchor=\"middle\">ECN<\/text><path class=\"d-ln d-dash\" d=\"M40 92 v6 h106 v-6\"/><text class=\"d-s\" x=\"93\" y=\"112\" text-anchor=\"middle\">old IP precedence (3 bits)<\/text><text class=\"d-s\" x=\"180\" y=\"136\" text-anchor=\"middle\">EF = 101110 = 46 · AF41 = 100010 = 34 · CS6 = 110000 = 48<\/text><\/svg>"}, {"p": "The last two bits are ECN (Explicit Congestion Notification). The course calls them \"flow control\"."}, {"check": [6, 7, 15]}]}, {"h": "DSCP values worth knowing", "b": [{"tbl": [["Marking", "DSCP", "Used for"], ["EF (Expedited Forwarding)", "46", "Voice: low loss, latency and jitter"], ["AF41", "34", "Interactive video and conferencing"], ["AF31", "26", "Streaming video"], ["CS6", "48", "Network control (routing protocols)"], ["CS3", "24", "Call signalling"], ["CS1", "8", "Scavenger (less than best effort)"], ["Default (DF)", "0", "Best effort"]]}, {"p": "EF gets prioritized forwarding with guaranteed bandwidth and a minimum departure rate, but it's policed so it can't starve everything else."}, {"p": "AF classes are written AFxy. The first digit x is the class (1 to 4); the second digit y is the drop precedence (1 low, 3 high). Under congestion, WRED drops AF33 before AF32 before AF31. To compare drop precedence, look only at the second digit: AF22 has a higher drop precedence than AF11."}, {"check": [14, 1, 9]}]}, {"h": "Shaping versus policing", "b": [{"dia": "<svg viewBox=\"0 0 360 160\" role=\"img\" aria-label=\"Policing clips traffic above the rate limit, while shaping buffers the excess and sends it later\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"82\" y=\"14\" text-anchor=\"middle\">POLICING<\/text><line class=\"d-ln\" x1=\"10\" y1=\"110\" x2=\"160\" y2=\"110\"/><line class=\"d-ln\" x1=\"10\" y1=\"110\" x2=\"10\" y2=\"24\"/><line class=\"d-ln d-dash\" x1=\"10\" y1=\"58\" x2=\"160\" y2=\"58\"/><text class=\"d-s\" x=\"162\" y=\"54\" text-anchor=\"end\">rate limit<\/text><path class=\"d-ln\" d=\"M10 90 L30 80 L40 58 L65 58 L75 88 L95 92 L105 58 L130 58 L140 90 L160 94\" style=\"stroke-width:2\"/><path class=\"d-ln d-red d-dash\" d=\"M40 58 L45 34 L60 30 L65 58 M105 58 L110 40 L125 36 L130 58\"/><text class=\"d-h\" x=\"262\" y=\"14\" text-anchor=\"middle\">SHAPING<\/text><line class=\"d-ln\" x1=\"190\" y1=\"110\" x2=\"340\" y2=\"110\"/><line class=\"d-ln\" x1=\"190\" y1=\"110\" x2=\"190\" y2=\"24\"/><line class=\"d-ln d-dash\" x1=\"190\" y1=\"58\" x2=\"340\" y2=\"58\"/><text class=\"d-s\" x=\"342\" y=\"54\" text-anchor=\"end\">rate limit<\/text><path class=\"d-ln\" d=\"M190 90 L210 80 L220 58 L270 58 L280 92 L285 92 L290 58 L330 58 L340 94\" style=\"stroke-width:2\"/><text class=\"d-s\" x=\"88\" y=\"128\" text-anchor=\"middle\">excess dropped or re-marked<\/text><text class=\"d-s\" x=\"268\" y=\"128\" text-anchor=\"middle\">excess queued, sent later<\/text><text class=\"d-s\" x=\"180\" y=\"152\" text-anchor=\"middle\">Same bursty traffic; the shaper smooths it, the policer clips it<\/text><\/svg>"}, {"tbl": [["", "Shaping", "Policing"], ["Excess traffic", "Buffered (queued) and sent later", "Dropped or re-marked"], ["Direction", "Outbound only", "Inbound or outbound"], ["Effect on TCP", "Fewer retransmits, since packets are delayed, not lost", "More retransmits"], ["Typical use", "Smoothing traffic to a provider's contracted rate (e.g. 50 Mbps on a 100 Mbps port)", "Enforcing a contract at the edge"]]}, {"check": [2, 8, 16]}]}, {"h": "Queuing and dropping", "b": [{"p": "Queuing decides the order packets leave an interface during congestion:"}, {"tbl": [["Method", "How"], ["WFQ", "Automatically separates flows; low-bandwidth flows get priority"], ["CBWFQ", "You define classes; each gets a guaranteed share of bandwidth during congestion"], ["LLQ", "CBWFQ plus a strict priority queue for voice and video, served first but policed so it can't starve the others. The standard for voice."]]}, {"p": "Dropping (congestion avoidance) decides which packets to discard as a queue fills. WRED drops some packets early, preferring higher drop precedence, so TCP sessions slow down gradually rather than all at once. Design rules:"}, {"ul": ["Apply DSCP-based WRED on AF queues and the default queue (mostly TCP).", "Don't use it on strict-priority or control queues.", "Skip it on the scavenger queue: it has little bandwidth anyway, and WRED costs CPU."]}, {"p": "WRED is congestion avoidance and a single-rate three-color marker is a policer; neither is a queuing technique."}, {"check": [3, 17, 10]}]}, {"h": "8-class and 12-class models", "b": [{"p": "Cisco's baseline models group traffic into a manageable number of classes. In the 8-class model:"}, {"tbl": [["Class", "Marking", "Treatment"], ["Voice", "EF", "Strict priority, no more than 10%"], ["Multimedia conferencing", "AF41", "Strict priority, no more than 23%"], ["Multimedia streaming", "AF31", "10% guaranteed, with WRED"], ["Network control, signalling, transactional data, scavenger, best effort", "CS6, CS3, AF21, CS1, DF", "Each its own queue"]]}, {"p": "Voice and conferencing share the priority queue: 10% + 23% = 33%, the recommended maximum for all strict-priority traffic."}, {"p": "The 12-class model (based on RFC 4594) adds four more classes: real-time interactive (CS4), broadcast video (CS5), management/OAM (CS2) and bulk data (AF11)."}, {"check": [11, 4]}]}, {"h": "WAN link efficiency", "b": [{"p": "On slow WAN links, two mechanisms help:"}, {"ul": ["Compression (such as RTP header compression) shrinks headers or payloads.", "Link Fragmentation and Interleaving (LFI) chops large data packets into small fragments so voice packets can slip in between rather than waiting behind a big packet."]}, {"p": "On high-latency links, the TCP window size also limits throughput, since the sender stops after a window's worth of data until an acknowledgement returns."}, {"check": [19]}]}, {"h": "Key takeaways", "b": [{"ul": ["Best effort, IntServ (RSVP, per-flow, a courier) and DiffServ (classes per hop, a parcel service).", "Classify and mark close to the source. Descriptors: CoS, IP precedence, DSCP, MPLS EXP. DSCP = top 6 bits of ToS or Traffic Class.", "EF 46 for voice; AFxy where y is drop precedence (higher drops first).", "Shaping buffers excess outbound (fewer TCP retransmits); policing drops or re-marks.", "WFQ, CBWFQ, LLQ (adds a policed strict-priority queue). WRED on AF and default queues, not scavenger or priority.", "8-class: voice EF ≤ 10%, conferencing AF41 ≤ 23%, streaming AF31 10% with WRED; priority total ≤ 33%. 12-class adds real-time interactive, broadcast video, OAM and bulk data.", "Compression and LFI help slow links."]}, {"tip": "Common traps: shaping doesn't drop. WRED isn't queuing. AF22 vs AF11: compare the second digit."}]}], "verified": [["Three models: best effort, DiffServ, IntServ", "p. 531–532"], ["DiffServ: classify and mark at the edge, PHB per hop using the 6-bit DSCP", "p. 532–533"], ["IntServ: RSVP per-flow reservation, admission control", "p. 533–534"], ["Classification with NBAR (deep packet inspection)", "p. 535"], ["Shaping slows egress traffic with a token bucket; policing tags or drops; shaping buffers, policing drops", "p. 535–536"], ["QoS doesn't add bandwidth; for chronic congestion add bandwidth", "p. 537"], ["WFQ, CBWFQ and LLQ (strict priority with a threshold)", "p. 538–539"], ["Link efficiency: LFI, MLP, RTP header compression; TCP window size", "p. 540"], ["Response time, throughput and reliability", "p. 516–518"]], "course": ["Courier and parcel-service analogies", "Traffic descriptors including MPLS EXP; ECN bits called flow control", "EF PHB characteristics; AFxy drop precedence", "WRED placement rules", "8-class percentages (10%, 23%, 33%) and the 12-class additions"]}, "IS-IS Routing": {"mins": 15, "intro": "IS-IS is OSPF's link-state cousin: same core idea, different vocabulary and different area rules. This lesson explains it mostly by comparison with OSPF, which you've just learned.", "parts": [{"h": "What IS-IS is", "b": [{"p": "IS-IS (Intermediate System to Intermediate System) is a link-state interior gateway protocol, just like OSPF. Every router floods descriptions of its links, builds an identical database, and runs Dijkstra's SPF to find the best paths. In IS-IS language a router is an intermediate system (IS) and a host is an end system (ES)."}, {"p": "It was built for the OSI protocol suite (CLNP/CLNS), not for IP. Integrated IS-IS, also called dual IS-IS (RFC 1195), added IP support, so one protocol can route IP and CLNS together in the same updates. RFC 1195 allows three kinds of domain: pure IP, pure ISO (CLNS), or dual."}, {"p": "You see IS-IS mostly inside large ISP networks and in some data centre fabrics, less often in enterprises. Its administrative distance is 115."}, {"check": [15, 0, 1, 7]}]}, {"h": "How it differs from OSPF", "b": [{"tbl": [["", "OSPF", "IS-IS"], ["Runs over", "IP (protocol 89)", "Directly over Layer 2, using OSI PDUs. It isn't carried in IP at all."], ["Topology messages", "LSAs", "LSPs (link-state PDUs)"], ["Neighbour messages", "Hellos", "IIHs (IS-IS Hellos)"], ["Built for", "IP only", "OSI CLNS, extended to IP"], ["New features added by", "New LSA types or a new version", "New TLVs (type-length-value fields)"], ["Network types", "Broadcast, point-to-point, NBMA, point-to-multipoint", "Only broadcast and point-to-point"], ["Default metric", "Cost based on bandwidth", "10 on every interface, regardless of speed"], ["Admin distance", "110", "115"]]}, {"p": "Running directly on Layer 2 means IS-IS can't be reached or spoofed from a remote IP network, a small security plus. The TLV structure makes it easy to extend: IPv6 support was simply new TLVs."}, {"p": "The course's comparison points: with default timers, IS-IS detects a failure faster than OSPF, and it adapts to new protocols easily through TLVs. An enterprise may still prefer OSPF because it was designed purely for IP and is far more familiar."}, {"check": [6, 20, 11, 3]}]}, {"h": "Addresses: the NET", "b": [{"p": "Even when IS-IS routes IP, the routers identify themselves with an OSI address called a NET (Network Entity Title), a type of NSAP address. It reads from general to specific, left to right:"}, {"dia": "<svg viewBox=\"0 0 360 112\" role=\"img\" aria-label=\"Parts of an IS-IS NET address: AFI, area ID, system ID and selector\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"8\" y=\"14\">NET 49.0001.1290.6600.1001.00<\/text><rect class=\"d-box d-boxa\" x=\"8\" y=\"22\" width=\"54\" height=\"38\" rx=\"2\"/><text class=\"d-t\" x=\"35.0\" y=\"38\" text-anchor=\"middle\">49<\/text><text class=\"d-s\" x=\"35.0\" y=\"52\" text-anchor=\"middle\">AFI<\/text><rect class=\"d-box d-boxa\" x=\"62\" y=\"22\" width=\"70\" height=\"38\" rx=\"2\"/><text class=\"d-t\" x=\"97.0\" y=\"38\" text-anchor=\"middle\">0001<\/text><text class=\"d-s\" x=\"97.0\" y=\"52\" text-anchor=\"middle\">Area ID<\/text><rect class=\"d-box\" x=\"132\" y=\"22\" width=\"168\" height=\"38\" rx=\"2\"/><text class=\"d-t\" x=\"216.0\" y=\"38\" text-anchor=\"middle\">1290.6600.1001<\/text><text class=\"d-s\" x=\"216.0\" y=\"52\" text-anchor=\"middle\">System ID (6 bytes)<\/text><rect class=\"d-box\" x=\"300\" y=\"22\" width=\"52\" height=\"38\" rx=\"2\"/><text class=\"d-t\" x=\"326.0\" y=\"38\" text-anchor=\"middle\">00<\/text><text class=\"d-s\" x=\"326.0\" y=\"52\" text-anchor=\"middle\">SEL<\/text><path class=\"d-ln\" d=\"M8 66v6h124v-6\"/><text class=\"d-s\" x=\"70\" y=\"84\" text-anchor=\"middle\">Area address: higher-order bits<\/text><path class=\"d-ln\" d=\"M132 66v6h220v-6\"/><text class=\"d-s\" x=\"242\" y=\"84\" text-anchor=\"middle\">This system: lower-order bits<\/text><text class=\"d-s\" x=\"180\" y=\"104\" text-anchor=\"middle\">8 to 20 bytes in total, written in hex<\/text><\/svg>"}, {"ul": ["AFI (Authority and Format Identifier): 49 means a private address, the IS-IS equivalent of RFC 1918.", "Area ID: which area the router is in.", "System ID: unique per router. On Cisco it's always 6 bytes and is often built from a MAC address or a loopback IP.", "SEL (selector, or NSEL): always 00 on a router."]}, {"p": "NSAP addresses are up to 20 bytes. The higher-order bits (the area) describe the inter-area structure, and the lower-order bits (system ID and selector) identify a system within the area."}, {"check": [2, 12]}]}, {"h": "Levels and areas", "b": [{"p": "IS-IS has a two-level hierarchy instead of numbered areas around a backbone:"}, {"tbl": [["Router type", "Does", "OSPF comparison"], ["Level 1 (L1)", "Routes inside its own area only, and sends traffic for anywhere else to the nearest L1/L2 router", "An internal router in a totally stubby area"], ["Level 2 (L2)", "Routes between areas: the backbone", "A backbone router"], ["Level 1-2 (L1/L2)", "Does both, and keeps a separate LSDB for each level", "An ABR"]]}, {"p": "There's no Area 0. The IS-IS backbone is simply the unbroken chain of Level 2 routers, and it must stay unbroken: never put an L1-only router in the middle of it."}, {"p": "The biggest conceptual difference is where the border sits. In OSPF the border runs through the ABR, which has interfaces in several areas. In IS-IS every router sits entirely inside one area, and the border falls on the link between two routers."}, {"dia": "<svg viewBox=\"0 0 360 336\" role=\"img\" aria-label=\"OSPF areas versus IS-IS areas\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"10\" y=\"14\" text-anchor=\"start\">OSPF<\/text><rect class=\"d-box\" x=\"10\" y=\"22\" width=\"340\" height=\"50\" rx=\"3\"/><text class=\"d-s\" x=\"16\" y=\"34\" text-anchor=\"start\">Area 0 (backbone)<\/text><rect class=\"d-box\" x=\"10\" y=\"72\" width=\"165\" height=\"52\" rx=\"3\"/><text class=\"d-s\" x=\"169\" y=\"118\" text-anchor=\"end\">Area 2<\/text><rect class=\"d-box\" x=\"185\" y=\"72\" width=\"165\" height=\"52\" rx=\"3\"/><text class=\"d-s\" x=\"191\" y=\"118\" text-anchor=\"start\">Area 3<\/text><line class=\"d-ln\" x1=\"90\" y1=\"72\" x2=\"180\" y2=\"45\"/><line class=\"d-ln\" x1=\"270\" y1=\"72\" x2=\"180\" y2=\"45\"/><line class=\"d-ln\" x1=\"90\" y1=\"72\" x2=\"40\" y2=\"100\"/><line class=\"d-ln\" x1=\"270\" y1=\"72\" x2=\"320\" y2=\"100\"/><circle class=\"d-rt\" cx=\"180\" cy=\"45\" r=\"10\"/><path class=\"d-x\" d=\"M175 42h10M175 48h10\"/><text class=\"d-t\" x=\"195\" y=\"49\">Backbone<\/text><circle class=\"d-rt\" cx=\"90\" cy=\"72\" r=\"10\"/><path class=\"d-x\" d=\"M85 69h10M85 75h10\"/><circle class=\"d-rt\" cx=\"270\" cy=\"72\" r=\"10\"/><path class=\"d-x\" d=\"M265 69h10M265 75h10\"/><circle class=\"d-rt\" cx=\"40\" cy=\"100\" r=\"10\"/><path class=\"d-x\" d=\"M35 97h10M35 103h10\"/><text class=\"d-t\" x=\"55\" y=\"104\">Internal<\/text><circle class=\"d-rt\" cx=\"320\" cy=\"100\" r=\"10\"/><path class=\"d-x\" d=\"M315 97h10M315 103h10\"/><text class=\"d-t\" x=\"305\" y=\"104\" text-anchor=\"end\">Internal<\/text><text class=\"d-t\" x=\"75\" y=\"70\" text-anchor=\"end\">ABR<\/text><text class=\"d-t\" x=\"285\" y=\"70\">ABR<\/text><text class=\"d-s\" x=\"180\" y=\"142\" text-anchor=\"middle\">ABR sits on the border; each link is in one area<\/text><text class=\"d-h\" x=\"10\" y=\"170\" text-anchor=\"start\">IS-IS<\/text><rect class=\"d-box\" x=\"10\" y=\"178\" width=\"340\" height=\"48\" rx=\"3\"/><text class=\"d-s\" x=\"180\" y=\"224\" text-anchor=\"middle\">Area 49.0001 (L2 backbone)<\/text><rect class=\"d-box\" x=\"10\" y=\"236\" width=\"165\" height=\"58\" rx=\"3\"/><text class=\"d-s\" x=\"16\" y=\"288\" text-anchor=\"start\">Area 49.0002<\/text><rect class=\"d-box\" x=\"185\" y=\"236\" width=\"165\" height=\"58\" rx=\"3\"/><text class=\"d-s\" x=\"344\" y=\"288\" text-anchor=\"end\">Area 49.0003<\/text><line class=\"d-ln\" x1=\"90\" y1=\"205\" x2=\"180\" y2=\"205\"/><line class=\"d-ln\" x1=\"180\" y1=\"205\" x2=\"270\" y2=\"205\"/><line class=\"d-ln\" x1=\"90\" y1=\"205\" x2=\"90\" y2=\"256\"/><line class=\"d-ln\" x1=\"270\" y1=\"205\" x2=\"270\" y2=\"256\"/><line class=\"d-ln d-dash\" x1=\"90\" y1=\"256\" x2=\"140\" y2=\"256\"/><line class=\"d-ln d-dash\" x1=\"270\" y1=\"256\" x2=\"220\" y2=\"256\"/><circle class=\"d-rt\" cx=\"90\" cy=\"205\" r=\"10\"/><path class=\"d-x\" d=\"M85 202h10M85 208h10\"/><text class=\"d-t\" x=\"90\" y=\"190\" text-anchor=\"middle\">L2<\/text><circle class=\"d-rt\" cx=\"180\" cy=\"205\" r=\"10\"/><path class=\"d-x\" d=\"M175 202h10M175 208h10\"/><text class=\"d-t\" x=\"180\" y=\"190\" text-anchor=\"middle\">L2<\/text><circle class=\"d-rt\" cx=\"270\" cy=\"205\" r=\"10\"/><path class=\"d-x\" d=\"M265 202h10M265 208h10\"/><text class=\"d-t\" x=\"270\" y=\"190\" text-anchor=\"middle\">L2<\/text><circle class=\"d-rt\" cx=\"90\" cy=\"256\" r=\"10\"/><path class=\"d-x\" d=\"M85 253h10M85 259h10\"/><text class=\"d-t\" x=\"70\" y=\"260\" text-anchor=\"end\">L1/L2<\/text><circle class=\"d-rt\" cx=\"150\" cy=\"256\" r=\"10\"/><path class=\"d-x\" d=\"M145 253h10M145 259h10\"/><text class=\"d-t\" x=\"150\" y=\"280\" text-anchor=\"middle\">L1<\/text><circle class=\"d-rt\" cx=\"270\" cy=\"256\" r=\"10\"/><path class=\"d-x\" d=\"M265 253h10M265 259h10\"/><text class=\"d-t\" x=\"290\" y=\"260\">L1/L2<\/text><circle class=\"d-rt\" cx=\"210\" cy=\"256\" r=\"10\"/><path class=\"d-x\" d=\"M205 253h10M205 259h10\"/><text class=\"d-t\" x=\"210\" y=\"280\" text-anchor=\"middle\">L1<\/text><text class=\"d-s\" x=\"180\" y=\"312\" text-anchor=\"middle\">Border falls on the link; each router is in one area<\/text><path class=\"d-ln\" d=\"M16 326h22\"/><text class=\"d-s\" x=\"44\" y=\"329\">Level 2<\/text><path class=\"d-ln d-dash\" d=\"M110 326h22\"/><text class=\"d-s\" x=\"138\" y=\"329\">Level 1<\/text><\/svg>"}, {"p": "Adjacency rules follow from that:"}, {"ul": ["Level 1 adjacencies form only between routers in the same area.", "Level 2 adjacencies form between L2-capable routers in different areas, or in the same area.", "So two L1-only routers with different area IDs form no adjacency at all, and two L1/L2 routers in different areas form a Level 2 adjacency only."]}, {"check": [16, 18, 23, 10, 8, 17, 22]}]}, {"h": "DIS, the IS-IS designated router", "b": [{"p": "On a broadcast segment, IS-IS elects a Designated Intermediate System (DIS). It represents the segment as a pseudonode in the database, much like OSPF's DR. The differences are worth memorizing:"}, {"ul": ["There's no backup DIS.", "Priority defaults to 64 (range 0 to 127). A tie goes to the highest system ID, or MAC address.", "It's pre-emptive: a better router that joins later takes over the role, unlike OSPF's DR.", "All routers on the segment still form adjacencies with each other, not just with the DIS."]}, {"check": [19]}]}, {"h": "Metrics", "b": [{"p": "Classic IS-IS metrics are tiny: 6 bits per link (maximum 63) and a maximum path total of 1,023. Cisco gives every active interface a metric of 10 regardless of bandwidth, so unless you set metrics yourself, IS-IS just counts hops."}, {"p": "Wide metrics fix this with 24 bits per link (up to 16,777,215). They're recommended for any real design and are needed for features like traffic engineering and route leaking."}, {"tip": "The Cert Guide's own wording on the old limits is loose: it says a link maxes out at 64 and a path at 1024. The standard values are 63 and 1,023 (6-bit and 10-bit fields). Either way, the point is that narrow metrics are too small, so use wide metrics."}, {"check": [24]}]}, {"h": "Designing an IS-IS network", "b": [{"tbl": [["Design", "What it is", "When to use it"], ["Flat", "One area, all routers at the same level (usually all L2)", "Small, simple networks with few routers. No summarization."], ["Hierarchical", "A Level 2 backbone with L1 areas hanging off it through L1/L2 routers", "Large networks; allows summarization"], ["Hybrid", "Areas joined by L1/L2 routers, without a separate backbone", "Networks not big enough to justify a backbone"]]}, {"p": "Summarize at the L1/L2 routers as routes go up into Level 2. One rule matters a lot: if an area has several L1/L2 routers, summarize on all of them. Routers always prefer the most specific (longest) match, so a single L1/L2 router leaking specific routes would pull all the backbone's traffic for that area towards itself."}, {"p": "By default, Level 2 routes aren't sent down into Level 1. L1 routers just head for the nearest L1/L2 router, which flags itself as attached to the backbone, and use it as a default route."}, {"check": [4, 13]}]}, {"h": "Authentication and IPv6", "b": [{"p": "IS-IS can authenticate at three scopes, each with its own password:"}, {"ul": ["Link: protects the hellos between neighbours on one interface.", "Area: protects the Level 1 LSPs and SNPs in an area. Every router in the area needs the same password.", "Domain: protects the Level 2 LSPs and SNPs. Every L2 and L1/L2 router needs the same password."]}, {"p": "The authentication data travels in TLV 10 inside the PDU. It proves the sender is genuine but doesn't encrypt anything. Use MD5 (or better) rather than plain text."}, {"p": "IPv6 support is just more TLVs: the IPv6 interface address TLV (232, or 0xE8) and the IPv6 reachability TLV (236, or 0xEC)."}, {"ul": ["Single-topology mode runs one SPF for both IPv4 and IPv6, so every link must run both protocols.", "Multi-topology mode runs separate SPF calculations, so IPv4 and IPv6 can have different topologies and different metrics.", "Transition mode lets a network keep running single-topology while routers are upgraded to multi-topology one at a time."]}, {"check": [9, 21, 5, 14]}]}, {"h": "Key takeaways", "b": [{"ul": ["IS-IS is a link-state IGP using SPF. It uses LSPs and IIHs, runs directly over Layer 2, and has an AD of 115.", "Integrated (dual) IS-IS carries both IP and CLNS. Domains can be pure IP, pure ISO or dual.", "A NET is AFI.area.system-ID.00. The high-order bits are the area; the system ID is 6 bytes on Cisco; up to 20 bytes in total.", "L1 is intra-area (like a totally stubby area), L2 is the backbone, and L1/L2 keeps both LSDBs.", "Area borders are on links; every router is in exactly one area. L1 adjacencies need the same area.", "DIS: no backup, priority 64, pre-emptive.", "Only broadcast and point-to-point network types. Default metric 10 everywhere; use wide metrics.", "Use flat designs for small networks and hierarchical for large ones, and summarize on every L1/L2 router in an area.", "Authentication at link, area and domain scope (TLV 10). IPv6 uses TLVs 232 and 236, with single- or multi-topology."]}, {"tip": "Common traps: an IS-IS router is never in two areas. IS-IS has no Area 0 and no backup DIS. It runs on Layer 2, not over IP."}]}], "verified": [["Link-state, Dijkstra SPF, LSPs; ISO 10589 / RFC 1195; built for CLNP and extended to IP", "p. 229"], ["Level 1 intra-area and Level 2 inter-area hierarchy; ES and IS terminology", "p. 229"], ["Cisco default metric 10 on active interfaces; wide (24-bit) metrics recommended and needed for route leaking", "p. 230"], ["Area boundaries are links, not routers; no BDR", "p. 230–231"], ["NET is 8 to 20 bytes: AFI, area ID, system ID (6 bytes on Cisco), SEL 00; example 49.0001.1290.6600.1001.00", "p. 231"], ["DIS: priority 64 (0 to 127), tie goes to highest system ID, no backup; all routers on a segment are adjacent with each other", "p. 232"], ["Only point-to-point and broadcast interface types", "p. 232"], ["L1 like a totally stubby area, L2 like the backbone, L1/L2 like an ABR with separate LSDBs; L2 routes not advertised into L1; keep the L2 backbone contiguous", "p. 232"], ["Flat for small networks, hierarchical for large, hybrid in between", "p. 233–234"], ["Link, area and domain authentication; MD5 recommended over plain text", "p. 235"], ["IS-IS for IPv6 (RFC 5308); IPv4 and IPv6 as separate topologies; AD 115", "p. 235–236"], ["The book states narrow-metric maximums as 64 per link and 1024 per path; the standard values are 63 and 1,023", "p. 230, 236"]], "course": ["Faster failure detection than OSPF with default timers", "Pure IP / pure ISO / dual domains from RFC 1195", "Authentication carried in TLV 10", "IPv6 TLVs 232 and 236, and multi-topology transition mode", "Summarize on every L1/L2 router (longest-match pull)", "DIS pre-emption; the attached bit sending L1 traffic to the nearest L1/L2 router"]}, "BGP Routing": {"mins": 15, "intro": "BGP is the routing protocol of the internet and of enterprise internet edges. This lesson covers what makes it different from an IGP, why iBGP needs a full mesh and the two ways around it, and how enterprises connect to one or more ISPs.", "parts": [{"h": "What BGP is for", "b": [{"p": "OSPF, IS-IS and EIGRP are interior gateway protocols: they find the fastest path inside one organization. BGP is different. It's an exterior gateway protocol for routing between autonomous systems (ASes), separately run networks such as your company and your ISPs. Its strength isn't speed; it's policy, letting each network decide which paths to use and advertise."}, {"ul": ["BGP version 4 is a path-vector protocol. Each route carries the list of ASes it has passed through (the AS path).", "It runs over TCP port 179, so neighbours are configured explicitly and the session is reliable.", "AS numbers 1 to 64,511 are public (issued by the registries). 64,512 to 65,535 are private, the BGP version of RFC 1918. 32-bit AS numbers extend the range.", "Enterprises mainly use BGP at the internet edge, and in very large networks as a core that links separate IGP domains."]}]}, {"h": "eBGP and iBGP", "b": [{"tbl": [["", "eBGP", "iBGP"], ["Peers are in", "Different ASes", "The same AS"], ["Admin distance", "20", "200"], ["Typical peering", "Directly connected routers", "Loopback to loopback, anywhere in the AS"], ["Loop prevention", "AS path: drop any route that already contains your own AS", "Split horizon: never pass an iBGP-learned route to another iBGP peer"]]}, {"p": "The loop-prevention row is the key to everything that follows. Inside one AS the AS path doesn't change, so it can't detect loops. BGP's answer is the iBGP split-horizon rule. The side effect is that a route learned from one iBGP peer goes no further, so every iBGP router must peer directly with every other one: a full mesh."}, {"p": "A full mesh needs n(n−1)/2 sessions. That's 10 for 5 routers, 45 for 10, and 190 for 20, which quickly becomes unmanageable."}, {"check": [2, 7]}]}, {"h": "Route reflectors", "b": [{"p": "A route reflector (RR) is an iBGP router that's allowed to break the split-horizon rule. It re-advertises (reflects) iBGP-learned routes to its clients, so the clients only need a session to the RR instead of to everyone."}, {"dia": "<svg viewBox=\"0 0 360 202\" role=\"img\" aria-label=\"iBGP full mesh compared with a route reflector cluster\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"90\" y=\"14\" text-anchor=\"middle\">FULL MESH<\/text><text class=\"d-s\" x=\"90\" y=\"28\" text-anchor=\"middle\">5 routers = 10 sessions<\/text><line class=\"d-ln\" x1=\"90.0\" y1=\"50.0\" x2=\"141.3570518799383\" y2=\"87.31308230375284\"/><line class=\"d-ln\" x1=\"90.0\" y1=\"50.0\" x2=\"121.74040362379355\" y2=\"147.68691769624718\"/><line class=\"d-ln\" x1=\"90.0\" y1=\"50.0\" x2=\"58.25959637620646\" y2=\"147.68691769624718\"/><line class=\"d-ln\" x1=\"90.0\" y1=\"50.0\" x2=\"38.6429481200617\" y2=\"87.31308230375285\"/><line class=\"d-ln\" x1=\"141.3570518799383\" y1=\"87.31308230375284\" x2=\"121.74040362379355\" y2=\"147.68691769624718\"/><line class=\"d-ln\" x1=\"141.3570518799383\" y1=\"87.31308230375284\" x2=\"58.25959637620646\" y2=\"147.68691769624718\"/><line class=\"d-ln\" x1=\"141.3570518799383\" y1=\"87.31308230375284\" x2=\"38.6429481200617\" y2=\"87.31308230375285\"/><line class=\"d-ln\" x1=\"121.74040362379355\" y1=\"147.68691769624718\" x2=\"58.25959637620646\" y2=\"147.68691769624718\"/><line class=\"d-ln\" x1=\"121.74040362379355\" y1=\"147.68691769624718\" x2=\"38.6429481200617\" y2=\"87.31308230375285\"/><line class=\"d-ln\" x1=\"58.25959637620646\" y1=\"147.68691769624718\" x2=\"38.6429481200617\" y2=\"87.31308230375285\"/><circle class=\"d-rt\" cx=\"90.0\" cy=\"50.0\" r=\"10\"/><path class=\"d-x\" d=\"M85.0 47.0h10M85.0 53.0h10\"/><circle class=\"d-rt\" cx=\"141.3570518799383\" cy=\"87.31308230375284\" r=\"10\"/><path class=\"d-x\" d=\"M136.3570518799383 84.31308230375284h10M136.3570518799383 90.31308230375284h10\"/><circle class=\"d-rt\" cx=\"121.74040362379355\" cy=\"147.68691769624718\" r=\"10\"/><path class=\"d-x\" d=\"M116.74040362379355 144.68691769624718h10M116.74040362379355 150.68691769624718h10\"/><circle class=\"d-rt\" cx=\"58.25959637620646\" cy=\"147.68691769624718\" r=\"10\"/><path class=\"d-x\" d=\"M53.25959637620646 144.68691769624718h10M53.25959637620646 150.68691769624718h10\"/><circle class=\"d-rt\" cx=\"38.6429481200617\" cy=\"87.31308230375285\" r=\"10\"/><path class=\"d-x\" d=\"M33.6429481200617 84.31308230375285h10M33.6429481200617 90.31308230375285h10\"/><text class=\"d-h\" x=\"270\" y=\"14\" text-anchor=\"middle\">ROUTE REFLECTOR<\/text><text class=\"d-s\" x=\"270\" y=\"28\" text-anchor=\"middle\">4 clients = 4 sessions<\/text><line class=\"d-ln\" x1=\"270\" y1=\"96\" x2=\"270\" y2=\"44\"/><line class=\"d-ln\" x1=\"270\" y1=\"96\" x2=\"326\" y2=\"96\"/><line class=\"d-ln\" x1=\"270\" y1=\"96\" x2=\"270\" y2=\"148\"/><line class=\"d-ln\" x1=\"270\" y1=\"96\" x2=\"214\" y2=\"96\"/><circle class=\"d-rt\" cx=\"270\" cy=\"44\" r=\"10\"/><path class=\"d-x\" d=\"M265 41h10M265 47h10\"/><circle class=\"d-rt\" cx=\"326\" cy=\"96\" r=\"10\"/><path class=\"d-x\" d=\"M321 93h10M321 99h10\"/><circle class=\"d-rt\" cx=\"270\" cy=\"148\" r=\"10\"/><path class=\"d-x\" d=\"M265 145h10M265 151h10\"/><circle class=\"d-rt\" cx=\"214\" cy=\"96\" r=\"10\"/><path class=\"d-x\" d=\"M209 93h10M209 99h10\"/><circle class=\"d-red\" cx=\"270\" cy=\"96\" r=\"14\" fill=\"none\"/><circle class=\"d-rt\" cx=\"270\" cy=\"96\" r=\"10\"/><path class=\"d-x\" d=\"M265 93h10M265 99h10\"/><text class=\"d-t\" x=\"290\" y=\"80\">RR<\/text><text class=\"d-s\" x=\"270\" y=\"172\" text-anchor=\"middle\">RR + clients = one cluster<\/text><text class=\"d-s\" x=\"180\" y=\"194\" text-anchor=\"middle\">A full mesh needs n(n−1)/2 sessions; clients only peer with the RR<\/text><\/svg>"}, {"ul": ["An RR and its clients form a cluster. Routes from a client are reflected to all clients and non-clients. Routes from a non-client are reflected to clients only.", "Route reflectors treat each other as ordinary non-clients, so RRs and any other non-clients must still be fully meshed with each other.", "Routers that don't support RR features should be fully meshed with the RRs of every cluster and with other non-clients.", "An RR can itself be a client of a higher RR, so hierarchies can be as deep as needed. Lower RRs that are clients of a top RR don't need a full mesh among themselves."]}, {"p": "To stop reflected routes from looping, the RR adds its cluster ID to a cluster list attribute. The cluster ID is a configured value, or the RR's router ID if none is set. A router that sees its own cluster ID drops the route, and when choosing between copies of the same route, a shorter cluster list wins."}, {"p": "For redundancy, give every cluster two RRs and connect each client to both, over physically separate paths. Two sessions over the same link don't protect against that link failing."}, {"check": [8, 11, 9, 1, 3, 13, 12, 14]}]}, {"h": "Confederations", "b": [{"p": "The other way out of the full mesh is a confederation. You split one AS into several sub-ASes (usually private numbers). Inside each sub-AS it's normal iBGP with a full mesh, but between sub-ASes the routers use eBGP-style sessions, which aren't bound by the iBGP rule."}, {"ul": ["To the outside world, the whole thing still looks like one AS, the confederation identifier.", "A confederation boundary router sits in its own sub-AS and also belongs to the overall confederation AS.", "Sub-AS numbers travel in the AS path in parentheses (the AS_CONFED_SEQUENCE), newest first, so loops between sub-ASes are still caught. They're stripped before routes leave the confederation.", "Route reflectors can be used inside a sub-AS as well."]}, {"p": "Here's the course's example. A route from AS 5 crosses sub-AS 65001, then 65002, and arrives in 65003:"}, {"dia": "<svg viewBox=\"0 0 360 182\" role=\"img\" aria-label=\"BGP confederation: route from AS 5 through sub-AS 65001 and 65002 to 65003\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><rect class=\"d-box\" x=\"4\" y=\"40\" width=\"72\" height=\"96\" rx=\"3\"/><text class=\"d-s\" x=\"10\" y=\"52\" text-anchor=\"start\">AS 5<\/text><circle class=\"d-rt\" cx=\"40\" cy=\"82\" r=\"10\"/><path class=\"d-x\" d=\"M35 79h10M35 85h10\"/><text class=\"d-t\" x=\"40\" y=\"67\" text-anchor=\"middle\">R1<\/text><text class=\"d-s\" x=\"40\" y=\"120\" text-anchor=\"middle\">10.0.0.0/8<\/text><rect class=\"d-box\" x=\"86\" y=\"22\" width=\"270\" height=\"132\" rx=\"3\"/><text class=\"d-s\" x=\"92\" y=\"34\" text-anchor=\"start\">Confederation (seen outside as AS 7)<\/text><rect class=\"d-box d-boxa\" x=\"94\" y=\"40\" width=\"80\" height=\"96\" rx=\"3\"/><text class=\"d-s\" x=\"134\" y=\"52\" text-anchor=\"middle\">AS 65001<\/text><circle class=\"d-rt\" cx=\"134\" cy=\"82\" r=\"10\"/><path class=\"d-x\" d=\"M129 79h10M129 85h10\"/><text class=\"d-t\" x=\"134\" y=\"67\" text-anchor=\"middle\">R2<\/text><rect class=\"d-box d-boxa\" x=\"180\" y=\"40\" width=\"80\" height=\"96\" rx=\"3\"/><text class=\"d-s\" x=\"220\" y=\"52\" text-anchor=\"middle\">AS 65002<\/text><circle class=\"d-rt\" cx=\"220\" cy=\"82\" r=\"10\"/><path class=\"d-x\" d=\"M215 79h10M215 85h10\"/><text class=\"d-t\" x=\"220\" y=\"67\" text-anchor=\"middle\">R3<\/text><rect class=\"d-box d-boxa\" x=\"266\" y=\"40\" width=\"80\" height=\"96\" rx=\"3\"/><text class=\"d-s\" x=\"306\" y=\"52\" text-anchor=\"middle\">AS 65003<\/text><circle class=\"d-rt\" cx=\"306\" cy=\"82\" r=\"10\"/><path class=\"d-x\" d=\"M301 79h10M301 85h10\"/><text class=\"d-t\" x=\"306\" y=\"67\" text-anchor=\"middle\">R4<\/text><path class=\"d-ln d-red\" marker-end=\"url(#ar)\" d=\"M51 82H121M145 82H207M231 82H293\"/><text class=\"d-t d-redt\" x=\"306\" y=\"122\" text-anchor=\"middle\">AS path?<\/text><text class=\"d-s\" x=\"180\" y=\"174\" text-anchor=\"middle\">Route from AS 5 crosses sub-AS 65001 and 65002, seen in 65003<\/text><\/svg>"}, {"p": "Seen in 65003, its AS path is (65002 65001) 5: the sub-ASes it crossed in brackets, most recent first, then the real external AS."}, {"p": "By default BGP ignores MED on routes learned from other sub-ASes. The command bgp bestpath med confed tells it to compare them."}, {"tip": "The course calls the number added in each sub-AS the \"confederation identifier\". Strictly, that's the sub-AS number; the confederation identifier is the single outer AS number outsiders see. Answer with the key's wording on the test."}, {"check": [0, 10, 4, 17, 18, 19]}]}, {"h": "Connecting to the internet", "b": [{"p": "How many
