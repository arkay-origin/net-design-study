links and how many ISPs you use decides how much redundancy you get:"}, {"tbl": [["Design", "Links", "Redundancy"], ["Single-homed", "One link to one ISP", "None"], ["Dual-homed", "Two links, same ISP", "Link (and router, with two routers), but not the ISP"], ["Multihomed", "One link to each of two or more ISPs", "Survives an ISP failure"], ["Dual-multihomed", "Two links to each of several ISPs", "The most redundancy"]]}, {"p": "The Cert Guide frames the same idea as single-router single-homed (minimum), single-router dual-homed (good), and dual-router dual-homed (the most resilient)."}, {"p": "Talking to two ISPs needs a few things in place:"}, {"ul": ["A public AS number for the eBGP sessions.", "Provider-independent (PI) address space, so both ISPs can advertise your prefix. Single-homed sites can use either the ISP's (PA) space or PI.", "Full or partial internet routing tables from the ISPs, to choose good exits.", "HSRP/GLBP or an IGP inside, so internal traffic finds the working edge router."]}, {"dia": "<svg viewBox=\"0 0 360 208\" role=\"img\" aria-label=\"Corporate AS 123 dual-homed to ISP AS 456 and AS 789\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><rect class=\"d-box\" x=\"8\" y=\"60\" width=\"110\" height=\"70\" rx=\"3\"/><text class=\"d-s\" x=\"14\" y=\"72\" text-anchor=\"start\">Corporate network<\/text><circle class=\"d-rt\" cx=\"63\" cy=\"100\" r=\"10\"/><path class=\"d-x\" d=\"M58 97h10M58 103h10\"/><text class=\"d-t\" x=\"63\" y=\"122\" text-anchor=\"middle\">AS 123<\/text><rect class=\"d-box\" x=\"170\" y=\"10\" width=\"120\" height=\"56\" rx=\"3\"/><text class=\"d-s\" x=\"176\" y=\"22\" text-anchor=\"start\">ISP 1<\/text><circle class=\"d-rt\" cx=\"230\" cy=\"40\" r=\"10\"/><path class=\"d-x\" d=\"M225 37h10M225 43h10\"/><text class=\"d-t\" x=\"245\" y=\"44\">AS 456<\/text><rect class=\"d-box\" x=\"170\" y=\"124\" width=\"120\" height=\"56\" rx=\"3\"/><text class=\"d-s\" x=\"176\" y=\"136\" text-anchor=\"start\">ISP 2<\/text><circle class=\"d-rt\" cx=\"230\" cy=\"154\" r=\"10\"/><path class=\"d-x\" d=\"M225 151h10M225 157h10\"/><text class=\"d-t\" x=\"245\" y=\"158\">AS 789<\/text><line class=\"d-ln\" x1=\"73\" y1=\"95\" x2=\"220\" y2=\"42\"/><line class=\"d-ln\" x1=\"73\" y1=\"105\" x2=\"220\" y2=\"152\"/><line class=\"d-ln d-dash\" x1=\"230\" y1=\"50\" x2=\"230\" y2=\"144\"/><text class=\"d-s\" x=\"135\" y=\"60\" text-anchor=\"middle\">EBGP<\/text><text class=\"d-s\" x=\"135\" y=\"146\" text-anchor=\"middle\">EBGP<\/text><rect class=\"d-cloud\" x=\"285.0\" y=\"82\" width=\"70\" height=\"26\" rx=\"13\"/><text class=\"d-t\" x=\"320\" y=\"99\" text-anchor=\"middle\">Internet<\/text><line class=\"d-ln d-dash\" x1=\"290\" y1=\"40\" x2=\"310\" y2=\"82\"/><line class=\"d-ln d-dash\" x1=\"290\" y1=\"154\" x2=\"310\" y2=\"108\"/><text class=\"d-s\" x=\"180\" y=\"200\" text-anchor=\"middle\">One local router, two EBGP sessions, two ISPs<\/text><\/svg>"}, {"tip": "Never let your network become a transit AS between your two ISPs. Advertise only your own prefixes to each one."}, {"check": [16, 5]}]}, {"h": "Sharing the load", "b": [{"p": "With two ISPs, active/standby (one link idle until the other fails) gives availability but wastes a link. Active/active uses both, steered by BGP attributes (covered in detail in the next lesson):"}, {"ul": ["Outbound (traffic leaving you): set a higher local preference on the routes from the ISP you prefer.", "Inbound (traffic coming to you): make one path look worse to the outside by AS-path prepending (adding your AS number again), or with MED towards the same ISP."]}, {"p": "BGP picks only one best path per prefix by default. If one router is connected to two ISPs and you want it to use both paths at once, turn on BGP multipath for equal-cost load sharing."}, {"check": [6, 15]}]}, {"h": "Key takeaways", "b": [{"ul": ["BGP is a path-vector EGP for policy between autonomous systems. TCP 179. Public ASNs 1 to 64,511, private 64,512 to 65,535.", "eBGP (AD 20) prevents loops with the AS path. iBGP (AD 200) uses split horizon, which forces a full mesh.", "Route reflectors bend split horizon: clients peer only with the RR, and RRs and non-clients stay fully meshed. The cluster list (cluster ID or router ID) prevents loops; a shorter list wins.", "Confederations split the AS into sub-ASes joined by eBGP-style sessions. Outsiders see one confederation ID. Sub-AS numbers appear in brackets in the AS path.", "Single-homed, dual-homed, multihomed and dual-multihomed, in increasing redundancy. Multihoming needs PI space and a public ASN.", "Active/active: local preference for outbound, AS-path prepend for inbound, multipath for equal-cost sharing. Never become a transit AS."]}, {"tip": "Common traps: RRs aren't clients of each other by default; they're fully meshed non-clients. Redundant RRs form a cluster, not a confederation. Dual-homed means one ISP; multihomed means several."}]}], "verified": [["BGP-4, path-vector, inter-AS routing; TCP port 179", "p. 280–281"], ["Public ASNs 1 to 64,511 and private 64,512 to 65,535", "p. 282"], ["eBGP between ASes; iBGP within an AS and used in transit ASes and large corporate cores", "p. 282–284"], ["iBGP needs a full mesh; route reflectors reduce it; RR plus clients is a cluster; RRs peer with each other; clients peer only with their RRs", "p. 285–287"], ["Single RR per cluster is a single point of failure", "p. 287"], ["Confederations: sub-ASes with full iBGP mesh inside, eBGP between; outsiders see only the confederation identifier", "p. 287–288"], ["AD 20 for eBGP and 200 for iBGP", "p. 289"], ["Local preference controls exit from the AS; higher wins; default 100", "p. 290"], ["Internet options: single-router single-homed, single-router dual-homed, dual-router dual-homed", "p. 526–527"], ["Internet edge HA: public ASN, PI space, full or partial tables, HSRP/GLBP or an IGP inside", "p. 528–529"]], "course": ["Single/dual-homed, multihomed and dual-multihomed names", "Cluster list and cluster ID fallback to router ID; shorter cluster list preferred", "RR redundancy over separate physical paths; hierarchical RRs", "AS_CONFED_SEQUENCE ordering and bgp bestpath med confed", "Active/active with local preference and AS-path prepend; BGP multipath"]}, "Introducing Multicast": {"mins": 14, "intro": "Multicast sends one stream to many receivers without the source sending a copy for each. This lesson covers why it exists, its addresses, how hosts join (IGMP), how switches avoid flooding, which protocols run where, distribution trees, and the RPF check that keeps it loop-free.", "parts": [{"h": "One to many", "b": [{"p": "Unicast sends one copy per receiver: 100 viewers means 100 identical streams from the source. Broadcast sends to everyone, wanted or not. Multicast sends to a group: the source sends one packet, and the network's multicast routers replicate it only at the points where paths to receivers split."}, {"dia": "<svg viewBox=\"0 0 360 230\" role=\"img\" aria-label=\"Multicast: the source sends one copy, routers running PIM replicate it toward receivers, and receivers join with IGMP\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><rect class=\"d-box\" x=\"76\" y=\"16\" width=\"248\" height=\"168\" rx=\"3\"/><text class=\"d-s\" x=\"200\" y=\"30\" text-anchor=\"middle\">PIM domain<\/text><line class=\"d-ln d-red\" x1=\"46\" y1=\"100\" x2=\"100\" y2=\"100\"/><line class=\"d-ln d-red\" x1=\"110\" y1=\"100\" x2=\"200\" y2=\"60\"/><line class=\"d-ln d-red\" x1=\"110\" y1=\"100\" x2=\"200\" y2=\"140\"/><line class=\"d-ln d-red\" x1=\"200\" y1=\"60\" x2=\"290\" y2=\"40\"/><line class=\"d-ln d-red\" x1=\"200\" y1=\"60\" x2=\"290\" y2=\"80\"/><line class=\"d-ln d-red\" x1=\"200\" y1=\"140\" x2=\"290\" y2=\"140\"/><rect class=\"d-rt\" x=\"14\" y=\"91\" width=\"32\" height=\"18\" rx=\"3\"/><text class=\"d-s\" x=\"30\" y=\"104\" text-anchor=\"middle\">Src<\/text><circle class=\"d-rt\" cx=\"110\" cy=\"100\" r=\"10\"/><path class=\"d-x\" d=\"M105 97h10M105 103h10\"/><circle class=\"d-rt\" cx=\"200\" cy=\"60\" r=\"10\"/><path class=\"d-x\" d=\"M195 57h10M195 63h10\"/><circle class=\"d-rt\" cx=\"200\" cy=\"140\" r=\"10\"/><path class=\"d-x\" d=\"M195 137h10M195 143h10\"/><rect class=\"d-rt\" x=\"294\" y=\"31\" width=\"32\" height=\"18\" rx=\"3\"/><text class=\"d-s\" x=\"310\" y=\"44\" text-anchor=\"middle\">Rcv<\/text><rect class=\"d-rt\" x=\"294\" y=\"71\" width=\"32\" height=\"18\" rx=\"3\"/><text class=\"d-s\" x=\"310\" y=\"84\" text-anchor=\"middle\">Rcv<\/text><rect class=\"d-rt\" x=\"294\" y=\"131\" width=\"32\" height=\"18\" rx=\"3\"/><text class=\"d-s\" x=\"310\" y=\"144\" text-anchor=\"middle\">Rcv<\/text><text class=\"d-s\" x=\"30\" y=\"124\" text-anchor=\"middle\">sends 1 copy<\/text><text class=\"d-s\" x=\"30\" y=\"138\" text-anchor=\"middle\">no protocol<\/text><text class=\"d-s\" x=\"150\" y=\"174\" text-anchor=\"middle\">PIM between routers<\/text><text class=\"d-s\" x=\"352\" y=\"176\" text-anchor=\"end\">IGMP on receiver LANs<\/text><text class=\"d-s\" x=\"200\" y=\"200\" text-anchor=\"middle\">MSDP / MP-BGP to other domains<\/text><text class=\"d-s\" x=\"180\" y=\"222\" text-anchor=\"middle\">Routers copy the packet only where branches lead to receivers<\/text><\/svg>"}, {"p": "The main application model is one-to-many (video streaming, software distribution, market data). Many-to-many, such as conferencing, is the second model. Multicast runs over UDP, so nothing resends lost packets."}, {"check": [0, 9, 1]}]}, {"h": "Multicast addresses", "b": [{"p": "IPv4 multicast uses 224.0.0.0/4 (224.0.0.0 to 239.255.255.255), the old Class D:"}, {"tbl": [["Range", "Use"], ["224.0.0.0/24", "Local network control, never forwarded (e.g. 224.0.0.5 OSPF, 224.0.0.13 all PIM routers)"], ["224.0.1.0 to 238.255.255.255", "Globally scoped, allocated dynamically across the internet"], ["232.0.0.0/8", "Source-Specific Multicast (SSM)"], ["239.0.0.0/8", "Administratively scoped (private, like RFC 1918)"]]}, {"p": "On Ethernet, the low 23 bits of the group address are copied into a MAC address starting 01:00:5E. For example, 224.0.0.2 becomes 0100.5e00.0002. IPv6 multicast uses FF00::/8."}, {"check": [17, 11]}]}, {"h": "Hosts join with IGMP", "b": [{"p": "Receivers tell their local router which groups they want with IGMP (Internet Group Management Protocol, IP protocol 2). It runs only between hosts and their local router; it's never routed. (IPv6 uses MLD.)"}, {"ul": ["IGMPv1: join only; leaving takes up to 3 minutes of timeouts.", "IGMPv2: adds a Leave message for fast leaving.", "IGMPv3: adds source filtering, so a host can ask for a group from a specific source. SSM needs it."]}, {"p": "A plain switch floods multicast out every port in the VLAN. IGMP snooping stops that: the switch listens to IGMP joins and leaves and forwards each group only to ports with interested receivers. (CGMP was the older Cisco method.)"}, {"check": [18, 19]}]}, {"h": "Which protocol runs where", "b": [{"tbl": [["Where", "Protocol"], ["Source segment", "Nothing. The source just sends to the group address; it doesn't join anything."], ["Receiver segments", "IGMP (MLD for IPv6)"], ["Between routers in a domain", "PIM (Protocol Independent Multicast), building distribution trees"], ["Between domains", "MSDP (shares active sources between RPs) and MP-BGP (multicast-capable routes for RPF)"]]}, {"p": "So a working multicast network needs two kinds of state: distribution trees across the whole network, and group membership state at the leaf (receiver) segments."}, {"check": [12, 3, 4, 8]}]}, {"h": "Distribution trees", "b": [{"tbl": [["", "Source tree", "Shared tree"], ["Rooted at", "The source", "A rendezvous point (RP)"], ["State", "(S,G): one entry per source and group", "(*,G): any source to group G"], ["Path", "Shortest path from the source, so also called a shortest-path tree (SPT)", "Via the RP, which may not be the shortest"], ["Good for", "A single source; lowest delay", "Many sources; less router memory"]]}, {"p": "PIM dense mode floods traffic everywhere, then prunes branches with no receivers (like junk mail you have to opt out of), using source trees. PIM sparse mode sends nothing until someone asks, starting on the shared tree through the RP. SSM builds source trees only, with no RP."}, {"check": [7, 13, 16, 20, 21, 22]}]}, {"h": "The RPF check", "b": [{"p": "Unicast forwarding looks at where a packet is going. Multicast looks at where it came from. The reverse path forwarding (RPF) check asks: did this packet arrive on the interface my unicast routing table would use to reach the source?"}, {"dia": "<svg viewBox=\"0 0 360 198\" role=\"img\" aria-label=\"Reverse path forwarding: a multicast packet arriving on the interface that leads back to the source is forwarded out the OIL; one arriving elsewhere is dropped\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><line class=\"d-ln d-red\" x1=\"40\" y1=\"70\" x2=\"170\" y2=\"70\"/><line class=\"d-ln\" x1=\"190\" y1=\"70\" x2=\"320\" y2=\"70\"/><line class=\"d-ln d-dash\" x1=\"180\" y1=\"80\" x2=\"180\" y2=\"140\"/><circle class=\"d-rt\" cx=\"180\" cy=\"70\" r=\"10\"/><path class=\"d-x\" d=\"M175 67h10M175 73h10\"/><text class=\"d-t\" x=\"180\" y=\"50\" text-anchor=\"middle\">Router<\/text><text class=\"d-s\" x=\"44\" y=\"62\">Gi0/1: route back to source<\/text><text class=\"d-s\" x=\"44\" y=\"90\">✓ arrives here: forwarded<\/text><text class=\"d-s\" x=\"316\" y=\"62\" text-anchor=\"end\">Gi0/2 (OIL)<\/text><text class=\"d-s\" x=\"316\" y=\"90\" text-anchor=\"end\">copy sent out<\/text><text class=\"d-s\" x=\"188\" y=\"124\">Gi0/3<\/text><text class=\"d-s\" x=\"180\" y=\"160\" text-anchor=\"middle\">✗ same packet arriving on Gi0/3: fails RPF, dropped<\/text><text class=\"d-s\" x=\"180\" y=\"190\" text-anchor=\"middle\">RPF asks “did this come in on the way back to the source?”<\/text><\/svg>"}, {"ul": ["Passes: forward a copy out every interface in the outgoing interface list (OIL), the interfaces with downstream receivers.", "Fails: the packet came in an unexpected way, possibly a loop, so it's silently dropped."]}, {"p": "The interface toward the source is called the incoming interface (IIF) in the multicast routing table."}, {"check": [5, 6, 14, 10]}]}, {"h": "Multicast over SD-WAN", "b": [{"p": "Cisco SD-WAN supports PIM sparse mode (and SSM) on the service side, with the RP outside the fabric. cEdge routers send multicast routes to vSmart using OMP, like every other piece of control information. A replicator WAN Edge copies the streams so the source's edge doesn't have to."}, {"check": [2, 15]}]}, {"h": "Key takeaways", "b": [{"ul": ["The source sends one packet; multicast routers replicate it toward receivers. One-to-many is the main model.", "224.0.0.0/4. 224.0.0.0/24 local; 224.0.1.0–238.255.255.255 global; 232/8 SSM; 239/8 private.", "IGMP: host to router (v3 adds source filtering). IGMP snooping stops switch flooding.", "Nothing at the source segment; IGMP at receivers; PIM inside a domain; MSDP and MP-BGP between domains.", "Source tree (S,G) = SPT, one source. Shared tree (*,G) = rooted at an RP, many sources.", "RPF checks where the packet came from. Pass: out every OIL interface. Fail: drop.", "SD-WAN: PIM-SM, multicast routes to vSmart via OMP."]}, {"tip": "Common traps: sources don't run IGMP. RPF doesn't check the destination. (*,G) means a shared tree."}]}], "verified": [["Class D 224.0.0.0 to 239.255.255.255; 239.x administratively scoped", "p. 327–328"], ["Low 23 bits mapped into 0100.5e MAC addresses", "p. 329–330"], ["IGMP between hosts and local router, protocol 2, not routed; v1, v2 leave, v3 for SSM", "p. 330–332"], ["IGMP snooping replaced CGMP", "p. 333–334"], ["(*,G) and (S,G); dense versus sparse approaches", "p. 334–335"], ["Source trees are SPTs; shared trees rooted at the RP", "p. 335"], ["PIM-DM floods and prunes with RPF; PIM-SM uses RPs", "p. 336"], ["MSDP interconnects PIM-SM domains by sharing sources between RPs", "p. 338"], ["IPv6 multicast FF00::/8", "p. 340"], ["SD-WAN supports PIM-SM with a replicator; RP is not an SD-WAN device", "p. 623"]], "course": ["Protocols by location (none at source segments)", "Two required kinds of state (trees and leaf group state)", "232.0.0.0/8 SSM and the global-scope range", "OIL and IIF terminology", "cEdge multicast routes via OMP"]}, "Discovering the Cisco SD-Access Architecture": {"mins": 14, "intro": "SD-Access is Cisco's automated campus. Instead of configuring hundreds of switches and VLANs by hand, a controller builds a fabric, and policy follows users by identity rather than by port or IP address. This lesson introduces the pieces, the layers and the node roles. The next two lessons go deeper into how the fabric works and how to size a site.", "parts": [{"h": "Why SD-Access", "b": [{"p": "In a traditional campus, segmentation is built from VLANs and IP subnets, security is ACLs tied to addresses, wired and wireless have separate policies, and everything is configured box by box on the CLI. It works, but every change touches many devices and mistakes are easy."}, {"p": "SD-Access changes three things:"}, {"ul": ["Automation: a central controller, Cisco DNA Center (now renamed Catalyst Center), designs and provisions the whole network.", "Policy by identity: users and devices are put into groups when they log in, and rules are written group to group, the same for wired and wireless.", "Assurance (analytics): the controller collects telemetry and uses AI and machine learning to spot problems and suggest fixes."]}, {"p": "It has three main components:"}, {"tbl": [["Component", "Job"], ["Catalyst (DNA) Center", "Automation, design, provisioning and assurance (analytics)"], ["ISE (Identity Services Engine)", "Authenticates users and devices, puts them in security groups (SGTs), and holds the group-based policy"], ["The wired and wireless fabric", "The switches, routers, WLCs and APs that actually carry traffic"]]}, {"tip": "The newer practice questions say Catalyst Center; older ones say DNA Center. They're the same product. On the test, the AI/ML and automation answers point to it, while identity points to ISE."}, {"check": [13, 3, 7, 5, 0, 14]}]}, {"h": "Four layers", "b": [{"p": "Cisco describes the architecture as four stacked layers, from the hardware up to the people:"}, {"tbl": [["Layer", "Contains"], ["Management", "What people and tools touch: the GUI, APIs and CLI"], ["Controller", "The brains: Catalyst Center and ISE, running automation, identity and analytics"], ["Network", "The underlay and the fabric overlay, with their control, data and policy planes"], ["Physical", "The switches, routers, controllers and servers themselves"]]}, {"check": [1, 8, 6]}]}, {"h": "Underlay and overlay", "b": [{"p": "A fabric is two networks stacked on each other:"}, {"ul": ["The underlay is the physical network: a plain routed Layer 3 design, with no STP, VTP or FHRP. Its only job is to carry IP packets between fabric nodes' loopbacks. LAN automation builds it with IS-IS.", "The overlay is the logical network the users live in. Their traffic is wrapped (encapsulated) at the edge, carried across the underlay, and unwrapped at the other side."]}, {"p": "The overlay has three planes, each with its own technology:"}, {"tbl": [["Plane", "Technology", "Job"], ["Control", "LISP", "Keeps track of where every endpoint is"], ["Data", "VXLAN", "Carries the traffic, wrapped in a header holding its VN and group"], ["Policy", "TrustSec SGTs", "Decides which groups may talk to which"]]}, {"p": "Two kinds of segmentation run in the overlay:"}, {"ul": ["Virtual networks (VNs) are VRFs: completely separate routing tables. Hosts in different VNs can't reach each other without going through a fusion router or firewall outside the fabric (macrosegmentation).", "Scalable (security) group tags (SGTs) identify a group, like Contractors or Cameras, regardless of subnet or VLAN. Policy within a VN is written group to group (microsegmentation)."]}, {"check": [17, 18, 19]}]}, {"h": "Fabric node roles", "b": [{"dia": "<svg viewBox=\"0 0 360 294\" role=\"img\" aria-label=\"SD-Access fabric roles: Catalyst Center and ISE above a fabric site with border, control plane and edge nodes, connected to the data centre and WAN\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><rect class=\"d-box d-boxa\" x=\"8\" y=\"8\" width=\"344\" height=\"30\" rx=\"3\"/><text class=\"d-t\" x=\"180\" y=\"28\" text-anchor=\"middle\">Catalyst (DNA) Center  +  ISE<\/text><rect class=\"d-box\" x=\"8\" y=\"52\" width=\"344\" height=\"156\" rx=\"3\"/><text class=\"d-s\" x=\"14\" y=\"64\" text-anchor=\"start\">Fabric site<\/text><line class=\"d-ln\" x1=\"105\" y1=\"172\" x2=\"48\" y2=\"104\"/><line class=\"d-ln\" x1=\"105\" y1=\"172\" x2=\"312\" y2=\"104\"/><line class=\"d-ln\" x1=\"160\" y1=\"172\" x2=\"48\" y2=\"104\"/><line class=\"d-ln\" x1=\"160\" y1=\"172\" x2=\"312\" y2=\"104\"/><line class=\"d-ln\" x1=\"215\" y1=\"172\" x2=\"48\" y2=\"104\"/><line class=\"d-ln\" x1=\"215\" y1=\"172\" x2=\"312\" y2=\"104\"/><line class=\"d-ln\" x1=\"270\" y1=\"172\" x2=\"48\" y2=\"104\"/><line class=\"d-ln\" x1=\"270\" y1=\"172\" x2=\"312\" y2=\"104\"/><line class=\"d-ln d-dash\" x1=\"48\" y1=\"104\" x2=\"180\" y2=\"104\"/><line class=\"d-ln d-dash\" x1=\"180\" y1=\"104\" x2=\"312\" y2=\"104\"/><circle class=\"d-rt\" cx=\"48\" cy=\"104\" r=\"10\"/><path class=\"d-x\" d=\"M43 101h10M43 107h10\"/><circle class=\"d-rt\" cx=\"312\" cy=\"104\" r=\"10\"/><path class=\"d-x\" d=\"M307 101h10M307 107h10\"/><circle class=\"d-rt\" cx=\"180\" cy=\"104\" r=\"10\"/><path class=\"d-x\" d=\"M175 101h10M175 107h10\"/><text class=\"d-t\" x=\"48\" y=\"88\" text-anchor=\"middle\">Border<\/text><text class=\"d-t\" x=\"312\" y=\"88\" text-anchor=\"middle\">Border<\/text><text class=\"d-t\" x=\"180\" y=\"88\" text-anchor=\"middle\">Control plane<\/text><rect class=\"d-rt\" x=\"91\" y=\"164\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M97 170h16M97 175h16\"/><rect class=\"d-rt\" x=\"146\" y=\"164\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M152 170h16M152 175h16\"/><rect class=\"d-rt\" x=\"201\" y=\"164\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M207 170h16M207 175h16\"/><rect class=\"d-rt\" x=\"256\" y=\"164\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M262 170h16M262 175h16\"/><text class=\"d-s\" x=\"188\" y=\"198\" text-anchor=\"middle\">Edge nodes (same anycast gateway on each)<\/text><line class=\"d-ln\" x1=\"48\" y1=\"114\" x2=\"48\" y2=\"224\"/><line class=\"d-ln\" x1=\"312\" y1=\"114\" x2=\"312\" y2=\"224\"/><rect class=\"d-cloud\" x=\"10.0\" y=\"223\" width=\"120\" height=\"26\" rx=\"13\"/><text class=\"d-t\" x=\"70\" y=\"240\" text-anchor=\"middle\">Data centre<\/text><rect class=\"d-cloud\" x=\"230.0\" y=\"223\" width=\"120\" height=\"26\" rx=\"13\"/><text class=\"d-t\" x=\"290\" y=\"240\" text-anchor=\"middle\">WAN / internet<\/text><text class=\"d-s\" x=\"70\" y=\"264\" text-anchor=\"middle\">via internal border<\/text><text class=\"d-s\" x=\"290\" y=\"264\" text-anchor=\"middle\">via external border<\/text><text class=\"d-s\" x=\"180\" y=\"286\" text-anchor=\"middle\">Solid = underlay links; dashed = border to control plane<\/text><\/svg>"}, {"tbl": [["Role", "What it does"], ["Control plane node", "The LISP map server and resolver. It runs the host tracking database that maps each endpoint to the edge node it's behind."], ["Edge node", "The fabric's access switch. It gives users first-hop services, registers each connected endpoint with the control plane node, and does the VXLAN encapsulation."], ["Border node", "The way in and out of the fabric. Internal borders lead to known internal networks such as the data centre and advertise those prefixes into the fabric. External borders are the gateway of last resort to the WAN and internet."], ["Fabric WLC", "Manages APs as usual, and registers wireless clients with the control plane node. It isn't in the client data path."]]}, {"p": "Every edge node uses the same anycast gateway (the same IP and virtual MAC) for each subnet. A host can move to another edge and still find its gateway, with no FHRP needed."}, {"p": "Roles can share a box. A collocated border and control plane is common, and a single Catalyst 9300 with the embedded 9800 wireless controller can be a fabric in a box (every role) or a collocated border and control plane. Before combining roles, check that the specific hardware and software release supports those roles at the scale you need."}, {"tip": "The course key says control plane nodes \"enable users and applications to be securely isolated\". Strictly, isolation comes from VNs and SGTs, but pick that option alongside the host tracking database."}, {"check": [9, 10, 15, 16, 11, 2, 20, 12, 4, 21]}]}, {"h": "Key takeaways", "b": [{"ul": ["SD-Access = automation (Catalyst/DNA Center) + identity and policy (ISE) + the fabric. Assurance uses AI/ML.", "Layers: management (GUI, APIs, CLI), controller (Center + ISE), network (underlay and overlay), physical.", "Underlay: routed, IS-IS, just connects loopbacks. Overlay: LISP control plane, VXLAN data plane, SGT policy plane.", "VN = VRF (macrosegmentation); SGT = group (microsegmentation).", "Control plane node = host tracking database. Edge = first hop, registers hosts, encapsulates, anycast gateway. Internal border = known internal networks; external border = gateway of last resort. Fabric WLC registers wireless clients with the control plane.", "Check the platform's support for combined roles and scale before collocating."]}, {"tip": "Common traps: ISE doesn't do analytics. The external border, not the internal one, is the default exit. The WLC doesn't carry fabric client data."}]}], "verified": [["SD-Access built on DNA; benefits automation, policy, assurance and integration", "p. 557"], ["Underlay: routed, link-state recommended, no STP/VTP/FHRP; LAN automation uses IS-IS", "p. 559–560"], ["Overlay planes: LISP control, VXLAN data, SGT policy", "p. 561"], ["LISP tracks EID and RLOC on the control plane node; host mobility", "p. 561–562"], ["ISE provides identity and policy services and maps endpoints to scalable groups", "p. 567–568"], ["Fabric WLC registers clients with the control plane; AP data VXLAN-encapsulated", "p. 565"], ["Fusion router or firewall between VNs; borders exchange routes with the fusion router", "p. 573, 575"], ["Control plane functions can be collocated on border nodes if they meet the endpoint scale", "p. 572"]], "course": ["Three components including ISE (the Cert Guide lists two: DNA Center and the fabric)", "Four-layer model (management, controller, network, physical)", "Internal versus external border wording; gateway of last resort", "Anycast gateway", "Catalyst 9800 embedded WLC on the Catalyst 9300 topologies", "DNA Center renamed Catalyst Center"]}, "Layer 2 Campus": {"mins": 18, "intro": "Layer 2 is the switching part of the campus: VLANs, trunks, spanning tree, EtherChannel and the gateway redundancy that sits on top. It's the most question-heavy section, so this lesson is longer. Each part builds on the one before.", "parts": [{"h": "VLANs and trunks", "b": [{"p": "A VLAN splits one physical switch into several separate logical ones. Each VLAN is its own broadcast domain, normally matched to one IP subnet. Hosts in VLAN 10 can't talk to hosts in VLAN 20 directly; a Layer 3 device has to route between them (inter-VLAN routing), usually an SVI on a multilayer switch."}, {"p": "A trunk is a link that carries many VLANs at once, tagging each frame with its VLAN number (802.1Q). Cisco switches can negotiate trunks with DTP (Dynamic Trunking Protocol):"}, {"tbl": [["Port mode", "Behaviour"], ["Trunk", "Always a trunk"], ["Dynamic desirable", "Actively asks the neighbour to form a trunk"], ["Dynamic auto", "Waits; becomes a trunk only if the other side asks"], ["Access", "Never a trunk"]]}, {"p": "Two auto ports never form a trunk, because neither one asks. Best practice is to skip negotiation: hard-code trunks on, and disable trunking on host ports."}, {"p": "VTP (VLAN Trunking Protocol) can copy the VLAN list between switches, but versions 1 and 2 have a nasty failure mode: plug in a switch with a higher configuration revision number and its VLAN database overwrites everyone else's, wiping out VLANs. The recommendation is VTP transparent mode (VLANs managed locally on each switch), or VTPv3."}, {"p": "Cisco IP phones use CDP (Cisco Discovery Protocol) to learn their voice VLAN and negotiate PoE power from the switch. Non-Cisco phones use LLDP-MED."}, {"check": [19, 20, 0, 7, 21, 3]}]}, {"h": "Spanning tree: why and how", "b": [{"p": "Redundant links between switches are good, but Ethernet frames have no hop limit. A broadcast in a loop circles forever and multiplies until the network melts (a broadcast storm). Spanning Tree Protocol (STP) keeps the redundant cables but blocks just enough ports that there's only one active path. If the active path fails, a blocked port opens."}, {"p": "How it decides:"}, {"ul": ["Elect a root bridge: the switch with the lowest bridge ID wins. The bridge ID is priority (default 32,768) plus MAC address. Priority is compared first; the lowest MAC only breaks ties.", "Every other switch picks the port with the lowest total path cost to the root as its root port. Faster links have lower costs.", "On each segment, one port is designated to forward. Every other port blocks."]}, {"p": "Left alone, the oldest switch (lowest MAC) often becomes root, which might be a closet switch in a corner. So set the root manually: lower the priority on the distribution switch you want, and make its partner the secondary root."}, {"dia": "<svg viewBox=\"0 0 360 204\" role=\"img\" aria-label=\"STP root bridge and HSRP active gateway aligned on distribution switch 1, with each access switch blocking its uplink to distribution 2\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><line class=\"d-ln\" x1=\"90\" y1=\"60\" x2=\"270\" y2=\"60\"/><line class=\"d-ln\" x1=\"90\" y1=\"146\" x2=\"90\" y2=\"60\"/><line class=\"d-ln\" x1=\"270\" y1=\"146\" x2=\"90\" y2=\"60\"/><line class=\"d-ln d-red\" x1=\"90\" y1=\"146\" x2=\"270\" y2=\"60\"/><line class=\"d-ln d-red\" x1=\"270\" y1=\"146\" x2=\"270\" y2=\"60\"/><rect class=\"d-rt\" x=\"76\" y=\"52\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M82 58h16M82 63h16\"/><rect class=\"d-rt\" x=\"256\" y=\"52\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M262 58h16M262 63h16\"/><rect class=\"d-rt\" x=\"76\" y=\"138\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M82 144h16M82 149h16\"/><rect class=\"d-rt\" x=\"256\" y=\"138\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M262 144h16M262 149h16\"/><text class=\"d-t\" x=\"90\" y=\"18\" text-anchor=\"middle\">Dist 1<\/text><text class=\"d-s\" x=\"90\" y=\"34\" text-anchor=\"middle\">STP root + HSRP active<\/text><text class=\"d-t\" x=\"270\" y=\"18\" text-anchor=\"middle\">Dist 2<\/text><text class=\"d-s\" x=\"270\" y=\"34\" text-anchor=\"middle\">secondary root + standby<\/text><text class=\"d-t\" x=\"90\" y=\"174\" text-anchor=\"middle\">Access 1<\/text><text class=\"d-t\" x=\"270\" y=\"174\" text-anchor=\"middle\">Access 2<\/text><text class=\"d-s\" x=\"180\" y=\"198\" text-anchor=\"middle\">Red = uplink blocked by STP. Root and gateway on one switch<\/text><\/svg>"}, {"p": "Then align the gateway. Make the STP root the same switch as the HSRP or VRRP active gateway for that VLAN. Otherwise frames travel up to one distribution switch, cross the inter-switch link to reach the gateway on the other, and come back: needless hairpinning."}, {"check": [22, 9, 1, 24, 23]}]}, {"h": "STP versions", "b": [{"tbl": [["Version", "Standard", "Instances", "Notes"], ["STP", "802.1D", "One for all VLANs", "The original. Slow (30 to 50 seconds to converge)."], ["PVST+", "Cisco", "One per VLAN", "Lets different VLANs block different links, but hundreds of VLANs means hundreds of trees."], ["Rapid PVST+", "802.1w based", "One per VLAN", "Converges in about a second. Cisco's recommended choice. Ports are discarding, learning or forwarding."], ["MST", "802.1s", "A few, each covering many VLANs", "Maps VLANs with the same topology onto one instance. Scales best."]]}, {"p": "MST sends a single BPDU with all instances inside (as M-records), however many instances exist. PVST+ sends one per VLAN."}, {"p": "The MST catch: it blocks per instance, not per VLAN. If two VLANs share an instance but each is only allowed on one of two parallel links, blocking one link can cut off a VLAN entirely. Don't manually prune VLANs from trunks in an MST design."}, {"check": [8, 29, 11, 30]}]}, {"h": "The STP toolkit", "b": [{"p": "Cisco adds features that make STP faster and safer. Each one goes in a specific place:"}, {"tbl": [["Feature", "Where", "What it does"], ["PortFast", "Edge ports to end devices", "Skips listening and learning, so a PC's port forwards immediately"], ["BPDU Guard", "With PortFast, on edge ports", "Shuts (err-disables) the port if a BPDU arrives, meaning someone plugged in a switch"], ["Root Guard", "Distribution ports facing access", "If a superior BPDU arrives, the port goes root-inconsistent instead of letting a new root take over"], ["Loop Guard", "Root and alternate (blocking) ports", "If expected BPDUs stop arriving, it blocks (loop-inconsistent) instead of wrongly starting to forward"], ["UDLD", "Fibre links (aggressive mode, enabled globally)", "Detects one-way links and miswired fibre pairs before they create a loop"]]}, {"tip": "PortFast always goes with BPDU Guard. Loop Guard protects against missing BPDUs; Root Guard against unexpected superior ones; UDLD against bad wiring."}, {"check": [25, 2, 26, 27, 10]}]}, {"h": "EtherChannel and logical switches", "b": [{"p": "EtherChannel bundles up to eight links into one logical link. STP sees one link, so nothing blocks, and if a member fails the others carry on. Traffic is spread across members by a hash of addresses and ports, so one flow always uses one link."}, {"tbl": [["Method", "Type", "Misconfiguration protection"], ["LACP (802.3ad)", "Open standard, negotiates", "Good: checks the far end first. Recommended."], ["PAgP", "Cisco, negotiates", "Good"], ["Static (mode on)", "No negotiation", "Least: mismatched ends can still bundle and cause loops"]]}, {"p": "Normally an EtherChannel ends on one switch. Multichassis EtherChannel (MEC) lets it end on two switches that behave as one:"}, {"ul": ["VSS (Catalyst 4500/6500/6800) and StackWise Virtual (for example a 2-node Catalyst 9500 pair) join two chassis into one logical switch, with one active control plane and one standby.", "StackWise joins access switches with stacking cables into one switch with one management IP.", "The device at the far end only needs normal EtherChannel support."]}, {"p": "Two sizing rules from Cisco:"}, {"ul": ["Oversubscription: 20:1 for access-to-distribution uplinks, 4:1 for distribution-to-core.", "Fibre reach: 10GBASE-SR (multimode) up to about 400 m on OM4; 10GBASE-LR (single-mode) 10 km; 10GBASE-ER 40 to 80 km."]}, {"p": "Where the servers are also shapes bandwidth needs. If an application's server is on the same segment as its clients (client-local server), its traffic never crosses the core. Data-centre and internet-edge applications do."}, {"check": [13, 4, 17, 12, 6, 16]}]}, {"h": "First-hop redundancy", "b": [{"p": "A PC has one default gateway. If that router dies, the PC is stranded. A first-hop redundancy protocol (FHRP) lets two or more routers share a virtual IP and MAC address that the PCs use as their gateway. One router answers, and another takes over if it fails."}, {"tbl": [["", "HSRP", "VRRP", "GLBP"], ["Owner", "Cisco", "IETF standard (RFC 5798 for v3)", "Cisco"], ["Roles", "Active / standby", "Master / backup", "One AVG, up to 4 AVFs"], ["Load sharing", "Per VLAN, using different groups", "Per VLAN, using different groups", "Built in: several virtual MACs behind one IP"], ["Default timers", "3 s hello / 10 s hold", "1 s / 3 s", "3 s / 10 s"], ["Preemption", "Off by default", "On by default", "Off by default (for the AVG)"]]}, {"p": "HSRP can fail over in under a second with tuned timers (200 ms hello, 750 ms hold), and it should be configured with preemption so the primary takes back over when it recovers. VSS and StackWise Virtual remove the need for an FHRP, because the pair is already one switch."}, {"check": [5, 14, 15]}]}, {"h": "Filtering inside the switch", "b": [{"p": "A multilayer switch can filter traffic at three points, with different ACL types:"}, {"ul": ["PACL (port ACL): on a physical switch port.", "VACL (VLAN ACL): on everything in a VLAN, including traffic switched between two hosts in the same VLAN, which a router never sees.", "RACL (router ACL): on a routed interface or SVI. It only sees traffic being routed."]}, {"dia": "<svg viewBox=\"0 0 360 86\" role=\"img\" aria-label=\"ACL processing order: ingress PACL, VACL, RACL, routing, then egress RACL, VACL, PACL\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"8\" y=\"14\" text-anchor=\"start\">INGRESS (IN THE PORT)<\/text><text class=\"d-h\" x=\"352\" y=\"14\" text-anchor=\"end\">EGRESS (OUT THE PORT)<\/text><rect class=\"d-box\" x=\"6\" y=\"30\" width=\"44\" height=\"26\" rx=\"3\"/><text class=\"d-t\" x=\"28.0\" y=\"47\" text-anchor=\"middle\">PACL<\/text><line class=\"d-ln\" x1=\"50\" y1=\"43\" x2=\"56\" y2=\"43\" marker-end=\"url(#ar)\"/><rect class=\"d-box\" x=\"57\" y=\"30\" width=\"44\" height=\"26\" rx=\"3\"/><text class=\"d-t\" x=\"79.0\" y=\"47\" text-anchor=\"middle\">VACL<\/text><line class=\"d-ln\" x1=\"101\" y1=\"43\" x2=\"107\" y2=\"43\" marker-end=\"url(#ar)\"/><rect class=\"d-box\" x=\"108\" y=\"30\" width=\"44\" height=\"26\" rx=\"3\"/><text class=\"d-t\" x=\"130.0\" y=\"47\" text-anchor=\"middle\">RACL<\/text><line class=\"d-ln\" x1=\"152\" y1=\"43\" x2=\"158\" y2=\"43\" marker-end=\"url(#ar)\"/><rect class=\"d-box d-boxa\" x=\"159\" y=\"30\" width=\"40\" height=\"26\" rx=\"3\"/><text class=\"d-t\" x=\"179.0\" y=\"47\" text-anchor=\"middle\">route<\/text><line class=\"d-ln\" x1=\"199\" y1=\"43\" x2=\"205\" y2=\"43\" marker-end=\"url(#ar)\"/><rect class=\"d-box\" x=\"206\" y=\"30\" width=\"44\" height=\"26\" rx=\"3\"/><text class=\"d-t\" x=\"228.0\" y=\"47\" text-anchor=\"middle\">RACL<\/text><line class=\"d-ln\" x1=\"250\" y1=\"43\" x2=\"256\" y2=\"43\" marker-end=\"url(#ar)\"/><rect class=\"d-box\" x=\"257\" y=\"30\" width=\"44\" height=\"26\" rx=\"3\"/><text class=\"d-t\" x=\"279.0\" y=\"47\" text-anchor=\"middle\">VACL<\/text><line class=\"d-ln\" x1=\"301\" y1=\"43\" x2=\"307\" y2=\"43\" marker-end=\"url(#ar)\"/><rect class=\"d-box\" x=\"308\" y=\"30\" width=\"44\" height=\"26\" rx=\"3\"/><text class=\"d-t\" x=\"330.0\" y=\"47\" text-anchor=\"middle\">PACL<\/text><text class=\"d-s\" x=\"180\" y=\"78\" text-anchor=\"middle\">Port → VLAN → routed interface, then back out in reverse<\/text><\/svg>"}, {"check": [28, 18]}]}, {"h": "Key takeaways", "b": [{"ul": ["A VLAN is a broadcast domain; moving between VLANs needs inter-VLAN routing. Desirable asks for a trunk, auto waits. Use VTP transparent mode.", "STP: lowest bridge ID (priority, then MAC) becomes root; lowest path cost wins. Set the root manually at distribution and align it with the FHRP active gateway.", "Rapid PVST+ is recommended. MST maps many VLANs to a few instances in one BPDU, but blocks per instance.", "Toolkit: PortFast plus BPDU Guard on edge ports, Root Guard toward access, Loop Guard on blocking ports, UDLD on fibre.", "LACP negotiates and protects; mode on doesn't. VSS and StackWise Virtual make two chassis one switch, so MEC uses every uplink.", "Oversubscription 20:1 access and 4:1 distribution. 10GBASE-SR reaches about 400 m.", "VRRP is the IETF FHRP and preempts by default; HSRP doesn't. GLBP load-balances.", "ACL order: ingress PACL, VACL, RACL; egress RACL, VACL, PACL. A VACL sees switched traffic."]}, {"tip": "Common traps: auto plus auto never trunks. Priority is checked before MAC. Root Guard isn't Loop Guard. VRRP, not HSRP, preempts by default."}]}], "verified": [["PAgP modes and combinations that form a channel; LACP protects against misconfiguration; static mode can cause problems", "p. 400–401"], ["EtherChannel up to eight ports with matching speed, duplex and VLAN; Cisco hash-based load balancing", "p. 399"], ["STP: 802.1D, default priority 32,768, lowest MAC breaks ties; lower the priority on the distribution switch and align it with the FHRP", "p. 402–403, 405"], ["PVST+, Rapid PVST+ (802.1w, recommended) and MST (802.1s, maps VLANs to fewer instances; don't prune VLANs manually)", "p. 404–405"], ["PortFast with BPDU Guard on end-user ports; Root Guard where a root isn't expected; Loop Guard on root and blocked ports", "p. 406–407"], ["UDLD detects unidirectional fibre links; aggressive mode, enabled globally", "p. 409"], ["Use VTP transparent mode; disable trunking on host ports; set trunks on with no negotiation", "p. 427"], ["VTPv1/v2 instability when a higher-revision switch is added; VTPv3 fixes it", "p. 433"], ["HSRP 3 s/10 s, subsecond with 200/750 ms, preemption disabled by default; load sharing via multiple groups", "p. 435"], ["VRRP: RFC 3768 (v2) and RFC 5798 (v3), based on HSRP but incompatible, 1 s/3 s, preempt on by default", "p. 436–437"], ["GLBP: Cisco, up to four gateways, one virtual IP with multiple virtual MACs", "p. 437–438"], ["VSS: distribution pair as one switch, MEC, no STP blocking and no FHRP", "p. 438"], ["Oversubscription 20:1 access-to-distribution and 4:1 distribution-to-core", "p. 442"], ["10GBASE-SR multimode up to 400 m", "p. 448"]], "course": ["DTP modes (dynamic desirable and auto)", "CDP for Cisco IP phones; LLDP-MED for others", "MST single BPDU with M-records, and the per-instance blocking risk", "StackWise Virtual on the Catalyst 9500", "ACL processing order (PACL, VACL, RACL)", "Client-local server application type"]}, "Exploring Cisco SD-Access Fabric Design": {"mins": 15, "intro": "How the fabric actually works: how segmentation is layered, how LISP finds an endpoint, what VXLAN does to a packet (and why MTU matters), what the underlay needs, and how DHCP and wireless fit in.", "parts": [{"h": "Segmentation in two layers", "b": [{"p": "SD-Access segments traffic with two technologies working together:"}, {"tbl": [["", "Macrosegmentation", "Microsegmentation"], ["Built with", "Virtual networks (VNs), which are VRFs", "Scalable group tags (Cisco TrustSec SGTs)"], ["Separates", "Whole routing domains, e.g. Corporate, Guest, IoT", "Groups inside one VN, e.g. Sales and Marketing"], ["Crossing the line", "Only via a fusion router or firewall outside the fabric", "Allowed or denied by SGACLs from ISE, enforced on the edge and border"]]}, {"p": "So the answer to \"what segments SD-Access\" is VNs (VRFs) plus SGTs (TrustSec). VXLAN only carries them, and ISE defines the policy."}, {"p": "Users and devices first have to prove who they are. In AAA terms, authentication confirms identity, authorization decides what they're allowed (including which SGT they get), and accounting records what they did."}, {"check": [0, 5, 7, 17]}]}, {"h": "LISP: finding an endpoint", "b": [{"p": "LISP (Locator/ID Separation Protocol) splits an endpoint's address into two ideas:"}, {"ul": ["EID (endpoint identifier): who it is, its IP or MAC address. It stays the same wherever the device moves.", "RLOC (routing locator): where it is, the loopback address of the edge node it's attached to. This is what the underlay routes to."]}, {"p": "The control plane node keeps the map between them, so the underlay never has to learn host routes:"}, {"dia": "<svg viewBox=\"0 0 360 222\" role=\"img\" aria-label=\"LISP in SD-Access: edge 2 registers host B, edge 1 asks the control plane node where B is, gets edge 2 as the RLOC, and tunnels the traffic with VXLAN\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><circle class=\"d-rt\" cx=\"180\" cy=\"36\" r=\"10\"/><path class=\"d-x\" d=\"M175 33h10M175 39h10\"/><text class=\"d-t\" x=\"180\" y=\"16\" text-anchor=\"middle\">Control plane node<\/text><text class=\"d-s\" x=\"200\" y=\"40\">B is at Edge 2<\/text><line class=\"d-ln\" x1=\"292\" y1=\"110\" x2=\"192\" y2=\"46\" marker-end=\"url(#ar)\"/><circle class=\"d-rt\" cx=\"256\" cy=\"70\" r=\"8\"/><text class=\"d-s\" x=\"256\" y=\"74\" text-anchor=\"middle\">1<\/text><text class=\"d-s\" x=\"300\" y=\"80\" text-anchor=\"middle\">Map-Register<\/text><line class=\"d-ln\" x1=\"70\" y1=\"110\" x2=\"166\" y2=\"48\" marker-end=\"url(#ar)\"/><circle class=\"d-rt\" cx=\"98\" cy=\"72\" r=\"8\"/><text class=\"d-s\" x=\"98\" y=\"76\" text-anchor=\"middle\">2<\/text><text class=\"d-s\" x=\"56\" y=\"66\" text-anchor=\"middle\">Map-Request<\/text><line class=\"d-ln d-dash\" x1=\"172\" y1=\"52\" x2=\"78\" y2=\"114\" marker-end=\"url(#ar)\"/><circle class=\"d-rt\" cx=\"128\" cy=\"100\" r=\"8\"/><text class=\"d-s\" x=\"128\" y=\"104\" text-anchor=\"middle\">3<\/text><text class=\"d-s\" x=\"140\" y=\"122\">Map-Reply: RLOC = Edge 2<\/text><rect class=\"d-rt\" x=\"46\" y=\"112\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M52 118h16M52 123h16\"/><rect class=\"d-rt\" x=\"286\" y=\"112\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M292 118h16M292 123h16\"/><text class=\"d-t\" x=\"38\" y=\"124\" text-anchor=\"end\">Edge 1<\/text><text class=\"d-t\" x=\"320\" y=\"124\">Edge 2<\/text><rect class=\"d-tun\" x=\"76\" y=\"160\" width=\"208\" height=\"14\" rx=\"7\"/><text class=\"d-s\" x=\"180\" y=\"191\" text-anchor=\"middle\">4 · VXLAN tunnel across the underlay<\/text><line class=\"d-ln\" x1=\"60\" y1=\"128\" x2=\"60\" y2=\"160\"/><line class=\"d-ln\" x1=\"300\" y1=\"128\" x2=\"300\" y2=\"160\"/><rect class=\"d-rt\" x=\"6\" y=\"158\" width=\"36\" height=\"20\" rx=\"3\"/><text class=\"d-t\" x=\"24\" y=\"172\" text-anchor=\"middle\">A<\/text><rect class=\"d-rt\" x=\"318\" y=\"158\" width=\"36\" height=\"20\" rx=\"3\"/><text class=\"d-t\" x=\"336\" y=\"172\" text-anchor=\"middle\">B<\/text><line class=\"d-ln\" x1=\"42\" y1=\"168\" x2=\"76\" y2=\"168\"/><line class=\"d-ln\" x1=\"284\" y1=\"168\" x2=\"318\" y2=\"168\"/><text class=\"d-s\" x=\"180\" y=\"214\" text-anchor=\"middle\">EID = who (host IP/MAC); RLOC = where (edge loopback)<\/text><\/svg>"}, {"ul": ["When host B connects, Edge 2 registers it: \"B is behind me\" (Map-Register).", "When A first sends to B, Edge 1 doesn't know where B is, so it asks the control plane node, which is the map resolver (Map-Request).", "The answer is Edge 2's RLOC (Map-Reply). Edge 1 caches it.", "Edge 1 tunnels the traffic straight to Edge 2 with VXLAN."]}, {"p": "If B moves to another edge, the new edge registers it and the control plane node updates B's mapping. B keeps its IP address, and wireless roaming works the same way."}, {"p": "If you've met DMVPN, NHRP plays the same part there: it maps tunnel addresses to the real (NBMA) underlay addresses. LISP maps EIDs to RLOCs."}, {"check": [9, 10, 11, 14, 16]}]}, {"h": "VXLAN and MTU", "b": [{"p": "VXLAN is the data plane. The edge wraps each user frame in new headers addressed from its own RLOC to the destination edge's RLOC:"}, {"dia": "<svg viewBox=\"0 0 360 116\" role=\"img\" aria-label=\"VXLAN packet layout: outer Ethernet, outer IP, UDP 4789 and a VXLAN header with VNI and SGT wrapped around the original frame\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"8\" y=\"14\" text-anchor=\"start\">A VXLAN PACKET<\/text><rect class=\"d-box\" x=\"6\" y=\"26\" width=\"64\" height=\"34\" rx=\"3\"/><text class=\"d-s\" x=\"38.0\" y=\"40\" text-anchor=\"middle\">Outer<\/text><text class=\"d-s\" x=\"38.0\" y=\"54\" text-anchor=\"middle\">Ethernet<\/text><rect class=\"d-box\" x=\"72\" y=\"26\" width=\"74\" height=\"34\" rx=\"3\"/><text class=\"d-s\" x=\"109.0\" y=\"40\" text-anchor=\"middle\">Outer IP<\/text><text class=\"d-s\" x=\"109.0\" y=\"54\" text-anchor=\"middle\">edge → edge<\/text><rect class=\"d-box\" x=\"148\" y=\"26\" width=\"62\" height=\"34\" rx=\"3\"/><text class=\"d-s\" x=\"179.0\" y=\"40\" text-anchor=\"middle\">UDP<\/text><text class=\"d-s\" x=\"179.0\" y=\"54\" text-anchor=\"middle\">port 4789<\/text><rect class=\"d-box\" x=\"212\" y=\"26\" width=\"70\" height=\"34\" rx=\"3\"/><text class=\"d-s\" x=\"247.0\" y=\"40\" text-anchor=\"middle\">VXLAN<\/text><text class=\"d-s\" x=\"247.0\" y=\"54\" text-anchor=\"middle\">VNI + SGT<\/text><rect class=\"d-box d-boxa\" x=\"284\" y=\"26\" width=\"60\" height=\"34\" rx=\"3\"/><text class=\"d-s\" x=\"314.0\" y=\"40\" text-anchor=\"middle\">Original<\/text><text class=\"d-s\" x=\"314.0\" y=\"54\" text-anchor=\"middle\">frame<\/text><path class=\"d-ln\" d=\"M6 64 v6 h276 v-6\"/><text class=\"d-s\" x=\"145\" y=\"84\" text-anchor=\"middle\">about 50 bytes added by the fabric<\/text><text class=\"d-s\" x=\"318\" y=\"84\" text-anchor=\"middle\">user packet<\/text><text class=\"d-s\" x=\"180\" y=\"108\" text-anchor=\"middle\">The VNI says which VN; the group ID carries the SGT<\/text><\/svg>"}, {"ul": ["It runs over UDP port 4789.", "The VNI (VXLAN network identifier) is 24 bits, so about 16 million segments are possible.", "The Group Policy Option field carries the 16-bit SGT, so policy travels with the packet."]}, {"p": "Those extra headers add about 50 bytes. If the underlay MTU is still 1,500, a full-size user packet won't fit, and it's dropped or fragmented. So fabric links use jumbo frames (9,100 is typical). Only the underlay needs them; endpoints can stay at the normal 1,500-byte MTU."}, {"tip": "The course's answer to \"which two header formats does SD-Access support\" is LISP and VXLAN. Strictly, packets carry a VXLAN header and LISP is the control protocol, but remember the pair."}, {"check": [4, 12, 13]}]}, {"h": "The underlay", "b": [{"p": "The underlay is a routed network connecting every fabric node's loopback. Cisco recommends IS-IS, and LAN automation in Catalyst Center configures it automatically. IS-IS forms neighbours over Layer 2 without needing IP addresses, peers using loopbacks, and treats IPv4 and IPv6 the same way. (OSPF works too, configured manually.)"}, {"p": "Built as a routed design with equal-cost links, the underlay uses ECMP: several equal best paths to each destination, already installed, for load sharing and fast failover."}, {"check": [6, 1]}]}, {"h": "DHCP in the fabric", "b": [{"p": "Every edge node uses the same anycast gateway IP for a subnet. That's great for mobility, but awkward for DHCP: when the server replies to the gateway address, which edge should get it?"}, {"p": "The fix is DHCP option 82 (relay agent information). When Catalyst Center automates the DHCP relay, the edge adds option 82 to the request, identifying which edge node (RLOC) and VN it came from. The reply carries it back, so the border can send it to the right edge."}, {"check": [15, 2]}]}, {"h": "Wireless in the fabric", "b": [{"p": "There are two ways to add wireless:"}, {"tbl": [["", "Fabric wireless (preferred)", "Over-the-top (OTT)"], ["Control traffic", "CAPWAP from AP to WLC", "CAPWAP from AP to WLC"], ["Client data", "The AP VXLAN-encapsulates it straight into the fabric", "CAPWAP carries it all the way to the WLC"], ["Fabric benefits", "Same VNs, SGTs and policy as wired", "None; the fabric is just transport"], ["Use when", "Fabric-capable WLC and APs", "Older APs, or as a migration step"]]}, {"p": "In fabric mode, the WLC still does its classic jobs (AP image and configuration management, client sessions, mobility), and it integrates with the fabric control plane: it registers each wireless client with the control plane node, which tracks EID-to-RLOC bindings in its host database. As the client roams, the mapping is updated."}, {"check": [3, 8]}]}, {"h": "Key takeaways", "b": [{"ul": ["Segmentation = VNs/VRFs (macro) + TrustSec SGTs (micro). Authentication confirms identity.", "Control plane LISP, data plane VXLAN, policy plane SGTs.", "EID = identity; RLOC = edge loopback. Edges register (Map-Register) and ask (Map-Request). A move updates the mapping, and the host keeps its IP. NHRP is DMVPN's equivalent.", "VXLAN: UDP 4789, 24-bit VNI (16 million), SGT in the header, about 50 bytes of overhead. Jumbo MTU on the underlay only.", "Underlay: IS-IS (LAN automation), ECMP.", "DHCP option 82 tells the server which edge and VN; needed because of the anycast gateway.", "Fabric WLC integrates with the control plane; client data goes AP to fabric."]}, {"tip": "Common traps: ISE defines policy but isn't the segmentation mechanism. RLOC is a location, not the host's IP. Endpoints don't need jumbo frames."}]}], "verified": [["Underlay: routed, link-state; LAN automation uses IS-IS; configures MTU, loopbacks, ECMP and BFD", "p. 559–560"], ["Control plane LISP, data plane VXLAN with group policy, policy plane SGTs", "p. 561"], ["LISP tracks EID (IP or MAC) and RLOC; host mobility keeps the IP address; RFC 6830", "p. 561–562"], ["VXLAN over UDP 4789; VNI identifies the VN; SGT in the Group ID field; RFC 7348", "p. 563"], ["Fabric wireless: CAPWAP control to the WLC, client data VXLAN from the AP; WLC registers clients with the control plane; OTT uses CAPWAP for both", "p. 565–566, 581–582"], ["SGT is a 16-bit value in the VXLAN header; ISE classifies; TrustSec propagates", "p. 568–569"], ["Macrosegmentation via VNs needs a fusion router or firewall; microsegmentation via SGTs", "p. 570"], ["SGACLs downloaded from ISE to edge and border nodes", "p. 574"], ["VN is a VRF; 16 million VNI segments", "p. 575–576"]], "course": ["DHCP option 82 with the anycast gateway", "About 50 bytes of VXLAN overhead and the 9,100-byte jumbo MTU", "Map-Register, Map-Request and Map-Reply", "NHRP versus LISP comparison", "AAA definitions"]}, "Exploring YANG, NETCONF, RESTCONF and Model-Driven Telemetry": {"mins": 13, "intro": "The final lesson goes deeper into YANG, NETCONF and RESTCONF side by side, then covers model-driven telemetry: streaming data out of devices instead of polling them, the subscription types, and dial-in versus dial-out.", "parts": [{"h": "YANG revisited", "b": [{"p": "YANG is a data modelling language. It's hierarchical (a tree of modules, containers, lists and leafs), modular and extensible, and it defines the meaning of the data. It's protocol-independent: although it was originally designed for NETCONF, its models can be carried by NETCONF, RESTCONF or gRPC. What YANG is not is a transport. It carries nothing; SSH or HTTPS do that."}, {"p": "When a design calls for vendor-neutral models maintained by an industry community, choose OpenConfig. IETF models are standards-body models; native models are vendor-specific."}, {"check": [0, 10, 22]}]}, {"h": "NETCONF and RESTCONF compared", "b": [{"tbl": [["", "NETCONF", "RESTCONF"], ["Published", "2006 (RFC 4741, updated as 6241)", "2017 (RFC 8040)"], ["Transport", "SSH", "HTTPS"], ["Encoding", "XML", "XML or JSON"], ["Datastores", "Running, startup, candidate", "Uses NETCONF's datastores"], ["Transactions and locks", "Yes, including network-wide transactions", "No; changes apply directly"]]}, {"p": "Because NETCONF has a separate candidate datastore, you can diff it against running and validate a change before committing it, which minimizes the impact of changes. TFTP isn't a datastore; it's a file-transfer protocol."}, {"p": "RESTCONF verbs map onto NETCONF operations:"}, {"tbl": [["RESTCONF", "NETCONF equivalent"], ["GET", "<get> / <get-config>"], ["POST", "<edit-config> create, or invoke an RPC"], ["PUT", "<edit-config> create/replace"], ["PATCH", "<edit-config> merge (partial update)"], ["DELETE", "<edit-config> delete"]]}, {"check": [11, 13, 9, 1, 2, 12]}]}, {"h": "Model-driven telemetry: push, not pull", "b": [{"p": "CLI, SNMP and even RESTCONF all poll: the collector asks, the device answers. With several management stations polling many devices, that doesn't scale, and it misses anything between polls."}, {"p": "Model-driven telemetry (MDT) flips it. The device streams (pushes) YANG-structured data to a collector, either on a timer or whenever a value changes. It's faster, more efficient and near-real-time, which helps with traffic optimization and catching problems early. On IOS XE, telemetry subscriptions are set up and delivered over NETCONF (and gRPC for dial-out)."}, {"check": [5, 19, 4]}]}, {"h": "Subscriptions", "b": [{"p": "A subscription is an agreement about which YANG data to push and when:"}, {"tbl": [["Type", "Sends", "Best for"], ["Periodic (cadence-based)", "When a timer is met, e.g. every 10 seconds, whether or not the data changed", "Steadily changing data like interface counters"], ["On-change (policy-based)", "Only when a data node's value changes", "Values that change occasionally but must be reported quickly, like an interface or neighbour going down"]]}, {"p": "Don't use on-change for counters that change constantly; it would fire nonstop."}, {"check": [14, 16, 7, 20, 15]}]}, {"h": "Dial-in and dial-out", "b": [{"dia": "<svg viewBox=\"0 0 360 196\" role=\"img\" aria-label=\"Telemetry dial-in, where the collector connects and subscribes, compared with dial-out, where the device connects to the collector; in both the device pushes the data\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"90\" y=\"14\" text-anchor=\"middle\">DIAL-IN<\/text><text class=\"d-h\" x=\"270\" y=\"14\" text-anchor=\"middle\">DIAL-OUT (DEFAULT)<\/text><rect class=\"d-box d-boxa\" x=\"52\" y=\"26\" width=\"76\" height=\"28\" rx=\"3\"/><text class=\"d-t\" x=\"90\" y=\"44\" text-anchor=\"middle\">Collector<\/text><circle class=\"d-rt\" cx=\"90\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M85 117h10M85 123h10\"/><rect class=\"d-box d-boxa\" x=\"232\" y=\"26\" width=\"76\" height=\"28\" rx=\"3\"/><text class=\"d-t\" x=\"270\" y=\"44\" text-anchor=\"middle\">Collector<\/text><circle class=\"d-rt\" cx=\"270\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M265 117h10M265 123h10\"/><line class=\"d-ln d-dash\" x1=\"80\" y1=\"56\" x2=\"80\" y2=\"108\" marker-end=\"url(#ar)\"/><line class=\"d-ln d-red\" x1=\"100\" y1=\"108\" x2=\"100\" y2=\"56\" marker-end=\"url(#ar)\"/><text class=\"d-s\" x=\"74\" y=\"80\" text-anchor=\"end\">1 · connects,<\/text><text class=\"d-s\" x=\"74\" y=\"94\" text-anchor=\"end\">subscribes<\/text><text class=\"d-s\" x=\"106\" y=\"80\">2 · device<\/text><text class=\"d-s\" x=\"106\" y=\"94\">pushes<\/text><line class=\"d-ln d-dash\" x1=\"260\" y1=\"108\" x2=\"260\" y2=\"56\" marker-end=\"url(#ar)\"/><line class=\"d-ln d-red\" x1=\"280\" y1=\"108\" x2=\"280\" y2=\"56\" marker-end=\"url(#ar)\"/><text class=\"d-s\" x=\"254\" y=\"80\" text-anchor=\"end\">1 · device<\/text><text class=\"d-s\" x=\"254\" y=\"94\" text-anchor=\"end\">connects<\/text><text class=\"d-s\" x=\"286\" y=\"80\">2 · then<\/text><text class=\"d-s\" x=\"286\" y=\"94\">pushes<\/text><text class=\"d-t\" x=\"90\" y=\"146\" text-anchor=\"middle\">Device<\/text><text class=\"d-t\" x=\"270\" y=\"146\" text-anchor=\"middle\">Device<\/text><text class=\"d-s\" x=\"90\" y=\"164\" text-anchor=\"middle\">dynamic; ends with session<\/text><text class=\"d-s\" x=\"270\" y=\"164\" text-anchor=\"middle\">configured; persists<\/text><text class=\"d-s\" x=\"180\" y=\"188\" text-anchor=\"middle\">Either way the data is pushed; only who opens the connection differs<\/text><\/svg>"}, {"ul": ["Dial-in: the collector connects to the device and subscribes dynamically to one or more sensor paths. The subscription ends when the session ends. NETCONF is the only transport for these dynamic subscriptions, created with an <establish-subscription> XML RPC over an existing NETCONF session.", "Dial-out (the default): subscriptions are configured on the device, which connects to the collector itself and keeps retrying (every 30 seconds) if the session drops. They persist across reboots."]}, {"check": [8, 18, 21, 6, 17]}]}, {"h": "gNMI", "b": [{"p": "gNMI (gRPC Network Management Interface) runs over gRPC and handles both configuration and streaming telemetry. Its subscription modes are:"}, {"ul": ["Once: a single snapshot.", "Poll: sends when the collector asks.", "Stream: sends continuously, sampled or on change."]}, {"check": [3, 23]}]}, {"h": "Key takeaways", "b": [{"ul": ["YANG: hierarchical, modular, extensible, protocol-independent (first for NETCONF), not a transport. OpenConfig = vendor-neutral.", "NETCONF: SSH, XML, running/startup/candidate, transactions and locks, config diff. RESTCONF: HTTPS, XML/JSON, no transactions.", "PATCH = merge; PUT = create/replace; POST = create or invoke an RPC.", "MDT pushes data instead of polling; NETCONF carries it on IOS XE.", "Periodic (cadence, timer) versus on-change (policy, value changes).", "Dial-in: collector subscribes dynamically, NETCONF only, XML RPCs. Dial-out: default, device connects, persistent.", "gNMI over gRPC: Once, Poll, Stream."]}, {"tip": "Common traps: RESTCONF still polls. Dial-out, not dial-in, is the default. TFTP isn't a datastore."}]}], "verified": [["YANG RFC 6020 for NETCONF and RESTCONF; extensible; tree structure", "p. 650"], ["NETCONF running, candidate and startup datastores; transactions", "p. 653–654"], ["NETCONF over SSH with XML; RESTCONF over HTTP with XML or JSON; NETCONF network-wide transactions and locks, RESTCONF none", "p. 654, 656–658"], ["OpenConfig vendor-neutral models from network operators", "p. 660"], ["Model-driven telemetry streams data with a push model, replacing SNMP polling; subscriptions over NETCONF", "p. 660–663"], ["Periodic and on-change publications; on-change not for frequently changing counters", "p. 663–665"], ["Dial-in: receiver connects, dynamic, ends with the session; dial-out: default, device connects, persistent, retries every 30 seconds", "p. 665–666"]], "course": ["RESTCONF to NETCONF operation mapping", "Cadence-based and policy-based configuration methods", "NETCONF as the only transport for dynamic subscriptions; <establish-subscription> XML RPCs", "gNMI subscription modes (Once, Poll, Stream)"]}, "Designing Layer 3 Campus": {"mins": 16, "intro": "Once the campus is routed, the design work moves to the routing protocol: how links are built, how fast it recovers, where to summarize, how to bring in a default route, how to mix protocols safely, and how to manage it all. This lesson covers each in turn.", "parts": [{"h": "Build triangles, not squares", "b": [{"p": "How switches are cabled decides how they recover. In a triangle, each switch connects to both switches in the layer above, so it holds two equal-cost routes for every destination, and both are installed in its CEF forwarding table. In a square, each switch has only one link up, so a failure means waiting for the routing protocol to find a new path."}, {"dia": "<svg viewBox=\"0 0 360 208\" role=\"img\" aria-label=\"Layer 3 triangles give each distribution switch two equal-cost paths to the core; squares give only one\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"85\" y=\"16\" text-anchor=\"middle\">TRIANGLES<\/text><line class=\"d-ln\" x1=\"40\" y1=\"50\" x2=\"130\" y2=\"50\"/><line class=\"d-ln\" x1=\"40\" y1=\"130\" x2=\"40\" y2=\"50\"/><line class=\"d-ln\" x1=\"40\" y1=\"130\" x2=\"130\" y2=\"50\"/><line class=\"d-ln\" x1=\"130\" y1=\"130\" x2=\"40\" y2=\"50\"/><line class=\"d-ln\" x1=\"130\" y1=\"130\" x2=\"130\" y2=\"50\"/><rect class=\"d-rt\" x=\"26\" y=\"42\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M32 48h16M32 53h16\"/><rect class=\"d-rt\" x=\"116\" y=\"42\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M122 48h16M122 53h16\"/><rect class=\"d-rt\" x=\"26\" y=\"122\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M32 128h16M32 133h16\"/><rect class=\"d-rt\" x=\"116\" y=\"122\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M122 128h16M122 133h16\"/><text class=\"d-s\" x=\"85\" y=\"40\" text-anchor=\"middle\">core<\/text><text class=\"d-s\" x=\"85\" y=\"156\" text-anchor=\"middle\">distribution<\/text><text class=\"d-h\" x=\"271\" y=\"16\" text-anchor=\"middle\">SQUARES<\/text><line class=\"d-ln\" x1=\"226\" y1=\"50\" x2=\"316\" y2=\"50\"/><line class=\"d-ln\" x1=\"226\" y1=\"130\" x2=\"226\" y2=\"50\"/><line class=\"d-ln\" x1=\"316\" y1=\"130\" x2=\"316\" y2=\"50\"/><line class=\"d-ln\" x1=\"226\" y1=\"130\" x2=\"316\" y2=\"130\"/><rect class=\"d-rt\" x=\"212\" y=\"42\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M218 48h16M218 53h16\"/><rect class=\"d-rt\" x=\"302\" y=\"42\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M308 48h16M308 53h16\"/><rect class=\"d-rt\" x=\"212\" y=\"122\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M218 128h16M218 133h16\"/><rect class=\"d-rt\" x=\"302\" y=\"122\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M308 128h16M308 133h16\"/><text class=\"d-s\" x=\"271\" y=\"40\" text-anchor=\"middle\">core<\/text><text class=\"d-s\" x=\"271\" y=\"156\" text-anchor=\"middle\">distribution<\/text><text class=\"d-s\" x=\"85\" y=\"176\" text-anchor=\"middle\">two equal paths up, both in CEF<\/text><text class=\"d-s\" x=\"271\" y=\"176\" text-anchor=\"middle\">one path up; failure = reconverge<\/text><text class=\"d-s\" x=\"180\" y=\"200\" text-anchor=\"middle\">A failed link in a triangle just removes one CEF entry<\/text><\/svg>"}, {"p": "CEF (Cisco Express Forwarding) is the hardware fast path. It builds a Forwarding Information Base (FIB) from the routing table, plus an adjacency table of ready-made Layer 2 headers for each next hop. Packets are switched without looking up the route each time."}, {"p": "With ECMP (equal-cost multipath), the backup path is already in the FIB. In OSPF, routes have to tie on cost (and stay within maximum-paths) to be installed together."}, {"check": [0, 15, 14, 16]}]}, {"h": "Recovering fast", "b": [{"p": "When there's no alternate path ready, recovery has three steps, and each takes time:"}, {"ul": ["Detect the failure.", "Calculate or choose a new route.", "Update the forwarding table (FIB)."]}, {"p": "Designs shorten each step:"}, {"ul": ["Detection: a link going down physically is noticed at once, but a failure behind a switch or on a provider link might not be. BFD (Bidirectional Forwarding Detection) sends tiny, frequent hellos and tells the routing protocol within milliseconds, much faster than routing dead timers.", "Calculation: ECMP skips this step entirely, because the alternate path is already installed.", "Forwarding during a control-plane restart: NSF (Non-Stop Forwarding) keeps forwarding on the last known CEF table while the routing process restarts or a supervisor switches over. Graceful Restart (GR) tells neighbours not to tear down the adjacency meanwhile."]}, {"p": "The opposite danger is routing meltdown: churn spreading faster than routers can process it, so instability snowballs. The cure is GR/NSF plus slowing things down where it helps, using SPF and LSA throttling timers and dampening. Speeding everything up makes meltdown worse."}, {"check": [17, 18, 4, 11]}]}, {"h": "Controlling where the routing protocol runs", "b": [{"p": "Distribution switches have interfaces on every user VLAN. If the routing protocol forms neighbourships over those VLANs, the access layer can become a transit path, and you waste CPU on pointless adjacencies. Make those interfaces passive: they still advertise their subnet, but send no hellos, so no adjacency forms."}, {"p": "Passive behaves differently by protocol. In OSPF and EIGRP it stops hellos completely, so nothing forms in either direction. RIP has no hellos or adjacencies, so a passive RIP interface just stops sending updates but still listens."}, {"p": "In OSPF the area design is the main control tool. OSPF can only summarize or filter at the area border (the ABR). Inside an area every router holds the full database, so you have little control over intra-area traffic. That's why proper multi-area design matters."}, {"p": "OSPFv3 runs over IPv6 (link-local addresses), but with address families it can route both IPv4 and IPv6."}, {"check": [1, 10, 25, 8, 12]}]}, {"h": "Summarization and default routes", "b": [{"p": "Summarizing at the distribution layer toward the core keeps the core's tables small and hides flapping links from the rest of the network. That gives stability, control and predictability, and lets the design scale."}, {"p": "Working out a summary: 10.3.8.0/24 to 10.3.15.0/24 is eight subnets. Eight is 2³, so take three bits off the /24 to get /21. The range starts on a multiple of eight, so 10.3.8.0/21 covers it exactly."}, {"p": "The catch: a summary stays advertised as long as any one of its subnets exists. If one access subnet dies, traffic for it still heads to that distribution switch and is dropped. A link between the distribution pair helps by giving it somewhere to send the traffic."}, {"p": "The ultimate summary is the default route, 0.0.0.0/0, which matches everything. In the campus, the best way to provide one is to have the edge router originate or redistribute it into the IGP, rather than configuring static defaults everywhere. It must reflect real upstream connectivity: if the ISP link fails, the default should be withdrawn, or internal routers keep sending internet traffic to a dead exit."}, {"check": [2, 20, 21, 6, 7, 22]}]}, {"h": "Redistribution and filtering", "b": [{"p": "Redistribution copies routes from one source into another protocol. Sources can be static routes, connected routes, or routes learned from another protocol. Common reasons are migrations, mergers, mixed vendors, and the internet edge (OSPF inside, BGP to the ISP)."}, {"ul": ["One-way redistribution: routes go only one direction, with a default or static route going the other way. Simple and safe.", "Two-way (mutual) redistribution: routes go both ways. The risk is route feedback: a route from protocol A enters B, then comes back into A at a second redistribution point, looking like a better path. That causes loops and suboptimal routing. Tag routes and filter them at every redistribution point."]}, {"p": "Filtering also protects you from others. Defensive filtering means filtering what you accept from peers, so someone else's bad advertisement doesn't disrupt your network."}, {"p": "At the internet edge, BGP is the protocol between autonomous systems. With two ISPs, advertise only your own prefixes to each, and never pass one ISP's routes to the other, or you become a transit path between them."}, {"check": [23, 24, 9, 19, 3]}]}, {"h": "Managing the network", "b": [{"tbl": [["", "In-band", "Out-of-band (OOB)"], ["Path", "The same network as user traffic", "A separate, dedicated network (console and management ports)"], ["When the network fails", "Management goes down with it", "Still reachable"], ["Cost", "Cheap", "A second network to build"]]}, {"p": "OOB best practice is isolation and strict access control, since the OOB network can reach every device. Give remote administrators access through a firewall that terminates their client VPNs. A management VRF is a middle ground: management traffic gets its own routing table while sharing the physical network."}, {"p": "The main tools:"}, {"ul": ["SNMP polls devices for statistics and receives traps. v1 and v2c send community strings in plain text, so use them read-only at most. SNMPv3 adds three security levels: noAuthNoPriv, authNoPriv, and authPriv (authentication and encryption).", "RMON collects detailed traffic statistics on segments using probes.", "NetFlow records per-flow data (who talked to whom, ports, volume) for traffic analysis, capacity planning, billing and security. SNMP and RMON give device and interface totals instead.", "Syslog collects event messages; CDP and LLDP discover neighbours."]}, {"tip": "Management traffic deserves some priority. The Cert Guide writes it as \"CS1 PHB (DSCP 16)\", but DSCP 16 is CS2, which is the class Cisco's QoS baseline actually uses for network management."}, {"check": [28, 13, 5, 29, 26, 27]}]}, {"h": "Key takeaways", "b": [{"ul": ["Triangles give two equal-cost CEF entries, so failover doesn't wait for reconvergence. CEF uses a FIB plus an adjacency table.", "Recovery is detect, recalculate, update. BFD speeds detection; ECMP skips recalculation; NSF and GR keep forwarding during a control-plane restart. Slowing propagation prevents meltdown.", "Passive interfaces on user-facing VLANs. OSPF only controls traffic at area borders.", "Summarize at distribution toward the core. The default route is the ultimate summary; originate it from the edge and withdraw it if the ISP fails.", "Mutual redistribution risks feedback loops: tag and filter. Defensive filtering protects against peers' mistakes. Never be a transit AS.", "OOB management is a separate network: isolate it and control access. SNMPv3 levels are noAuthNoPriv, authNoPriv and authPriv. NetFlow is per-flow."]}, {"tip": "Common traps: speeding up propagation causes meltdown rather than preventing it. A summary can black-hole a failed subnet. A passive RIP interface still receives."}]}], "verified": [["Two CEF entries in redundant triangles let forwarding continue without waiting for routing convergence", "p. 394"], ["Build Layer 3 triangles, not squares; summarize at distribution toward the core; only peer on transit links", "p. 430"], ["Summarize at distribution; passive interfaces on access-layer interfaces", "p. 303–306"], ["Summarization example 192.168.16.0/21 and common-bit method", "p. 304–305"], ["Redistribution reasons and sources (static, other protocols); one-way and two-way; route feedback prevented by filters", "p. 306–309"], ["Filtering at redistribution points avoids loops and suboptimal routing; don't become a transit AS with two ISPs", "p. 310"], ["FCAPS; SNMP manager, agent and MIB", "p. 341–345"], ["In-band versus OOB management; OOB uses separate credentials and infrastructure", "p. 343–344"], ["SNMPv1/v2c read-only; SNMPv3 levels noAuthNoPriv, authNoPriv, authPriv", "p. 346–349"], ["RMON and NetFlow characteristics", "p. 350–352"]], "course": ["BFD, NSF and Graceful Restart; routing meltdown prevention", "Reconvergence steps; ECMP equal-cost condition", "Passive RIP versus OSPF behaviour", "Conditional default-route origination", "Defensive filtering; firewall with VPN termination for OOB access; management VRF"]}, "Examining Cisco SD-WAN Architectures": {"mins": 16, "intro": "SD-WAN builds one centrally managed, policy-driven overlay across whatever transports each site has. This lesson covers the four planes and their components, how OMP and TLOCs work, the reserved VPNs, and how a new router joins the fabric.", "parts": [{"h": "Overlay over underlay", "b": [{"p": "The primary purpose of Cisco SD-WAN is to provide centrally managed, policy-based connectivity over multiple WAN transports. Instead of tying a site to one MPLS circuit, you mix MPLS, broadband internet and LTE/5G, active/active, under one set of policies."}, {"ul": ["The underlay is the real transport that provides IP reachability: MPLS, internet, LTE/5G, Metro Ethernet. (Wi-Fi standards like 802.11ac are LAN, not WAN transports.)", "The overlay is the virtual network of IPsec tunnels built on top, between the WAN Edge routers."]}, {"check": [25, 26, 0, 11]}]}, {"h": "Four planes, four components", "b": [{"dia": "<svg viewBox=\"0 0 360 244\" role=\"img\" aria-label=\"Cisco SD-WAN planes: vManage, vBond and vSmart controllers with control connections to WAN Edge routers, which carry user traffic over IPsec tunnels across the transports\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><line class=\"d-ln d-dash\" x1=\"60\" y1=\"46\" x2=\"80\" y2=\"160\"/><line class=\"d-ln d-dash\" x1=\"180\" y1=\"46\" x2=\"80\" y2=\"160\"/><line class=\"d-ln d-dash\" x1=\"300\" y1=\"46\" x2=\"80\" y2=\"160\"/><line class=\"d-ln d-dash\" x1=\"60\" y1=\"46\" x2=\"280\" y2=\"160\"/><line class=\"d-ln d-dash\" x1=\"180\" y1=\"46\" x2=\"280\" y2=\"160\"/><line class=\"d-ln d-dash\" x1=\"300\" y1=\"46\" x2=\"280\" y2=\"160\"/><rect class=\"d-cloud\" x=\"105.0\" y=\"115\" width=\"150\" height=\"26\" rx=\"13\"/><text class=\"d-t\" x=\"180\" y=\"132\" text-anchor=\"middle\">MPLS · internet · LTE<\/text><line class=\"d-ln d-red\" x1=\"90\" y1=\"170\" x2=\"270\" y2=\"170\"/><rect class=\"d-box d-boxa\" x=\"16\" y=\"14\" width=\"88\" height=\"32\" rx=\"3\"/><text class=\"d-t\" x=\"60\" y=\"29\" text-anchor=\"middle\">vManage<\/text><text class=\"d-s\" x=\"60\" y=\"41\" text-anchor=\"middle\">management<\/text><rect class=\"d-box d-boxa\" x=\"136\" y=\"14\" width=\"88\" height=\"32\" rx=\"3\"/><text class=\"d-t\" x=\"180\" y=\"29\" text-anchor=\"middle\">vBond<\/text><text class=\"d-s\" x=\"180\" y=\"41\" text-anchor=\"middle\">orchestration<\/text><rect class=\"d-box d-boxa\" x=\"256\" y=\"14\" width=\"88\" height=\"32\" rx=\"3\"/><text class=\"d-t\" x=\"300\" y=\"29\" text-anchor=\"middle\">vSmart<\/text><text class=\"d-s\" x=\"300\" y=\"41\" text-anchor=\"middle\">control<\/text><circle class=\"d-rt\" cx=\"80\" cy=\"170\" r=\"10\"/><path class=\"d-x\" d=\"M75 167h10M75 173h10\"/><circle class=\"d-rt\" cx=\"280\" cy=\"170\" r=\"10\"/><path class=\"d-x\" d=\"M275 167h10M275 173h10\"/><text class=\"d-t\" x=\"80\" y=\"196\" text-anchor=\"middle\">WAN Edge<\/text><text class=\"d-t\" x=\"280\" y=\"196\" text-anchor=\"middle\">WAN Edge<\/text><text class=\"d-s\" x=\"180\" y=\"164\" text-anchor=\"middle\">IPsec data tunnel<\/text><text class=\"d-s\" x=\"180\" y=\"212\" text-anchor=\"middle\">data plane<\/text><text class=\"d-s\" x=\"180\" y=\"236\" text-anchor=\"middle\">Dashed = DTLS/TLS control connections (OMP to vSmart); red = user traffic<\/text><\/svg>"}, {"tbl": [["Plane", "Component", "Job"], ["Orchestration", "vBond", "First point of contact. Authenticates a new WAN Edge, tells it how to reach vManage and the vSmarts, and tells the vSmarts about the new edge."], ["Management", "vManage", "The single GUI and NMS for configuring and monitoring every device. vAnalytics is reached through it."], ["Control", "vSmart", "The \"brains\": runs OMP with every WAN Edge, distributes routes, TLOCs and keys, and enforces the policies built in vManage"], ["Data"
