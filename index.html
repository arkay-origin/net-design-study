, "WAN Edge (vEdge or IOS XE SD-WAN router)", "Builds the IPsec tunnels and forwards user traffic"]]}, {"p": "\"Overlay plane\" isn't one of the four. WAN Edges never exchange routes directly with each other; they send them to vSmart, which redistributes them with policy applied."}, {"p": "vAnalytics uses telemetry to spot utilization anomalies, application-experience problems and SLA-violation trends, and to forecast \"what if\" changes."}, {"tip": "Newer Cisco names: vManage is SD-WAN Manager, vSmart is SD-WAN Controller, vBond is SD-WAN Validator. The course uses the old names."}, {"check": [12, 18, 2, 13, 1, 3, 19, 28, 6, 4, 33]}]}, {"h": "OMP: the control protocol", "b": [{"p": "OMP (Overlay Management Protocol) runs between each WAN Edge and the vSmarts, inside secure DTLS or TLS control connections. It's control-plane only. It carries:"}, {"ul": ["OMP routes: the prefixes each site learned locally (connected, static, OSPF, BGP).", "TLOC routes: the tunnel endpoints on each WAN Edge.", "Service routes: services such as firewalls or IPS at a site.", "Encryption keys and policy."]}, {"p": "It never carries user data. Because each WAN Edge learns every other edge's TLOCs and keys through vSmart, it can build IPsec tunnels straight to them, with no IKE between edges and no full mesh of control sessions."}, {"p": "That means the control topology and the data topology can differ: every edge peers with the vSmarts (hub-like), while the IPsec tunnels can form a full mesh between edges."}, {"check": [14, 20, 17, 7, 10, 27, 29]}]}, {"h": "TLOCs and colors", "b": [{"p": "A TLOC (transport locator) is one tunnel endpoint on a WAN Edge: one transport interface. It's identified by three things:"}, {"ul": ["The system IP of the router", "The color: a label for the link type, such as mpls or biz-internet", "The encapsulation: IPsec or GRE"]}, {"p": "No MAC address is involved. OMP routes point to TLOCs as their next hop, much like a BGP next hop. A router with an MPLS link and an internet link has two TLOCs, told apart by their colors."}, {"tbl": [["", "Private colors", "Public colors"], ["Examples", "mpls, metro-ethernet, private1–6", "biz-internet, public-internet, lte, 3g, gold, silver, bronze, red, blue, green, custom1–3, default"], ["Tunnels built to", "The native (private) address; no NAT expected", "The post-NAT public address"]]}, {"p": "Two other identifiers matter. The system IP is a unique logical ID for each device, like a router ID; it doesn't have to be a WAN interface address. The site ID identifies a location: two WAN Edges at the same branch share it (and don't build tunnels to each other), but each keeps its own system IP."}, {"check": [15, 9, 21, 16, 22, 30, 31, 32]}]}, {"h": "Reserved VPNs", "b": [{"p": "In SD-WAN, a VPN is a segment, like a VRF:"}, {"tbl": [["VPN", "Use"], ["VPN 0", "Transport: the WAN interfaces and control connections"], ["VPN 512", "Out-of-band management"], ["1–511, 513–65530", "Service VPNs carrying user traffic, segmented like VRFs"]]}, {"check": [8, 23]}]}, {"h": "Joining the fabric", "b": [{"p": "Every element is authenticated before it's admitted (a zero-trust model). Control connections use certificates over DTLS/TLS, and data tunnels use AES-256-GCM."}, {"p": "With Zero Touch Provisioning (ZTP), a new router configures itself:"}, {"ul": ["It needs a signed certificate in its onboard tamper-proof module (TPM), so vBond can trust it before any configuration exists.", "It must reach public DNS and the ZTP server (ztp.viptela.com), which points it to vBond.", "vBond authenticates it and tells it where vManage and the vSmarts are.", "It downloads its configuration template from vManage, forms OMP peering with vSmart, learns routes and TLOCs, then builds IPsec tunnels and runs BFD across them."]}, {"p": "Without ZTP, an admin configures the minimum by hand: an IP address and gateway, the vBond address, the organization name, system IP and site ID. IOS XE routers can also use PnP Connect or a bootstrap file on a USB key."}, {"check": [5, 24]}]}, {"h": "Key takeaways", "b": [{"ul": ["SD-WAN = one policy-based overlay across many transports. Underlay = transport; overlay = IPsec tunnels.", "Planes: orchestration (vBond, onboarding), management (vManage, GUI), control (vSmart, the brains), data (WAN Edge).", "OMP between edges and vSmart carries OMP, TLOC and service routes plus keys and policy, never user data. Control and data topologies can differ.", "TLOC = system IP + color + encapsulation. Private colors (mpls, metro-ethernet, private1–6) use native addresses; public colors use post-NAT addresses.", "System IP is unique per device; site ID is shared at a site.", "VPN 0 transport, VPN 512 management.", "ZTP needs a TPM certificate, DNS and ztp.viptela.com, then vBond."]}, {"tip": "Common traps: there's no overlay plane. vBond onboards; vManage monitors. IPsec runs edge to edge, not to the controllers."}]}], "verified": [["Four planes: orchestration, management, control, data", "p. 600–601"], ["vManage central NMS; vAnalytics accessed through vManage", "p. 601–602"], ["vBond authenticates vEdges and orchestrates vSmart/vEdge connectivity", "p. 602"], ["vSmart is the brains; vEdges send routes to vSmart via OMP, not to each other", "p. 602"], ["vEdges build IPsec/GRE tunnels and forward traffic", "p. 602"], ["Private colors (metro-ethernet, mpls, private1–6) and public colors (lte, gold and others) and NAT behaviour", "p. 603"], ["OMP runs in TLS/DTLS; carries prefixes, next hops, keys and policy; OMP, TLOC and service routes", "p. 603–604"], ["TLOC = system IP, color and encapsulation; similar to the BGP next hop", "p. 604"], ["ZTP: public DNS, ztp.viptela.com, redirect to vBond, template from vManage, OMP, then IPsec and BFD", "p. 606–607"], ["Manual onboarding fields; IOS XE PnP, bootstrap and manual", "p. 607–608"], ["Zero-trust control plane with certificates over TLS/DTLS; AES-256-GCM", "p. 608–610"]], "course": ["Reserved VPNs 0 and 512 and the service VPN range", "TPM certificate requirement for ZTP", "Control versus data topology", "System IP versus site ID", "vAnalytics anomaly and SLA trend detection"]}, "OSPF Design": {"mins": 18, "intro": "How OSPF scales, and the design choices the exam asks about: areas, LSA types, stub area flavours, where to put the ABR, and how to keep a big OSPF network stable.", "parts": [{"h": "How OSPF works, in two minutes", "b": [{"p": "OSPF is a link-state interior gateway protocol. Instead of passing routing tables around like a distance-vector protocol, each router describes its own links in link-state advertisements (LSAs) and floods them to the other routers in its area."}, {"p": "Every router in an area ends up with an identical copy of that information, the link-state database (LSDB). Each router then runs Dijkstra's shortest path first (SPF) algorithm on its own copy to build a loop-free tree of best paths, and that becomes its routing table."}, {"ul": ["OSPFv2 is for IPv4; OSPFv3 is for IPv6 (and can now carry IPv4 too). The design ideas are the same in both.", "It runs directly over IP (protocol 89) and uses multicast: 224.0.0.5 for all OSPF routers and 224.0.0.6 for the DR and BDR (FF02::5 and FF02::6 in OSPFv3).", "The metric is cost. By default cost = 100 Mbps ÷ interface bandwidth, never lower than 1.", "Hellos every 10 seconds on broadcast and point-to-point links (30 on NBMA). Administrative distance is 110."]}, {"tip": "The default reference bandwidth makes every link of 100 Mbps or faster cost 1, so OSPF can't tell a 1 Gbps link from a 100 Gbps one. Raise the reference bandwidth, and do it the same on every router."}]}, {"h": "Why areas exist", "b": [{"p": "In one big area, every router stores every LSA and reruns SPF whenever any link anywhere changes. As the network grows, that costs memory, CPU and bandwidth, and one unstable link can keep the whole network busy."}, {"p": "Areas fix this by splitting the network into a two-level hierarchy. Area 0, the backbone, sits at the top, and every other area attaches to it. Traffic between two non-backbone areas always crosses Area 0."}, {"ul": ["Detailed topology (Type 1 and 2 LSAs) stays inside its area, so each LSDB is smaller.", "A change in one area triggers a full SPF only in that area. Other areas just see a changed summary.", "Less flooding, because LSAs don't cross area borders in detail.", "Area borders are where you can summarize, which shrinks routing tables everywhere else."]}, {"dia": "<svg viewBox=\"0 0 360 296\" role=\"img\" aria-label=\"Multi-area OSPF: Area 0 with two ABRs, a stub area and an NSSA with an ASBR\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><rect class=\"d-box d-boxa\" x=\"60\" y=\"8\" width=\"240\" height=\"72\" rx=\"3\"/><text class=\"d-s\" x=\"66\" y=\"20\" text-anchor=\"start\">Area 0 (backbone)<\/text><line class=\"d-ln\" x1=\"180\" y1=\"44\" x2=\"110\" y2=\"80\"/><line class=\"d-ln\" x1=\"180\" y1=\"44\" x2=\"250\" y2=\"80\"/><circle class=\"d-rt\" cx=\"180\" cy=\"44\" r=\"10\"/><path class=\"d-x\" d=\"M175 41h10M175 47h10\"/><text class=\"d-t\" x=\"180\" y=\"29\" text-anchor=\"middle\">Backbone<\/text><rect class=\"d-box\" x=\"8\" y=\"104\" width=\"164\" height=\"124\" rx=\"3\"/><text class=\"d-s\" x=\"14\" y=\"116\" text-anchor=\"start\">Area 1 (stub)<\/text><rect class=\"d-box\" x=\"188\" y=\"104\" width=\"164\" height=\"124\" rx=\"3\"/><text class=\"d-s\" x=\"194\" y=\"116\" text-anchor=\"start\">Area 2 (NSSA)<\/text><line class=\"d-ln\" x1=\"110\" y1=\"80\" x2=\"60\" y2=\"156\"/><line class=\"d-ln\" x1=\"250\" y1=\"80\" x2=\"300\" y2=\"156\"/><circle class=\"d-rt\" cx=\"110\" cy=\"80\" r=\"10\"/><path class=\"d-x\" d=\"M105 77h10M105 83h10\"/><text class=\"d-t\" x=\"94\" y=\"84\" text-anchor=\"end\">ABR 1<\/text><circle class=\"d-rt\" cx=\"250\" cy=\"80\" r=\"10\"/><path class=\"d-x\" d=\"M245 77h10M245 83h10\"/><text class=\"d-t\" x=\"266\" y=\"84\">ABR 2<\/text><circle class=\"d-rt\" cx=\"60\" cy=\"156\" r=\"10\"/><path class=\"d-x\" d=\"M55 153h10M55 159h10\"/><text class=\"d-t\" x=\"60\" y=\"178\" text-anchor=\"middle\">Internal<\/text><circle class=\"d-rt\" cx=\"300\" cy=\"156\" r=\"10\"/><path class=\"d-x\" d=\"M295 153h10M295 159h10\"/><text class=\"d-t\" x=\"300\" y=\"178\" text-anchor=\"middle\">ASBR<\/text><text class=\"d-t d-redt\" x=\"92\" y=\"124\">Type 3<\/text><text class=\"d-t d-redt\" x=\"284\" y=\"138\" text-anchor=\"end\">Type 7<\/text><text class=\"d-s\" x=\"16\" y=\"202\">Type 1 and 2 stay inside.<\/text><text class=\"d-s\" x=\"16\" y=\"214\">Gets Type 3 + default, no Type 5.<\/text><text class=\"d-s\" x=\"196\" y=\"202\">Local externals<\/text><text class=\"d-s\" x=\"196\" y=\"214\">enter as Type 7.<\/text><line class=\"d-ln d-dash\" x1=\"300\" y1=\"180\" x2=\"300\" y2=\"236\"/><rect class=\"d-cloud\" x=\"248.0\" y=\"237\" width=\"104\" height=\"26\" rx=\"13\"/><text class=\"d-t\" x=\"300\" y=\"254\" text-anchor=\"middle\">External routes<\/text><text class=\"d-s\" x=\"16\" y=\"276\" text-anchor=\"start\">ABRs pass summaries (Type 3) between areas.<\/text><text class=\"d-s\" x=\"16\" y=\"288\" text-anchor=\"start\">ABR 2 turns Type 7 into Type 5 for the rest of the domain.<\/text><\/svg>"}, {"p": "What actually limits OSPF scale comes down to router resources (memory, CPU and interface bandwidth), driven by:"}, {"ul": ["the number of prefixes,", "how often links flap,", "how many neighbours each router has,", "how many routers share an area."]}, {"check": [1, 5, 13]}]}, {"h": "Router roles", "b": [{"tbl": [["Role", "What it is"], ["Internal router", "Every interface is in one area. Keeps one LSDB."], ["Backbone router", "At least one interface in Area 0."], ["ABR (area border router)", "Interfaces in Area 0 and at least one other area. Keeps a separate LSDB for each area and advertises summaries (Type 3) between them."], ["ASBR (AS boundary router)", "Redistributes external routes (static, EIGRP, BGP and so on) into OSPF."]]}, {"p": "One router can hold several roles at once. A router with interfaces in Area 0 and Area 1 that also redistributes a static route is a backbone router, an ABR and an ASBR."}, {"check": [8, 9]}]}, {"h": "The LSA types you must know", "b": [{"p": "The exam expects you to know LSAs by number and by name."}, {"tbl": [["Type", "Name", "Who sends it", "How far it goes"], ["1", "Router", "Every router", "Its own area"], ["2", "Network", "The DR on a multi-access segment", "Its own area"], ["3", "Summary (network)", "ABR", "Into other areas: inter-area routes"], ["4", "ASBR summary", "ABR", "Tells other areas how to reach the ASBR"], ["5", "AS external", "ASBR", "The whole OSPF domain, except stub-type areas"], ["7", "NSSA external", "ASBR inside an NSSA", "Only the NSSA. The ABR translates it to Type 5."]]}, {"p": "External routes come in two flavours. E2, the default, keeps the cost set at redistribution and ignores the internal path to the ASBR. E1 adds the internal cost to reach the ASBR, which is better when there are several exit points and you want the closest one used."}, {"check": [14]}]}, {"h": "Stub, totally stubby and NSSA", "b": [{"p": "A branch area with one way out doesn't need the full list of every external route. Special area types cut LSAs and replace them with a default route."}, {"tbl": [["Area type", "Blocks", "Gets instead", "Can have an ASBR?"], ["Normal", "Nothing", "Everything (1, 2, 3, 4, 5)", "Yes"], ["Stub", "Type 4 and 5 (externals)", "Type 3 + default from the ABR", "No"], ["Totally stubby (Cisco)", "Type 3, 4 and 5", "Just a default from the ABR", "No"], ["NSSA", "Type 4 and 5", "Type 3. Default only if configured", "Yes, using Type 7"], ["Totally NSSA (Cisco)", "Type 3, 4 and 5", "A default from the ABR", "Yes, using Type 7"]]}, {"ul": ["If several ABRs serve a stub area, they all inject a default, and traffic goes to the closest one.", "Area 0 can never be a stub, and stub areas can't carry virtual links.", "NSSA is the answer whenever a branch must redistribute something local, such as a static route or a small EIGRP island, but should still be protected from the domain's Type 5 externals."]}, {"tip": "Stub areas still see inter-area (Type 3) routes. Only totally stubby areas drop those too. The exam loves asking which routes a totally stubby area doesn't get: both external and inter-area."}, {"check": [0, 7, 16]}]}, {"h": "Designing areas well", "b": [{"p": "Good OSPF design is mostly about where you draw the area borders and how addressing lines up with them."}, {"ul": ["Give each area a contiguous address block. Then the ABR can advertise one summary instead of dozens of routes, and a flap inside the area is hidden behind it.", "Summarize at the ABRs, which in a campus usually means the distribution layer.", "Keep the backbone small and stable, with as few routers in Area 0 as you can.", "Don't redistribute connected routes such as loopbacks as externals when a network statement or passive interface will do. It adds external LSAs for no reason.", "Avoid virtual links. They patch an area that has lost its connection to Area 0, but they're a repair, not a design."]}, {"p": "Hub-and-spoke WANs get their own rule: put the area boundary at the hub. The hub is the ABR, and each spoke (with its WAN link) sits in a non-backbone area. A flapping spoke link then only disturbs its own area, and the small branch router runs SPF for just its own area."}, {"dia": "<svg viewBox=\"0 0 360 206\" role=\"img\" aria-label=\"Hub-and-spoke OSPF: area boundary at the hub versus one big Area 0\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"8\" y=\"14\" text-anchor=\"start\">RECOMMENDED<\/text><rect class=\"d-box d-boxa\" x=\"4\" y=\"22\" width=\"166\" height=\"44\" rx=\"3\"/><text class=\"d-s\" x=\"10\" y=\"34\" text-anchor=\"start\">Area 0<\/text><circle class=\"d-rt\" cx=\"87\" cy=\"46\" r=\"10\"/><path class=\"d-x\" d=\"M82 43h10M82 49h10\"/><text class=\"d-t\" x=\"102\" y=\"50\">Hub (ABR)<\/text><rect class=\"d-box\" x=\"4\" y=\"76\" width=\"54\" height=\"92\" rx=\"3\"/><text class=\"d-s\" x=\"31\" y=\"162\" text-anchor=\"middle\">Area 1<\/text><line class=\"d-ln\" x1=\"87\" y1=\"56\" x2=\"31\" y2=\"120\"/><circle class=\"d-rt\" cx=\"31\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M26 117h10M26 123h10\"/><rect class=\"d-box\" x=\"60\" y=\"76\" width=\"54\" height=\"92\" rx=\"3\"/><text class=\"d-s\" x=\"87\" y=\"162\" text-anchor=\"middle\">Area 2<\/text><line class=\"d-ln\" x1=\"87\" y1=\"56\" x2=\"87\" y2=\"120\"/><circle class=\"d-rt\" cx=\"87\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M82 117h10M82 123h10\"/><rect class=\"d-box\" x=\"116\" y=\"76\" width=\"54\" height=\"92\" rx=\"3\"/><text class=\"d-s\" x=\"143\" y=\"162\" text-anchor=\"middle\">Area 3<\/text><line class=\"d-ln\" x1=\"87\" y1=\"56\" x2=\"143\" y2=\"120\"/><circle class=\"d-rt\" cx=\"143\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M138 117h10M138 123h10\"/><text class=\"d-s\" x=\"87\" y=\"186\" text-anchor=\"middle\">One area per spoke and WAN link<\/text><text class=\"d-s\" x=\"87\" y=\"198\" text-anchor=\"middle\">A flap stays in that area<\/text><text class=\"d-h\" x=\"194\" y=\"14\" text-anchor=\"start\">AVOID<\/text><rect class=\"d-box d-boxa\" x=\"190\" y=\"22\" width=\"166\" height=\"146\" rx=\"3\"/><text class=\"d-s\" x=\"196\" y=\"34\" text-anchor=\"start\">Area 0 (everything)<\/text><circle class=\"d-rt\" cx=\"273\" cy=\"46\" r=\"10\"/><path class=\"d-x\" d=\"M268 43h10M268 49h10\"/><text class=\"d-t\" x=\"288\" y=\"50\">Hub<\/text><line class=\"d-ln\" x1=\"273\" y1=\"56\" x2=\"217\" y2=\"120\"/><circle class=\"d-rt\" cx=\"217\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M212 117h10M212 123h10\"/><line class=\"d-ln\" x1=\"273\" y1=\"56\" x2=\"273\" y2=\"120\"/><circle class=\"d-rt\" cx=\"273\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M268 117h10M268 123h10\"/><line class=\"d-ln\" x1=\"273\" y1=\"56\" x2=\"329\" y2=\"120\"/><circle class=\"d-rt\" cx=\"329\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M324 117h10M324 123h10\"/><path class=\"d-ln d-red\" d=\"M230 92l10 10M240 92l-10 10\"/><text class=\"d-s\" x=\"273\" y=\"186\" text-anchor=\"middle\">Any spoke flap floods everyone<\/text><text class=\"d-s\" x=\"273\" y=\"198\" text-anchor=\"middle\">and reruns SPF everywhere<\/text><\/svg>"}, {"p": "Don't lump all branches into one big area either. That brings back the original problem, with every branch flap felt by every branch."}, {"tbl": [["Command", "Where", "Summarizes"], ["area 1 range 10.20.0.0 255.255.252.0", "ABR", "Inter-area routes from Area 1 (Type 3)"], ["summary-address 192.168.8.0 255.255.252.0", "ASBR", "External routes being redistributed (Type 5/7)"]]}, {"check": [2, 10, 21, 22, 15]}]}, {"h": "Neighbours, DRs and network types", "b": [{"p": "Every adjacency costs hellos, database exchanges and flooding. On a shared segment with many routers, a full mesh of adjacencies would be wasteful, so OSPF elects a designated router (DR) and a backup (BDR)."}, {"ul": ["Every other router (a DROTHER) forms full adjacencies only with the DR and BDR, sending updates to 224.0.0.6. The DR then floods them to everyone on 224.0.0.5.", "The DR also originates the segment's Type 2 network LSA.", "Election: highest interface priority wins (default 1); a tie goes to the highest router ID. Priority 0 means never DR or BDR.", "The election isn't pre-emptive. A better router added later doesn't take over until the DR and BDR both fail. If the DR fails, the BDR is promoted."]}, {"p": "For a router with many neighbours, the design advice is to spread the load: if one router sits on several LAN segments, it shouldn't be DR on all of them. Once the number of adjacencies gets large, go hierarchical."}, {"p": "On hub-and-spoke (NBMA-style) WANs, use the point-to-multipoint network type. It needs no DR, treats each spoke as a separate link to the hub, and avoids the DR problems a broadcast type causes when spokes can't reach each other."}, {"check": [17, 6, 3]}]}, {"h": "Fast, stable convergence", "b": [{"p": "OSPF's own hellos detect a dead neighbour in tens of seconds by default. Tuning them down costs CPU, because they run in the control plane. The better tool is BFD."}, {"ul": ["BFD (Bidirectional Forwarding Detection) is a lightweight hello that detects a forwarding failure in under a second and tells OSPF immediately.", "It isn't tied to one protocol: the same mechanism serves OSPF, EIGRP, IS-IS and BGP. Parts of it can run in hardware, so it's lighter than aggressive routing timers.", "Graceful restart (also called NSF) keeps packets forwarding on known routes while a router switches to its standby supervisor, so neighbours don't reconverge needlessly."]}, {"p": "Two lesser-known protections from the course:"}, {"ul": ["OSPF database protection (max-lsa) caps the number of non-self-generated LSAs a router will accept, so a flood of LSAs (from a misconfiguration, say) can't exhaust its memory.", "OSPF flood reduction sets the DoNotAge bit, so unchanged LSAs aren't re-flooded every 30 minutes. That's useful on stable links where refresh traffic is just overhead."]}, {"p": "When something is wrong, the symptom to look for is neighbours repeatedly changing state along with frequent SPF runs. That points to an unstable link or a control-plane problem."}, {"check": [11, 4, 12, 18]}]}, {"h": "Areas are not security", "b": [{"p": "It's tempting to think putting Finance in Area 20 and Employees in Area 10 separates them. It doesn't. Areas divide routing information, not traffic: routers still know how to reach every prefix, and packets flow between areas freely."}, {"p": "To enforce separation you need a firewall or ACLs, placed on the actual forwarding path between the zones. A firewall can only inspect traffic that passes through it."}, {"check": [19, 20]}]}, {"h": "Key takeaways", "b": [{"ul": ["Areas exist to limit LSDB size, SPF runs and flooding, and to make summarization possible. Everything connects through Area 0.", "Know the LSAs: 1 router, 2 network (DR), 3 summary (ABR), 4 ASBR summary, 5 external, 7 NSSA external.", "Stub blocks externals. Totally stubby blocks externals and inter-area routes. NSSA blocks externals but allows a local ASBR using Type 7.", "Use contiguous addressing per area, and summarize at the ABR with area range (summary-address is for externals on an ASBR).", "In hub-and-spoke designs, put the ABR at the hub, give each spoke its own area, and use point-to-multipoint.", "Use BFD for sub-second detection rather than aggressive hello timers.", "Areas aren't a security boundary; use firewalls or ACLs."]}, {"tip": "Common traps: an ABR keeps a database for every area it's in, not just Area 0. Stub areas still receive Type 3. A new higher-priority router doesn't steal the DR role."}]}], "verified": [["Link-state, identical LSDB per area, SPF; IP protocol 89; multicast 224.0.0.5/224.0.0.6", "p. 259, 262, 267"], ["Cost = 10^8 ÷ bandwidth, minimum 1; raise the reference bandwidth on all routers", "p. 259–260"], ["Hello 10 s (30 s on NBMA)", "p. 260"], ["Benefits of areas: fewer SPF runs, less flooding, summarization at ABRs, topology hiding; Area 0 required", "p. 263"], ["Hub-and-spoke: area boundary at the hub; don't put all branches in one area", "p. 264"], ["Router types; an ABR keeps an LSDB for each of its areas", "p. 265–266, 276"], ["DR/BDR: priority default 1, tie goes to highest router ID, 0 = never; not pre-emptive; DR sends Type 2", "p. 266–267"], ["LSA types 1–5 and 7 and their flooding scope; E1 vs E2, E2 by default", "p. 268–270"], ["Stub, totally stubby, NSSA and totally NSSA behaviour; NSSA gets no default unless configured", "p. 270–272"], ["Virtual links are a temporary fix through a transit area", "p. 272"], ["Summarize at the distribution layer; assign addresses so they can be summarized", "p. 303–304"], ["BFD: sub-second, protocol-independent, less CPU than tuned timers; GR/NSF keeps forwarding during switchover", "p. 311–312"], ["OSPFv3 keeps the same areas, router types and LSA ideas; FF02::5/FF02::6", "p. 274–276"]], "course": ["OSPF scalability factors (memory, CPU, bandwidth; prefixes, flaps, neighbours, routers per area)", "Point-to-multipoint recommended for hub-and-spoke", "Database protection (max-lsa) and flood reduction (DoNotAge)", "Keep the backbone small; don't redistribute connected loopbacks", "area range vs summary-address commands"]}, "Designing Cisco SD-WAN Routing and High Availability": {"mins": 15, "intro": "The last SD-WAN lesson covers how the fabric stays up and makes smart choices: the scale limits, the four kinds of redundancy, BFD and application-aware routing, routing on the LAN side, segmentation, security, and reaching the cloud.", "parts": [{"h": "Scale", "b": [{"p": "Controllers have limits, so large networks scale them out horizontally:"}, {"tbl": [["Need", "Add", "Limit to know"], ["Faster onboarding of new WAN Edges", "More vBond orchestrators", "—"], ["Manage more WAN Edges", "A vManage cluster", "About 2,000 WAN Edges per vManage"], ["More control-plane capacity", "More vSmart controllers", "Up to 5,400 connections per vSmart"]]}, {"check": [10, 11, 0, 19]}]}, {"h": "Four kinds of redundancy", "b": [{"tbl": [["Category", "How"], ["Site", "Two WAN Edges at the site, with VRRP on the LAN side or OSPF/BGP to a LAN router"], ["Transport", "Two or more transports (e.g. MPLS and internet); traffic shifts if one fails"], ["Network / headend", "Redundant hub WAN Edges at the data centre"], ["Controller", "Several vSmarts (and vBonds, a vManage cluster)"]]}, {"p": "WAN Edges support VRRP, the open standard FHRP, on the service side. HSRP and GLBP aren't supported."}, {"p": "What if a WAN Edge loses all its vSmarts? OMP graceful restart lets it keep forwarding on its last known routes and keys for a set time (12 hours by default) while it tries to reconnect. It carries on normally rather than dropping traffic."}, {"check": [21, 2, 1]}]}, {"h": "BFD and application-aware routing", "b": [{"p": "BFD (Bidirectional Forwarding Detection) runs inside every IPsec tunnel, automatically and always (it can't be turned off). Its hellos go every second by default. It does two jobs:"}, {"ul": ["Detects transport failures: when hellos stop, the tunnel is marked down and traffic moves.", "Measures each tunnel's loss, latency and jitter."]}, {"p": "Application-aware routing uses those measurements. You define SLA classes (for example voice: under 1% loss, 150 ms latency, 30 ms jitter), match applications to them, and the WAN Edge picks a path for each application class that meets its SLA in real time:"}, {"dia": "<svg viewBox=\"0 0 360 208\" role=\"img\" aria-label=\"Application-aware routing: BFD measures loss, latency and jitter on MPLS and internet tunnels, and voice is sent over the tunnel that meets its SLA\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><path class=\"d-ln d-red\" d=\"M50 92 Q180 30 310 92\"/><path class=\"d-ln d-dash\" d=\"M50 100 Q180 162 310 100\"/><circle class=\"d-rt\" cx=\"40\" cy=\"96\" r=\"10\"/><path class=\"d-x\" d=\"M35 93h10M35 99h10\"/><circle class=\"d-rt\" cx=\"320\" cy=\"96\" r=\"10\"/><path class=\"d-x\" d=\"M315 93h10M315 99h10\"/><text class=\"d-t\" x=\"40\" y=\"124\" text-anchor=\"middle\">Branch<\/text><text class=\"d-t\" x=\"320\" y=\"124\" text-anchor=\"middle\">Hub<\/text><rect class=\"d-box d-boxa\" x=\"118\" y=\"14\" width=\"124\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"180\" y=\"29\" text-anchor=\"middle\">MPLS tunnel<\/text><text class=\"d-s\" x=\"180\" y=\"42\" text-anchor=\"middle\">loss 0.1% · 40 ms · 5 ms<\/text><rect class=\"d-box d-boxa\" x=\"118\" y=\"144\" width=\"124\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"180\" y=\"159\" text-anchor=\"middle\">Internet tunnel<\/text><text class=\"d-s\" x=\"180\" y=\"172\" text-anchor=\"middle\">loss 3% · 120 ms · 40 ms<\/text><text class=\"d-s\" x=\"180\" y=\"96\" text-anchor=\"middle\">Voice SLA: loss &lt; 1%,<\/text><text class=\"d-s\" x=\"180\" y=\"110\" text-anchor=\"middle\">latency &lt; 150 ms, jitter &lt; 30 ms<\/text><text class=\"d-s\" x=\"180\" y=\"200\" text-anchor=\"middle\">BFD measures each tunnel; only MPLS meets the SLA, so voice uses it<\/text><\/svg>"}, {"ul": ["Traffic is load-shared across all tunnels that meet the SLA, or kept on a preferred color if that one meets it.", "If no tunnel meets the SLA, traffic uses any available tunnel (or a backup color), unless the policy says strict, in which case it's dropped."]}, {"check": [13, 3, 20]}]}, {"h": "Routing in and around the fabric", "b": [{"p": "On the service (LAN) side, WAN Edges peer with local routers using OSPF or BGP. (Newer IOS XE releases add EIGRP, but the course answer is OSPF and BGP.) A small branch might just use a static route."}, {"p": "Into the fabric, OMP advertises three route types:"}, {"tbl": [["OMP route type", "Carries"], ["OMP routes (vRoutes)", "Prefixes learned from the local service side"], ["TLOC routes", "Tunnel endpoints"], ["Service routes", "Network services at a site, such as a data-centre firewall or IPS, so policy can steer traffic through them (service chaining)"]]}, {"check": [12, 4, 14]}]}, {"h": "Segmentation", "b": [{"p": "SD-WAN segments traffic with VPNs, which work like VRFs: each has its own routing table, and a VPN label keeps segments apart across the overlay. Each VPN can have its own topology: full mesh, hub-and-spoke, partial mesh or point-to-point. For example, VoIP might be a full or partial mesh between branches, while payment traffic only goes to the data-centre hubs."}, {"p": "In the course's FIB bank case study, the customer's answers lead to three isolated segments across the fabric."}, {"tip": "The segment-count question depends on the case study's customer responses in the Learning Guide. If the wording differs on the test, reread them."}, {"check": [7, 22]}]}, {"h": "Security", "b": [{"tbl": [["Need", "SD-WAN feature"], ["Data privacy", "AES-256 encryption in the IPsec tunnels"], ["Data integrity", "SHA hashing"], ["Application-aware firewall", "Enterprise Application Firewall, classifying with NBAR2 (over a thousand applications by deep packet inspection)"], ["Exploits, worms, viruses", "IPS (Snort-based signatures)"], ["Sandboxing unknown files", "Cisco Secure Endpoint with Threat Grid (formerly AMP)"], ["Malicious domains", "Cisco Umbrella DNS filtering, blocking at the DNS lookup"]]}, {"check": [6, 16, 18, 9, 8, 17]}]}, {"h": "Reaching the cloud", "b": [{"ul": ["Cloud onRamp for SaaS measures the paths to applications like Microsoft 365 and picks the best exit, local internet or through a hub.", "vEdge Cloud (a virtual WAN Edge) runs in AWS and Microsoft Azure to extend the fabric into those clouds."]}, {"check": [5, 15]}]}, {"h": "Key takeaways", "b": [{"ul": ["Scale: more vBonds for onboarding, vManage cluster (2,000 edges each), more vSmarts (5,400 connections each).", "Redundancy: site (VRRP or OSPF/BGP), transport, network/headend, controller. OMP graceful restart keeps forwarding for 12 hours.", "BFD in every tunnel, 1-second hellos, detects failures and measures loss/latency/jitter. Application-aware routing picks paths per SLA.", "Service side: OSPF and BGP. OMP routes = LAN prefixes; TLOC routes = endpoints; service routes = firewalls and similar.", "VPNs segment like VRFs, each with its own topology.", "AES privacy, SHA integrity, NBAR2 app firewall, IPS, Threat Grid sandbox, Umbrella DNS.", "Cloud onRamp for SaaS; vEdge Cloud in AWS and Azure."]}, {"tip": "Common traps: vBond, not vSmart, increases bring-up capacity. SHA isn't encryption. HSRP isn't supported on WAN Edges."}]}], "verified": [["Horizontal scaling: vBonds for bring-up, vManage cluster, more vSmarts", "p. 611"], ["Redundancy categories: site, transport, network/headend, controller", "p. 611–613"], ["Site redundancy with VRRP or OSPF/BGP", "p. 612–614"], ["OMP route types: OMP, TLOC and service routes", "p. 603–604"], ["Security: segmentation, enterprise firewall, secure web gateway, DNS-layer security; IPS, app controls, malware protection", "p. 616"], ["VPN segmentation like VRFs; topologies full mesh, hub-and-spoke, partial mesh, point-to-point", "p. 617–618"], ["BFD runs inside IPsec tunnels, in echo mode, cannot be disabled; measures latency, jitter and loss", "p. 620"], ["Application-aware routing behaviour with SLA classes, preferred colors and strict", "p. 621–622"], ["AES-256-GCM data plane encryption", "p. 610"]], "course": ["Scale limits: 5,400 connections per vSmart, 2,000 edges per vManage", "OMP graceful restart default of 12 hours", "BFD default 1-second hello", "NBAR2, Threat Grid and Umbrella roles", "Cloud onRamp for SaaS; vEdge Cloud in AWS and Azure", "FIB case study segment count"]}, "Deploying IPv6": {"mins": 15, "intro": "How an organization actually moves to IPv6: the project phases, the three ways IPv4 and IPv6 coexist (dual stack, tunnels, translation), where to start, and the security gaps a second protocol opens up.", "parts": [{"h": "A migration is a project, not a switch", "b": [{"p": "Nobody turns IPv4 off and IPv6 on overnight. The two run side by side for years, and the move is planned like any other big project. The course uses a plan, build and manage approach with these phases:"}, {"tbl": [["Phase", "What happens"], ["Discovery", "Understand why: the business drivers and what IPv6 has to support. This is the first step of planning."], ["Assessment", "Inventory what you have: do the routers, switches, firewalls, servers and applications support IPv6, and which need OS, hardware or licence upgrades?"], ["Planning and design", "Address plan, routing, security, and which transition method goes where."], ["Implementation and optimization", "Build it in a lab, pilot it, measure, tune, then roll it out to production."]]}, {"tip": "Order matters on the exam. Discovery (the why) comes before assessment (the inventory). Building in a lab and improving from real measurements is implementation and optimization."}, {"check": [12, 0, 13]}]}, {"h": "Three ways to coexist", "b": [{"p": "There are three basic strategies for running IPv4 and IPv6 together. Most real networks use a mix."}, {"dia": "<svg viewBox=\"0 0 360 240\" role=\"img\" aria-label=\"The three IPv4-to-IPv6 migration strategies: dual stack, tunnelling and translation\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"8\" y=\"14\" text-anchor=\"start\">DUAL STACK<\/text><rect class=\"d-rt\" x=\"18\" y=\"25\" width=\"44\" height=\"22\" rx=\"3\"/><text class=\"d-t\" x=\"40\" y=\"40\" text-anchor=\"middle\">v4+v6<\/text><text class=\"d-s\" x=\"40\" y=\"60\" text-anchor=\"middle\">host<\/text><line class=\"d-ln\" x1=\"62\" y1=\"36\" x2=\"150\" y2=\"36\"/><circle class=\"d-rt\" cx=\"170\" cy=\"36\" r=\"10\"/><path class=\"d-x\" d=\"M165 33h10M165 39h10\"/><line class=\"d-ln\" x1=\"180\" y1=\"36\" x2=\"276\" y2=\"36\"/><rect class=\"d-rt\" x=\"278\" y=\"25\" width=\"44\" height=\"22\" rx=\"3\"/><text class=\"d-t\" x=\"300\" y=\"40\" text-anchor=\"middle\">v4+v6<\/text><text class=\"d-s\" x=\"300\" y=\"60\" text-anchor=\"middle\">server<\/text><text class=\"d-s\" x=\"110\" y=\"30\" text-anchor=\"middle\">both protocols<\/text><text class=\"d-s\" x=\"232\" y=\"30\" text-anchor=\"middle\">natively<\/text><text class=\"d-h\" x=\"8\" y=\"84\" text-anchor=\"start\">TUNNEL (IPv6 INSIDE IPv4)<\/text><rect class=\"d-rt\" x=\"18\" y=\"97\" width=\"44\" height=\"22\" rx=\"3\"/><text class=\"d-t\" x=\"40\" y=\"112\" text-anchor=\"middle\">v6<\/text><text class=\"d-s\" x=\"40\" y=\"132\" text-anchor=\"middle\">site A<\/text><line class=\"d-ln\" x1=\"62\" y1=\"108\" x2=\"92\" y2=\"108\"/><circle class=\"d-rt\" cx=\"104\" cy=\"108\" r=\"10\"/><path class=\"d-x\" d=\"M99 105h10M99 111h10\"/><circle class=\"d-rt\" cx=\"236\" cy=\"108\" r=\"10\"/><path class=\"d-x\" d=\"M231 105h10M231 111h10\"/><line class=\"d-ln\" x1=\"248\" y1=\"108\" x2=\"278\" y2=\"108\"/><rect class=\"d-rt\" x=\"278\" y=\"97\" width=\"44\" height=\"22\" rx=\"3\"/><text class=\"d-t\" x=\"300\" y=\"112\" text-anchor=\"middle\">v6<\/text><text class=\"d-s\" x=\"300\" y=\"132\" text-anchor=\"middle\">site B<\/text><rect class=\"d-tun\" x=\"116\" y=\"100\" width=\"108\" height=\"16\" rx=\"8\"/><text class=\"d-s\" x=\"170\" y=\"96\" text-anchor=\"middle\">IPv4-only network<\/text><text class=\"d-s\" x=\"104\" y=\"134\" text-anchor=\"middle\">dual-stack<\/text><text class=\"d-s\" x=\"236\" y=\"134\" text-anchor=\"middle\">dual-stack<\/text><text class=\"d-h\" x=\"8\" y=\"160\" text-anchor=\"start\">TRANSLATION (NAT64 + DNS64)<\/text><rect class=\"d-rt\" x=\"18\" y=\"173\" width=\"44\" height=\"22\" rx=\"3\"/><text class=\"d-t\" x=\"40\" y=\"188\" text-anchor=\"middle\">v6 only<\/text><text class=\"d-s\" x=\"40\" y=\"208\" text-anchor=\"middle\">client<\/text><line class=\"d-ln\" x1=\"62\" y1=\"184\" x2=\"150\" y2=\"184\"/><circle class=\"d-rt\" cx=\"170\" cy=\"184\" r=\"10\"/><path class=\"d-x\" d=\"M165 181h10M165 187h10\"/><line class=\"d-ln\" x1=\"180\" y1=\"184\" x2=\"276\" y2=\"184\"/><rect class=\"d-rt\" x=\"278\" y=\"173\" width=\"44\" height=\"22\" rx=\"3\"/><text class=\"d-t\" x=\"300\" y=\"188\" text-anchor=\"middle\">v4 only<\/text><text class=\"d-s\" x=\"300\" y=\"208\" text-anchor=\"middle\">server<\/text><text class=\"d-s\" x=\"170\" y=\"210\" text-anchor=\"middle\">NAT64 router<\/text><text class=\"d-s\" x=\"110\" y=\"178\" text-anchor=\"middle\">IPv6<\/text><text class=\"d-s\" x=\"232\" y=\"178\" text-anchor=\"middle\">IPv4<\/text><text class=\"d-s\" x=\"180\" y=\"232\" text-anchor=\"middle\">Dual stack is preferred; tunnels and translation fill the gaps<\/text><\/svg>"}, {"ul": ["Dual stack: every device runs both protocols natively. DNS decides which one is used: an AAAA record means IPv6, an A record means IPv4. Modern operating systems prefer IPv6 when both exist. This is the recommended approach because there are no tunnels to manage and IPv4 can simply be retired later.", "Tunnelling: IPv6 packets are wrapped inside IPv4 to cross the parts of the network that don't speak IPv6 yet. It's useful but adds overhead and shrinks the MTU.", "Translation: an IPv6-only device talks to an IPv4-only device through a translator (NAT64 with DNS64). Use it when one side can't run the other protocol at all."]}, {"check": [19, 3]}]}, {"h": "Tunnelling options", "b": [{"p": "All tunnels share one rule: the devices at each end must be dual-stacked. Usually that's the edge or border routers, so the hosts behind them don't change."}, {"tbl": [["Tunnel", "How it works", "Where it fits"], ["Manual / GRE", "Statically configured between two border routers; acts like a permanent link. GRE can also carry other protocols such as IS-IS.", "Joining two IPv6 islands across an IPv4 backbone"], ["6to4", "Automatic; uses the fixed 2002::/16 prefix with the site's IPv4 address embedded", "Older, ad hoc site-to-site tunnelling"], ["6rd", "6to4 reworked for service providers, using the provider's own IPv6 prefix instead of 2002::/16", "An ISP offering IPv6 over its IPv4 network"], ["ISATAP", "Automatic tunnels inside a site between dual-stack hosts and routers", "Reaching an IPv6 core from an IPv4-only access layer"], ["Tunnel broker", "A provider that gives you an IPv6-over-IPv4 tunnel", "Your ISP only offers IPv4 but you want IPv6 internet"], ["DS-Lite", "The reverse: IPv4 carried inside IPv6 to a provider NAT", "An ISP running an IPv6-only network while customers keep IPv4"]]}, {"p": "LISP (Locator/ID Separation Protocol) also turns up here. It separates a device's identity (its EID) from its location (the RLOC) and tunnels between sites. The roles to know: an ETR registers its site's EID prefixes with the map server (MS), which holds them. An ITR asks the map resolver (MR) where an EID lives."}, {"tip": "Tunnels have no built-in security. Traffic is carried in the clear and can be spoofed, so protect them with IPsec."}, {"check": [5, 6, 7, 8, 9, 18]}]}, {"h": "Translation: NAT64 and DNS64", "b": [{"p": "NAT64 lets IPv6-only clients reach IPv4-only servers. It replaced the old NAT-PT, which was deprecated because it was too tangled up with DNS. DNS64 is its partner."}, {"p": "Here's how a connection works:"}, {"ul": ["An IPv6-only client asks DNS for the server's AAAA record.", "The server only has an A (IPv4) record, so DNS64 builds a fake AAAA by putting the IPv4 address inside a special prefix, usually the well-known 64:FF9B::/96.", "The client sends IPv6 packets to that address.", "The NAT64 router sees the prefix, strips it to get the real IPv4 address, translates the header, and forwards the packet over IPv4. Replies are translated back."]}, {"tbl": [["", "Stateless NAT64", "Stateful NAT64"], ["IPv4 addresses", "One per IPv6 host", "Many IPv6 hosts share one IPv4 address"], ["State", "None; a fixed one-to-one mapping", "Tracks every flow"], ["Who can start a session", "Either side", "Only the IPv6 side (unless manually configured)"]]}, {"p": "One more option sits outside the network layer: proxying. A proxy server takes the client's IPv6 request and makes the IPv4 request on its behalf. It's an application-level workaround for servers that haven't been moved to IPv6 yet."}, {"check": [20, 21, 10]}]}, {"h": "Deployment models", "b": [{"p": "The Cert Guide describes three enterprise deployment models, built from the strategies above:"}, {"tbl": [["Model", "What it is"], ["Dual-stack model", "Hosts, switches and routers all run both protocols. Recommended: no tunnels, and the easiest to manage."], ["Hybrid model", "Mostly dual stack, with ISATAP or manual tunnels to cross the parts that can't run IPv6 yet (for example an IPv4-only access layer or core)."], ["Service block model", "A central block of dual-stack devices that IPv6 users reach through tunnels. A quick way to offer IPv6 services without touching the whole network."]]}, {"check": [22]}]}, {"h": "Where to start, and where to finish", "b": [{"p": "Migrate from the edges of least effort inward:"}, {"ul": ["The WAN and core usually go first. There are few devices, they're routers that already support IPv6, and the change needs little modification.", "The campus LAN usually comes last. That's where the thousands of end devices, printers and access switches are, so it takes the longest."]}, {"p": "Two practical details:"}, {"ul": ["SLAAC needs a /64 on every LAN segment, and it works from the router's ICMPv6 Router Advertisement.", "DNS needs AAAA records for anything reachable over IPv6. A records stay for IPv4, and PTR records handle reverse lookups."]}, {"check": [15, 2, 14, 1, 4]}]}, {"h": "Securing IPv6", "b": [{"p": "Turning on IPv6 adds a second network on the same wires. If it isn't secured as well as IPv4, an attacker simply uses IPv6."}, {"ul": ["Dual-stack security: firewalls and other security devices need an IPv6 policy that matches the existing IPv4 one. The IPv4 rules don't cover IPv6 traffic.", "RA Guard: a switch feature that only allows Router Advertisements on ports facing real routers, so a host can't pretend to be the gateway.", "SEND with CGA: Secure Neighbor Discovery signs ND messages using a PKI, and Cryptographically Generated Addresses tie an address to its owner's public key.", "Tunnel security: tunnels carry traffic unprotected, so add IPsec. (IPv6 has IPsec built in through the AH and ESP extension headers.)"]}, {"check": [11, 16, 17]}]}, {"h": "Key takeaways", "b": [{"ul": ["Phases: discovery (why), assessment (inventory), planning and design, then implementation and optimization.", "Three strategies: dual stack (preferred), tunnelling (IPv6 inside IPv4) and translation (NAT64/DNS64).", "Tunnel endpoints must be dual-stacked, usually the edge routers. 6to4 uses 2002::/16; 6rd uses the provider's own prefix. DS-Lite is IPv4 inside IPv6. A tunnel broker gets IPv6 to a site whose ISP is IPv4-only.", "DNS64 synthesizes AAAA records using 64:FF9B::/96, and NAT64 translates. Stateful NAT64 shares one IPv4 address among many hosts.", "Deployment models: dual-stack (recommended), hybrid and service block.", "Start with the WAN and core; the LAN goes last.", "Secure both protocols equally: matching IPv6 policy, RA Guard, SEND/CGA, and IPsec on tunnels."]}, {"tip": "Common traps: 6rd doesn't use 2002::/16 (that's 6to4). DS-Lite carries IPv4, not IPv6. Proxying is the application workaround, not NAT64."}]}], "verified": [["DHCPv6 is stateful; stateless DHCPv6 (DHCPv6 Lite) adds DNS and other options to SLAAC", "p. 141"], ["IPv6 carries IPsec in the AH and ESP extension headers", "p. 142"], ["Three migration strategies: dual stack, tunnelling, translation", "p. 149–150"], ["Dual stack is recommended; DNS (AAAA vs A) decides which stack is used; modern OSes prefer IPv6", "p. 150–151, 159"], ["Tunnel endpoints must run both stacks; tunnels add overhead and reduce MTU", "p. 151–152"], ["Manual and GRE tunnels between border routers; GRE can carry IS-IS too", "p. 152"], ["6to4 uses 2002::/16; 6RD uses the provider's own prefix", "p. 152–153"], ["ISATAP builds automatic tunnels within a site", "p. 154"], ["NAT-PT deprecated because of its coupling with DNS", "p. 154"], ["DNS64 synthesizes AAAA from A using the well-known prefix 64:FF9B::/96 (or a network-specific prefix)", "p. 155"], ["Stateless NAT64 uses one IPv4 address per host; stateful NAT64 multiplexes many and only IPv6-initiated flows", "p. 155–158"], ["Deployment models: dual-stack, hybrid and service block, with dual stack preferred", "p. 158–161"]], "course": ["Project phases (discovery, assessment, planning and design, implementation and optimization)", "WAN and core first, campus LAN last", "Tunnel brokers and DS-Lite", "LISP roles (map server, map resolver, ITR, ETR)", "Proxying as an application workaround", "RA Guard, SEND/CGA and dual-stack security policy"]}, "Exploring Cisco SD-Access Site Design Strategy and Considerations": {"mins": 14, "intro": "With the fabric's pieces understood, this lesson is about sizing and planning: which site model fits how many endpoints, how fabric sites are joined across a campus or metro, and how to migrate an existing network into SD-Access.", "parts": [{"h": "Fabric sites", "b": [{"p": "A fabric site is one self-contained fabric: its own control plane, border and edge nodes, and its own IP pools. Mobility and anycast gateways work within a site. Larger networks have several sites joined by transits."}, {"p": "Cisco's recommendation is to prefer fewer, larger fabric sites when scale and operations allow, because they're simpler to run. Split into more sites only for scale limits, geography, latency, or to limit the size of a failure domain."}, {"check": [11]}]}, {"h": "Site reference models", "b": [{"p": "Cisco publishes reference models by endpoint count. They're guidelines, not hard limits:"}, {"tbl": [["Model", "Endpoints", "Layout"], ["Fabric in a Box (FiaB)", "Under 200", "One switch or stack runs border, control plane and edge, often with an embedded wireless controller"], ["Very small", "Under 2,000", "A colocated border/control plane pair with separate edge nodes"], ["Small", "Under 10,000", "A single office or building; border and control plane on one or two collapsed-core switches"], ["Medium", "Under 25,000", "A building with many wiring closets, or several buildings; dedicated border and control plane nodes"], ["Large", "Under 50,000", "Same layout as medium at larger scale, typically three-tier, with internal and external borders"]]}, {"p": "As sites grow, roles separate. Medium and large designs use dedicated control plane nodes so they can hold more endpoint mappings and keep control-plane load off the borders. Large sites usually split borders too: internal borders toward known enterprise networks such as the data centre, external borders as the default exit to the WAN and internet."}, {"p": "A few limits worth knowing: up to six control plane nodes in a wired fabric, and a WLC can talk to up to four. Embedded wireless controllers suit only the smallest sites (the Cert Guide says under 200 APs and 4,000 endpoints)."}, {"tip": "The Cert Guide describes a very small site as a single stack running every role, which is closer to the course's FiaB. For the test, use the course's table: FiaB under 200 endpoints on one device; very small under 2,000 with a colocated border/control plane pair."}, {"check": [1, 0, 2, 3, 12, 13, 14, 15]}]}, {"h": "Joining sites: transits", "b": [{"p": "A transit connects fabric sites to each other and to the outside world. The type of transit decides whether segmentation survives the trip:"}, {"tbl": [["Transit", "VN and SGT carried?", "Typical use"], ["SD-Access (distributed campus) transit", "Yes, natively in VXLAN", "Sites on a campus or metro network"], ["SD-WAN transit", "Yes", "Sites across an SD-WAN"], ["IP-based transit", "No; packets leave as plain IP and lose VN/SGT context", "Any WAN, including high latency"]]}, {"dia": "<svg viewBox=\"0 0 360 194\" role=\"img\" aria-label=\"Two fabric sites joined by an SD-Access transit, with a redundant pair of transit control plane nodes kept outside the data path\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><rect class=\"d-box\" x=\"8\" y=\"8\" width=\"112\" height=\"74\" rx=\"3\"/><text class=\"d-s\" x=\"14\" y=\"20\" text-anchor=\"start\">Fabric site A<\/text><circle class=\"d-rt\" cx=\"64\" cy=\"38\" r=\"10\"/><path class=\"d-x\" d=\"M59 35h10M59 41h10\"/><rect class=\"d-rt\" x=\"24\" y=\"58\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M30 64h16M30 69h16\"/><rect class=\"d-rt\" x=\"76\" y=\"58\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M82 64h16M82 69h16\"/><line class=\"d-ln\" x1=\"64\" y1=\"48\" x2=\"38\" y2=\"58\"/><line class=\"d-ln\" x1=\"64\" y1=\"48\" x2=\"90\" y2=\"58\"/><rect class=\"d-box\" x=\"240\" y=\"8\" width=\"112\" height=\"74\" rx=\"3\"/><text class=\"d-s\" x=\"246\" y=\"20\" text-anchor=\"start\">Fabric site B<\/text><circle class=\"d-rt\" cx=\"296\" cy=\"38\" r=\"10\"/><path class=\"d-x\" d=\"M291 35h10M291 41h10\"/><rect class=\"d-rt\" x=\"256\" y=\"58\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M262 64h16M262 69h16\"/><rect class=\"d-rt\" x=\"308\" y=\"58\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M314 64h16M314 69h16\"/><line class=\"d-ln\" x1=\"296\" y1=\"48\" x2=\"270\" y2=\"58\"/><line class=\"d-ln\" x1=\"296\" y1=\"48\" x2=\"322\" y2=\"58\"/><line class=\"d-ln\" x1=\"120\" y1=\"38\" x2=\"240\" y2=\"38\"/><text class=\"d-s\" x=\"180\" y=\"30\" text-anchor=\"middle\">SD-Access transit<\/text><text class=\"d-s\" x=\"180\" y=\"52\" text-anchor=\"middle\">VN + SGT kept<\/text><line class=\"d-ln d-dash\" x1=\"64\" y1=\"82\" x2=\"150\" y2=\"116\"/><line class=\"d-ln d-dash\" x1=\"296\" y1=\"82\" x2=\"210\" y2=\"116\"/><line class=\"d-ln d-dash\" x1=\"64\" y1=\"82\" x2=\"210\" y2=\"116\"/><line class=\"d-ln d-dash\" x1=\"296\" y1=\"82\" x2=\"150\" y2=\"116\"/><circle class=\"d-rt\" cx=\"150\" cy=\"116\" r=\"10\"/><path class=\"d-x\" d=\"M145 113h10M145 119h10\"/><circle class=\"d-rt\" cx=\"210\" cy=\"116\" r=\"10\"/><path class=\"d-x\" d=\"M205 113h10M205 119h10\"/><text class=\"d-s\" x=\"180\" y=\"146\" text-anchor=\"middle\">transit control plane pair<\/text><text class=\"d-s\" x=\"180\" y=\"160\" text-anchor=\"middle\">(out of the data path)<\/text><text class=\"d-s\" x=\"180\" y=\"186\" text-anchor=\"middle\">Transit needs: IS-IS reachability, under 10 ms, MTU 9100<\/text><\/svg>"}, {"p": "An SD-Access transit expects campus-like performance:"}, {"ul": ["Sufficient bandwidth and low latency, under 10 ms one way. Higher-latency links should use IP or SD-WAN transit.", "An MTU that fits VXLAN, typically 9,100 bytes. If the WAN only supports 1,500 bytes, adjust the TCP MSS on the client- and AP-facing SVIs down to 1,250 so packets still fit after encapsulation.", "An IGP underlay, usually IS-IS, providing reachability to every site."]}, {"p": "Transit control plane nodes track which site holds which prefixes. Deploy them as a matching, redundantly connected pair, out of the data forwarding path: they only answer lookups, so traffic load can't disrupt them. They need IGP reachability to the fabric sites before Catalyst Center can discover and provision them."}, {"tip": "The course calls the 1,250 value an \"MTU\" on the SVIs. Cisco actually configures it as a TCP MSS adjustment, but the number to remember is 1,250."}, {"check": [4, 5, 6, 16, 17, 7, 18, 19]}]}, {"h": "Shared services and the fusion router", "b": [{"p": "Services such as DHCP, DNS, ISE, WLCs and Catalyst Center usually sit outside the fabric, often in the global routing table. Every VN needs to reach them, but VNs are separate VRFs. A fusion router (or firewall) outside the border leaks routes between the VNs and the shared services. The border exchanges routes with it using eBGP, one session per VN. Putting shared services in their own VRF works too, but adds manual configuration, loses SGT context and can hairpin traffic."}]}, {"h": "Migrating to SD-Access", "b": [{"tbl": [["Strategy", "How", "Trade-off"], ["Parallel", "Build a new fabric alongside the old network and move users across gradually", "Needs new hardware, but rollback is extremely simple: move users back"], ["Incremental", "Convert existing (brownfield) switches into fabric edge nodes one at a time", "Reuses hardware, but rollback is harder"]]}, {"p": "During migration, a Layer 2 border handoff lets fabric and traditional endpoints share the same VLAN and subnet, so users can move over one by one. It's resource-intensive, so Cisco strongly recommends a dedicated border node for it, not an edge node, a control plane node, or a border that also handles Layer 3 handoff. Loop prevention still matters on the traditional side."}, {"tip": "The course question lists edge, control plane and a combined border; the key is \"none\" of them, because the right home is a dedicated Layer 2 border."}, {"check": [8, 9, 10, 20]}]}, {"h": "Key takeaways", "b": [{"ul": ["Prefer fewer, larger fabric sites.", "FiaB under 200; very small under 2,000; small under 10,000 (one building); medium under 25,000; large under 50,000 (multiple closets or buildings).", "Bigger sites separate roles: dedicated control plane nodes, internal and external borders. Up to six control plane nodes; a WLC talks to up to four.", "SD-Access transit: under 10 ms, MTU 9,100 (MSS 1,250 if the WAN is 1,500), IS-IS. VN and SGT survive; IP transit loses them.", "Transit control plane: redundant pair, out of the data path, reachable by the IGP first.", "Fusion router joins VNs to shared services.", "Parallel = easy rollback; incremental = reuse switches. Layer 2 handoff goes on a dedicated border."]}, {"tip": "Common traps: medium and large share a layout and differ by endpoint count. The transit control plane isn't in the data path. Parallel, not incremental, has the simple rollback."}]}], "verified": [["Fabric site: own control plane, border and edge; IP pools, mobility and anycast gateways within one site", "p. 571"], ["Two control plane nodes for HA; can be collocated on borders if they meet the scale", "p. 572"], ["Up to six control plane nodes (wired); a WLC can talk to up to four", "p. 573"], ["Fusion router fuses VNs into the GRT; eBGP between border and fusion router; shared services in a separate VRF adds manual config, loses SGT context and hairpins", "p. 573"], ["Distributed campus and SD-WAN transits carry VN natively; IP transit loses SGT/VN information", "p. 574"], ["Site sizes: under 2,000 (very small), 10,000 (small), 25,000 (medium) and 50,000 (large) endpoints", "p. 576–577"], ["Small sites collocate border and control plane; embedded WLC only under 200 APs and 4,000 endpoints", "p. 578"], ["Medium sites use dedicated border and control plane nodes; large sites are typically three-tier", "p. 579–580"]], "course": ["Fabric in a Box under 200 endpoints, and the very small site's colocated pair", "Prefer larger fabric sites", "Transit latency (under 10 ms), MTU 9,100 and the 1,250 adjustment", "Transit control plane placement and redundancy", "Parallel and incremental migration; Layer 2 border handoff"]}, "Designing LAN and WAN QoS": {"mins": 15, "intro": "Applying QoS end to end: where to trust markings in the campus, how voice is handled at the access port, what affects delay, how markings survive an MPLS provider, how QoS works through VPN tunnels, and how SD-WAN edges queue traffic.", "parts": [{"h": "The trust boundary", "b": [{"p": "Markings are only useful if you can believe them. The trust boundary is the point where the network starts accepting markings instead of resetting them. Put it as close to the source as possible."}, {"tbl": [["Port trust state", "What it does"], ["Untrusted", "Discards Layer 2 and Layer 3 markings and sets DSCP 0"], ["Trust CoS", "Accepts the CoS marking and works out an internal DSCP from the CoS-to-DSCP map"], ["Trust DSCP", "Keeps the packet's DSCP as it is"]]}, {"p": "On a Catalyst switch, DSCP trust is an interface command: mls qos trust dscp (no switchport or cos keyword)."}, {"check": [7, 1]}]}, {"h": "Voice at the access port", "b": [{"p": "A Cisco IP phone sits between the PC and the switch. It marks its own voice traffic CoS 5 (which maps to DSCP EF) and resets the PC's data passing through it to CoS 0."}, {"dia": "<svg viewBox=\"0 0 360 154\" role=\"img\" aria-label=\"Campus trust boundary: the IP phone marks voice CoS 5 and resets PC data to CoS 0; the access switch trusts the phone but not the PC\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><rect class=\"d-box d-boxa\" x=\"14\" y=\"56\" width=\"52\" height=\"28\" rx=\"3\"/><text class=\"d-t\" x=\"40\" y=\"74\" text-anchor=\"middle\">PC<\/text><rect class=\"d-box d-boxa\" x=\"114\" y=\"56\" width=\"52\" height=\"28\" rx=\"3\"/><text class=\"d-t\" x=\"140\" y=\"74\" text-anchor=\"middle\">IP phone<\/text><line class=\"d-ln\" x1=\"66\" y1=\"70\" x2=\"114\" y2=\"70\"/><line class=\"d-ln\" x1=\"166\" y1=\"70\" x2=\"236\" y2=\"70\"/><rect class=\"d-rt\" x=\"240\" y=\"62\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M246 68h16M246 73h16\"/><line class=\"d-ln\" x1=\"268\" y1=\"70\" x2=\"330\" y2=\"70\"/><text class=\"d-t\" x=\"254\" y=\"98\" text-anchor=\"middle\">Access switch<\/text><text class=\"d-s\" x=\"204\" y=\"40\" text-anchor=\"middle\">voice CoS 5 (EF)<\/text><text class=\"d-s\" x=\"204\" y=\"54\" text-anchor=\"middle\">PC data reset to CoS 0<\/text><line class=\"d-ln d-red d-dash\" x1=\"96\" y1=\"30\" x2=\"96\" y2=\"122\"/><text class=\"d-s\" x=\"102\" y=\"118\">trust boundary (at the phone)<\/text><text class=\"d-s\" x=\"90\" y=\"118\" text-anchor=\"end\">untrusted<\/text><text class=\"d-s\" x=\"180\" y=\"146\" text-anchor=\"middle\">The switch trusts the phone (conditional trust via CDP), not the PC<\/text><\/svg>"}, {"ul": ["Trust the CoS from the phone's voice traffic at the access port (conditionally: only while a Cisco phone is detected via CDP).", "Do the classification, marking and policing for voice at the ingress of that port.", "Use 1P1Q3T queuing (one priority queue, one normal queue, three drop thresholds) at both ingress and egress of the phone's port."]}, {"tip": "The Cert Guide marks signalling as AF31, which is an older convention. Cisco's current baseline marks call signalling CS3, with AF31 used for streaming video."}, {"check": [10, 8]}]}, {"h": "Delay, buffers and ordering", "b": [{"p": "Three delays add up across a network:"}, {"ul": ["Propagation delay: the time for the signal to travel the distance. Fixed by physics.", "Serialization delay: the time to put the bits on the wire. Worst on slow links.", "Queuing delay: waiting behind other packets. The one QoS can influence."]}, {"p": "(Processing delay exists too, but the course's three are these.) Buffers absorb bursts, but buffer tuning is hardware-specific, and not every platform supports buffer allocations, so check before designing around it."}, {"p": "EtherChannel load balancing matters too. Hashing on source or destination IP address keeps every packet of a flow on the same member link, so packets can't arrive out of order."}, {"check": [11, 0, 9]}]}, {"h": "QoS across an MPLS provider", "b": [{"p": "Your DSCP markings are inside the IP header, but the provider's core looks at the MPLS EXP bits in the label. How the two relate depends on the provider's DiffServ tunnelling mode:"}, {"tbl": [["Mode", "Behaviour"], ["Uniform", "Customer and provider share one DiffServ domain. DSCP is copied into EXP at the ingress PE; EXP is copied down label to label, and at the egress PE back into the DSCP. Changes the provider makes show up in your DSCP."], ["Pipe / short pipe", "The provider has its own markings in EXP and leaves your DSCP untouched end to end"]]}, {"check": [2]}]}, {"h": "QoS through VPN tunnels", "b": [{"p": "IPsec has two modes: transport mode protects only the payload and keeps the original IP header; tunnel mode encrypts the whole packet and adds a new header. Either way, the router's QoS sees the outer packet."}, {"ul": ["The ToS byte is copied to the outer header automatically, so DSCP-based QoS still works.", "If you classify on anything else (addresses, ports), encryption hides it. QoS pre-classify lets the router classify on the original header before it's encrypted."]}, {"p": "DMVPN has a hub-side problem: every spoke tunnel ends on the hub's single mGRE interface, so one interface policy can't protect a slow spoke from a fast hub. Per-tunnel QoS for DMVPN solves it: each spoke registers through NHRP with a QoS group name, and the hub applies a separate policy (usually a shaper) to each spoke's tunnel."}, {"p": "GETVPN has two router types: key servers manage the group keys, and group members do the encryption and decryption. Because it keeps the original IP header, QoS in the MPLS core works normally."}, {"check": [12, 3, 4, 13]}]}, {"h": "SD-WAN queuing", "b": [{"p": "Each interface on a WAN Edge (vEdge or cEdge) has eight queues, numbered 0 to 7:"}, {"ul": ["Queue 0 is the low-latency queue (LLQ). Control and BFD traffic (DSCP 48) go here, so they're always sent first.", "Queues 1 to 7 are scheduled with weighted round robin. User traffic defaults to queue 2."]}, {"p": "One more fact from the course: a cEdge uses two security associations (SAs) per TLOC."}, {"check": [5, 6, 14]}]}, {"h": "Key takeaways", "b": [{"ul": ["Trust boundary close to the source. Untrusted resets to DSCP 0; trust CoS maps CoS to DSCP; trust DSCP keeps it. mls qos trust dscp.", "IP phone: voice CoS 5, PC data CoS 0. Trust the phone; mark and police at ingress; 1P1Q3T both ways.", "Delay = propagation + serialization + queuing. Not every platform supports buffer tuning. IP-based EtherChannel hashing keeps flows in order.", "MPLS uniform mode: one DiffServ domain; DSCP copied to EXP and back.", "Pre-classify when classifying on fields other than ToS. Per-tunnel QoS for DMVPN. GETVPN: key server and group members.", "SD-WAN: 8 queues; queue 0 LLQ for control/BFD; user traffic queue 2; 2 SAs per TLOC."]}, {"tip": "Common traps: trust DSCP doesn't reset to 0. Pre-classify isn't needed for ToS-based QoS. Per-tunnel QoS is the DMVPN hub fix."}]}], "verified": [["CoS in the 802.1Q tag (802.1p, 3 bits); mark as close to the source as possible", "p. 449–450"], ["IP phone marks voice CoS 5 / DSCP EF and reclassifies PC data to CoS 0", "p. 451"], ["IPsec transport and tunnel modes; ESP", "p. 488–489"], ["GETVPN key servers and group members", "p. 497"], ["vEdge interfaces have eight queues; queue 0 LLQ for control and BFD (DSCP 48); queues 1–7 WRR; user traffic queue 2", "p. 622"]], "course": ["Trust states and the mls qos trust dscp command", "1P1Q3T queuing at the phone port", "Three delay components; buffer allocation support", "MPLS DiffServ uniform mode", "QoS pre-classify and per-tunnel QoS for DMVPN", "Two SAs per TLOC on a cEdge"]}, "Examining Cisco SD-WAN NAT and Hybrid Design Considerations": {"mins": 14, "intro": "Many WAN Edges sit behind NAT, especially on internet links. This lesson explains how SD-WAN discovers and traverses NAT, which NAT types allow direct tunnels, the zero-touch onboarding sequence, branch virtualization, and hybrid and migration designs.", "parts": [{"h": "NAT in a nutshell", "b": [{"p": "NAT's job is to translate addresses between address spaces, usually private inside addresses to a public outside address. It isn't a security feature; filtering is a firewall's job. But NAT does change how outsiders can reach an inside device, and that matters for SD-WAN, because WAN Edges build IPsec tunnels directly to each other."}, {"p": "Internet transports bring a second issue: sites behind NAT often use the same private ranges, so their transport addresses can overlap. SD-WAN avoids routing on those addresses by identifying devices by system IP and TLOC instead."}, {"check": [12, 3, 13]}]}, {"h": "How SD-WAN discovers NAT", "b": [{"p": "A device behind NAT doesn't know what its own address looks like from outside. STUN (Session Traversal Utilities for NAT) solves that: a server on the outside tells the device the public address and port it observed. In SD-WAN, vBond acts as the STUN server."}, {"dia": "<svg viewBox=\"0 0 360 174\" role=\"img\" aria-label=\"vBond acting as a STUN server: it tells a WAN Edge behind NAT what its public address and port look like\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><circle class=\"d-rt\" cx=\"36\" cy=\"70\" r=\"10\"/><path class=\"d-x\" d=\"M31 67h10M31 73h10\"/><text class=\"d-t\" x=\"36\" y=\"96\" text-anchor=\"middle\">WAN Edge<\/text><text class=\"d-s\" x=\"36\" y=\"110\" text-anchor=\"middle\">10.1.1.1:12346<\/text><rect class=\"d-box d-boxa\" x=\"100\" y=\"52\" width=\"56\" height=\"36\" rx=\"3\"/><text class=\"d-t\" x=\"128\" y=\"74\" text-anchor=\"middle\">NAT<\/text><rect class=\"d-cloud\" x=\"182.0\" y=\"57\" width=\"80\" height=\"26\" rx=\"13\"/><text class=\"d-t\" x=\"222\" y=\"74\" text-anchor=\"middle\">Internet<\/text><rect class=\"d-box d-boxa\" x=\"282\" y=\"52\" width=\"70\" height=\"36\" rx=\"3\"/><text class=\"d-t\" x=\"317\" y=\"74\" text-anchor=\"middle\">vBond<\/text><line class=\"d-ln\" x1=\"46\" y1=\"70\" x2=\"100\" y2=\"70\"/><line class=\"d-ln\" x1=\"156\" y1=\"70\" x2=\"182\" y2=\"70\"/><line class=\"d-ln\" x1=\"262\" y1=\"70\" x2=\"282\" y2=\"70\"/><line class=\"d-ln\" x1=\"60\" y1=\"40\" x2=\"300\" y2=\"40\" marker-end=\"url(#ar)\"/><text class=\"d-s\" x=\"180\" y=\"32\" text-anchor=\"middle\">1 · DTLS hello from 203.0.113.5:4500 (after NAT)<\/text><line class=\"d-ln d-dash\" x1=\"300\" y1=\"122\" x2=\"60\" y2=\"122\" marker-end=\"url(#ar)\"/><text class=\"d-s\" x=\"180\" y=\"140\" text-anchor=\"middle\">2 · \"You appear as 203.0.113.5:4500\"<\/text><text class=\"d-s\" x=\"180\" y=\"166\" text-anchor=\"middle\">The edge advertises both addresses in its TLOC route; peers use the public one<\/text><\/svg>"}, {"p": "The WAN Edge then advertises both its private and its public address and port in its TLOC route, so remote edges know where to send tunnel traffic. Public colors build tunnels to the public (post-NAT) address; private colors use the native address."}, {"check": [14]}]}, {"h": "NAT types and direct tunnels", "b": [{"p": "Whether two edges can build a tunnel straight to each other depends on how each NAT device maps and filters. From friendliest to strictest:"}, {"tbl": [["NAT type", "Who can send in to the mapped address and port", "Same mapping for new destinations?"], ["Full-cone", "Any external host. The classic one-to-one NAT.", "Yes"], ["Address-restricted cone", "Only IPs the inside host has already sent to (any port)", "Yes"], ["Port-restricted cone", "Only the exact IP and port the inside host has sent to", "Yes"], ["Symmetric", "Only the exact IP and port it sent to", "No: a new mapping for every destination"]]}, {"p": "Symmetric NAT is the hard case. The mapping vBond saw is useless to anyone else, because the NAT creates a different one for each destination. The course's traversal matrix boils down to:"}, {"ul": ["Full-cone on either side: a direct tunnel works, even if the other side is symmetric.", "Symmetric with symmetric (or symmetric with port-restricted): no direct tunnel. Traffic between those two sites has to go through a hub both can reach."]}, {"tip": "The course question words this as symmetric-symmetric being \"recommended when there is no direct IPsec tunnel\". It isn't recommended; it's what forces the hub path. Remember: symmetric on both sides means no direct tunnel."}, {"check": [1, 9, 8, 0, 15, 5, 16]}]}, {"h": "Zero-touch provisioning, step by step", "b": [{"p": "ZTP's purpose is to onboard and provision a new WAN Edge automatically, with nobody configuring it on site. DHCP usually gives the interface an address and DNS server, then:"}, {"ul": ["The WAN Edge powers up, uses DNS to resolve ztp.viptela.com, and connects to the ZTP server.", "The ZTP server verifies the WAN Edge and sends it the address of its organization's vBond.", "Initial control communication happens between the router and vBond, which authenticates it.", "The WAN Edge connects to vManage, which sends it its system IP address.", "vManage pushes the full configuration, and the router joins the overlay (vSmart connections follow)."]}, {"p": "IOS XE SD-WAN routers use Plug and Play Connect, which points them to the Cisco-hosted vBond. The course also calls vBond the vOrchestrator; they're the same component."}, {"check": [17, 18, 2, 10, 6]}]}, {"h": "Virtual WAN Edges at the branch", "b": [{"p": "A branch doesn't need a physical WAN Edge. Two Cisco platforms host virtual network functions:"}, {"ul": ["ENCS (Enterprise Network Compute System) runs the NFVIS hypervisor. The ISRv (Integrated Services Virtual Router) runs on top as the WAN Edge, alongside other virtual functions like a firewall.", "UCS-E is a server module that slides into an ISR router."]}, {"check": [4, 11]}]}, {"h": "Hybrid designs and migration", "b": [{"p": "A hybrid WAN mixes transport types, for example MPLS for critical applications and broadband internet for SaaS. Used active-active, both links carry production traffic at once; active-standby keeps one mostly idle for failover. Backhauling SaaS traffic to a distant data center adds path length and latency, so local or regional breakout is common."}, {"p": "A hybrid deployment with rich services keeps a separate service router running existing features (voice, security and so on) alongside the WAN Edge router that handles SD-WAN."}, {"p": "Migration is usually phased: build SD-WAN in parallel, let it use the existing MPLS as one transport, then replace the old routers. While legacy and SD-WAN sites coexist, the critical part is planning routing between them, the interim traffic paths, and security and policy boundaries."}, {"check": [19, 20, 21, 7, 22]}]}, {"h": "Key takeaways", "b": [{"ul": ["NAT translates addresses; it's not security. Overlapping transport addresses are why SD-WAN uses system IPs and TLOCs.", "vBond is the STUN server, telling edges their public address and port.", "Full-cone (one-to-one), address-restricted, port-restricted, symmetric (new mapping per destination). Full-cone anywhere = direct tunnel; symmetric on both sides = through a hub.", "ZTP: DNS for ztp.viptela.com, ZTP server gives vBond, vBond authenticates, vManage gives the system IP and full config. vOrchestrator = vBond.", "ENCS with NFVIS runs the ISRv as a virtual WAN Edge; UCS-E fits in an ISR.", "Hybrid WAN = mixed transports; active-active uses both. Rich services keep a service router next to the WAN Edge. Plan routing and policy boundaries during migration."]}, {"tip": "Common traps: address-restricted checks only the IP; port-restricted checks IP and port. The ZTP server gives vBond, not vManage."}]}], "verified": [["Private colors use native addresses; public colors build tunnels to post-NAT addresses; TLOC routes carry private and public addresses", "p. 603, 605"], ["ZTP: reach public DNS and ztp.viptela.com, redirect to vBond, template from vManage, then OMP and IPsec", "p. 606–607"], ["IOS XE onboarding via PnP Connect, bootstrap or manual", "p. 607–608"], ["DIA: internet traffic leaves the branch directly, with NAT on the internet transport", "p. 616"], ["Migration: parallel SD-WAN, use MPLS as a transport, then replace MPLS routers", "p. 619"]], "course": ["vBond as the STUN server; NAT types and the traversal matrix", "Ordered ZTP steps including the system IP from vManage", "vOrchestrator as another name for vBond", "ENCS, NFVIS, ISRv and UCS-E", "Hybrid deployment with rich services (service router plus WAN Edge)"]}, "Designing WAN Resiliency": {"mins": 17, "intro": "Resiliency is about the business staying connected when a link, router or provider fails. This lesson covers how availability is measured, the main WAN deployment models from MPLS-only to internet-only, how remote sites get to the internet, how to build a dual-router branch, and how routing steers traffic across several transports.", "parts": [{"h": "What resiliency means", "b": [{"p": "The goal of WAN resiliency is to maintain critical connectivity when components fail, by removing single points of failure. Availability is uptime as a share of total time. A year has 8,760 hours, so 4 hours of downtime is 8,756 ÷ 8,760, about 99.95%. Each extra 9 cuts the allowed downtime tenfold: 99.9% is about 8.8 hours a year, 99.99% about 53 minutes, and 99.999% about 5 minutes."}, {"tbl": [["Remote-site design", "Removes as single point of failure"], ["One router, one circuit", "Nothing"], ["One router, two circuits", "The circuit (and the provider, if they differ)"], ["Two routers, separate circuits", "The router and the circuit"]]}, {"p": "Watch for hidden shared fate. Two circuits from different providers can still run through the same conduit or building entrance, and one backhoe cuts both. Check physical path diversity, not just provider names."}, {"check": [16, 17, 18]}]}, {"h": "WAN deployment models", "b": [{"p": "Whatever the transport, a remote site looks roughly the same: WAN routers joining a LAN back to the hub. The general topology is the part least affected by your choice of transport. What changes is how many routers and links you use, and how routing works."}, {"tbl": [["Model", "What it is", "Trade-off"], ["MPLS WAN", "One or two MPLS providers", "Best SLAs and QoS; most expensive; tied to the provider"], ["Hybrid WAN", "MPLS plus internet VPN (DMVPN)", "Balanced cost; priority traffic on MPLS, the rest (or backup) on internet"], ["Internet WAN", "Internet VPN only", "Cheapest; no carrier SLA or QoS"]]}, {"p": "For MPLS aggregation at the hub, the models scale with size:"}, {"ul": ["MPLS static: small networks, static routes to the provider.", "MPLS dynamic: medium networks, one provider, dynamic routing (usually BGP) between CE and PE. Prefixes are advertised and withdrawn automatically, so failover doesn't depend on someone editing routes.", "Dual MPLS: larger networks, two providers with BGP, removing the single-carrier failure point. BGP carries the per-provider policy."]}, {"p": "Summarize at the distribution layer of the WAN aggregation site, the choke point between WAN edge and core, so remote routes don't flood the core and vice versa."}, {"p": "With a Layer 2 WAN (like Metro Ethernet), the provider just carries frames, so the enterprise controls inter-site routing. In a trunked demarcation, you hand the provider several tagged VLANs, and the provider uses Q-in-Q tunnelling (its own outer tag) to carry your tags through untouched."}, {"check": [0, 1, 2, 19, 20, 21, 3, 22, 4]}]}, {"h": "DMVPN designs", "b": [{"p": "Classic DMVPN is mGRE, NHRP and IPsec (covered in the last lesson). In WAN designs it shows up in several combinations:"}, {"tbl": [["Design", "Transports"], ["DMVPN only", "One internet link"], ["Dual DMVPN", "Internet as both primary and secondary, two DMVPN clouds, usually over two ISPs"], ["DMVPN backup", "MPLS primary, DMVPN over internet as backup (shared or dedicated hub router)"]]}, {"p": "Putting the MPLS CE and the DMVPN hub on one shared router saves hardware, but one failure takes out both the primary and the backup path."}, {"p": "DMVPN suits cellular WANs because cellular links get changing public addresses; spokes register their current address with the hub through NHRP. Cellular backup also brings its own concerns: coverage, data limits and carrier-grade NAT."}, {"check": [23, 5, 24, 6, 26]}]}, {"h": "Internet access for remote sites", "b": [{"tbl": [["", "Central internet", "Local internet (direct, split tunnelling)"], ["Internet traffic", "Backhauled over the WAN to the hub", "Leaves straight from the branch's own ISP link"], ["Security", "Centralized, easier to manage", "Distributed; more points to protect"], ["WAN bandwidth and delay", "Higher", "Lower"]]}, {"p": "Local internet is also called split tunnelling or local breakout: internal traffic goes over the VPN or WAN, and internet traffic goes straight out. For the local model:"}, {"ul": ["Make sure the private WAN (MPLS, Layer 2 or DMVPN) still provides the internal routes to the data centre and campus.", "Enable split tunnelling so web and cloud traffic uses the local link.", "Use PAT on the ISP-facing interface to translate internal private addresses."]}, {"p": "One thing local internet can't do: fall back to the central internet over an internet-based VPN tunnel. That tunnel rides the same local link that just failed. Fallback has to use MPLS or another path."}, {"check": [8, 27, 9, 7]}]}, {"h": "Building the remote-site LAN", "b": [{"dia": "<svg viewBox=\"0 0 360 224\" role=\"img\" aria-label=\"Dual-router remote site: one router on MPLS and one on internet DMVPN, joined by a transit link, sharing an HSRP gateway with IP SLA tracking\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><rect class=\"d-cloud\" x=\"20.0\" y=\"13\" width=\"120\" height=\"26\" rx=\"13\"/><text class=\"d-t\" x=\"80\" y=\"30\" text-anchor=\"middle\">MPLS<\/text><rect class=\"d-cloud\" x=\"220.0\" y=\"13\" width=\"120\" height=\"26\" rx=\"13\"/><text class=\"d-t\" x=\"280\" y=\"30\" text-anchor=\"middle\">Internet (DMVPN)<\/text><line class=\"d-ln\" x1=\"80\" y1=\"39\" x2=\"80\" y2=\"96\"/><line class=\"d-ln\" x1=\"280\" y1=\"39\" x2=\"280\" y2=\"96\"/><line class=\"d-ln d-red\" x1=\"80\" y1=\"96\" x2=\"280\" y2=\"96\"/><text class=\"d-s\" x=\"180\" y=\"88\" text-anchor=\"middle\">transit link<\/text><line class=\"d-ln\" x1=\"80\" y1=\"96\" x2=\"180\" y2=\"166\"/><line class=\"d-ln\" x1=\"280\" y1=\"96\" x2=\"180\" y2=\"166\"/><circle class=\"d-rt\" cx=\"80\" cy=\"96\" r=\"10\"/><path class=\"d-x\" d=\"M75 93h10M75 99h10\"/><circle class=\"d-rt\"
