cx=\"280\" cy=\"96\" r=\"10\"/><path class=\"d-x\" d=\"M275 93h10M275 99h10\"/><rect class=\"d-rt\" x=\"166\" y=\"158\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M172 164h16M172 169h16\"/><text class=\"d-t\" x=\"56\" y=\"100\" text-anchor=\"end\">WAN 1<\/text><text class=\"d-t\" x=\"304\" y=\"100\">WAN 2<\/text><text class=\"d-s\" x=\"74\" y=\"124\" text-anchor=\"end\">HSRP active<\/text><text class=\"d-s\" x=\"286\" y=\"124\">HSRP standby<\/text><text class=\"d-s\" x=\"88\" y=\"66\">↑ IP SLA probe<\/text><text class=\"d-t\" x=\"180\" y=\"192\" text-anchor=\"middle\">Access switch (users)<\/text><text class=\"d-s\" x=\"180\" y=\"216\" text-anchor=\"middle\">If the IP SLA probe fails, tracking lowers HSRP priority and WAN 2 takes over<\/text><\/svg>"}, {"ul": ["Give hosts one virtual gateway with an FHRP (HSRP, VRRP or GLBP) shared by the two WAN routers.", "Use Enhanced Object Tracking (EOT) with IP SLA probes. An interface can stay up while the provider path behind it is broken; the probe notices, and tracking lowers the HSRP priority so the other router takes over quickly.", "Add a transit link between the two WAN routers. Without it, traffic that arrives at the wrong router has to go back down to the LAN switch and up again (hairpinning).", "Use the same VLAN scheme at every site (for example voice always VLAN 10), but a unique IP subnet per site, so the WAN can route between them. VLAN numbers are local.", "Larger branches add a distribution layer to aggregate access switches and do inter-VLAN routing and policy, just like the campus."]}, {"check": [29, 10, 25, 11, 12, 28, 30]}]}, {"h": "Routing across several transports", "b": [{"p": "BGP gives the most flexibility for load balancing across multiple WAN transports, because its attributes give fine control in both directions:"}, {"ul": ["Outbound: local preference (or weight) picks which transport your traffic leaves on.", "Inbound: MED suggests to a neighbouring AS which entry point to use. AS-path prepending also works, and often better, because MED is only honoured by the directly connected AS."]}, {"p": "Cloud applications add one more set of paths. The course names three cloud connection options: Cloud Direct Connect (a private link straight to the provider), Cloud OnRamp (Cisco SD-WAN's automated cloud access), and MPLS Direct Connect (reaching the cloud through your MPLS provider). Community and hybrid cloud are deployment models, not connection methods."}, {"check": [13, 14, 15]}]}, {"h": "Key takeaways", "b": [{"ul": ["Resiliency = staying connected through failures. Two routers with separate circuits removes both single points of failure. Check physical path diversity.", "MPLS WAN (best SLA, costly), hybrid (MPLS + internet VPN), internet WAN (cheapest). MPLS static (small), dynamic (medium), dual MPLS (large); BGP for policy. Summarize at distribution.", "Layer 2 WAN: the customer routes. Trunked demarcation uses Q-in-Q.", "Dual DMVPN = internet primary and secondary. DMVPN suits dynamic (cellular) addresses. A shared CE/hub router is a single point of failure.", "Local internet = split tunnelling; needs internal routes over the private WAN and PAT, and can't fall back over an internet tunnel.", "Remote site: FHRP plus EOT/IP SLA, a transit link to avoid hairpinning, consistent VLANs, unique subnets.", "BGP for multiple transports; MED (or prepend) for inbound."]}, {"tip": "Common traps: two providers aren't automatically diverse. Dual DMVPN uses no MPLS. Local internet fallback can't ride the internet tunnel."}]}], "verified": [["Availability calculation (4 hours a year ≈ 99.95%) and goal of removing single points of failure", "p. 519–520"], ["MPLS WAN, hybrid WAN and internet WAN deployment models and trade-offs", "p. 521–522"], ["Redundancy options: dual routers and links, single router with dual links, single-homed", "p. 522"], ["Single- versus multi-carrier trade-offs; eBGP CE to PE in MPLS designs", "p. 522–524"], ["Hybrid WAN: MPLS primary with internet tunnel backup; FHRP or metrics to prefer MPLS", "p. 524–525"], ["Central versus direct internet for remote sites; split tunnelling", "p. 527–528"], ["Backup options: secondary WAN link, IPsec tunnel over the internet, SD-WAN; IP SLA with a floating static route", "p. 529–530"], ["DMVPN supports spokes with dynamic addresses", "p. 491"]], "course": ["MPLS static, dynamic and dual-MPLS aggregation models; summarization at distribution", "Trunked demarcation with Q-in-Q", "DMVPN only, dual DMVPN and DMVPN backup designs", "Local internet design principles and the fallback limitation", "EOT with IP SLA, transit link, VLAN and subnet schemes", "Cloud connection options"]}, "Examining Cisco SD-WAN Deployment Design Considerations": {"mins": 14, "intro": "Where do the SD-WAN controllers live, who runs them, and how do routers reach them securely? This lesson covers the controller deployment models, certificates, control connections, and the placement and reachability rules that keep the control plane up.", "parts": [{"h": "Who hosts the controllers", "b": [{"tbl": [["Model", "Who runs vManage, vBond, vSmart", "Notes"], ["Cisco cloud-hosted", "Cisco CloudOps, in AWS or Azure", "Recommended. No controller infrastructure for you to maintain; redundancy built in."], ["Managed service provider (MSP)", "A service provider, in its cloud", "Often multitenant"], ["Enterprise IT (on-premises / private cloud)", "Your own IT team, in your own data centre or private cloud", "Runs on VMware ESXi or KVM (or your own AWS/Azure). VirtualBox isn't supported."]]}, {"p": "In a multitenant MSP deployment, vManage and vBond can be shared by all tenants, but each tenant gets its own dedicated vSmart controllers, because each needs its own control plane."}, {"p": "Controllers can also be split, some in a public cloud and some in an enterprise data centre. That works as long as they have IP connectivity to each other and firewalls permit their secure communications."}, {"check": [10, 20, 12, 0, 1, 4, 3, 14, 21]}]}, {"h": "Trust: certificates", "b": [{"p": "Every device proves its identity with a certificate before any control connection comes up. A certificate authority (CA) issues and signs them."}, {"ul": ["Cisco cloud-hosted controllers use certificates signed by DigiCert (which took over Symantec's CA business). That's the default.", "On-premises deployments can use their own enterprise CA.", "Hardware WAN Edges also carry a Cisco-signed certificate in their TPM chip."]}, {"check": [5, 16, 25]}]}, {"h": "Control connections", "b": [{"p": "Control connections are encrypted tunnels from each device to the controllers, sourced from VPN 0 (the transport VPN):"}, {"ul": ["They use DTLS (TLS adapted for UDP datagrams, the default) or TLS (over TCP). HTTPS, SSL and SSH are for management access, not the fabric.", "The WAN Edge to vBond connection must use DTLS.", "By default, a WAN Edge builds a control connection to each vSmart on every transport (TLOC). Four transports means four connections to a vSmart. (Separately, max-control-connections, default 2, limits how many vSmarts each transport connects to.)", "vSmart needs IP reachability to vBond, vManage, the other vSmarts, and every WAN Edge."]}, {"dia": "<svg viewBox=\"0 0 360 244\" role=\"img\" aria-label=\"A WAN Edge with MPLS and internet transports builds a control connection to each vSmart on each transport; vBond sits in the DMZ reached over DTLS\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><line class=\"d-ln\" x1=\"50\" y1=\"120\" x2=\"120\" y2=\"80\"/><line class=\"d-ln d-dash\" x1=\"220\" y1=\"80\" x2=\"270\" y2=\"50\"/><line class=\"d-ln d-dash\" x1=\"220\" y1=\"80\" x2=\"270\" y2=\"110\"/><line class=\"d-ln\" x1=\"50\" y1=\"120\" x2=\"120\" y2=\"160\"/><line class=\"d-ln d-dash\" x1=\"220\" y1=\"160\" x2=\"270\" y2=\"50\"/><line class=\"d-ln d-dash\" x1=\"220\" y1=\"160\" x2=\"270\" y2=\"110\"/><line class=\"d-ln d-red\" x1=\"220\" y1=\"160\" x2=\"270\" y2=\"180\"/><rect class=\"d-cloud\" x=\"120.0\" y=\"67\" width=\"100\" height=\"26\" rx=\"13\"/><text class=\"d-t\" x=\"170\" y=\"84\" text-anchor=\"middle\">MPLS<\/text><rect class=\"d-cloud\" x=\"120.0\" y=\"147\" width=\"100\" height=\"26\" rx=\"13\"/><text class=\"d-t\" x=\"170\" y=\"164\" text-anchor=\"middle\">Internet<\/text><circle class=\"d-rt\" cx=\"40\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M35 117h10M35 123h10\"/><text class=\"d-t\" x=\"40\" y=\"146\" text-anchor=\"middle\">WAN Edge<\/text><text class=\"d-s\" x=\"40\" y=\"160\" text-anchor=\"middle\">2 transports<\/text><rect class=\"d-box d-boxa\" x=\"270\" y=\"36\" width=\"80\" height=\"28\" rx=\"3\"/><text class=\"d-t\" x=\"310\" y=\"54\" text-anchor=\"middle\">vSmart 1<\/text><rect class=\"d-box d-boxa\" x=\"270\" y=\"96\" width=\"80\" height=\"28\" rx=\"3\"/><text class=\"d-t\" x=\"310\" y=\"114\" text-anchor=\"middle\">vSmart 2<\/text><rect class=\"d-box d-boxa\" x=\"270\" y=\"166\" width=\"80\" height=\"28\" rx=\"3\"/><text class=\"d-t\" x=\"310\" y=\"180\" text-anchor=\"middle\">vBond<\/text><text class=\"d-s\" x=\"310\" y=\"191\" text-anchor=\"middle\">DMZ, 1:1 NAT<\/text><text class=\"d-s\" x=\"310\" y=\"210\" text-anchor=\"middle\">always DTLS<\/text><text class=\"d-s\" x=\"180\" y=\"236\" text-anchor=\"middle\">Dashed: a control connection on every transport, to each vSmart<\/text><\/svg>"}, {"p": "Because the edge builds control connections on every transport, a perimeter firewall in front of on-premises controllers has to allow both the MPLS and the internet paths. Block one, and that transport has no control connections."}, {"check": [17, 27, 6, 15, 9, 7, 8]}]}, {"h": "Placing vBond and NAT", "b": [{"p": "vBond is the first point of contact for every device, so it must be reachable from anywhere. It also does NAT traversal: like a STUN server, it tells each device what its public (post-NAT) address looks like, so tunnels can be built through NAT. So vBond goes in the DMZ with a publicly reachable address, and shouldn't itself sit behind dynamic NAT."}, {"p": "If vBond (or any controller) has a private address, give it a static one-to-one NAT mapping to its own fixed public address, plus firewall rules allowing its DTLS traffic. PAT can't do this, because each controller needs its own predictable public address. Cisco's cloud-hosted controllers work the same way: private addresses inside, one-to-one NAT to public addresses outside."}, {"p": "Internet-facing controllers in a DMZ sit behind a perimeter firewall that only allows the ports and services the controllers need."}, {"check": [19, 18, 24, 22, 28]}]}, {"h": "Control versus data transports", "b": [{"p": "Control connections and data tunnels are independent. A branch might reach the controllers over the internet while sending user traffic over MPLS tunnels. Hybrid deployments most often use MPLS and public internet as underlays, and cloud-hosted controllers are usually reached over an internet transport."}, {"p": "The design trap: two circuits don't give control-plane redundancy unless both can reach the controllers. If only the internet reaches the cloud controllers, losing the internet can drop control connectivity even while MPLS data tunnels are still up (they keep working only for a while). Fix it with a second, independently routed internet path, verified to reach the controllers, or a route from MPLS to the controllers."}, {"check": [2, 13, 23, 26, 29]}]}, {"h": "Scaling and redundancy", "b": [{"p": "Controllers scale horizontally:"}, {"ul": ["Add vBond orchestrators to bring more edges up at once.", "Build a vManage cluster to manage more edges.", "Add vSmart controllers to increase control-plane capacity and redundancy."]}, {"p": "Remember the colors from the previous lesson. Public colors include gold, red, biz-internet, lte and public-internet. \"Yellow\" isn't a color at all."}, {"check": [11]}]}, {"h": "Key takeaways", "b": [{"ul": ["Deployment models: Cisco cloud-hosted (recommended, AWS/Azure), MSP, enterprise IT on-premises (ESXi or KVM, not VirtualBox).", "Multitenant: vManage and vBond shared; vSmart per tenant.", "DigiCert is the default CA; an enterprise CA can sign for on-premises.", "Control connections: DTLS (default) or TLS, from VPN 0. Edge to vBond is always DTLS. One connection per transport per vSmart by default.", "vSmart reaches vBond, vManage, other vSmarts and all edges. Firewalls must allow every transport.", "vBond: DMZ, public address, NAT traversal; use one-to-one NAT for private controllers.", "Control and data paths are independent; make sure more than one transport can reach the controllers."]}, {"tip": "Common traps: vSmart, not vManage, is per tenant. vBond to edge isn't TLS. One-to-one NAT, not PAT."}]}], "verified": [["Controller deployment models: on-premises, managed SP, Cisco cloud", "p. 610"], ["Horizontal scaling: add vBonds, vManage cluster, add vSmarts", "p. 611"], ["Zero-trust control plane with certificates over TLS 1.2/DTLS 1.2", "p. 608–609"], ["DTLS/TLS connections to vSmart and vBond are initiated from VPN 0", "p. 617"], ["Controller redundancy by adding vSmarts", "p. 613"], ["Public and private colors", "p. 603"]], "course": ["Cisco cloud-hosted as the recommended model; AWS and Azure hosting", "Multitenancy: shared vManage and vBond, dedicated vSmart", "Supported hypervisors", "DigiCert default CA; enterprise CA option", "WAN Edge to vBond always DTLS; per-transport control connections", "vBond NAT traversal, DMZ placement and one-to-one NAT", "Control-plane reachability over multiple transports"]}, "Exploring IPv6": {"mins": 16, "intro": "What IPv6 addresses look like, the address types you have to recognize on sight, how hosts get addresses without ARP or broadcasts, and how to plan an enterprise IPv6 address space.", "parts": [{"h": "Why IPv6, and what changed", "b": [{"p": "IPv4 has about 4.3 billion addresses, and they've run out. IPv6 uses 128-bit addresses, which is about 3.4 × 10³⁸. Address shortage simply isn't a design concern any more, which changes how you plan: you size subnets for convenience, not to save space."}, {"p": "The header was cleaned up too. It's a fixed 40 bytes, twice the size of IPv4's 20-byte header even though addresses are four times longer, because rarely used fields were moved out."}, {"ul": ["No fragmentation fields and no header checksum. Routers never fragment; only the sending host can, using path MTU discovery. Every link must support at least 1,280 bytes.", "Traffic Class does the job of IPv4's ToS byte (QoS marking). A new Flow Label field can tag a stream of packets, such as a voice call, for special handling.", "Hop Limit replaces TTL. Next Header replaces Protocol.", "Optional information goes in extension headers chained after the main header: routing, fragment, hop-by-hop, and the IPsec AH and ESP headers.", "There is no broadcast. Multicast does that job."]}, {"check": [11]}]}, {"h": "Reading and writing IPv6 addresses", "b": [{"p": "An address is written as eight groups of four hex digits separated by colons. Two rules make them shorter:"}, {"ul": ["Drop the leading zeros in any group: 0db8 becomes db8, and 0000 becomes 0.", "Replace one run of all-zero groups with a double colon (::). You can only do this once, or nobody could tell how many zeros each :: stands for."]}, {"tbl": [["Full address", "Shortest form"], ["2001:0db8:0000:0001:0abc:0000:0000:ab01", "2001:db8:0:1:abc::ab01"], ["FE1A:42B9:001B:0000:0000:12D0:005B:06B0", "FE1A:42B9:1B::12D0:5B:6B0"], ["2001:004C:0000:0000:09EA:0000:0000:0001", "2001:4C::9EA:0:0:1"]]}, {"p": "When there are two runs of zeros, the standard (RFC 5952) says shorten the longest run. If they're the same length, shorten the first one. That's why the last row compresses the first pair of zero groups."}, {"p": "To expand an address, do it in reverse: put the leading zeros back, then fill the :: with however many 0000 groups it takes to make eight."}, {"tip": "Watch for answers that drop zeros without using :: (like 2001:db8:0:1:abc:0:ab01). That has only seven groups, so it's a different address."}, {"check": [4]}]}, {"h": "Address types to recognize on sight", "b": [{"p": "The first few bits tell you what kind of address you're looking at. Expect exam questions that give a prefix and ask what it is."}, {"tbl": [["Prefix", "Type", "What it's for"], ["2000::/3", "Global unicast", "Public, routable on the internet (anything starting 2 or 3)"], ["FE80::/10", "Link-local", "Every IPv6 interface has one. Never routed off the local link."], ["FC00::/7", "Unique local (ULA)", "IPv6's private addresses, like RFC 1918. Not routed on the internet."], ["FF00::/8", "Multicast", "One-to-many. Also replaces broadcast."], ["::1/128", "Loopback", "Like 127.0.0.1"], ["::/128", "Unspecified", "\"No address yet\"; never forwarded"], ["::/0", "Default route", "Like 0.0.0.0/0"]]}, {"ul": ["Link-local addresses do a lot of work. Routers use them as next hops, and protocols like OSPFv3 use them to talk to neighbours.", "ULAs replaced the old site-local addresses (FEC0::/10), which are deprecated.", "Some well-known multicast groups: FF02::1 is all nodes on the link (the broadcast replacement), and FF02::2 is all routers. The \"02\" means link scope.", "Anycast has no prefix of its own. You assign the same global unicast address to several devices, and routing delivers each packet to the nearest one. It's often used for things like DNS servers."]}, {"check": [12, 13, 14, 7]}]}, {"h": "How hosts get addresses: ND and SLAAC", "b": [{"p": "IPv6 has no ARP. Neighbor Discovery (ND), built on ICMPv6, handles finding neighbours, finding routers, checking for duplicate addresses and learning the subnet prefix."}, {"tbl": [["ICMPv6 message", "Sent by", "Purpose"], ["Router Solicitation (RS)", "Host", "\"Any routers here?\""], ["Router Advertisement (RA)", "Router", "\"I'm a router; here's the prefix and settings\""], ["Neighbor Solicitation (NS)", "Host", "\"What's your MAC address?\" Also used to check for duplicates."], ["Neighbor Advertisement (NA)", "Host", "The reply to an NS"], ["Redirect", "Router", "\"Use a better next hop\""]]}, {"p": "With stateless address autoconfiguration (SLAAC), a host builds its own address with no server:"}, {"ul": ["It makes a link-local address and checks nobody else has it (duplicate address detection).", "It listens for (or asks for) a Router Advertisement, which carries the /64 prefix.", "It adds its own 64-bit interface ID to that prefix."]}, {"p": "The classic way to make the interface ID is EUI-64. Split the 48-bit MAC in half, insert FFFE in the middle, then flip the seventh bit of the first byte. For example, MAC 0200:FE23:5A6B becomes 0000:FEFF:FE23:5A6B."}, {"p": "The alternative is stateful DHCPv6, where a server hands out addresses and keeps track of them, much like DHCP in IPv4. There's also stateless DHCPv6: SLAAC for the address, with DHCPv6 just supplying extras such as DNS servers. Infrastructure devices (routers, switches, servers, firewalls) should still get static addresses."}, {"p": "Names work as before: DNS returns IPv6 addresses in AAAA (\"quad-A\") records, from the same DNS servers you already have."}, {"check": [16, 15]}]}, {"h": "Getting address space: PA vs PI", "b": [{"p": "You get global IPv6 space one of two ways. Provider-aggregatable (PA) space is lent to you by your ISP from its own block. Provider-independent (PI) space comes from a regional registry, such as ARIN for Canada and the US, and belongs to you."}, {"tbl": [["", "PA (from your ISP)", "PI (from a registry)"], ["Change ISPs?", "You must renumber everything", "Keep your addresses"], ["Multihoming to two ISPs", "Awkward", "The recommended way"], ["Internet routing table", "Rolls up into the ISP's summary", "One extra route everyone must carry, since it can't be aggregated"]]}, {"p": "Typical sizes: ISPs get a /32. A normal company or site gets a /48, which is the default PI allocation. Large companies may get a /40, small ones a /56, and a home connection a /64."}, {"p": "Renumbering is the real IPv6 headache. Address space is never the problem, but moving providers with PA space means changing every prefix. That's why multihomed enterprises use PI, and why IPv6 avoids NAT: NAT is discouraged in IPv6, so you can't hide behind it the way IPv4 networks do."}, {"check": [0, 1, 5, 6]}]}, {"h": "Planning the subnets", "b": [{"p": "The rule is simple: every LAN segment is a /64. That's IPv6's version of a /24, and it's what SLAAC expects. Don't make LANs smaller (point-to-point links are the usual exception, often /127)."}, {"p": "So a /64 is exactly one subnet. A /48 leaves 16 bits between the /48 and the /64 for subnets, which is 2¹⁶ = 65,536 subnets. Those 16 bits are where your design lives."}, {"dia": "<svg viewBox=\"0 0 360 180\" role=\"img\" aria-label=\"IPv6 global unicast address layout and an example subnet ID plan\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"8\" y=\"16\">GLOBAL UNICAST ADDRESS (TYPICAL /48 SITE)<\/text><rect class=\"d-box d-boxa\" x=\"8\" y=\"22\" width=\"130\" height=\"34\" rx=\"2\"/><text class=\"d-t\" x=\"73.0\" y=\"37\" text-anchor=\"middle\">Global routing prefix<\/text><text class=\"d-s\" x=\"73.0\" y=\"50\" text-anchor=\"middle\">48 bits, from ISP or RIR<\/text><rect class=\"d-box\" x=\"138\" y=\"22\" width=\"56\" height=\"34\" rx=\"2\"/><text class=\"d-t\" x=\"166.0\" y=\"37\" text-anchor=\"middle\">Subnet ID<\/text><text class=\"d-s\" x=\"166.0\" y=\"50\" text-anchor=\"middle\">16 bits<\/text><rect class=\"d-box\" x=\"194\" y=\"22\" width=\"158\" height=\"34\" rx=\"2\"/><text class=\"d-t\" x=\"273.0\" y=\"37\" text-anchor=\"middle\">Interface ID<\/text><text class=\"d-s\" x=\"273.0\" y=\"50\" text-anchor=\"middle\">64 bits (the host)<\/text><path class=\"d-ln\" d=\"M8 64v6h186v-6\"/><text class=\"d-s\" x=\"101\" y=\"82\" text-anchor=\"middle\">The /64 network part<\/text><text class=\"d-h\" x=\"8\" y=\"108\">INSIDE THE 16-BIT SUBNET ID (ONE OPTION)<\/text><rect class=\"d-box\" x=\"8\" y=\"116\" width=\"80\" height=\"34\" rx=\"2\"/><text class=\"d-t\" x=\"48.0\" y=\"131\" text-anchor=\"middle\">Location<\/text><text class=\"d-s\" x=\"48.0\" y=\"144\" text-anchor=\"middle\">4 bits: 16 sites<\/text><rect class=\"d-box\" x=\"88\" y=\"116\" width=\"80\" height=\"34\" rx=\"2\"/><text class=\"d-t\" x=\"128.0\" y=\"131\" text-anchor=\"middle\">Type<\/text><text class=\"d-s\" x=\"128.0\" y=\"144\" text-anchor=\"middle\">4 bits: 16 kinds<\/text><rect class=\"d-box\" x=\"168\" y=\"116\" width=\"184\" height=\"34\" rx=\"2\"/><text class=\"d-t\" x=\"260.0\" y=\"131\" text-anchor=\"middle\">VLAN / subnet<\/text><text class=\"d-s\" x=\"260.0\" y=\"144\" text-anchor=\"middle\">8 bits: 256 per type<\/text><text class=\"d-s\" x=\"180\" y=\"172\" text-anchor=\"middle\">Location goes in the highest bits so each site summarizes to one route<\/text><\/svg>"}, {"p": "Like IPv4, build the subnet ID as a hierarchy. Location goes first (in the highest bits) so each site or region summarizes to one route, then type (data, voice, servers), then the individual subnet. If you embed a full 12-bit VLAN ID, that leaves 16 − 12 = 4 bits for location or type."}, {"p": "Summarization works the same as IPv4, just in hex. A site holding 2001:db8:2a3e:8180::/64 through 2001:db8:2a3e:818F::/64 (16 subnets) is advertised as 2001:db8:2a3e:8180::/60."}, {"check": [8, 3, 9]}]}, {"h": "Linking IPv6 to your IPv4 plan", "b": [{"p": "Most IPv6 deployments sit alongside an existing IPv4 network, so it pays to make the two plans line up. People can then read one address and know the other."}, {"ul": ["Subnets: reuse the IPv4 third octet as the IPv6 subnet ID. 10.1.45.0/24 on VLAN 45 becomes 2001:db8:…:45::/64. Writing the decimal digits straight in (45, not hex 2d) is easiest to read when troubleshooting, and it works best with /24s.", "Hosts: for statically addressed devices like servers, reuse the last octet as the host part. Server 10.1.20.25 becomes …:20::25.", "Embedding the whole IPv4 address in the low bits also works (172.16 becomes AC10 in hex), but it's hard to read at a glance, so it's the least helpful option."]}, {"tip": "For quick troubleshooting, the course's answers favour the readable options: the third octet as-is for subnets, the last octet for static hosts."}, {"check": [10, 2]}]}, {"h": "Key takeaways", "b": [{"ul": ["128-bit addresses, a 40-byte fixed header, no broadcast, no router fragmentation, and extension headers for options.", "Shorten with two rules: drop leading zeros, and use :: once for the longest run of zero groups.", "Know the prefixes: 2000::/3 global, FE80::/10 link-local, FC00::/7 ULA (private), FF00::/8 multicast, ::1 loopback.", "ND (ICMPv6 RS/RA/NS/NA) replaces ARP. SLAAC builds the address from the RA prefix plus an EUI-64 or random interface ID. DHCPv6 is the stateful option.", "PI space (a /48 by default) suits multihoming and avoids renumbering, but adds an unaggregatable route. Renumbering is IPv6's main pain point.", "Every LAN is a /64. A /48 gives 65,536 of them. Plan location first, then type, then subnet.", "Link to IPv4 where you can: the third octet for subnets, the last octet for static hosts."]}, {"tip": "Common traps: a /64 from your ISP is one subnet, not many. Multicast replaces broadcast; anycast has no special prefix. ULAs are FC00::/7, not FE80::/10."}]}], "verified": [["Header is a fixed 40 bytes; no fragmentation fields; Flow Label added; Traffic Class, Next Header and Hop Limit; extension headers", "p. 117–119"], ["Eight 16-bit hex groups; drop leading zeros; :: only once; longest run first, then the first run on a tie (RFC 5952)", "p. 120–121"], ["Expanding a compressed address. (The book's own tie-break example prints the result with two ::, which is a typo; the correct form is 2001:4C::9EA:0:0:1.)", "p. 121"], ["Unspecified ::, loopback ::1", "p. 124–125"], ["Global unicast layout: 48-bit routing prefix, 16-bit subnet ID, 64-bit interface ID; 2000::/3", "p. 126–127"], ["Link-local FE80::/10, not forwarded beyond the link", "p. 126, 139"], ["ULA FC00::/7, replaces deprecated site-local", "p. 127"], ["Anycast: no dedicated prefix, delivered to the nearest device, can't be a source", "p. 128–129"], ["Multicast FF00::/8 replaces broadcast; FF02::2 all routers", "p. 129–131"], ["ICMPv6 (next header 58); ND replaces ARP; RS, RA, NS, NA and Redirect", "p. 133–136"], ["DNS AAAA records from the same DNS servers", "p. 136–137"], ["Only the source host fragments; minimum link MTU 1,280; path MTU discovery", "p. 137–138"], ["Static addresses for infrastructure; SLAAC from the RA prefix; EUI-64 with FFFE inserted and the seventh bit flipped", "p. 138–140"], ["Use /64 for LANs; obtain space from an RIR to avoid renumbering when changing ISPs", "p. 145"], ["IPv6 summarization example (…8180::/60 covering 16 /64s)", "p. 146"], ["ULAs should be rare; NAT is not recommended for IPv6", "p. 146–147"], ["ISPs get /32, companies /40 to /56 (normally /48), homes /64; a /48 = 65,536 /64s", "p. 147"], ["Partly linked (third octet = subnet = VLAN) and whole-address-linked schemes, and why the second is hard to read", "p. 147–148"], ["Location and type bits in the subnet ID", "p. 149"]], "course": ["PI allocation defaults to a /48 (the book gives /48 as the normal company allocation)", "Using the last octet of a static IPv4 address as the IPv6 host part", "12-bit VLAN ID leaves 4 bits for location/type", "Stateless DHCPv6 and /127 point-to-point links (standard practice, not detailed in this chapter)"]}, "Designing Enterprise-Managed VPNs": {"mins": 18, "intro": "Enterprise-managed VPNs run over transport you buy, often the internet, while you run the tunnels, routing and encryption yourself. This lesson builds up from the pieces (GRE and IPsec) to the designs (DMVPN, GETVPN, FlexVPN) and when to use each.", "parts": [{"h": "Kinds of VPN", "b": [{"p": "VPNs fall into two main categories:"}, {"ul": ["Site-to-site: joins whole networks, such as a branch to headquarters, or a business partner (an extranet VPN, landing in a firewalled DMZ). DMVPN and GETVPN are site-to-site solutions.", "Remote access: connects individual users. SSL VPN with the AnyConnect client in full tunnel mode gives network-layer access to virtually any application; clientless mode only works through a browser."]}, {"p": "Benefits are flexibility, low cost and reach (anywhere there's internet). The catch over the internet is best-effort delivery and no visibility into the provider. If you need QoS and an SLA, run your enterprise VPN over a service provider's VPN (such as MPLS) rather than the internet."}, {"check": [0, 17, 25, 22]}]}, {"h": "GRE: the tunnel", "b": [{"p": "GRE (Generic Routing Encapsulation) wraps one packet inside another so it can cross an IP network as a tunnel. It adds a 4-byte GRE header and a new 20-byte IP header, 24 bytes in all."}, {"ul": ["It carries multicast, so routing protocols like EIGRP and OSPF run across it. It can carry non-IP protocols too.", "It doesn't encrypt anything.", "Avoid routing the tunnel's own destination through the tunnel. That creates a recursive loop and the tunnel flaps."]}, {"p": "Classic point-to-point GRE has one fixed destination per tunnel, so a hub with 100 spokes needs 100 tunnel interfaces. That doesn't scale. Multipoint GRE (mGRE) fixes it: one tunnel interface with no fixed destination serves many peers."}, {"check": [2, 23, 3, 4]}]}, {"h": "IPsec: the security", "b": [{"p": "IPsec is a suite of open standards (RFC 4301) that protects IP packets with four services: confidentiality (encryption), integrity (hashing), authentication of the peer, and anti-replay (sequence numbers)."}, {"ul": ["ESP (Encapsulating Security Payload) encrypts and authenticates. It's the one normally used.", "AH (Authentication Header) authenticates only, with no encryption.", "Tunnel mode encrypts the whole original packet inside a new outer IP packet. Transport mode encrypts only the payload and keeps the original header."]}, {"p": "Before encrypting, the two peers agree on keys and settings with IKE (Internet Key Exchange):"}, {"tbl": [["", "IKEv1", "IKEv2"], ["Phase 1", "Main Mode (6 messages) or Aggressive Mode (3) builds a secure management channel", "IKE_SA_INIT and IKE_AUTH: four messages build the IKE SA and the first IPsec SA together"], ["Phase 2", "Quick Mode negotiates the IPsec SAs that protect user data", "CREATE_CHILD_SA for further SAs"]]}, {"p": "Plain IPsec on its own carries only unicast, so it can't run a routing protocol. With direct encapsulation, you need static routes."}, {"check": [6, 7, 8, 9]}]}, {"h": "Putting them together", "b": [{"p": "GRE carries routing protocols but isn't secure; IPsec is secure but carries only unicast. So the classic answer is GRE over IPsec: GRE builds the tunnel, and IPsec encrypts the GRE packets."}, {"dia": "<svg viewBox=\"0 0 360 150\" role=\"img\" aria-label=\"GRE over IPsec packet: new IP header and ESP around a GRE header, GRE IP header and the original packet\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"8\" y=\"14\" text-anchor=\"start\">GRE OVER IPSEC (TUNNEL MODE)<\/text><rect class=\"d-box\" x=\"6\" y=\"26\" width=\"58\" height=\"34\" rx=\"3\"/><text class=\"d-s\" x=\"35.0\" y=\"40\" text-anchor=\"middle\">New IP<\/text><text class=\"d-s\" x=\"35.0\" y=\"54\" text-anchor=\"middle\">20 B<\/text><rect class=\"d-box\" x=\"66\" y=\"26\" width=\"50\" height=\"34\" rx=\"3\"/><text class=\"d-s\" x=\"91.0\" y=\"40\" text-anchor=\"middle\">ESP<\/text><text class=\"d-s\" x=\"91.0\" y=\"54\" text-anchor=\"middle\">header<\/text><rect class=\"d-box\" x=\"118\" y=\"26\" width=\"58\" height=\"34\" rx=\"3\"/><text class=\"d-s\" x=\"147.0\" y=\"40\" text-anchor=\"middle\">GRE IP<\/text><text class=\"d-s\" x=\"147.0\" y=\"54\" text-anchor=\"middle\">20 B<\/text><rect class=\"d-box\" x=\"178\" y=\"26\" width=\"44\" height=\"34\" rx=\"3\"/><text class=\"d-s\" x=\"200.0\" y=\"40\" text-anchor=\"middle\">GRE<\/text><text class=\"d-s\" x=\"200.0\" y=\"54\" text-anchor=\"middle\">4 B<\/text><rect class=\"d-box d-boxa\" x=\"224\" y=\"26\" width=\"80\" height=\"34\" rx=\"3\"/><text class=\"d-s\" x=\"264.0\" y=\"40\" text-anchor=\"middle\">Original IP<\/text><text class=\"d-s\" x=\"264.0\" y=\"54\" text-anchor=\"middle\">packet<\/text><rect class=\"d-box\" x=\"306\" y=\"26\" width=\"44\" height=\"34\" rx=\"3\"/><text class=\"d-s\" x=\"328.0\" y=\"40\" text-anchor=\"middle\">ESP<\/text><text class=\"d-s\" x=\"328.0\" y=\"54\" text-anchor=\"middle\">trailer<\/text><path class=\"d-ln\" d=\"M66 66 v6 h284 v-6\"/><text class=\"d-s\" x=\"208\" y=\"86\" text-anchor=\"middle\">encrypted by IPsec<\/text><path class=\"d-ln d-dash\" d=\"M118 104 v-6 h104 v6\"/><text class=\"d-s\" x=\"170\" y=\"120\" text-anchor=\"middle\">GRE adds 24 bytes<\/text><text class=\"d-s\" x=\"180\" y=\"142\" text-anchor=\"middle\">All the extra headers are why the tunnel MTU is lowered, often to 1400<\/text><\/svg>"}, {"p": "You can apply IPsec to GRE two ways: a crypto map on the physical interface (the older method) or tunnel protection on the tunnel interface (preferred). Either way, the headers add up, so lower the tunnel MTU (commonly 1,400) and adjust the TCP MSS to avoid fragmentation."}, {"p": "A VTI (virtual tunnel interface) is the modern alternative: an IPsec tunnel that's a real routable interface, with no GRE. A static VTI connects two fixed peers. Routing protocols usually work over it, but full multicast support depends on the platform. A dynamic VTI (DVTI) hub clones a new virtual-access interface from a virtual template for each spoke that connects, so you don't configure a tunnel per spoke."}, {"p": "FlexVPN is Cisco's IKEv2-based framework that uses VTIs for both site-to-site and remote access. It supports IP multicast, failover redundancy, per-tunnel QoS and VRF awareness. An IPsec profile ties the transform set and IKEv2 profile to the tunnel interface (tunnel protection ipsec profile)."}, {"check": [10, 18, 11, 12, 13, 16, 27]}]}, {"h": "DMVPN", "b": [{"p": "DMVPN (Dynamic Multipoint VPN) is mGRE plus NHRP plus IPsec. The hub has one mGRE interface and one IPsec profile for every spoke; spokes can have dynamic addresses and sit behind NAT; and spokes can build direct tunnels to each other on demand."}, {"p": "NHRP (Next Hop Resolution Protocol) is the glue. It works like ARP for the tunnel, mapping each tunnel IP address to the spoke's real public (NBMA, underlay) address. Spokes register their mapping with the hub, the NHRP server (NHS), and look up other spokes when they need them."}, {"dia": "<svg viewBox=\"0 0 360 234\" role=\"img\" aria-label=\"DMVPN: spokes register with a hub on one mGRE interface; phases 2 and 3 add direct spoke-to-spoke tunnels\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><line class=\"d-ln\" x1=\"180\" y1=\"40\" x2=\"60\" y2=\"140\"/><line class=\"d-ln\" x1=\"180\" y1=\"40\" x2=\"180\" y2=\"140\"/><line class=\"d-ln\" x1=\"180\" y1=\"40\" x2=\"300\" y2=\"140\"/><path class=\"d-ln d-red d-dash\" d=\"M70 142 Q180 230 290 142\"/><circle class=\"d-rt\" cx=\"180\" cy=\"40\" r=\"10\"/><path class=\"d-x\" d=\"M175 37h10M175 43h10\"/><text class=\"d-t\" x=\"180\" y=\"20\" text-anchor=\"middle\">Hub (NHRP server)<\/text><text class=\"d-s\" x=\"200\" y=\"44\">one mGRE interface<\/text><circle class=\"d-rt\" cx=\"60\" cy=\"140\" r=\"10\"/><path class=\"d-x\" d=\"M55 137h10M55 143h10\"/><text class=\"d-t\" x=\"60\" y=\"166\" text-anchor=\"middle\">Spoke 1<\/text><circle class=\"d-rt\" cx=\"180\" cy=\"140\" r=\"10\"/><path class=\"d-x\" d=\"M175 137h10M175 143h10\"/><text class=\"d-t\" x=\"180\" y=\"166\" text-anchor=\"middle\">Spoke 2<\/text><circle class=\"d-rt\" cx=\"300\" cy=\"140\" r=\"10\"/><path class=\"d-x\" d=\"M295 137h10M295 143h10\"/><text class=\"d-t\" x=\"300\" y=\"166\" text-anchor=\"middle\">Spoke 3<\/text><text class=\"d-s\" x=\"112\" y=\"88\" text-anchor=\"end\">registers with hub<\/text><text class=\"d-s\" x=\"180\" y=\"204\" text-anchor=\"middle\">Phase 2/3: on-demand spoke-to-spoke tunnel<\/text><text class=\"d-s\" x=\"180\" y=\"226\" text-anchor=\"middle\">Phase 1: everything goes through the hub<\/text><\/svg>"}, {"tbl": [["Phase", "Topology", "Routing notes (EIGRP)"], ["1", "Hub and spoke only. The hub uses mGRE; spokes may use point-to-point GRE. Spoke-to-spoke traffic goes through the hub.", "Disable split horizon on the hub (no ip split-horizon eigrp), or just send spokes a summary or default"], ["2", "Spokes use mGRE and build direct spoke-to-spoke tunnels", "Disable split horizon, and the hub must preserve the original next hop (no next-hop-self); no summarization"], ["3", "Spoke-to-spoke via NHRP redirect and shortcut", "The hub can change the next hop and summarize; it doesn't need to preserve next-hop information"]]}, {"p": "Why split horizon matters: the hub learns Spoke 3's routes on its single mGRE interface. Split horizon forbids advertising a route back out the interface it came in on, so without disabling it, Spoke 2 never learns Spoke 3's networks."}, {"check": [24, 5, 21, 1, 20, 26]}]}, {"h": "GETVPN", "b": [{"p": "GETVPN (Group Encrypted Transport VPN) is tunnel-less. Instead of building tunnels between pairs of routers, every group member shares the same keys, handed out by a key server using GDOI. Each router encrypts the payload but keeps the original IP header."}, {"ul": ["Because the original addresses are preserved, routing, multicast and QoS in the provider core work natively, and any-to-any traffic needs no tunnel setup.", "The catch: the network in between must be able to route those original (usually private) addresses. That's fine on a private MPLS WAN, but it doesn't work across the internet, and NAT breaks it.", "Deployment choices: group members authenticate with pre-shared keys or PKI certificates, and you can run one key server or several for redundancy."]}, {"check": [14, 15, 19]}]}, {"h": "Key takeaways", "b": [{"ul": ["Two VPN categories: site-to-site (DMVPN, GETVPN) and remote access (AnyConnect full tunnel mode). Need QoS and SLA? Run over a provider VPN.", "GRE: 24 bytes (4 GRE + 20 IP), carries multicast and IGPs, no encryption; avoid recursive routing. Point-to-point GRE needs one tunnel per spoke; mGRE needs one interface.", "IPsec: confidentiality, integrity, authentication, anti-replay. ESP tunnel mode wraps the whole packet. IKEv1 Phase 2 Quick Mode builds the IPsec SAs; IKEv2 uses IKE_SA_INIT and IKE_AUTH.", "GRE over IPsec: crypto map or (preferred) tunnel protection; lower the MTU. DVTI clones virtual-access interfaces; FlexVPN is IKEv2 with VTIs.", "DMVPN = mGRE + NHRP + IPsec. NHRP maps tunnel to NBMA addresses. Phase 1 hub-and-spoke; Phase 2 needs split horizon and next-hop-self off; Phase 3 uses redirects, so the hub can summarize.", "GETVPN keeps original headers; needs a private routed WAN; PSK or PKI; one or more key servers."]}, {"tip": "Common traps: IPsec alone doesn't carry routing protocols. Phase 3, not Phase 2, frees the hub from preserving next hops. GETVPN doesn't work over the internet."}]}], "verified": [["Site-to-site VPN benefits (flexibility, cost, scalability); intranet and extranet VPNs; best-effort over the internet", "p. 486–487"], ["IPsec RFC 4301; confidentiality, integrity and authenticity; ISAKMP, ESP and AH", "p. 488"], ["IKEv1 Main Mode six messages, Aggressive three; IKEv2 four messages", "p. 488"], ["IPsec direct encapsulation doesn't support routing protocols or multicast", "p. 489"], ["DMVPN relies on NHRP and mGRE; one mGRE interface and IPsec profile on the hub; dynamic spoke addresses, NAT, spoke-to-spoke tunnels", "p. 490–491"], ["GRE carries many protocols but lacks security; GRE over IPsec supports IGPs, multicast and QoS", "p. 496"], ["GETVPN: GDOI key servers, group members, preserves original IP header, unsuitable for the internet because of NAT", "p. 497"]], "course": ["Remote-access SSL VPN modes (AnyConnect full tunnel versus clientless)", "GRE header sizes and recursive routing", "IKEv1 Quick Mode and IKEv2 exchange names; ESP tunnel versus transport mode", "Crypto map versus tunnel protection; MTU 1400", "Static and dynamic VTIs; FlexVPN capabilities and IPsec profiles", "DMVPN phases and EIGRP split horizon / next-hop settings", "GETVPN deployment choices (PSK or PKI, one or more key servers)"]}, "BGP Attributes, Communities and Path Selection": {"mins": 15, "intro": "BGP doesn't pick routes by speed. It compares attributes attached to each route, in a fixed order. This lesson covers the attributes you need, the order Cisco checks them, how to push traffic in and out of your network with them, communities, and BGP for IPv6.", "parts": [{"h": "Attributes are BGP's metrics", "b": [{"p": "Every BGP route carries a set of path attributes: labels such as the next hop, the AS path and the local preference. They do two jobs. They describe the route, and they carry policy, letting you nudge which path wins. Attributes come in four types, based on whether every router must understand them and whether they're passed on:"}, {"tbl": [["Category", "Meaning", "Examples"], ["Well-known mandatory", "Every BGP router understands it, and every update includes it", "AS path, next hop, origin"], ["Well-known discretionary", "Every router understands it, but it may be left out", "Local preference, atomic aggregate"], ["Optional transitive", "Not every router has to support it, but it must be passed on anyway", "Community, aggregator"], ["Optional non-transitive", "Not every router has to support it, and it needn't be passed on", "MED"]]}, {"p": "Weight isn't in the table because it's not a real BGP attribute. It's a Cisco setting that lives on one router and is never sent anywhere."}]}, {"h": "The attributes you'll use", "b": [{"tbl": [["Attribute", "Scope", "Default", "Better is"], ["Weight (Cisco only)", "One router only", "0 learned, 32,768 local", "Higher"], ["Local preference", "Shared with iBGP peers inside the AS", "100", "Higher"], ["AS path", "Grows as it crosses ASes", "—", "Shorter"], ["Origin", "Set where the route enters BGP", "—", "IGP (i) < EGP (e) < incomplete (?)"], ["MED", "Sent to one neighbouring AS, not passed further", "0", "Lower"]]}, {"ul": ["Weight: a quick, purely local way to make one router prefer a path. Weights run from 0 to 65,535.", "Local preference: the whole AS agrees on which exit to use. You set it on the edge router, and it's shared with iBGP peers but never sent to eBGP peers.", "AS path: the list of ASes the route has crossed. Each AS adds (prepends) its own number. It also prevents loops.", "Origin: how the route got into BGP. i means a network statement, e means the old EGP protocol, and ? means redistribution.", "MED (multi-exit discriminator): a hint to a neighbour AS about which of your entry points to use. It's carried into the neighbour's AS but no further."]}, {"tip": "Memory hook: weight and local preference prefer high, like a priority. AS path and MED prefer low, like a cost."}, {"check": [4, 5, 6, 7, 10]}]}, {"h": "How BGP picks the best path", "b": [{"p": "BGP only installs one best path per prefix by default. Cisco checks these in order, and stops at the first one that breaks the tie:"}, {"tbl": [["#", "Prefer", "Mnemonic"], ["0", "Drop it if the next hop isn't reachable", "—"], ["1", "Highest weight", "We"], ["2", "Highest local preference", "Love"], ["3", "Locally originated (network, aggregate, redistribute)", "Oranges"], ["4", "Shortest AS path", "AS"], ["5", "Lowest origin (IGP < EGP < incomplete)", "Oranges"], ["6", "Lowest MED", "Mean"], ["7", "eBGP over iBGP", "Pure"], ["8", "Lowest IGP metric to the next hop", "Refreshment"], ["9+", "Oldest path, lowest router ID, shortest cluster list, lowest neighbour IP", "—"]]}, {"p": "Weight is checked first, so whatever it says wins outright on that router. Only if every check ties does BGP fall back to tie-breakers like router ID."}, {"check": [1, 3]}]}, {"h": "Steering traffic out and in", "b": [{"p": "Outbound and inbound traffic are separate problems. You control your own exits directly, but you can only make suggestions to other ASes about how to come in."}, {"p": "Outbound, set a higher local preference on the routes learned at the edge router you want to use. All iBGP routers learn it and exit there:"}, {"dia": "<svg viewBox=\"0 0 360 204\" role=\"img\" aria-label=\"Local preference steering outbound traffic out through router C\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"8\" y=\"14\" text-anchor=\"start\">OUTBOUND: LOCAL PREFERENCE<\/text><rect class=\"d-box\" x=\"8\" y=\"26\" width=\"176\" height=\"152\" rx=\"3\"/><text class=\"d-s\" x=\"14\" y=\"38\" text-anchor=\"start\">Your AS 100<\/text><rect class=\"d-box\" x=\"236\" y=\"26\" width=\"116\" height=\"152\" rx=\"3\"/><text class=\"d-s\" x=\"242\" y=\"38\" text-anchor=\"start\">ISP AS 200<\/text><line class=\"d-ln\" x1=\"44\" y1=\"102\" x2=\"140\" y2=\"62\"/><line class=\"d-ln\" x1=\"140\" y1=\"62\" x2=\"294\" y2=\"102\"/><line class=\"d-ln d-red\" x1=\"44\" y1=\"102\" x2=\"140\" y2=\"142\"/><line class=\"d-ln d-red\" x1=\"140\" y1=\"142\" x2=\"294\" y2=\"102\"/><circle class=\"d-rt\" cx=\"44\" cy=\"102\" r=\"10\"/><path class=\"d-x\" d=\"M39 99h10M39 105h10\"/><text class=\"d-t\" x=\"44\" y=\"124\" text-anchor=\"middle\">A<\/text><circle class=\"d-rt\" cx=\"140\" cy=\"62\" r=\"10\"/><path class=\"d-x\" d=\"M135 59h10M135 65h10\"/><text class=\"d-t\" x=\"125\" y=\"66\" text-anchor=\"end\">B<\/text><circle class=\"d-rt\" cx=\"140\" cy=\"142\" r=\"10\"/><path class=\"d-x\" d=\"M135 139h10M135 145h10\"/><text class=\"d-t\" x=\"125\" y=\"146\" text-anchor=\"end\">C<\/text><circle class=\"d-rt\" cx=\"294\" cy=\"102\" r=\"10\"/><path class=\"d-x\" d=\"M289 99h10M289 105h10\"/><text class=\"d-t\" x=\"294\" y=\"124\" text-anchor=\"middle\">D<\/text><text class=\"d-s\" x=\"140\" y=\"46\" text-anchor=\"middle\">LP 300<\/text><text class=\"d-s\" x=\"140\" y=\"166\" text-anchor=\"middle\">LP 400<\/text><text class=\"d-s\" x=\"180\" y=\"196\" text-anchor=\"middle\">Every router in AS 100 exits via C: higher local preference wins<\/text><\/svg>"}, {"p": "Inbound, you have several ways to make one entrance look better or worse to the outside world:"}, {"ul": ["MED: tell a neighbour AS which link to use when you have two connections to it. Lower wins.", "AS-path prepending: add your own AS number several times to routes sent out of the link you don't want used. The path looks longer, so it's less attractive. Unlike MED, this works across different ISPs.", "Advertise more specific prefixes: send a /23 out of each link plus the /22 on both. The longest match wins, so each half comes in its own way, with the /22 as backup.", "Communities: tag routes so the ISP applies a local preference you've asked for inside its network."]}, {"dia": "<svg viewBox=\"0 0 360 204\" role=\"img\" aria-label=\"MED steering inbound traffic from AS 200 in through router B\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"8\" y=\"14\" text-anchor=\"start\">INBOUND: MED<\/text><rect class=\"d-box\" x=\"8\" y=\"26\" width=\"176\" height=\"152\" rx=\"3\"/><text class=\"d-s\" x=\"14\" y=\"38\" text-anchor=\"start\">Your AS 100<\/text><rect class=\"d-box\" x=\"236\" y=\"26\" width=\"116\" height=\"152\" rx=\"3\"/><text class=\"d-s\" x=\"242\" y=\"38\" text-anchor=\"start\">ISP AS 200<\/text><line class=\"d-ln\" x1=\"44\" y1=\"102\" x2=\"140\" y2=\"62\"/><line class=\"d-ln\" x1=\"44\" y1=\"102\" x2=\"140\" y2=\"142\"/><line class=\"d-ln\" x1=\"140\" y1=\"142\" x2=\"294\" y2=\"102\"/><line class=\"d-ln d-red\" x1=\"140\" y1=\"62\" x2=\"294\" y2=\"102\"/><circle class=\"d-rt\" cx=\"44\" cy=\"102\" r=\"10\"/><path class=\"d-x\" d=\"M39 99h10M39 105h10\"/><text class=\"d-t\" x=\"44\" y=\"124\" text-anchor=\"middle\">A<\/text><circle class=\"d-rt\" cx=\"140\" cy=\"62\" r=\"10\"/><path class=\"d-x\" d=\"M135 59h10M135 65h10\"/><text class=\"d-t\" x=\"125\" y=\"66\" text-anchor=\"end\">B<\/text><circle class=\"d-rt\" cx=\"140\" cy=\"142\" r=\"10\"/><path class=\"d-x\" d=\"M135 139h10M135 145h10\"/><text class=\"d-t\" x=\"125\" y=\"146\" text-anchor=\"end\">C<\/text><circle class=\"d-rt\" cx=\"294\" cy=\"102\" r=\"10\"/><path class=\"d-x\" d=\"M289 99h10M289 105h10\"/><text class=\"d-t\" x=\"294\" y=\"124\" text-anchor=\"middle\">D<\/text><text class=\"d-s\" x=\"140\" y=\"46\" text-anchor=\"middle\">MED 50<\/text><text class=\"d-s\" x=\"140\" y=\"166\" text-anchor=\"middle\">MED 200<\/text><text class=\"d-s\" x=\"180\" y=\"196\" text-anchor=\"middle\">AS 200 enters via B: B and C send MED to D, and lower MED wins<\/text><\/svg>"}, {"tip": "Weight, local preference and AS-path filtering steer outbound traffic. AS-path prepending, MED and communities steer inbound traffic."}, {"check": [8, 9]}]}, {"h": "Communities", "b": [{"p": "A community is a tag you stick on routes so you (or your ISP) can treat a whole group the same way. It doesn't affect path selection by itself; a route map on the receiving router matches the tag and then acts, for example setting local preference or filtering."}, {"ul": ["It's an optional transitive attribute, so it's passed along even by routers that don't use it.", "It's 32 bits, written AS:value. The high 16 bits are the AS number and the low 16 bits are a value meaning whatever that AS has defined.", "You add communities with a route map, and match them on the far side with a community list."]}, {"p": "Three well-known communities have fixed meanings:"}, {"tbl": [["Community", "Don't advertise the route to…"], ["no-export", "Any eBGP peer outside the AS (or the confederation). iBGP peers still get it."], ["no-advertise", "Any peer at all, including iBGP peers."], ["local-as (no-export-subconfed)", "Anything outside the local sub-AS in a confederation."]]}, {"check": [11, 2, 15, 16]}]}, {"h": "BGP for IPv6", "b": [{"p": "Multiprotocol BGP (MP-BGP, sometimes called BGP4+) lets one BGP process carry routes for several kinds of address. Each kind is an address family: IPv4 unicast, IPv6 unicast, VPNv4 for MPLS VPNs, and so on. IPv6 routes travel in the MP_REACH_NLRI attribute in the IPv6 unicast address family."}, {"ul": ["By default, Cisco activates IPv4 unicast for every neighbour you configure. The command no bgp default ipv4-unicast turns that off so you activate each neighbour only in the address families you want, which is cleaner for IPv6 or VPN designs.", "The BGP router ID is always a 32-bit value written like an IPv4 address, even on an IPv6-only router. With no IPv4 addresses, you set it by hand.", "The preferred IPv4-to-IPv6 migration is still dual stack (covered in the IPv6 lessons)."]}, {"check": [0, 13, 14, 12]}]}, {"h": "Key takeaways", "b": [{"ul": ["Attribute types: well-known mandatory (AS path, next hop, origin), well-known discretionary (local preference), optional transitive (community) and optional non-transitive (MED).", "Weight: Cisco-only, one router, higher wins, default 0 (32,768 local). Local preference: whole AS, higher wins, default 100. MED: to a neighbour AS, lower wins, default 0.", "Decision order: weight, local preference, locally originated, AS path, origin, MED, eBGP over iBGP, IGP metric, then tie-breakers (\"We Love Oranges AS Oranges Mean Pure Refreshment\").", "Outbound: weight and local preference. Inbound: AS-path prepending, MED, more specific prefixes and communities.", "Communities are 32-bit AS:value tags applied with route maps. no-export stays in the AS; no-advertise goes nowhere.", "MP-BGP carries IPv6 in the IPv6 unicast address family. no bgp default ipv4-unicast stops automatic IPv4 activation. The router ID is still 32-bit dotted decimal."]}, {"tip": "Common traps: weight is checked before local preference, and isn't shared. Local preference is never sent to eBGP peers. MED isn't passed beyond the receiving AS. no-export still allows iBGP peers."}]}], "verified": [["Attributes and categories: well-known mandatory or discretionary, optional transitive or non-transitive", "p. 289–290, 295"], ["Next hop well-known mandatory; local preference well-known discretionary, iBGP only, default 100, higher wins", "p. 290"], ["Origin well-known mandatory: IGP (i), EGP (e), incomplete (?)", "p. 291"], ["AS path well-known mandatory; each AS prepends; loop prevention; fewest AS hops preferred", "p. 291–292"], ["MED optional non-transitive; lowest preferred; default 0; influences inbound; not passed beyond the receiving AS", "p. 292–293"], ["Community optional transitive; groups routes for policy, not used in the decision itself", "p. 293"], ["Weight Cisco-specific, local, 0 to 65,535, higher wins, 32,768 local and 0 learned", "p. 294"], ["Cisco decision order: next hop, weight, local preference, locally originated, AS path, origin, MED, eBGP over iBGP, IGP metric, oldest, router ID, cluster list, neighbour IP", "p. 296–297"], ["Outbound levers: weight, local preference, AS path; inbound levers: AS path, communities, MED, more-specific prefixes", "p. 298–299"], ["Multipath with maximum-paths", "p. 300"], ["MP-BGP (BGP4+) carries IPv6 with MP_REACH_NLRI and address family identifiers", "p. 144, 284"]], "course": ["Well-known communities no-export, no-advertise and local-as; AS:value format", "Community lists matched in route maps", "no bgp default ipv4-unicast; 32-bit router ID on IPv6-only routers", "The \"We Love Oranges\" mnemonic"]}, "EIGRP Design": {"mins": 16, "intro": "EIGRP is Cisco's advanced distance-vector protocol. It converges fast because it keeps backup routes ready, but in a large network one missing route can set off a flood of queries. This lesson is about how DUAL works and how to design so queries stay contained.", "parts": [{"h": "What EIGRP is", "b": [{"p": "EIGRP (Enhanced Interior Gateway Routing Protocol) is often called an advanced distance-vector or hybrid protocol. Like distance vector, routers only know what their neighbours tell them, not the whole map. But like link-state, it forms neighbour relationships, sends updates only when something changes, and converges fast."}, {"ul": ["Runs over IP protocol 88 and multicasts to 224.0.0.10 (FF02::A for IPv6).", "Cisco-developed. It's simple to design for and works almost anywhere, from campus to WAN and VPNs.", "No areas and no required topology. Any hierarchy you want, you have to build yourself.", "Administrative distance: 90 internal, 170 external, 5 for a local summary route.", "Hellos every 5 seconds on fast links (hold time 15), and every 60 seconds on slow multipoint WAN links of T1 speed or less (hold time 180).", "Five packet types: hello, acknowledgement, update, query and reply."]}, {"p": "The metric is a composite. By default it uses only the slowest bandwidth along the path and the total delay (K1 = K3 = 1, the other K values 0). Load and reliability can be added, but rarely are."}]}, {"h": "DUAL, successors and feasible successors", "b": [{"p": "EIGRP's engine is DUAL (the Diffusing Update Algorithm). Its job is to pick the best path and, if possible, a guaranteed loop-free backup, before anything fails. A few terms:"}, {"tbl": [["Term", "Meaning"], ["Reported distance (RD)", "A neighbour's own metric to the destination: what it tells you"], ["Feasible distance (FD)", "Your best total metric to the destination"], ["Successor", "The neighbour on your best path"], ["Feasible successor (FS)", "A backup neighbour that passes the feasibility condition"], ["Feasibility condition", "The neighbour's RD must be less than your current FD"]]}, {"p": "Why does that rule work? If a neighbour's own distance is shorter than yours, its path can't possibly loop back through you. So a feasible successor is provably loop-free and can be used the instant the successor fails, with no questions asked."}, {"dia": "<svg viewBox=\"0 0 360 200\" role=\"img\" aria-label=\"EIGRP feasibility condition: successor via B with FD 900, feasible successor via C with reported distance 850\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><circle class=\"d-rt\" cx=\"40\" cy=\"80\" r=\"10\"/><path class=\"d-x\" d=\"M35 77h10M35 83h10\"/><text class=\"d-t\" x=\"40\" y=\"102\" text-anchor=\"middle\">You<\/text><rect class=\"d-cloud\" x=\"285.0\" y=\"67\" width=\"70\" height=\"26\" rx=\"13\"/><text class=\"d-t\" x=\"320\" y=\"84\" text-anchor=\"middle\">10.9.9.0/24<\/text><line class=\"d-ln\" x1=\"50\" y1=\"80\" x2=\"140\" y2=\"40\"/><line class=\"d-ln\" x1=\"50\" y1=\"80\" x2=\"140\" y2=\"120\"/><circle class=\"d-rt\" cx=\"150\" cy=\"40\" r=\"10\"/><path class=\"d-x\" d=\"M145 37h10M145 43h10\"/><text class=\"d-t\" x=\"150\" y=\"25\" text-anchor=\"middle\">B<\/text><circle class=\"d-rt\" cx=\"150\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M145 117h10M145 123h10\"/><text class=\"d-t\" x=\"150\" y=\"142\" text-anchor=\"middle\">C<\/text><line class=\"d-ln\" x1=\"160\" y1=\"40\" x2=\"285\" y2=\"72\"/><line class=\"d-ln\" x1=\"160\" y1=\"120\" x2=\"285\" y2=\"88\"/><text class=\"d-s\" x=\"228\" y=\"44\" text-anchor=\"middle\">B reports 800<\/text><text class=\"d-s\" x=\"228\" y=\"124\" text-anchor=\"middle\">C reports 850<\/text><text class=\"d-s\" x=\"80\" y=\"50\" text-anchor=\"end\">+100<\/text><text class=\"d-s\" x=\"80\" y=\"118\" text-anchor=\"end\">+350<\/text><text class=\"d-t\" x=\"16\" y=\"160\">Via B: 800 + 100 = 900  → successor, so FD = 900<\/text><text class=\"d-t\" x=\"16\" y=\"176\">Via C: 850 + 350 = 1200 → C reports 850, less than 900<\/text><text class=\"d-t d-redt\" x=\"16\" y=\"192\">So C is a feasible successor: a ready, loop-free backup<\/text><\/svg>"}, {"p": "Notice the backup's total metric (1200) is worse than the best path's. That doesn't matter. Only the neighbour's reported distance is compared with your FD."}, {"check": [12, 20]}]}, {"h": "Queries, and why they cause trouble", "b": [{"p": "When the successor fails:"}, {"ul": ["With a feasible successor, the router switches over immediately. The route stays passive, and no queries are sent.", "Without one, the route goes active. The router sends a query to every neighbour asking for another path. Any neighbour without an answer queries its own neighbours, and so on."]}, {"p": "The router can't finish until every query it sent has been answered. In a big flat network, queries can spread everywhere, and if replies don't come back in time (about 3 minutes by default) the route is declared stuck in active (SIA) and neighbours get reset. Query scope is the central EIGRP design problem."}, {"p": "There are three ways to stop queries:"}, {"ul": ["Have feasible successors. A router with a backup never goes active. Equal-cost paths are an easy way to guarantee one.", "Summarize. A router that only knows a summary, not the specific route, replies \"I don't have it\" straight away instead of passing the query on.", "Use stubs. Stub routers are never queried."]}, {"check": [13, 7, 0]}]}, {"h": "Hierarchy, choke points and the three layers", "b": [{"p": "EIGRP has no areas, so hierarchy only exists if you design it. You do that by dividing the network into zones and summarizing (and applying policy) at the choke points: the places where routes and traffic naturally funnel between zones."}, {"p": "In a classic three-layer design:"}, {"tbl": [["Layer", "EIGRP role"], ["Core", "High-speed switching between distribution blocks. Keep it simple."], ["Distribution", "Summarization and aggregation. Each block is advertised to the core as one summary, so a flap inside it doesn't spread."], ["Access", "Where users and security policies attach. Configure these routers as stubs so they're never queried."]]}, {"p": "Splitting a network into several EIGRP autonomous systems doesn't stop queries on its own. Redistribution between the ASes means a query in one AS triggers a fresh query in the other. Summarization at the boundary is what actually contains it. Redistributing between ASes, or between EIGRP and OSPF, also risks routes feeding back into where they came from, so tag routes as you redistribute them and filter on those tags."}, {"check": [5, 2, 8, 3, 11, 16, 1, 17, 21]}]}, {"h": "Hub-and-spoke and stub routers", "b": [{"p": "Hub-and-spoke WANs are where EIGRP scale is won or lost. Three factors matter:"}, {"ul": ["Make the spokes stubs.", "Send the spokes as little as possible, ideally just a default route (0.0.0.0/0) or a summary.", "Test what happens when the primary hub fails, because that's when every spoke reconverges at once."]}, {"dia": "<svg viewBox=\"0 0 360 184\" role=\"img\" aria-label=\"EIGRP queries reach every non-stub spoke; stub spokes are never queried\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"8\" y=\"14\" text-anchor=\"start\">WITHOUT STUBS<\/text><circle class=\"d-rt\" cx=\"87\" cy=\"40\" r=\"10\"/><path class=\"d-x\" d=\"M82 37h10M82 43h10\"/><text class=\"d-t\" x=\"102\" y=\"44\">Hub<\/text><line class=\"d-ln\" x1=\"87\" y1=\"50\" x2=\"24\" y2=\"104\"/><circle class=\"d-rt\" cx=\"24\" cy=\"112\" r=\"10\"/><path class=\"d-x\" d=\"M19 109h10M19 115h10\"/><path class=\"d-ln d-red\" marker-end=\"url(#ar)\" d=\"M64.95 62L42.900000000000006 86\"/><line class=\"d-ln\" x1=\"87\" y1=\"50\" x2=\"66\" y2=\"104\"/><circle class=\"d-rt\" cx=\"66\" cy=\"112\" r=\"10\"/><path class=\"d-x\" d=\"M61 109h10M61 115h10\"/><path class=\"d-ln d-red\" marker-end=\"url(#ar)\" d=\"M79.65 62L72.3 86\"/><line class=\"d-ln\" x1=\"87\" y1=\"50\" x2=\"108\" y2=\"104\"/><circle class=\"d-rt\" cx=\"108\" cy=\"112\" r=\"10\"/><path class=\"d-x\" d=\"M103 109h10M103 115h10\"/><path class=\"d-ln d-red\" marker-end=\"url(#ar)\" d=\"M94.35 62L101.7 86\"/><line class=\"d-ln\" x1=\"87\" y1=\"50\" x2=\"150\" y2=\"104\"/><circle class=\"d-rt\" cx=\"150\" cy=\"112\" r=\"10\"/><path class=\"d-x\" d=\"M145 109h10M145 115h10\"/><path class=\"d-ln d-red\" marker-end=\"url(#ar)\" d=\"M109.05 62L131.1 86\"/><text class=\"d-s\" x=\"87\" y=\"140\" text-anchor=\"middle\">Spokes are not stubs:<\/text><text class=\"d-s\" x=\"87\" y=\"152\" text-anchor=\"middle\">every spoke gets queried<\/text><text class=\"d-h\" x=\"194\" y=\"14\" text-anchor=\"start\">WITH STUBS<\/text><circle class=\"d-rt\" cx=\"273\" cy=\"40\" r=\"10\"/><path class=\"d-x\" d=\"M268 37h10M268 43h10\"/><text class=\"d-t\" x=\"288\" y=\"44\">Hub<\/text><line class=\"d-ln\" x1=\"273\" y1=\"50\" x2=\"210\" y2=\"104\"/><circle class=\"d-rt\" cx=\"210\" cy=\"112\" r=\"10\"/><path class=\"d-x\" d=\"M205 109h10M205 115h10\"/><line class=\"d-ln\" x1=\"273\" y1=\"50\" x2=\"252\" y2=\"104\"/><circle class=\"d-rt\" cx=\"252\" cy=\"112\" r=\"10\"/><path class=\"d-x\" d=\"M247 109h10M247 115h10\"/><line class=\"d-ln\" x1=\"273\" y1=\"50\" x2=\"294\" y2=\"104\"/><circle class=\"d-rt\" cx=\"294\" cy=\"112\" r=\"10\"/><path class=\"d-x\" d=\"M289 109h10M289 115h10\"/><line class=\"d-ln\" x1=\"273\" y1=\"50\" x2=\"336\" y2=\"104\"/><circle class=\"d-rt\" cx=\"336\" cy=\"112\" r=\"10\"/><path class=\"d-x\" d=\"M331 109h10M331 115h10\"/><text class=\"d-s\" x=\"273\" y=\"140\" text-anchor=\"middle\">Spokes are stubs:<\/text><text class=\"d-s\" x=\"273\" y=\"152\" text-anchor=\"middle\">hub never queries them<\/text><text class=\"d-s\" x=\"180\" y=\"176\" text-anchor=\"middle\">Red arrows: queries sent when the hub loses a route with no backup<\/text><\/svg>"}, {"p": "A stub router tells its neighbours \"don't route through me\", so the hub never sends it queries. A stub only advertises what you allow:"}, {"tbl": [["Stub option", "Advertises"], ["receive-only", "Nothing"], ["connected", "Directly connected networks"], ["static", "Static routes"], ["summary", "Summary routes (connected and summary is the default)"], ["redistributed", "Redistributed routes"]]}, {"p": "The one cost: a stub can't be a transit path, so it can't serve as a backup path between two hubs."}, {"check": [9, 14, 15]}]}, {"h": "The dual-hub black hole", "b": [{"p": "Summarizing is good, but there's a classic trap when a branch area has two hubs that both advertise the same summary. A summary installs a route to Null0, a discard route, on the router that creates it."}, {"dia": "<svg viewBox=\"0 0 360 222\" role=\"img\" aria-label=\"Dual-homed hub-and-spoke black hole when both hubs summarize to Null0\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-s\" x=\"180\" y=\"14\" text-anchor=\"middle\">Both hubs advertise 192.168.0.0/22 to the core<\/text><circle class=\"d-rt\" cx=\"110\" cy=\"40\" r=\"10\"/><path class=\"d-x\" d=\"M105 37h10M105 43h10\"/><text class=\"d-t\" x=\"95\" y=\"44\" text-anchor=\"end\">Hub A<\/text><circle class=\"d-rt\" cx=\"250\" cy=\"40\" r=\"10\"/><path class=\"d-x\" d=\"M245 37h10M245 43h10\"/><text class=\"d-t\" x=\"265\" y=\"44\">Hub B<\/text><circle class=\"d-rt\" cx=\"60\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M55 117h10M55 123h10\"/><text class=\"d-t\" x=\"60\" y=\"142\" text-anchor=\"middle\">192.168.1.0/24<\/text><circle class=\"d-rt\" cx=\"180\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M175 117h10M175 123h10\"/><text class=\"d-t\" x=\"180\" y=\"142\" text-anchor=\"middle\">192.168.2.0/24<\/text><circle class=\"d-rt\" cx=\"300\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M295 117h10M295 123h10\"/><text class=\"d-t\" x=\"300\" y=\"142\" text-anchor=\"middle\">192.168.3.0/24<\/text><line class=\"d-ln\" x1=\"110\" y1=\"50\" x2=\"60\" y2=\"110\"/><line class=\"d-ln\" x1=\"250\" y1=\"50\" x2=\"60\" y2=\"110\"/><line class=\"d-ln d-red\" x1=\"110\" y1=\"50\" x2=\"180\" y2=\"110\"/><line class=\"d-ln\" x1=\"250\" y1=\"50\" x2=\"180\" y2=\"110\"/><line class=\"d-ln\" x1=\"110\" y1=\"50\" x2=\"300\" y2=\"110\"/><line class=\"d-ln\" x1=\"250\" y1=\"50\" x2=\"300\" y2=\"110\"/><path class=\"d-blkl\" d=\"M140 76l10 10M150 76l-10 10\"/><path class=\"d-ln d-dash\" d=\"M122 40H238\"/><text class=\"d-s\" x=\"180\" y=\"34\" text-anchor=\"middle\">fix: link the hubs<\/text><text class=\"d-t d-redt\" x=\"16\" y=\"166\">Hub A loses its link to 192.168.2.0 but still owns the /22 → Null0.<\/text><text class=\"d-t\" x=\"16\" y=\"182\">Traffic for .2.x that arrives at Hub A is dropped (black-holed).<\/text><text class=\"d-t\" x=\"16\" y=\"198\">Fix: interconnect the hubs and don't summarize between them, so<\/text><text class=\"d-t\" x=\"16\" y=\"214\">Hub A learns the specific /24 from Hub B and forwards to it.<\/text><\/svg>"}, {"p": "Two fixes go together: connect the two hub routers inside EIGRP so each can learn the specific routes from the other, and don't summarize between the hubs themselves. A specific /24 beats the /22 to Null0, so traffic is forwarded instead of dropped."}, {"check": [4]}]}, {"h": "Fast detection and graceful restart", "b": [{"p": "Even 5-second hellos are slow by modern standards. Two features help:"}, {"ul": ["BFD (Bidirectional Forwarding Detection) is a separate, lightweight hello that detects a broken forwarding path in well under a second and tells EIGRP immediately. It works the same way for every media type and routing protocol, and runs over UDP. BFD doesn't route anything; it just reports failures.", "Graceful restart (NSF) helps when a router switches to its standby supervisor. Neighbours keep the adjacency and keep forwarding on the known routes while the restarting router relearns its routing information, so the network doesn't have to reconverge."]}, {"tip": "Course wording says graceful restart \"reduces convergence times\". More precisely, it avoids an unnecessary reconvergence; it doesn't make convergence itself faster."}, {"check": [10, 18, 6, 19]}]}, {"h": "Key takeaways", "b": [{"ul": ["EIGRP is an advanced distance-vector protocol using DUAL. Protocol 88, multicast 224.0.0.10, AD 90/170/5, hellos 5/15 or 60/180.", "A feasible successor's reported distance is less than your feasible distance. It's a guaranteed loop-free backup used instantly.", "No feasible successor means the route goes active and queries spread. Uncontained queries cause stuck-in-active problems.", "Contain queries with feasible successors, summarization at choke points (usually distribution) and stub routers (access or spokes).", "Hierarchy is manual: zones plus summarization. Multiple ASes alone don't stop queries; summarize at the boundary and tag or filter redistribution.", "Hub-and-spoke: stub spokes, a default route to spokes, and test hub failover. Two hubs that both summarize need a link between them.", "BFD gives sub-second detection; graceful restart (NSF) keeps forwarding through a switchover."]}, {"tip": "Common traps: a feasible successor is chosen by reported distance, not total metric. Stubs are configured on the leaves, not the hub. Graceful restart prevents reconvergence; it doesn't speed it up."}]}], "verified": [["DUAL: successor, feasible successor, RD, FD; feasibility condition is RD < FD", "p. 215"], ["Passive vs active; queries go to neighbours and the route stays active until all reply; stuck in active after the active timer (3 minutes)", "p. 216–217"], ["Hello/hold 5/15 s, and 60/180 s on multipoint links of 1.544 Mbps or less", "p. 217–218"], ["Composite metric: bandwidth and delay by default (K1 = K3 = 1)", "p. 218–219"], ["Five packet types: hello, ack, update, query, reply; multicast 224.0.0.10", "p. 220–221"], ["Supports VLSM and summarization; Cisco-developed; suits LAN, WAN and VPN designs", "p. 221–222"], ["Stub routers reduce queries to branches; options receive-only, connected, static, summary, redistributed; a stub can't be a transit backup", "p. 222–224"], ["IP protocol 88; AD 90 internal, 170 external, 5 summary; MD5 authentication", "p. 224–225"], ["EIGRP for IPv6 uses FF02::A and the same DUAL concepts", "p. 225–226"], ["BFD: sub-second, protocol-independent; graceful restart/NSF keeps forwarding through a switchover", "p. 311–312"], ["The book gives EIGRP's maximum diameter as 225 hops on p. 221 and 255 on p. 226; 255 is the correct maximum (default 100)", "p. 221, 226"]], "course": ["Zones and choke points as the way to build EIGRP hierarchy", "Three-layer roles (access stubs, distribution summarizes, core switches)", "Multiple autonomous systems don't stop queries; summarize at the boundary", "The dual-hub Null0 black hole and its fix", "Hub-and-spoke scalability factors (stubs, minimal advertisements, hub failover testing)", "Route tagging and filtering against redistribution feedback"]}, "Designing Rendezvous Point Distribution Solutions": {"mins": 12, "intro": "Every PIM-SM and BIDIR router needs to know which RP serves each group. This lesson covers where to put RPs, the ways routers learn about them (static, Auto-RP, BSR, embedded RP), and how Anycast RP with MSDP adds redundancy and connects domains.", "parts": [{"h": "Where to put the RP", "b": [{"p": "With the default SPT threshold of 0, the RP only carries the first packets before receivers switch to the source tree, so its placement isn't critical."}, {"p": "Set the threshold to infinity and everything changes: routers never leave the shared tree, so all traffic for the group flows through the RP. Then:"}, {"ul": ["Place the RP close to the sources, so traffic doesn't detour.", "Watch its load: the RP can become a congestion point."]}, {"check": [0, 8]}]}, {"h": "How routers learn the RP", "b": [{"tbl": [["Method", "How routers learn the RP"], ["Static RP", "Typed by hand on every router. Simple but doesn't scale."], ["Auto-RP (Cisco)", "Candidate RPs announce themselves to 224.0.1.39. Mapping agents pick an RP per group (highest IP) and send the mappings to 224.0.1.40."], ["BSR (PIMv2, open standard)", "Candidate RPs unicast advertisements to the elected bootstrap router (BSR). The BSR floods the RP set to all PIM routers on 224.0.0.13, and every router runs the same hash on the group address to pick an RP."], ["Embedded RP (IPv6)", "The RP's address is encoded inside the IPv6 group address itself"], ["Anycast RP + MSDP", "Several RPs share one address; MSDP keeps them in sync (see below)"]]}, {"p": "Dynamic discovery (Auto-RP or BSR) scales better and suits complex networks, because nothing has to be typed into each router."}, {"ul": ["Auto-RP: if you run more than one mapping agent, configure them identically. Routers accept mappings from whichever agent they hear, so if the agents disagree, different routers end up with different RPs for the same group.", "BSR: a candidate-RP advertisement carries the group range it can serve, its own address, and a hold time. Every BSR router receives the flooded BSR messages and selects the RP with the hash.", "Embedded RP: the 4-bit RP interface ID (RIID) field gives up to 16 RP addresses within the embedded prefix."]}, {"p": "To verify which RP each group maps to, and how it was learned, use show ip pim rp mapping."}, {"check": [4, 1, 5, 6, 7, 10, 2]}]}, {"h": "Anycast RP and MSDP", "b": [{"p": "A single RP is a single point of failure. Anycast RP fixes it: two or more RPs are configured with the same address. Unicast routing sends every router to the nearest one, and if one fails, routing simply converges to the other."}, {"dia": "<svg viewBox=\"0 0 360 202\" role=\"img\" aria-label=\"Anycast RP: two RPs share one address, routers use the nearest, and MSDP keeps their lists of active sources in sync\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><path class=\"d-ln d-dash\" d=\"M100 56 Q180 20 260 56\"/><text class=\"d-s\" x=\"180\" y=\"26\" text-anchor=\"middle\">MSDP peering (TCP 639)<\/text><line class=\"d-ln\" x1=\"90\" y1=\"70\" x2=\"60\" y2=\"130\"/><line class=\"d-ln\" x1=\"270\" y1=\"70\" x2=\"300\" y2=\"130\"/><line class=\"d-ln\" x1=\"90\" y1=\"70\" x2=\"140\" y2=\"130\"/><line class=\"d-ln\" x1=\"270\" y1=\"70\" x2=\"220\" y2=\"130\"/><circle class=\"d-rt\" cx=\"90\" cy=\"60\" r=\"10\"/><path class=\"d-x\" d=\"M85 57h10M85 63h10\"/><circle class=\"d-rt\" cx=\"270\" cy=\"60\" r=\"10\"/><path class=\"d-x\" d=\"M265 57h10M265 63h10\"/><text class=\"d-t\" x=\"74\" y=\"64\" text-anchor=\"end\">RP A<\/text><text class=\"d-t\" x=\"286\" y=\"64\">RP B<\/text><text class=\"d-s\" x=\"180\" y=\"66\" text-anchor=\"middle\">both use 10.0.0.1<\/text><rect class=\"d-rt\" x=\"34\" y=\"131\" width=\"52\" height=\"18\" rx=\"3\"/><text class=\"d-s\" x=\"60\" y=\"144\" text-anchor=\"middle\">Source<\/text><rect class=\"d-rt\" x=\"114\" y=\"131\" width=\"52\" height=\"18\" rx=\"3\"/><text class=\"d-s\" x=\"140\" y=\"144\" text-anchor=\"middle\">Receiver<\/text><rect class=\"d-rt\" x=\"194\" y=\"131\" width=\"52\" height=\"18\" rx=\"3\"/><text class=\"d-s\" x=\"220\" y=\"144\" text-anchor=\"middle\">Receiver<\/text><rect class=\"d-rt\" x=\"274\" y=\"131\" width=\"52\" height=\"18\" rx=\"3\"/><text class=\"d-s\" x=\"300\" y=\"144\" text-anchor=\"middle\">Source<\/text><text class=\"d-s\" x=\"100\" y=\"168\" text-anchor=\"middle\">nearest RP: A<\/text><text class=\"d-s\" x=\"260\" y=\"168\" text-anchor=\"middle\">nearest RP: B<\/text><text class=\"d-s\" x=\"180\" y=\"194\" text-anchor=\"middle\">Routing sends each router to the closest RP; MSDP shares their active sources<\/text><\/svg>"}, {"p": "There's a catch: a source registers with its nearest RP, and receivers near the other RP wouldn't hear about it. MSDP (Multicast Source Discovery Protocol) solves this. The RPs peer with each other and exchange Source-Active messages listing their active sources."}, {"ul": ["MSDP runs over TCP port 639, a reliable session like BGP's TCP 179.", "It does RPF checks on those messages against BGP (or MP-BGP) routes, so MSDP peers should also be BGP peers with consistent routing.", "The same mechanism connects separate PIM-SM domains, each keeping its own RP."]}, {"check": [3, 9]}]}, {"h": "Key takeaways", "b": [{"ul": ["SPT threshold infinity keeps traffic on the shared tree: put the RP near sources and watch for congestion. Default threshold is 0.", "Static, Auto-RP (224.0.1.39 announce, 224.0.1.40 discovery), BSR (224.0.0.13 flood, hash), embedded RP (16 RPs via a 4-bit RIID), Anycast RP.", "Dynamic discovery scales and suits complex networks. Multiple mapping agents must be identical. show ip pim rp mapping verifies.", "Candidate-RP advertisements: group range, C-RP address, hold time.", "Anycast RP: shared address, nearest RP wins. MSDP (TCP 639) shares sources and relies on BGP routing."]}, {"tip": "Common traps: 224.0.1.39 is announce, .40 is discovery. MSDP isn't TCP 179. BSR routers hash; they don't elect the RP by highest IP."}]}], "verified": [["Auto-RP: candidate RPs announce to 224.0.1.39; mapping agents send discovery to 224.0.1.40 and choose the highest IP", "p. 337–338"], ["Joins sent to 224.0.0.13 (all PIM routers)", "p. 337"], ["MSDP (RFC 3618) connects PIM-SM domains; RPs exchange Source-Active messages; peer-RPF via the MRIB", "p. 338–339"]], "course": ["RP placement with SPT threshold infinity", "BSR flooding and hash-based RP selection; candidate-RP message contents", "Embedded RP and the 16-RP RIID limit", "Identical mapping agents; show ip pim rp mapping", "Anycast RP; MSDP over TCP 639 relying on BGP"]}, "Introducing Network APIs and Protocols": {"mins": 15, "intro": "Network automation replaces typing commands with software talking to devices through APIs. This lesson builds up the vocabulary: why APIs beat screen-scraping, the two encodings, what a data model is, the model-driven stack, REST and its HTTP verbs, and the three protocols that carry the data: NETCONF, RESTCONF and gRPC.", "parts": [{"h": "Why APIs", "b": [{"p": "An API (application programming interface) is how one piece of software talks to another. For years, network automation meant scripts that typed CLI commands and parsed the text that came back (screen-scraping), or SNMP, which is fine for reading counters but poor at configuration. Both are fragile."}, {"p": "APIs are a more robust way to manage devices: the device returns structured data that software can rely on. Next-generation programmatic interfaces share two attributes: extensible, open APIs (REST, RESTCONF, NETCONF, gRPC) and support for secure transports (HTTP, SSH, TLS)."}, {"check": [11, 1]}]}, {"h": "Encodings: JSON and XML", "b": [{"p": "An encoding is how the data is written down. The two main ones are JSON and XML. Both are readable by people and by machines."}, {"dia": "<svg viewBox=\"0 0 360 174\" role=\"img\" aria-label=\"The same interface data written in JSON and in XML\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><pa
