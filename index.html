<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0c0b10"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ENSLD Study"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ENSLD 300-420 Study Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centred study column — deck controls on top, a single card, grade buttons pinned under it. Black field, tan type, red reserved for "review again" and the active marker. */
:root{
  /* Palette taken from the slide deck: blue-black ground, pale khaki wordmark, brass-gold tagline, orange-red badge field, multicam olive */
  --bg:#0c0b10; --panel:#15141b; --line:#2a2833;
  --tan:#d9d7b0; --tan-dim:#bfa152; --ink:#ebe8dc; --muted:#8d8a7c;
  --red:#d9561f; --red-soft:#33190f; --ok:#8f9d4c;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --label:"Saira","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 84px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:2.3rem;letter-spacing:.03em;text-transform:uppercase;color:var(--tan);margin:0;line-height:1;text-wrap:balance}
h1 span{color:var(--red)}
.tally{font-family:var(--mono);font-size:.8rem;color:var(--muted);display:flex;gap:14px;font-variant-numeric:tabular-nums}
.tally b{color:var(--ink);font-weight:500}
.tally .k b{color:var(--ok)} .tally .r b{color:var(--red)}
.label{font-family:var(--label);font-weight:500;text-transform:uppercase;letter-spacing:.28em;font-size:.72rem;color:var(--tan-dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .82rem var(--body);background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:5px 9px;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--bg);background:var(--tan);border-color:var(--tan)}
.chip:hover{border-color:var(--tan-dim)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{font:500 .82rem var(--body);background:transparent;color:var(--muted);border:0;padding:6px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--tan)}
.tool{font:500 .82rem var(--body);background:transparent;color:var(--tan);border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer}
.tool:hover{border-color:var(--tan-dim)}
.tool.danger{color:var(--muted)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tan);width:0;transition:width .3s}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--tan);border-radius:4px;padding:22px 22px 20px;min-height:280px;display:flex;flex-direction:column;gap:14px;cursor:pointer;outline:none}
.card:focus-visible{box-shadow:0 0 0 2px var(--tan)}
.card.flipped{border-top-color:var(--red)}
.meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.meta .st-r{color:var(--red)} .meta .st-k{color:var(--ok)}
.q{font-size:1.2rem;font-weight:500;line-height:1.4;color:var(--ink);text-wrap:pretty;margin:0}
.hint{margin-top:auto;font-size:.82rem;color:var(--muted)}
.ans{display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--line);padding-top:14px}
.ans ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ans li{padding-left:16px;position:relative;font-weight:600;color:var(--tan)}
.ans li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;background:var(--red)}
.why,.note{margin:0;font-size:.93rem;color:var(--ink);max-width:65ch}
.why b,.note b{font-family:var(--label);font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:.68rem;color:var(--tan-dim);margin-right:6px}
.note{background:var(--red-soft);border-left:2px solid var(--red);padding:8px 10px;border-radius:2px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade button{font:700 1.05rem var(--display);text-transform:uppercase;letter-spacing:.08em;padding:12px;border-radius:3px;cursor:pointer;border:1px solid}
.again{background:transparent;color:var(--red);border-color:var(--red)}
.again:hover{background:var(--red-soft)}
.got{background:var(--tan);color:var(--bg);border-color:var(--tan)}
.got:hover{filter:brightness(1.08)}
.grade button:disabled{opacity:.35;cursor:default}
.nav{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.nav button{background:none;border:0;color:var(--tan-dim);font:500 .82rem var(--body);cursor:pointer;padding:4px 0}
.done{text-align:center;padding:40px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.done h2{font-family:var(--display);text-transform:uppercase;color:var(--tan);margin:0;font-size:1.6rem}
.done p{margin:0;color:var(--muted)}
.keys{font-size:.75rem;color:var(--muted);text-align:center}
.keys kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:2px;padding:0 4px;color:var(--tan-dim)}

.views{display:flex;border:1px solid var(--tan-dim);border-radius:3px;overflow:hidden}
.views button{font:700 .95rem var(--display);text-transform:uppercase;letter-spacing:.1em;background:transparent;color:var(--tan);border:0;padding:8px 14px;cursor:pointer}
.views button+button{border-left:1px solid var(--tan-dim)}
.views button[aria-pressed="true"]{background:var(--tan);color:var(--bg)}
.search{width:100%;font:400 .95rem var(--body);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:9px 11px}
.search:focus{outline:2px solid var(--tan);outline-offset:0;border-color:var(--tan)}
.search::placeholder{color:var(--muted)}
.gsec{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.gsec h2{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:1.45rem;color:var(--tan);margin:18px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-wrap:balance}
.gsec h2 small{font:500 .75rem var(--mono);color:var(--muted);letter-spacing:0;white-space:nowrap}
.cheat{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tan-dim);border-radius:3px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.cheat b{font-family:var(--label);font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:.68rem;color:var(--tan-dim);margin-right:6px}
.tblwrap{overflow-x:auto}
.cheat table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
.cheat th,.cheat td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--line)}
.cheat th{color:var(--tan-dim);font-weight:600}
.gq{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.gq:last-child{border-bottom:0}
.gq h3{margin:0;font-size:1.05rem;font-weight:500;line-height:1.45;color:var(--ink);display:flex;gap:10px}
.gq h3 .n{font:500 .8rem var(--mono);color:var(--red);padding-top:3px;flex:none;min-width:2.2em}
.gq .ans{border-top:0;padding-top:0;padding-left:calc(2.2em + 10px)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.top{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font:600 .8rem var(--body);background:var(--panel);color:var(--tan);border:1px solid var(--line);border-radius:3px;padding:8px 10px;cursor:pointer}
@media (max-width:480px){.gq .ans{padding-left:0}}
.dia{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:10px 8px;overflow-x:auto}
.dia svg{display:block;width:100%;min-width:300px;height:auto;max-height:420px}
.d-box{fill:none;stroke:var(--line);stroke-width:1.2}.d-boxa{fill:var(--panel)}
.d-rt{fill:var(--panel);stroke:var(--tan);stroke-width:1.4}.d-x{stroke:var(--tan);stroke-width:1.2;fill:none}
.d-ln{stroke:var(--tan-dim);stroke-width:1.4;fill:none}.d-dash{stroke-dasharray:4 3}.d-red{stroke:var(--red)}
.d-arh{fill:var(--red)}.d-redt{fill:var(--red)}
.d-t{fill:var(--ink);font:500 10px var(--body)}.d-s{fill:var(--muted);font:400 9px var(--body)}
.d-h{fill:var(--tan-dim);font:500 9px var(--label);letter-spacing:.16em}
.d-cloud{fill:var(--panel);stroke:var(--muted);stroke-width:1}
.d-sep{stroke:var(--line);stroke-width:1}
.d-tun{fill:var(--tan-dim);fill-opacity:.35;stroke:var(--tan-dim)}
.d-fw{fill:var(--panel);stroke:var(--red);stroke-width:1.4}
.d-blk{fill:none;stroke:var(--red);stroke-width:2}.d-blkl{stroke:var(--red);stroke-width:2}
.test{border-top:1px solid var(--line);padding-top:10px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}.test p{margin:0}.test b{font-family:var(--label);font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:.66rem;color:var(--tan-dim)}
.book{font-size:.88rem;display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:3px;padding:12px 14px}
.book .lbl{font-family:var(--label);font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:.66rem;color:var(--tan-dim)}
.book ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--ink)}
.book ul li::marker{color:var(--red)}
.book .rl{display:flex;flex-direction:column;gap:3px;font:500 .78rem var(--mono);color:var(--muted)}
.ref{margin:0;font:500 .74rem var(--mono);color:var(--muted)}
.ref b{font-family:var(--label);font-weight:500;letter-spacing:.18em;text-transform:uppercase;font-size:.62rem;color:var(--tan-dim);margin-right:6px}
.srcnote{margin:0;font-size:.82rem;color:var(--muted)}
.chip.bk{border-style:dashed}
.srctag{display:inline-block;vertical-align:middle;margin-left:6px;font:500 .62rem var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--tan-dim);border:1px solid var(--line);border-radius:2px;padding:1px 5px}

.mgrp{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.secnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hit{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;color:var(--ink);font:500 .97rem/1.45 var(--body);cursor:pointer}
.hit .n{font:500 .8rem var(--mono);color:var(--red);padding-top:3px;flex:none;min-width:2.2em}
.hit .hans{display:block;font-weight:600;color:var(--tan);font-size:.88rem;margin-top:3px}
.fold{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tan-dim);border-radius:3px;padding:0 14px;font-size:.92rem}
.fold.bk{border-left-color:var(--red)}
.fold>summary{cursor:pointer;list-style:none;padding:11px 0;font-family:var(--label);font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:.72rem;color:var(--tan-dim)}
.fold>summary::-webkit-details-marker,.gq>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:" +";color:var(--muted)}.fold[open]>summary::after{content:" –"}
.fold[open]{padding-bottom:14px;display:flex;flex-direction:column;gap:10px}
details.gq>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:8px}
details.gq .tapr{padding-left:calc(2.2em + 10px);font-size:.8rem;color:var(--muted)}
details.gq[open] .tapr{display:none}
details.gq[open]>summary{margin-bottom:10px}
details.gq.flash{background:var(--red-soft);transition:background .4s}
button:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
@media (max-width:480px){h1{font-size:1.6rem}.q{font-size:1.08rem}.card{padding:18px 16px}.keys{display:none}}
/* ----- practice test ----- */
.tpanel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tpanel h2{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:1.3rem;color:var(--tan);margin:0}
.tsub{margin:0;font-size:.85rem;color:var(--muted)}
.weak{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) 3.2em;gap:4px 10px;align-items:center;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%}
.wrow:last-child{border-bottom:0}
.wrow .nm{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .pc{font:500 .8rem var(--mono);text-align:right;color:var(--tan);font-variant-numeric:tabular-nums}
.wrow .pc.lo{color:var(--red)}
.wrow .wb{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.wrow .wb i{display:block;height:100%;background:var(--tan)}
.wrow .wb i.lo{background:var(--red)}
.wrow .dt{grid-column:1/-1;font:500 .7rem var(--mono);color:var(--muted)}
button.wrow:hover .nm{color:var(--tan)}
.go{font:700 1.05rem var(--display);text-transform:uppercase;letter-spacing:.08em;padding:12px 16px;border-radius:3px;cursor:pointer;background:var(--tan);color:var(--bg);border:1px solid var(--tan)}
.go:disabled{opacity:.35;cursor:default}
.go.alt{background:transparent;color:var(--tan)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.btnrow>*{flex:1 1 140px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:400 .97rem/1.45 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:10px 12px;cursor:pointer}
.opt .bx{flex:none;width:18px;height:18px;margin-top:2px;border:1.5px solid var(--muted);display:grid;place-items:center;font:600 .7rem var(--mono);color:var(--bg)}
.opt.radio .bx{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--tan)}
.opt[aria-pressed="true"] .bx{background:var(--tan);border-color:var(--tan)}
.opt.ok{border-color:var(--ok);background:rgba(143,157,76,.12)}
.opt.ok .bx{background:var(--ok);border-color:var(--ok)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.bad .bx{background:var(--red);border-color:var(--red)}
.opt:disabled{cursor:default;color:var(--ink)}
.pick{margin:0;font:500 .72rem var(--label);letter-spacing:.2em;text-transform:uppercase;color:var(--tan-dim)}
.verdict{font:700 1.2rem var(--display);text-transform:uppercase;letter-spacing:.06em;margin:0}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--red)}
.score{font:700 3.2rem var(--display);color:var(--tan);line-height:1;margin:0}
.miss{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.miss:last-child{border-bottom:0}
.miss .mq{font-weight:500;margin:0}
.miss .yp{margin:0;color:var(--red);font-size:.86rem}
.miss ul{margin:0;padding-left:16px;color:var(--tan);font-weight:600}
@media (max-width:480px){.views button{padding:8px 9px;font-size:.86rem;letter-spacing:.06em}}
.cfold>summary{display:flex;align-items:baseline;gap:10px;font-size:.78rem;letter-spacing:.14em;color:var(--tan)}
.cfold>summary::after{margin-left:auto}
.cfold .cn{font:500 .75rem var(--mono);color:var(--red);letter-spacing:0}
.cfold .cc{font:500 .68rem var(--mono);color:var(--muted);letter-spacing:0;text-transform:none;white-space:nowrap}
.terms{margin:0;display:flex;flex-direction:column}
.terms>div{display:grid;grid-template-columns:minmax(7.5em,32%) 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.terms dt{font-weight:600;color:var(--tan);font-size:.9rem}
.terms dd{margin:0;font-size:.92rem;color:var(--ink)}
.clist{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:.82rem}
.ctip{margin:4px 0 0;padding:10px 12px;background:var(--red-soft);border-left:3px solid var(--red);font-size:.9rem}
.ctip b{display:block;font:500 .66rem var(--label);text-transform:uppercase;letter-spacing:.22em;color:var(--red);margin-bottom:3px}
.cq{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.cq .mq{margin:0;font-weight:500}
@media (max-width:480px){.terms>div{grid-template-columns:1fr;gap:2px}}
.views{display:grid;grid-template-columns:repeat(4,auto)}
.views button+button{border-left:1px solid var(--tan-dim)}
@media (max-width:560px){.views{grid-template-columns:1fr 1fr;width:100%}.views button:nth-child(3){border-left:0}.views button:nth-child(n+3){border-top:1px solid var(--tan-dim)}}
.seg{flex-wrap:wrap}
.star{background:none;border:0;padding:0 2px;margin-left:6px;font-size:1.05rem;line-height:1;color:var(--muted);cursor:pointer;vertical-align:baseline}
.star[aria-pressed="true"]{color:var(--red)}
.star:hover{color:var(--tan)}
.foot{border-top:1px solid var(--line);padding-top:16px;margin-top:8px}
.foot .btnrow>*{flex:1 1 160px}
.sumq{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line);font-size:.92rem}
.sumq .mq{margin:0;font-weight:500}
.sumq ul{margin:0;padding-left:16px;color:var(--tan);font-weight:600}
.trend{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.trend i{flex:1;max-width:36px;background:var(--tan-dim);border-radius:2px 2px 0 0;position:relative}
.trend i.lo{background:var(--red)}
.trend i span{position:absolute;top:-16px;left:0;right:0;text-align:center;font:500 .66rem var(--mono);color:var(--muted)}
.ltabs{display:flex;border:1px solid var(--tan-dim);border-radius:3px;overflow:hidden}
.ltabs button{flex:1;font:600 .9rem var(--display);text-transform:uppercase;letter-spacing:.08em;padding:9px 10px;background:none;color:var(--tan);border:0;cursor:pointer}
.ltabs button+button{border-left:1px solid var(--tan-dim)}
.ltabs button[aria-pressed="true"]{background:var(--tan);color:var(--bg)}
.lsn{display:flex;flex-direction:column;gap:14px}
.lsn h2{margin:0}
.lsn .lmeta{font:500 .72rem var(--mono);color:var(--muted)}
.lsn h3.lh{margin:0;font:700 1.35rem/1.2 var(--display);color:var(--ink);text-transform:none;letter-spacing:.01em}
.lsn p.lp{margin:0;font-size:1rem;line-height:1.6}
.lsn ul.lu{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.55}
.lsn ul.lu li::marker{color:var(--red)}
.ltbl{overflow-x:auto;border:1px solid var(--line);border-radius:3px}
.ltbl table{border-collapse:collapse;width:100%;font-size:.88rem}
.ltbl th{text-align:left;font:500 .66rem var(--label);text-transform:uppercase;letter-spacing:.16em;color:var(--tan-dim);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.ltbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ltbl tr:last-child td{border-bottom:0}
.ltbl td:first-child{color:var(--tan);font-weight:600;overflow-wrap:anywhere;min-width:5.5em}
.ltbl td{overflow-wrap:anywhere}
.lcheck{border:1px solid var(--line);border-left:3px solid var(--tan);border-radius:3px;padding:4px 14px 8px;background:var(--panel)}

  "notes": [
   "Dual stack is the recommended transition method. Tunnels (manual, 6to4, 6rd, ISATAP, DS-Lite) and translation (NAT64/DNS64) fill gaps.",
   "Manual tunnels terminate on dual-stacked edge routers. A tunnel broker gives an IPv6 tunnel to a site whose ISP only offers IPv4.",
   "6rd uses the provider's own IPv6 prefix (unlike 6to4's 2002::/16). DS-Lite carries IPv4 traffic across an IPv6-only provider network.",
   "SLAAC needs a /64 and uses the router's ICMPv6 Router Advertisement. AAAA records map names to IPv6 addresses.",
   "Security: RA Guard blocks rogue router advertisements, SEND/CGA secures ND with certificates, and the IPv6 policy must match the existing IPv4 policy. Tunnels have no built-in security, so add IPsec."

document.addEventListener('keydown',e=>{
  if(S.view!=='cards')return;
  if(e.target.closest&&e.target.closest('button:not(#card)')&&e.key===' ')return;
  if(e.key===' '){e.preventDefault();if(pos<queue.length)flip()}

});

const EXAM=[{"n": 1, "dom": "Routing", "q": "A company allocates a /16 to 16 branches. Each branch must receive a summarizable block supporting up to 12 /24 networks. Which allocation best meets the requirement?", "o": ["Assign one /24 per branch", "Assign one /20 per branch", "Assign one /22 per branch", "Assign one /28 per branch"], "c": [1], "why": "A /20 holds sixteen /24s, enough for 12 with room to grow, and summarizes as one route. Sixteen /20s fit exactly in a /16."}, {"n": 2, "dom": "Routing", "q": "An EIGRP router has a successor feasible distance of 900. A neighbor reports a distance of 850 and a total metric of 1200. How is the neighbor route classified?", "o": ["Not loop-free", "Feasible successor", "Successor regardless of metric", "External route only"], "c": [1], "why": "Feasibility condition: the neighbour's reported distance (850) is less than the current feasible distance (900), so the path is loop-free and becomes a feasible successor, even though its total metric (1200) is higher."}, {"n": 3, "dom": "Routing", "q": "A large EIGRP hub-and-spoke network experiences excessive queries when a remote route fails. Which two changes help contain queries?", "o": ["Configure spokes as EIGRP stubs", "Disable route summarization", "Summarize routes at distribution boundaries", "Increase the number of transit spokes", "Use a single flat query domain"], "c": [0, 2], "why": "Stub spokes and summaries limit query propagation."}, {"n": 4, "dom": "Routing", "q": "An OSPF area must allow a local ASBR to redistribute routes while limiting Type 5 external LSAs. Which area type fits?", "o": ["Stub", "Totally stubby", "NSSA", "Backbone"], "c": [2], "why": "An NSSA carries redistributed external routes as Type 7 LSAs."}, {"n": 5, "dom": "Routing", "q": "A network designer wants OSPF interarea summarization for a group of branch prefixes. Where should the summary be configured?", "o": ["On each internal router", "On the ABR", "On the DR", "On every host default gateway"], "c": [1], "why": "An ABR originates interarea summary information."}, {"n": 6, "dom": "Routing", "q": "An IS-IS design needs routers in different areas to exchange reachability. Which routing level supplies interarea connectivity?", "o": ["Level 1 only", "Level 2", "DIS only", "CSNP only"], "c": [1], "why": "IS-IS Level 2 connects areas."}, {"n": 7, "dom": "Routing", "q": "On a broadcast IS-IS segment, which statement about the DIS is accurate?", "o": ["A backup DIS is elected", "The DIS creates a pseudonode LSP", "The DIS blocks redundant links", "The DIS is the only router that forwards traffic"], "c": [1], "why": "The DIS represents the broadcast segment using a pseudonode LSP; no backup DIS is elected."}, {"n": 8, "dom": "Routing", "q": "An enterprise wants all iBGP speakers to learn routes without a full mesh. Which design most directly reduces peer count?", "o": ["Route reflection", "Increasing local preference", "Route dampening", "MED tuning"], "c": [0], "why": "Route reflectors propagate eligible iBGP routes to clients."}, {"n": 9, "dom": "Routing", "q": "Two Internet exits advertise the same prefix to internal routers. The enterprise wants all internal routers to prefer exit A for outbound traffic. Which BGP attribute should be set?", "o": ["MED", "Local preference", "Origin code", "AS_PATH prepend on exit A"], "c": [1], "why": "Higher local preference influences outbound selection throughout the AS."}, {"n": 10, "dom": "Routing", "q": "A multihomed enterprise wants to influence which ingress a neighboring AS uses. Which attribute can it advertise as a hint, subject to neighbor policy?", "o": ["Weight", "Local preference", "MED", "IGP cost"], "c": [2], "why": "MED suggests a preferred entry point to a neighboring AS."}, {"n": 11, "dom": "Routing", "q": "Which two mechanisms can support IPv6-only clients reaching IPv4-only services?", "o": ["NAT64", "DNS64", "HSRP", "MST", "LACP"], "c": [0, 1], "why": "DNS64 synthesizes AAAA records and NAT64 translates between address families."}, {"n": 12, "dom": "Routing", "q": "A BGP peer must exchange IPv6 unicast NLRI. Which design element is necessary?", "o": ["IPv6 unicast address family activation", "Only an IPv4 static default route", "MPLS PHP", "OSPF Type 7 translation"], "c": [0], "why": "MP-BGP negotiates and exchanges NLRI through the appropriate address family."}, {"n": 13, "dom": "Routing", "q": "A redistribution boundary connects OSPF and EIGRP domains. Which two controls most directly reduce route feedback loops?", "o": ["Route tagging with matching filters", "Unrestricted bidirectional redistribution", "Explicit prefix filtering", "Disabling administrative distance globally", "Increasing OSPF hello timers"], "c": [0, 2], "why": "Tagging routes as they're redistributed, and filtering on those tags (plus explicit prefix filters), stops routes leaking back into the domain they came from."}, {"n": 14, "dom": "Campus", "q": "A campus must minimize spanning-tree dependencies between access and distribution. Which architecture is most appropriate?", "o": ["Extend all VLANs end to end", "Routed access with Layer 3 uplinks", "Single root bridge for all buildings", "Disable loop protection"], "c": [1], "why": "Routed access limits Layer 2 domains and uses routing convergence."}, {"n": 15, "dom": "Campus", "q": "A distribution pair provides one virtual default gateway for hosts, with an active router and standby router. Which technology meets this requirement?", "o": ["HSRP", "BFD alone", "LACP", "MPLS"], "c": [0], "why": "HSRP provides an active/standby first-hop gateway."}, {"n": 16, "dom": "Campus", "q": "A fiber link fails without an immediate routing protocol dead-timer expiration. Which mechanism provides fast forwarding-path failure detection?", "o": ["BFD", "DHCP snooping", "LLDP", "WRED"], "c": [0], "why": "BFD detects forwarding path failures rapidly when supported and tuned."}, {"n": 17, "dom": "Campus", "q": "Which two features protect access edge ports against unintended spanning-tree participation?", "o": ["BPDU Guard", "PortFast on edge ports", "Increase root priority", "Disable all STP", "Enable trunking on every access port"], "c": [0, 1], "why": "PortFast provides edge behavior; BPDU Guard shuts down an edge port receiving BPDUs."}, {"n": 18, "dom": "Campus", "q": "An organization wants a designated distribution switch to remain spanning-tree root despite superior BPDUs from an access switch. Which feature helps enforce that design?", "o": ["Root Guard", "Storm control", "DHCP relay", "LISP"], "c": [0], "why": "Root Guard prevents a port from accepting a superior root path."}, {"n": 19, "dom": "Campus", "q": "An IP phone requires power to remain available during a supported switch control-plane reload. Which PoE capability is most relevant?", "o": ["Perpetual PoE", "LACP", "VACL", "WOL"], "c": [0], "why": "Perpetual PoE keeps power flowing to phones and other PoE devices while the switch's control plane reloads. Fast PoE restores power quickly after a full power-up."}, {"n": 20, "dom": "Campus", "q": "An enterprise wants to isolate two departments using separate routing domains in an SD-Access fabric. Which feature is designed for this?", "o": ["Virtual networks", "One shared VLAN", "DSCP marking", "RPF"], "c": [0], "why": "Virtual networks provide macrosegmentation through distinct routing domains."}, {"n": 21, "dom": "Campus", "q": "An SDA fabric edge needs to discover the current location of an endpoint. Which control-plane technology provides endpoint mapping?", "o": ["LISP", "VXLAN", "STP", "LACP"], "c": [0], "why": "LISP maps endpoint identifiers to routing locators."}, {"n": 22, "dom": "Campus", "q": "Which technology encapsulates user traffic between SDA fabric nodes?", "o": ["VXLAN", "NETCONF", "RADIUS", "SNMP"], "c": [0], "why": "VXLAN carries overlay data traffic across the IP underlay."}, {"n": 23, "dom": "Campus", "q": "Which two functions are associated with SDA fabric edge nodes?", "o": ["Provide an anycast gateway to endpoints", "Encapsulate endpoint traffic into VXLAN", "Replace all fabric control-plane mapping services", "Act as the Internet DNS root", "Perform WAN OMP route reflection"], "c": [0, 1], "why": "Fabric edges connect endpoints, provide anycast gateways, and encapsulate fabric traffic."}, {"n": 24, "dom": "Campus", "q": "An SDA underlay has an IP MTU of 1500 bytes and carries 1500-byte original Ethernet frames inside VXLAN. What design concern must be addressed?", "o": ["Increase transport MTU to accommodate encapsulation", "Disable all routing protocols", "Use BGP MED", "Turn off anycast gateways"], "c": [0], "why": "VXLAN adds outer headers; the underlay needs adequate MTU to avoid drops or fragmentation."}, {"n": 25, "dom": "Campus", "q": "A multi-building campus needs separate tenant routing tables on shared Layer 3 infrastructure. Which feature fits?", "o": ["VRF", "BPDU filter", "WRED", "NHRP"], "c": [0], "why": "VRFs provide logically separate routing and forwarding tables."}, {"n": 26, "dom": "WAN", "q": "A provider offers customer-specific Layer 3 routing separation across an MPLS backbone. Which service is this?", "o": ["MPLS L3VPN", "GRE alone", "Metro Ethernet point-to-point only", "GETVPN only"], "c": [0], "why": "MPLS L3VPN uses VRFs and VPN routing to isolate customers."}, {"n": 27, "dom": "WAN", "q": "In an MPLS L3VPN, what is the main purpose of a route target?", "o": ["Determine VRF import/export membership", "Make overlapping IPv4 routes globally unique", "Set MPLS TTL", "Encrypt payloads"], "c": [0], "why": "Route targets control VPN route import/export; route distinguishers make VPN prefixes unique."}, {"n": 28, "dom": "WAN", "q": "An enterprise needs dynamic spoke-to-spoke encrypted connectivity over Internet transports. Which architecture best matches?", "o": ["DMVPN using mGRE, NHRP, and IPsec", "Static GRE without encryption", "MPLS PHP", "STP with PortFast"], "c": [0], "why": "DMVPN supports dynamic spoke-to-spoke resolution and commonly uses IPsec for encryption."}, {"n": 29, "dom": "WAN", "q": "An enterprise needs to carry multicast routing packets across an encrypted site-to-site connection. Which two design options may support this requirement?", "o": ["GRE over IPsec", "Supported route-based IPsec VTI with multicast routing", "IPsec tunnel mode always prohibits multicast", "Plain NAT only", "BGP communities alone"], "c": [0, 1], "why": "GRE over IPsec and suitable VTI implementations can carry multicast routing traffic. ENSLD 300-420 | Original practice questions Page 12"}, {"n": 30, "dom": "WAN", "q": "A business wants group encryption on an existing private routed WAN without introducing a traditional tunnel overlay. Which option is most relevant?", "o": ["GETVPN", "DMVPN Phase 1", "LACP", "MST"], "c": [0], "why": "GETVPN protects native routed traffic without traditional point-to-point tunnel encapsulation."}, {"n": 31, "dom": "WAN", "q": "A branch uses one ISP and requires connectivity even if that ISP experiences a regional outage. Which design best improves provider diversity?", "o": ["Second circuit from an independent ISP", "Second cable to same CPE on same ISP", "Increase OSPF cost", "Increase WAN shaping rate"], "c": [0], "why": "Independent providers reduce common-provider failure risk."}, {"n": 32, "dom": "WAN", "q": "Which Cisco SD-WAN component distributes overlay routing and centralized control policies?", "o": ["SD-WAN Controller (vSmart)", "SD-WAN Manager (vManage)", "SD-WAN Validator (vBond)", "WAN Edge data-plane ASIC"], "c": [0], "why": "The controller distributes OMP routes and policies."}, {"n": 33, "dom": "WAN", "q": "A branch application must prefer a path with acceptable latency, loss, and jitter, and move when SLA thresholds are exceeded. Which SD-WAN capability fits?", "o": ["Application-aware routing", "Spanning-tree root election", "LACP hashing", "DHCP snooping"], "c": [0], "why": "Application-aware routing selects paths using measured transport performance."}, {"n": 34, "dom": "WAN", "q": "An SD-WAN edge behind NAT must establish secure overlay connectivity. Which two items are particularly relevant?", "o": ["NAT traversal and supported transport connectivity", "Correct controller/validator reachability", "Disable all certificates", "Use only STP", "Require a public address on every LAN endpoint"], "c": [0, 1], "why": "Onboarding and tunnel establishment depend on NAT handling and reachability to control components."}, {"n": 35, "dom": "WAN", "q": "A company requires private high-capacity optical transport between data centers across a metropolitan area. Which technology is most closely associated with wavelength multiplexing?", "o": ["DWDM", "NHRP", "PIM-SM", "VRRP"], "c": [0], "why": "DWDM carries many wavelengths over one fibre pair, giving very high private capacity between sites in a metro area."}, {"n": 36, "dom": "Network Services", "q": "A WAN edge must smooth traffic bursts to a contracted rate while minimizing unnecessary drops. Which QoS action is preferred?", "o": ["Shaping", "Policing", "BPDU Guard", "Route reflection"], "c": [0], "why": "Shaping buffers bursts and controls egress transmission rate."}, {"n": 37, "dom": "Network Services", "q": "A service provider must enforce a strict traffic contract and immediately drop or remark excess packets. Which mechanism applies?", "o": ["Policing", "Shaping only", "LISP", "NSSA"], "c": [0], "why": "Policing enforces the configured rate without buffering excess traffic."}, {"n": 38, "dom": "Network Services", "q": "Voice packets must receive strict priority under congestion. Which queuing feature is commonly selected?", "o": ["LLQ", "WRED only", "FIFO only", "RPF"], "c": [0], "why": "LLQ provides a priority queue, typically with policing safeguards."}, {"n": 39, "dom": "Network Services", "q": "Which marking is commonly recommended for voice bearer traffic?", "o": ["DSCP EF (46)", "DSCP CS0 (0)", "AF11 (10)", "CS1 (8)"], "c": [0], "why": "Expedited Forwarding EF 46 is commonly used for voice bearer."}, {"n": 40, "dom": "Network Services", "q": "A company wants scalable differentiated traffic treatment without per-flow resource reservations. Which model fits?", "o": ["DiffServ", "IntServ with RSVP per flow", "STP", "PIM bidirectional"], "c": [0], "why": "DiffServ applies class-based treatment using markings."}, {"n": 41, "dom": "Network Services", "q": "A multicast receiver joins a specific (S,G) channel and the design must avoid an RP. Which model should be selected?", "o": ["SSM", "ASM shared tree only", "MSDP RP discovery", "PIM bidirectional only"], "c": [0], "why": "Source-specific multicast uses source/group subscriptions without an RP."}, {"n": 42, "dom": "Network Services", "q": "A PIM-SM multicast packet arrives on an interface that is not the expected path toward its source. What should occur?", "o": ["RPF check fails and packet is discarded", "Packet is always flooded", "Packet becomes a unicast packet", "RP is automatically removed"], "c": [0], "why": "RPF checks prevent multicast loops and unwanted duplicate forwarding."}, {"n": 43, "dom": "Network Services", "q": "A PIM-SM Any-Source Multicast design uses a shared tree. Which node acts as its root?", "o": ["Rendezvous Point", "DR in OSPF", "BGP route reflector", "LACP actor"], "c": [0], "why": "The RP roots the shared tree in PIM-SM ASM."}, {"n": 44, "dom": "Network Services", "q": "A network must remain manageable when its production routing plane is unavailable. Which management approach best supports this goal?", "o": ["Dedicated out-of-band management", "In-band management only", "SNMP over production default route only", "No separate management access"], "c": [0], "why": "An independent OOB network provides a separate management path."}, {"n": 45, "dom": "Network Services", "q": "A company wants its operations traffic isolated from user traffic using a separate routing instance. Which solution is most appropriate?", "o": ["Management VRF", "Single shared default VRF", "Disable SSH", "Increase DSCP for all user traffic"], "c": [0], "why": "A management VRF gives operations traffic its own routing table, separate from user traffic, even when it shares the same physical network."}, {"n": 46, "dom": "Automation", "q": "A design calls for a vendor-neutral YANG model maintained by an industry community for network interfaces. Which model family is most appropriate?", "o": ["OpenConfig", "Cisco proprietary YANG only", "MST", "OSPF LSAs"], "c": [0], "why": "OpenConfig is a vendor-neutral set of YANG models written by an operator-led industry group. IETF models are standards-body models, and native models are vendor-specific."}, {"n": 47, "dom": "Automation", "q": "An automation application needs transactional network configuration operations over SSH using XML RPCs. Which protocol fits?", "o": ["NETCONF", "RESTCONF using JSON only", "SNMP traps", "TFTP"], "c": [0], "why": "NETCONF uses XML-encoded RPCs, commonly over SSH TCP 830."}, {"n": 48, "dom": "Automation", "q": "An application uses HTTPS methods to read and change YANG-modeled resources. Which interface best matches?", "o": ["RESTCONF", "LACP", "IS-IS", "BFD"], "c": [0], "why": "RESTCONF exposes YANG data through HTTP methods."}, {"n": 49, "dom": "Automation", "q": "Telemetry should notify a collector when an operational value changes rather than only at fixed intervals. Which subscription mode fits?", "o": ["On-change", "Periodic only", "Syslog disabled", "Static polling once per day"], "c": [0], "why": "On-change telemetry emits updates when subscribed state changes, subject to implementation."}, {"n": 50, "dom": "Automation", "q": "A controller needs streaming model-driven telemetry over a gRPC-based network management interface. Which protocol is most appropriate?", "o": ["gNMI", "TACACS+", "STP", "NHRP"], "c": [0], "why": "gNMI runs over gRPC and handles both configuration and streaming model-driven telemetry."}],DOMS=['Routing','Campus','WAN','Network Services','Automation'],MOCKMIN=90;
EXAM.forEach(e=>{BYID['mock#'+e.n]={id:'mock#'+e.n,sec:e.dom,num:e.n,q:e.q,a:e.c.map(k=>e.o[k]),why:e.why,note:'',src:'Mock exam',mc:{o:e.o,c:e.c},mock:true}});
T.mocks=T.mocks||[];
if(T.cur&&T.cur.qs.some(x=>!BYID[x.id]))T.cur=null;
let tTick=null;
function fmtT(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+':'+String(s).padStart(2,'0')}
let tArmed=false;
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const NUMW=['','one','two','three','four','five','six'];

function secStats(name){
  const cs=CARDS.filter(c=>c.sec===name);let ok=0,seen=0,tested=0,tOk=0;
  cs.forEach(c=>{const h=T.hist[c.id];
    if(h){seen++;tested++;if(h.last)ok++,tOk++}
    else if(S.marks[c.id]){seen++;if(S.marks[c.id]==='k')ok++}});
  return {name,total:cs.length,ok,seen,tested,tOk,pct:cs.length?Math.round(ok/cs.length*100):0};
}
function weakList(){return DATA.map(s=>secStats(s.name)).sort((a,b)=>(!a.seen)-(!b.seen)||a.pct-b.pct||a.seen-b.seen)}

function tStart(ids,fb,mock){
  if(!ids.length)return;
  T.showRes=false;
  T.cur={fb,i:0,done:false,mock:!!mock,started:Date.now(),deadline:mock?Date.now()+MOCKMIN*60000:null,qs:ids.map(id=>{const c=BYID[id];
    return c.mc.order?{id,o:shuf(c.a.map((_,k)=>k)),sel:[],res:null}:{id,o:shuf(c.mc.o.map((_,k)=>k)),sel:[],res:null}})};
  tSave();tRender();goTo(0);
}
function tPickIds(secs,count){let p=shuf(POOL.filter(c=>secs.includes(c.sec)).map(c=>c.id));return count==='all'?p:p.slice(0,count)}

function tEnd(){ // finish a run; unanswered questions count as wrong in a mock
  const r=T.cur;if(!r||r.done)return;
  if(r.mock){r.qs.forEach(x=>{if(x.res===null)x.res=false});
    const by={};r.qs.forEach(x=>{const d=BYID[x.id].sec;by[d]=by[d]||[0,0];by[d][1]++;if(x.res)by[d][0]++});
    T.mocks.push({at:Date.now(),ok:r.qs.filter(x=>x.res).length,n:r.qs.length,used:Math.min(Date.now(),r.deadline)-r.started,by})}
  else r.qs=r.qs.filter(q=>q.res!==null);
  r.done=true;T.showRes=!!r.qs.length;if(!r.qs.length)T.cur=null;tSave();tRender();goTo(0);
}
function tRenderX(){}
function tRender(){
  const v=$('testView');if(tTick){clearInterval(tTick);tTick=null}
  if(T.cur&&!T.cur.done)return tQuestion(v);
  if(T.view==='sum')return tSummary(v);
  if(T.cur&&T.cur.done&&T.showRes)return tResults(v);
  return tSetup(v);
}

function tSetup(v){
  const W=weakList(),cfg=T.cfg;
  const avail=POOL.filter(c=>cfg.secs.includes(c.sec)).length;
  const anySeen=W.some(w=>w.seen);
  const M=T.mocks,last=M[M.length-1],best=M.length?Math.max(...M.map(m=>Math.round(m.ok/m.n*100))):null;
  v.innerHTML=`
  <div class="tpanel">
    <h2>Mock exam</h2>
    <p class="tsub">The instructor's 50-question practice exam, weighted like the real one (Routing 13, Campus 12, WAN 10, Network Services 10, Automation 5). ${MOCKMIN} minutes, marked at the end. Options are shuffled each time.</p>
    ${last?`<p class="tsub" style="color:var(--ink)">Last: <b style="color:var(--tan)">${Math.round(last.ok/last.n*100)}%</b> (${last.ok}/${last.n}, ${fmtT(last.used)}) · Best: <b style="color:var(--tan)">${best}%</b> · ${M.length} attempt${M.length>1?'s':''}</p>
    <div class="weak">${DOMS.filter(d=>last.by[d]).map(d=>{const [c,n]=last.by[d],p=Math.round(c/n*100),lo=p<60;return `<div class="wrow" style="cursor:default"><span class="nm">${d}</span><span class="pc${lo?' lo':''}">${p}%</span><span class="wb"><i class="${lo?'lo':''}" style="width:${p}%"></i></span><span class="dt">${c} of ${n} right on your last attempt</span></div>`}).join('')}</div>`:''}
    <div class="btnrow"><button type="button" class="go" id="tMock">Start mock exam</button></div>
  </div>
  <div class="tpanel">
    <h2>Weak areas</h2>
    <p class="tsub">Weakest sections first, then ones you haven't started. Each question counts as known from your latest practice-test answer, or your flash-card mark if you haven't tested it yet. Tap a section to test just that one.</p>
    <div class="weak">${W.map(w=>{const lo=w.seen&&w.pct<60;return `<button type="button" class="wrow" data-sec="${esc(w.name)}">
      <span class="nm">${esc(SHORT[w.name]||w.name)}</span><span class="pc${lo?' lo':''}">${w.seen?w.pct+'%':'<span style="color:var(--muted)">new</span>'}</span>
      ${w.seen?`<span class="wb"><i class="${lo?'lo':''}" style="width:${w.pct}%"></i></span>
      <span class="dt">${w.ok} of ${w.total} known · ${w.tested} tested${w.tested?` (${Math.round(w.tOk/w.tested*100)}% right)`:''}</span>`:''}</button>`}).join('')}</div>
    <div class="btnrow"><button type="button" class="go alt" id="tWeak">Drill weakest 3</button><button type="button" class="go alt" id="tSum">Test-day summary</button>${starCount()?`<button type="button" class="go alt" id="tStar">Test bookmarked (${CARDS.filter(c=>S.stars[c.id]&&c.mc).length})</button>`:''}</div>
  </div>
  <div class="tpanel">
    <h2>New test</h2>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="row"><span class="label">Sections</span><button class="tool" id="tAll" type="button">${cfg.secs.length===DATA.length?'Clear all':'Select all'}</button></div>
      <div class="chips" id="tChips">${DATA.map(s=>`<button type="button" class="chip" aria-pressed="${cfg.secs.includes(s.name)}" data-s="${esc(s.name)}">${esc(SHORT[s.name]||s.name)}</button>`).join('')}</div>
    </div>
    <div class="row">
      <div style="display:flex;flex-direction:column;gap:6px"><span class="label">Questions</span>
        <div class="seg" id="tCount">${[10,25,50,'all'].map(n=>`<button type="button" data-n="${n}" aria-pressed="${cfg.count===n}">${n==='all'?'All':n}</button>`).join('')}</div></div>
      <div style="display:flex;flex-direction:column;gap:6px"><span class="label">Feedback</span>
        <div class="seg" id="tFb"><button type="button" data-f="instant" aria-pressed="${cfg.fb==='instant'}">After each</button><button type="button" data-f="exam" aria-pressed="${cfg.fb==='exam'}">Exam style</button></div></div>
    </div>
    <p class="tsub">${avail} questions in the chosen sections. ${cfg.fb==='exam'?'Answers are marked at the end.':'You see the answer and the Why after each question.'} Multi-answer questions only count if every pick is right.</p>
    <div class="btnrow"><button type="button" class="go" id="tGo" ${avail?'':'disabled'}>Start test</button>
    ${T.cur&&T.cur.done?`<button type="button" class="go alt" id="tLast">Last results</button>`:''}</div>
    <div class="row" style="justify-content:flex-end"><button class="tool danger" id="tReset" type="button">Reset test history</button></div>
  </div>`;
  $('tChips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const n=b.dataset.s;cfg.secs=cfg.secs.includes(n)?cfg.secs.filter(x=>x!==n):[...cfg.secs,n];tSave();tSetup(v)};
  $('tAll').onclick=()=>{cfg.secs=cfg.secs.length===DATA.length?[]:DATA.map(s=>s.name);tSave();tSetup(v)};
  $('tCount').onclick=e=>{const b=e.target.closest('button');if(!b)return;cfg.count=b.dataset.n==='all'?'all':+b.dataset.n;tSave();tSetup(v)};
  $('tFb').onclick=e=>{const b=e.target.closest('button');if(!b)return;cfg.fb=b.dataset.f;tSave();tSetup(v)};
  $('tGo').onclick=()=>tStart(tPickIds(cfg.secs,cfg.count),cfg.fb);
  $('tSum').onclick=()=>{T.view='sum';tRender();goTo(0)};
  if($('tStar'))$('tStar').onclick=()=>tStart(shuf(CARDS.filter(c=>S.stars[c.id]&&c.mc).map(c=>c.id)),cfg.fb);
  $('tMock').onclick=()=>tStart(EXAM.map(e=>'mock#'+e.n),'exam',true);
  if($('tLast'))$('tLast').onclick=()=>{T.showRes=true;tSave();tRender();goTo(0)};
  v.querySelectorAll('.wrow').forEach(b=>b.onclick=()=>tStart(tPickIds([b.dataset.sec],cfg.count),cfg.fb));
  $('tWeak').onclick=()=>{const ws=(anySeen?W.filter(w=>w.seen):W).slice(0,3).map(w=>w.name);tStart(tPickIds(ws,cfg.count),cfg.fb)};
  $('tReset').onclick=()=>{
    if(!tArmed){tArmed=true;$('tReset').textContent='Tap again to confirm';$('tReset').style.color='var(--red)';setTimeout(()=>{tArmed=false;if($('tReset')){$('tReset').textContent='Reset test history';$('tReset').style.color=''}},3000);return}
    tArmed=false;T.hist={};T.mocks=[];T.cur=null;T.showRes=false;tSave();tSetup(v)};
}

function isRight(c,x){
  if(c.mc.order)return x.sel.length===c.a.length&&x.sel.every((k,i)=>k===i);
  const want=c.mc.c.slice().sort().join(),got=x.sel.slice().sort().join();return want===got;
}
function tSubmit(){
  const r=T.cur,x=r.qs[r.i],c=BYID[x.id];if(x.res!==null)return;
  x.res=isRight(c,x);
  if(!c.mock){const h=T.hist[c.id]||{n:0,c:0};h.n++;if(x.res)h.c++;h.last=x.res?1:0;T.hist[c.id]=h}
  if(r.fb==='exam')tNext();else{tSave();tRender()}
}
function tNext(){const r=T.cur;r.i++;if(r.i>=r.qs.length){r.i=r.qs.length-1;return tEnd()}tSave();tRender();goTo(0)}

function tQuestion(v){
  const r=T.cur,x=r.qs[r.i],c=BYID[x.id],shown=x.res!==null&&r.fb==='instant';
  const need=c.mc.order?c.a.length:c.mc.c.length,multi=!c.mc.order&&need>1;
  let body;
  if(c.mc.order){
    body=`<p class="pick">Tap the steps in order</p><div class="opts">${x.o.map(k=>{const p=x.sel.indexOf(k);
      const cls=shown?(p===k?' ok':' bad'):'';
      return `<button type="button" class="opt${cls}" data-k="${k}" aria-pressed="${p>=0}" ${shown?'disabled':''}><span class="bx">${p>=0?p+1:''}</span><span>${esc(c.a[k].replace(/^\d+\.\s*/,''))}</span></button>`}).join('')}</div>`;
  }else{
    body=`<p class="pick">${multi?'Pick '+NUMW[need]:'Pick one'}</p><div class="opts">${x.o.map(k=>{const on=x.sel.includes(k),cor=c.mc.c.includes(k);
      const cls=shown?(cor?' ok':on?' bad':''):'';
      return `<button type="button" class="opt${multi?'':' radio'}${cls}" data-k="${k}" aria-pressed="${on}" ${shown?'disabled':''}><span class="bx">${shown&&cor?'✓':''}</span><span>${esc(c.mc.o[k])}</span></button>`}).join('')}</div>`;
  }
  const ready=x.sel.length===need;
  v.innerHTML=`
  <div class="tally"><span><b>${r.i+1}</b> of ${r.qs.length}</span><span>${r.mock?`Mock exam · <b id="tClock">${fmtT(r.deadline-Date.now())}</b> left`:r.fb==='exam'?'Exam style':'Feedback after each'}</span></div>
  <div class="bar"><i style="width:${r.i/r.qs.length*100}%"></i></div>
  <div class="card" style="cursor:default;min-height:0">
    <div class="meta"><span>${esc(SHORT[c.sec]||c.sec)} · Q${c.num}${c.src&&!r.mock?' · '+esc(c.src):''}</span>${c.mock?'':starBtn(c.id)}</div>
    <p class="q">${esc(c.q)}</p>
    ${c.dia?`<div class="dia">${c.dia}</div>`:''}
    ${body}
    ${shown?`<div class="ans"><p class="verdict ${x.res?'ok':'bad'}">${x.res?'Correct':'Not quite'}</p>
      ${c.mc.order?`<ul>${c.a.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}
      ${c.why?`<p class="why"><b>Why</b>${esc(c.why)}</p>`:''}${c.note?`<p class="note"><b>Wording note</b>${esc(c.note)}</p>`:''}${c.ref?`<p class="ref"><b>Cert Guide</b>${refTxt(c.ref)}</p>`:''}</div>`:''}
  </div>
  <div class="btnrow">${shown?`<button type="button" class="go" id="tN">${r.i+1<r.qs.length?'Next question':'See results'}</button>`
    :`<button type="button" class="go" id="tS" ${ready?'':'disabled'}>${r.fb==='exam'?(r.i+1<r.qs.length?'Submit and next':'Submit and finish'):'Check answer'}</button>`}</div>
  <div class="nav"><button type="button" id="tQuit">End test now</button><span>${c.mc.order?'':`Keys 1–${x.o.length} pick · Enter submits`}</span></div>`;
  v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(x.res!==null)return;const k=+b.dataset.k;
    if(c.mc.order){const p=x.sel.indexOf(k);if(p>=0)x.sel=x.sel.slice(0,p);else x.sel.push(k)}
    else if(multi){x.sel=x.sel.includes(k)?x.sel.filter(y=>y!==k):(x.sel.length<need?[...x.sel,k]:x.sel)}
    else x.sel=[k];
    tSave();tQuestion(v)});
  if($('tS'))$('tS').onclick=tSubmit;
  if($('tN'))$('tN').onclick=tNext;
  let qa=false;
  $('tQuit').onclick=()=>{if(!qa){qa=true;$('tQuit').textContent=r.mock?'Tap again: unanswered count as wrong':'Tap again to end and mark';$('tQuit').style.color='var(--red)';return}tEnd()};
  if(r.mock){const tick=()=>{const left=r.deadline-Date.now();if(left<=0){tEnd();return}const el=$('tClock');if(el){el.textContent=fmtT(left);el.style.color=left<5*60000?'var(--red)':''}};
    if(r.deadline-Date.now()<=0)return tEnd();tTick=setInterval(tick,1000);tick()}
}

function tResults(v){
  const r=T.cur,qs=r.qs,ok=qs.filter(x=>x.res).length,pct=qs.length?Math.round(ok/qs.length*100):0;
  const by={};qs.forEach(x=>{const s=BYID[x.id].sec;by[s]=by[s]||{n:0,c:0};by[s].n++;if(x.res)by[s].c++});
  const secs=r.mock?DOMS.filter(d=>by[d]):Object.keys(by).sort((a,b)=>by[a].c/by[a].n-by[b].c/by[b].n);
  const lastM=r.mock?T.mocks[T.mocks.length-1]:null;
  const missed=qs.filter(x=>!x.res);
  v.innerHTML=`
  <div class="tpanel" style="align-items:flex-start">
    <span class="label">${r.mock?'Mock exam result':'Result'}</span>
    <p class="score">${pct}%</p>
    <p class="tsub">${ok} of ${qs.length} right${lastM?' in '+fmtT(lastM.used):''}${pct>=80?' · solid work':pct>=60?' · getting there':' · keep drilling the weak sections'}</p>
    <div class="btnrow" style="width:100%">${missed.length?`<button type="button" class="go" id="tRetry">Retry missed (${missed.length})</button>`:''}<button type="button" class="go alt" id="tNew">${r.mock?'Back to tests':'New test'}</button></div>
  </div>
  <div class="tpanel"><h2>${r.mock?'By exam area':'By section'}</h2><div class="weak">${secs.map(s=>{const p=Math.round(by[s].c/by[s].n*100),lo=p<60;
    return `<div class="wrow" style="cursor:default"><span class="nm">${esc(SHORT[s]||s)}</span><span class="pc${lo?' lo':''}">${p}%</span><span class="wb"><i class="${lo?'lo':''}" style="width:${p}%"></i></span><span class="dt">${by[s].c} of ${by[s].n} right</span></div>`}).join('')}</div></div>
  ${missed.length?`<div class="tpanel"><h2>Missed questions</h2><div>${missed.map(x=>{const c=BYID[x.id];
    const yours=c.mc.order?x.sel.map(k=>c.a[k].replace(/^\d+\.\s*/,'')).join(' → '):x.sel.map(k=>c.mc.o[k]).join(' / ');

let cExpand=false;
function cList(t,q){const p=t.replace(/\.$/,'').split(/;\s*/);return p.length>=3?`<ul class="clist">${p.map(x=>`<li>${hl(x,q)}</li>`).join('')}</ul>`:hl(t,q)}
function renderCheat(){
  const v=$('cheatView'),q=($('cq')?$('cq').value.trim():''),ql=q.toLowerCase();
  if(!$('cq')){
    v.innerHTML=`<input class="search" id="cq" type="search" placeholder="Filter terms and definitions" autocomplete="off">
    <div class="secnav"><p class="tsub" style="flex:1 1 200px">Key terms, design trade-offs and exam tips from the course's ENSLD 300-420 cheat sheet. Tap a topic to open it.</p><button type="button" class="tool" id="cExp">Expand all</button></div>
    <div id="cBody" style="display:flex;flex-direction:column;gap:10px"></div>`;
    $('cq').oninput=renderCheat;
    $('cExp').onclick=()=>{cExpand=!cExpand;v.querySelectorAll('#cBody details').forEach(d=>d.open=cExpand);$('cExp').textContent=cExpand?'Collapse all':'Expand all'};
  }
  const hit=t=>!ql||t.toLowerCase().includes(ql);
  let shown=0;
  const html=CHEAT.map(s=>{
    let inner='',count='';
    if(s.rows.length){const rows=s.rows.filter(r=>hit(r[0]+' '+r[1])||hit(s.title));if(ql&&!rows.length&&!hit(s.tip))return'';
      inner=`<dl class="terms">${rows.map(r=>`<div><dt>${hl(r[0],q)}</dt><dd>${cList(r[1],q)}</dd></div>`).join('')}</dl>`+(s.tip?`<p class="ctip"><b>Exam tip</b>${hl(s.tip,q)}</p>`:'');
      count=`${rows.length} ${s.n===16?'comparisons':'terms'}`}
    else if(s.qs.length){if(ql&&!s.qs.some(x=>hit(x.q+' '+x.o.join(' ')+' '+x.why)))return'';
      inner=s.qs.map((x,i)=>`<div class="cq" data-i="${i}"><p class="mq">${i+1}. ${hl(x.q,q)}</p><div class="opts">${x.o.map((o,k)=>`<button type="button" class="opt radio" data-k="${k}"><span class="bx"></span><span>${esc(o)}</span></button>`).join('')}</div><p class="why" hidden><b>Why</b>${esc(x.why)}</p></div>`).join('');
      count=`${s.qs.length} questions`}
    else if(s.pri.length){const ps=s.pri.filter(p=>hit(p[0]+' '+p[1]));if(ql&&!ps.length)return'';
      inner=`<dl class="terms">${ps.map(p=>`<div><dt>${hl(p[0],q)}</dt><dd>${hl(p[1],q)}</dd></div>`).join('')}</dl>${s.foot?`<p class="tsub">${esc(s.foot)}</p>`:''}`;count=`${ps.length} areas`}
    shown++;

  $('cBody').innerHTML=shown?html:`<p class="empty">Nothing matches "${esc(q)}".</p>`;
  $('cBody').querySelectorAll('.cq').forEach(box=>{const s=CHEAT.find(c=>c.qs.length),x=s.qs[+box.dataset.i];
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{box.querySelectorAll('.opt').forEach(o=>{o.disabled=true;const k=+o.dataset.k;if(k===x.a){o.classList.add('ok');o.querySelector('.bx').textContent='✓'}else if(o===b)o.classList.add('bad')});box.querySelector('.why').hidden=false})});
}

// backup / restore
function backup(){
  const data={app:'ensld-study',v:1,at:new Date().toISOString(),flash:S,test:T};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='ensld-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  $('bkMsg').textContent='Saved a backup file. Keep it somewhere you can reach from your other device.';
}
function restore(file){
  const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.app!=='ensld-study'||!d.flash)throw 0;
    localStorage.setItem(KEY,JSON.stringify(d.flash));localStorage.setItem(TKEY,JSON.stringify(d.test||{}));
    $('bkMsg').textContent='Progress restored. Reloading…';setTimeout(()=>location.reload(),600)}
    catch(e){$('bkMsg').textContent="That file isn't a progress backup from this course."}};rd.readAsText(file)}
$('bkSave').onclick=backup;$('bkLoad').onclick=()=>$('bkFile').click();$('bkFile').onchange=e=>{if(e.target.files[0])restore(e.target.files[0]);e.target.value=''};

  <div class="tpanel"><h2>Bookmarked</h2>${stars.length?`<div class="btnrow"><button type="button" class="go alt" id="sStar">Test bookmarked (${stars.filter(c=>c.mc).length})</button></div>`:'<p class="tsub">Tap ☆ on any question to bookmark it.</p>'}</div>`;
