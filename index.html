th d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"8\" y=\"14\" text-anchor=\"start\">JSON<\/text><text class=\"d-h\" x=\"184\" y=\"14\" text-anchor=\"start\">XML<\/text><rect class=\"d-box d-boxa\" x=\"6\" y=\"22\" width=\"170\" height=\"124\" rx=\"3\"/><rect class=\"d-box d-boxa\" x=\"182\" y=\"22\" width=\"172\" height=\"124\" rx=\"3\"/><text class=\"d-s\" x=\"14\" y=\"40\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace\" xml:space=\"preserve\">{<\/text><text class=\"d-s\" x=\"14\" y=\"55\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace\" xml:space=\"preserve\">  \"interface\": {<\/text><text class=\"d-s\" x=\"14\" y=\"70\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace\" xml:space=\"preserve\">    \"name\": \"Gi1\",<\/text><text class=\"d-s\" x=\"14\" y=\"85\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace\" xml:space=\"preserve\">    \"enabled\": true,<\/text><text class=\"d-s\" x=\"14\" y=\"100\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace\" xml:space=\"preserve\">    \"mtu\": 1500<\/text><text class=\"d-s\" x=\"14\" y=\"115\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace\" xml:space=\"preserve\">  }<\/text><text class=\"d-s\" x=\"14\" y=\"130\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace\" xml:space=\"preserve\">}<\/text><text class=\"d-s\" x=\"190\" y=\"40\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace\" xml:space=\"preserve\">&lt;interface&gt;<\/text><text class=\"d-s\" x=\"190\" y=\"55\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace\" xml:space=\"preserve\">  &lt;name&gt;Gi1&lt;/name&gt;<\/text><text class=\"d-s\" x=\"190\" y=\"70\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace\" xml:space=\"preserve\">  &lt;enabled&gt;true&lt;/enabled&gt;<\/text><text class=\"d-s\" x=\"190\" y=\"85\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace\" xml:space=\"preserve\">  &lt;mtu&gt;1500&lt;/mtu&gt;<\/text><text class=\"d-s\" x=\"190\" y=\"100\" style=\"font-family:ui-monospace,Menlo,Consolas,monospace\" xml:space=\"preserve\">&lt;/interface&gt;<\/text><text class=\"d-s\" x=\"180\" y=\"166\" text-anchor=\"middle\">Same data: name/value pairs in braces versus start and end tags<\/text><\/svg>"}, {"tbl": [["", "JSON", "XML"], ["Structure", "Name/value pairs, objects in { }, arrays in [ ]", "Data wrapped in start and end tags, nested in a hierarchy"], ["Tags", "No tags", "Tags are made up by the author (unlike HTML, whose tags are fixed)"], ["Validation", "A JSON schema describes valid input", "An XML schema does the same"], ["Used by", "RESTCONF, gRPC; increasingly supported on Cisco platforms", "NETCONF, RESTCONF"]]}, {"p": "XML is related to HTML, but HTML was designed to display data, while XML describes and carries it. In Python's ElementTree library, find() looks up a tag in an XML tree (strictly it searches by path; iter() or findall('.//tag') walk the whole tree)."}, {"check": [2, 13, 28, 3, 4, 14]}]}, {"h": "Data models and the stack", "b": [{"p": "A data model is an agreed way of describing something: which pieces of data exist, their types, and their allowed values. It defines the syntax and semantics, including constraints, of working with the API. For networks, the data modelling language is YANG. A YANG model says, for example, that an interface has a name (a string), an enabled flag (true or false) and an MTU within a certain range."}, {"ul": ["Containers group related nodes.", "Lists hold repeated entries identified by a key (such as one entry per interface, keyed by name).", "Leafs hold a single value, like a name or description."]}, {"p": "YANG models come from three main sources: IETF (standard models), OpenConfig (vendor-neutral models written by network operators) and Cisco native models (covering every platform feature)."}, {"dia": "<svg viewBox=\"0 0 360 222\" role=\"img\" aria-label=\"The model-driven programmability stack, from YANG data models at the bottom through transport, protocol and encoding to APIs and apps\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><rect class=\"d-box\" x=\"40\" y=\"8\" width=\"280\" height=\"28\" rx=\"3\"/><text class=\"d-t\" x=\"56\" y=\"26\">Apps<\/text><text class=\"d-s\" x=\"304\" y=\"26\" text-anchor=\"end\">scripts, controllers, tools<\/text><rect class=\"d-box\" x=\"40\" y=\"40\" width=\"280\" height=\"28\" rx=\"3\"/><text class=\"d-t\" x=\"56\" y=\"58\">APIs<\/text><text class=\"d-s\" x=\"304\" y=\"58\" text-anchor=\"end\">model-driven APIs<\/text><rect class=\"d-box\" x=\"40\" y=\"72\" width=\"280\" height=\"28\" rx=\"3\"/><text class=\"d-t\" x=\"56\" y=\"90\">Encoding<\/text><text class=\"d-s\" x=\"304\" y=\"90\" text-anchor=\"end\">XML · JSON<\/text><rect class=\"d-box d-boxa\" x=\"40\" y=\"104\" width=\"280\" height=\"28\" rx=\"3\"/><text class=\"d-t\" x=\"56\" y=\"122\">Protocol<\/text><text class=\"d-s\" x=\"304\" y=\"122\" text-anchor=\"end\">NETCONF · RESTCONF · gRPC<\/text><rect class=\"d-box\" x=\"40\" y=\"136\" width=\"280\" height=\"28\" rx=\"3\"/><text class=\"d-t\" x=\"56\" y=\"154\">Transport<\/text><text class=\"d-s\" x=\"304\" y=\"154\" text-anchor=\"end\">SSH · HTTP(S) · TLS<\/text><rect class=\"d-box d-boxa\" x=\"40\" y=\"168\" width=\"280\" height=\"28\" rx=\"3\"/><text class=\"d-t\" x=\"56\" y=\"186\">Data models<\/text><text class=\"d-s\" x=\"304\" y=\"186\" text-anchor=\"end\">YANG: IETF · OpenConfig · native<\/text><text class=\"d-s\" x=\"180\" y=\"214\" text-anchor=\"middle\">The model defines the data; everything above just carries or uses it<\/text><\/svg>"}, {"p": "Keep the layers straight: YANG is a model, not a protocol. NETCONF, RESTCONF and gRPC are protocols. JSON and XML are encodings. SSH and HTTP are transports. NETCONF and RESTCONF are the protocols fully driven by YANG, and YANG was originally written for NETCONF, so the two are tightly coupled."}, {"check": [12, 15, 23, 24, 27, 0, 6, 16, 5]}]}, {"h": "REST and HTTP verbs", "b": [{"p": "REST is a simple web-style API that uses HTTP methods to create, read, update and delete (CRUD) resources:"}, {"tbl": [["HTTP verb", "Action", "Safe?"], ["GET", "Read", "Yes: changes nothing"], ["POST", "Create a new resource (in RESTCONF, also invoke a YANG RPC operation)", "No"], ["PUT", "Create or replace the whole resource", "No"], ["PATCH", "Merge changes into part of a resource", "No"], ["DELETE", "Remove", "No"]]}, {"tip": "The course question says POST is used for \"NETCONF RPCs\". It's really RESTCONF using POST to invoke YANG-defined RPCs; NETCONF itself runs over SSH."}, {"check": [7, 17, 20]}]}, {"h": "NETCONF", "b": [{"p": "NETCONF (RFC 6241, first published in 2006) was designed for transactional configuration management, to fix SNMP's weaknesses there."}, {"ul": ["Transport: SSH (port 830). Encoding: XML.", "Every request is wrapped in an <rpc> message and answered with <rpc-reply>.", "Operations inside those include <get> (config and state), <get-config>, <edit-config> (load all or part of a configuration into a datastore), <copy-config>, <lock> and <commit>.", "Datastores: running, startup and candidate.", "Transactions: if one part of a multi-part change fails, the whole change fails, so you never end up with half a configuration. It can even apply a change across many devices as one network-wide transaction."]}, {"check": [8, 18, 19, 25]}]}, {"h": "RESTCONF", "b": [{"p": "RESTCONF (RFC 8040, 2017) combines the simplicity of HTTP with the predictability of a YANG schema-driven API. It runs over HTTPS and encodes data in XML or JSON, mapping CRUD to HTTP verbs on NETCONF-style datastores. It has no transactions or locks; each change applies directly."}, {"p": "URIs look like /restconf/data/<module:container>. The mandatory {+restconf}/data resource represents the combined configuration and operational state a client can access; {+restconf}/operations holds the RPCs."}, {"check": [26, 9]}]}, {"h": "gRPC", "b": [{"p": "gRPC is an open-source RPC framework from Google, implemented on Cisco IOS XE (and IOS XR). For network management it's a functional subset of NETCONF, it makes client development simple (client code is generated from the service definitions), and it's fast. Its operations include GetConfig (read), MergeConfig and ReplaceConfig (YANG-modelled data), and CliConfig, which merges configuration given in CLI format."}, {"check": [10, 21, 22]}]}, {"h": "Key takeaways", "b": [{"ul": ["APIs are more robust than CLI scraping or SNMP. Next-generation interfaces: open APIs (REST, RESTCONF, NETCONF, gRPC) over secure transports (HTTP, SSH, TLS).", "Encodings: JSON (name/value, {} and []) and XML (author-defined tags). HTML displays; XML carries.", "A data model defines syntax, semantics and constraints. YANG: containers, lists (keyed), leafs. Sources: IETF, OpenConfig, Cisco native.", "Stack: model, transport, protocol, encoding, API, apps. JSON isn't a protocol; YANG isn't a transport.", "POST creates (not safe), PUT replaces, PATCH merges, GET reads.", "NETCONF: SSH 830, XML, <rpc>/<rpc-reply>, <edit-config>, transactions. RESTCONF: HTTPS, XML or JSON, {+restconf}/data, no transactions.", "gRPC on IOS XE: subset of NETCONF, easy clients, CliConfig for CLI text."]}, {"tip": "Common traps: NETCONF and RESTCONF are the YANG-driven protocols, not JSON or XML. <get> is an operation, not a message type."}]}], "verified": [["APIs for software-to-software communication; REST uses GET, POST, PUT, DELETE", "p. 642–643"], ["NETCONF (2006) uses SSH and XML with YANG; RESTCONF (2017) supports XML and JSON with YANG", "p. 643"], ["gRPC is a functional subset of NETCONF and supports CLI data", "p. 644"], ["JSON name/value pairs, objects {} and arrays []; XML tags designed to store and transport data", "p. 644–645"], ["Model-driven stack: YANG models, SSH/HTTP transports, NETCONF/RESTCONF/gRPC protocols, JSON/XML encodings, APIs, apps", "p. 647"], ["CRUD with HTTP verbs", "p. 648"], ["YANG (RFC 6020): modules, containers, lists, leafs with types", "p. 650–651"], ["NETCONF (RFC 6241): XML RPCs, running/candidate/startup datastores, transactions, SSH", "p. 653–655"], ["RESTCONF (RFC 8040): HTTP CRUD on YANG data, XML or JSON; no transactions or locks", "p. 656–658"], ["IETF, OpenConfig and Cisco YANG models", "p. 659–660"]], "course": ["Attributes of next-generation programmatic interfaces", "JSON schema and Cisco JSON support; ElementTree find()", "Safe and unsafe HTTP verbs; PATCH", "<rpc>/<rpc-reply> versus operations; NETCONF port 830", "{+restconf}/data resource", "gRPC operations including CliConfig"]}, "Designing an IPv4 Address Plan": {"mins": 17, "intro": "How to build an IPv4 address plan that scales: subnetting and VLSM, a hierarchy that summarizes cleanly, addressing standards, voice and overlay subnets, NAT, and how addresses get handed out.", "parts": [{"h": "What a good address plan does", "b": [{"p": "An address plan is the foundation everything else sits on. Routing summaries, firewall rules, QoS policies and troubleshooting all get easier or harder depending on how addresses were laid out."}, {"p": "A good plan does four things:"}, {"ul": ["Gives every device an address, including the things nobody thinks of at first: phones, wireless, cameras, badge readers, building systems, loopbacks and management.", "Leaves room to grow. Sites get new services all the time, so size subnets for where they'll be, not where they are.", "Lets you summarize, so each site or region is advertised as one route.", "Makes traffic types easy to tell apart, so filters and QoS can match a whole range instead of individual hosts."]}, {"p": "The first step is the topology. Before choosing a single subnet, count the locations, the devices per location, and what each site needs (data, voice, wireless, video and so on)."}, {"tip": "Balance growth against waste. For 50 users, a /26 (62 hosts) is tight and a /25 (126) leaves room, but oversizing every subnet burns the space you'll later want for voice or video."}, {"check": [0]}]}, {"h": "IPv4 essentials", "b": [{"p": "A quick refresher on the pieces the exam expects you to know cold."}, {"ul": ["An IPv4 address is 32 bits, written as four decimal octets (10.1.1.1).", "The header is 20 bytes without options. Key fields: TTL (decremented by each router, packet dropped at 0), Protocol (what's inside, such as 6 for TCP or 89 for OSPF), and the ToS byte.", "The ToS byte (now called the DiffServ field) carries QoS markings. DSCP uses its upper 6 bits.", "Old classful ranges still show up in questions: Class D (224 to 239) is multicast, and Class E (240 and up) is reserved."]}, {"p": "RFC 1918 reserves three ranges for private use. They aren't routed on the internet, so you reach the internet through NAT."}, {"tbl": [["Range", "Prefix", "Typical use"], ["10.0.0.0 to 10.255.255.255", "10.0.0.0/8", "Large enterprises: room for a full hierarchy"], ["172.16.0.0 to 172.31.255.255", "172.16.0.0/12", "Mid-size networks, or a second range alongside 10/8"], ["192.168.0.0 to 192.168.255.255", "192.168.0.0/16", "Small sites and home routers"]]}, {"tip": "172.16.0.0/12 stops at 172.31. An address like 172.32.1.1 is public, and that's a classic distractor."}, {"check": [11, 12, 13]}]}, {"h": "Subnetting and VLSM", "b": [{"p": "A subnet mask splits an address into a network part and a host part. With n host bits you get 2ⁿ − 2 usable hosts, since the all-zeros address is the subnet itself and the all-ones address is the broadcast."}, {"tbl": [["Prefix", "Mask", "Usable hosts", "Typical use"], ["/22", "255.255.252.0", "1,022", "Large LAN"], ["/23", "255.255.254.0", "510", "Large LAN"], ["/24", "255.255.255.0", "254", "Standard user VLAN"], ["/25", "255.255.255.128", "126", "Floor with room to grow"], ["/26", "255.255.255.192", "62", "Small LAN"], ["/27", "255.255.255.224", "30", "Small LAN"], ["/28", "255.255.255.240", "14", "Small device group"], ["/30", "255.255.255.252", "2", "Router-to-router link"], ["/32", "255.255.255.255", "1 (the address itself)", "Loopback"]]}, {"p": "Variable-length subnet masking (VLSM) means using different mask lengths inside the same network, sizing each subnet to what it actually needs. You carve a big block into site blocks, then carve each site block into data, voice, wireless, point-to-point and loopback subnets."}, {"ul": ["Point-to-point links get a /30 (two usable addresses). Many platforms also support /31, which saves two more.", "Loopbacks get a /32: one address that identifies the router."]}, {"p": "Loopbacks are worth their own reserved range. They never go down as long as the router has any working path, so they're the right address for router IDs, management access, monitoring sources, BGP peerings and voice gateways (for example, dial peers)."}, {"check": [17, 14, 8, 4]}]}, {"h": "Build it as a hierarchy", "b": [{"p": "The single most important rule: give each part of the network one contiguous block, and carve smaller blocks out of it. Company, then region, then site, then VLAN."}, {"dia": "<svg viewBox=\"0 0 360 240\" role=\"img\" aria-label=\"Hierarchical IPv4 allocation: company /8, regional /10s, a site /20, and /24 VLANs\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><rect class=\"d-box d-boxa\" x=\"105.0\" y=\"6\" width=\"150\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"180\" y=\"20\" text-anchor=\"middle\">10.0.0.0/8<\/text><text class=\"d-s\" x=\"180\" y=\"33\" text-anchor=\"middle\">Whole company<\/text><line class=\"d-ln\" x1=\"180\" y1=\"40\" x2=\"64\" y2=\"64\"/><rect class=\"d-box\" x=\"10.0\" y=\"64\" width=\"108\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"64\" y=\"78\" text-anchor=\"middle\">10.0.0.0/10<\/text><text class=\"d-s\" x=\"64\" y=\"91\" text-anchor=\"middle\">Americas<\/text><line class=\"d-ln\" x1=\"180\" y1=\"40\" x2=\"180\" y2=\"64\"/><rect class=\"d-box\" x=\"126.0\" y=\"64\" width=\"108\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"180\" y=\"78\" text-anchor=\"middle\">10.64.0.0/10<\/text><text class=\"d-s\" x=\"180\" y=\"91\" text-anchor=\"middle\">Europe<\/text><line class=\"d-ln\" x1=\"180\" y1=\"40\" x2=\"296\" y2=\"64\"/><rect class=\"d-box\" x=\"242.0\" y=\"64\" width=\"108\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"296\" y=\"78\" text-anchor=\"middle\">10.128.0.0/10<\/text><text class=\"d-s\" x=\"296\" y=\"91\" text-anchor=\"middle\">Asia-Pacific<\/text><line class=\"d-ln\" x1=\"64\" y1=\"98\" x2=\"64\" y2=\"120\"/><rect class=\"d-box\" x=\"10.0\" y=\"120\" width=\"108\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"64\" y=\"134\" text-anchor=\"middle\">10.0.16.0/20<\/text><text class=\"d-s\" x=\"64\" y=\"147\" text-anchor=\"middle\">Ottawa site<\/text><line class=\"d-ln\" x1=\"64\" y1=\"154\" x2=\"70\" y2=\"178\"/><rect class=\"d-box\" x=\"20.0\" y=\"178\" width=\"100\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"70\" y=\"192\" text-anchor=\"middle\">10.0.16.0/24<\/text><text class=\"d-s\" x=\"70\" y=\"205\" text-anchor=\"middle\">Data<\/text><line class=\"d-ln\" x1=\"64\" y1=\"154\" x2=\"180\" y2=\"178\"/><rect class=\"d-box\" x=\"130.0\" y=\"178\" width=\"100\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"180\" y=\"192\" text-anchor=\"middle\">10.0.20.0/24<\/text><text class=\"d-s\" x=\"180\" y=\"205\" text-anchor=\"middle\">Voice<\/text><line class=\"d-ln\" x1=\"64\" y1=\"154\" x2=\"290\" y2=\"178\"/><rect class=\"d-box\" x=\"240.0\" y=\"178\" width=\"100\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"290\" y=\"192\" text-anchor=\"middle\">10.0.24.0/24<\/text><text class=\"d-s\" x=\"290\" y=\"205\" text-anchor=\"middle\">Wireless<\/text><text class=\"d-s\" x=\"130\" y=\"134\">The site advertises one route (its /20);<\/text><text class=\"d-s\" x=\"130\" y=\"146\">the region advertises one /10.<\/text><text class=\"d-s\" x=\"180\" y=\"232\" text-anchor=\"middle\">Each level owns one contiguous block, so each level can be summarized<\/text><\/svg>"}, {"p": "Compare that with a network where subnets were handed out as needed: 10.10.4.0/24 in Asia, 10.10.6.0/24 in the Americas, 10.10.8.0/24 in Europe. Nothing can be summarized, routing tables grow with every new subnet, and nobody can tell where a subnet lives just by looking at it."}, {"p": "A typical large site might get a /20, which is sixteen /24s. A common pattern is four for data, four for voice, four for wireless, and the rest for links, loopbacks and management. Matching the subnet to the VLAN number (10.10.150.0 for VLAN 150) makes the plan almost self-documenting."}, {"p": "Worked example: 16 branches share a /16, and each needs up to 12 /24 networks. Twelve rounds up to sixteen (a power of two), and sixteen /24s make a /20. Sixteen /20s fit exactly in a /16, so each branch gets one /20 and is advertised as a single route."}, {"check": [15, 19, 2, 7]}]}, {"h": "Summarization", "b": [{"p": "A summary replaces a run of contiguous subnets with one shorter prefix. It shrinks routing tables, cuts update traffic, and hides flaps inside the summarized block."}, {"p": "To work out a summary by hand:"}, {"ul": ["Find the first octet where the first and last subnets differ.", "Count how many values that octet spans (last − first + 1) and round up to a power of two. That tells you how many bits to take off.", "Check that the first subnet sits on that boundary (it's a multiple of the block size). If it doesn't, one summary won't cover the range exactly."]}, {"tbl": [["Range", "Differing octet", "Span", "Summary"], ["10.3.8.0 to 10.3.15.0", "3rd: 8 to 15", "8 = 2³, take 3 bits off /24", "10.3.8.0/21"], ["192.168.8.0 to 192.168.11.0", "3rd: 8 to 11", "4 = 2², take 2 bits off /24", "192.168.8.0/22"], ["10.10.128.0 to 10.10.191.0", "3rd: 128 to 191", "64 = 2⁶, take 6 bits off /24", "10.10.128.0/18"]]}, {"p": "The last row is the Cert Guide's site example: data, voice, wireless, badge and server subnets spread across 10.10.130 to 10.10.176 all sit inside 10.10.128.0/18, so the whole site is advertised as one route, provided the site owns that entire block."}, {"tip": "The course phrases the method as \"subtract the first octet that is different and round up to a power of 2\". Strictly it's last − first + 1 (8 to 15 is eight values, not seven), but rounding up to the power of two gives the same mask either way."}, {"check": [1]}]}, {"h": "Standards and the three-step process", "b": [{"p": "The Cert Guide frames an address plan as three steps:"}, {"ul": ["Define addressing standards.", "Plan the IPv4 range and allocate it.", "Document the plan."]}, {"p": "Standards are the conventions everyone follows, so anyone can read an address and know what it is. Common ones:"}, {"ul": ["The default gateway is always .1 (or always .254).", "The VLAN number matches the third octet (VLAN 150 uses 10.10.150.0).", "Reserve the low addresses (say .1 to .15) for static devices and give the rest to the DHCP pool.", "User subnets come from 10.x.x.x and are /24s, with a parallel /24 for voice.", "Name DHCP-assigned ranges in DNS by location (bldg2-floor3), since the host addresses inside them keep changing."]}, {"p": "In the Cert Guide's campus case study, floor 1 of building A gets VLAN 11 with 10.10.11.0/24 for data and VLAN 111 with 10.10.111.0/24 for voice. Building B uses the 20s and 120s. Point-to-point links come from 10.10.2.0/24 as /30s, loopbacks from 10.10.1.0/24 as /32s, and 10.10.3.0/24 is set aside for access control."}, {"check": [6]}]}, {"h": "Voice and overlay subnets", "b": [{"p": "IP phones belong in their own VLAN and subnet, separate from the PCs. It makes QoS simple (match the whole voice subnet), lets you filter what can reach the phones, and makes troubleshooting easier."}, {"p": "But what if the existing plan has no spare subnets left for voice? That's where overlay subnets come in. You add a second, separate private range on top of the existing plan, for example 172.16.x.x for voice alongside 10.x.x.x for data, instead of readdressing the data network."}, {"ul": ["The requirement: an extra private address space that isn't used anywhere else.", "The benefit: scalability in a network that was never designed for the new service.", "A bonus: a different range for each traffic type makes filters and QoS rules easy to write."]}, {"check": [3, 10]}]}, {"h": "Public addresses, NAT and PAT", "b": [{"p": "Inside the enterprise, use private addresses. Use public addresses only where something faces the internet: public web and DNS servers, e-commerce, and VPN termination."}, {"ul": ["Static NAT (one-to-one) is for internal servers that must be reachable from outside.", "PAT (many-to-one, using port numbers) is for users browsing out. One public address can carry thousands of sessions.", "DMZ servers can simply be given public addresses, which avoids NAT for them altogether."]}, {"tbl": [["NAT term", "Meaning"], ["Inside local", "The real (usually private) address of your host"], ["Inside global", "What your host is translated to on the outside"], ["Outside global", "The real address of the remote host on the internet"], ["Outside local", "How that remote host appears from inside your network"]]}, {"p": "Overlapping addresses happen in mergers, when both companies used the same private ranges. Readdressing is the cleanest fix because it removes the overlap for good. In practice, NAT is often used as a workaround, or the new network is given a different private range, because readdressing a live network is disruptive."}, {"tip": "If the question asks for the cleanest solution to overlap, the answer is readdressing. If it asks what avoids readdressing, it's NAT or another private range."}, {"check": [16, 5, 9]}]}, {"h": "Handing out addresses", "b": [{"p": "Infrastructure gets static addresses: routers, switches, servers, printers, anything you need to manage at a fixed address. End devices (PCs, phones, wireless clients, even access points) get theirs from DHCP."}, {"p": "The DHCP exchange is DORA:"}, {"ul": ["Discover: the client broadcasts to 255.255.255.255 looking for a server.", "Offer: a server offers an address, lease time and options.", "Request: the client asks for (accepts) that offer.", "Acknowledge: the server confirms the lease. A NAK means it refused."]}, {"p": "DHCP runs over UDP, with the server on port 67 and the client on port 68. Routers don't forward broadcasts, so when the server is on another subnet, the client's gateway acts as a relay agent (ip helper-address on Cisco). Place DHCP servers in the data centre or server farm, and at branches."}, {"check": [18]}]}, {"h": "Key takeaways", "b": [{"ul": ["Start from the topology: count locations, devices and services, then size for growth.", "Know the RFC 1918 ranges: 10/8, 172.16/12 (ends at 172.31) and 192.168/16.", "Hosts = 2ⁿ − 2. Use /30 (or /31) for point-to-point links and /32 for loopbacks; /24 for user VLANs.", "Allocate hierarchically with contiguous blocks (company, region, site, VLAN) so each level summarizes to one route.", "To summarize, find the differing octet, round its span up to a power of two, and take that many bits off.", "Set standards (gateway .1, VLAN = third octet, a static range) and document the plan.", "Put voice on separate subnets. Overlay subnets need an extra private range and avoid readdressing.", "Private addresses inside. Static NAT for servers, PAT for users, public addresses in the DMZ. Readdressing is the cleanest fix for overlap.", "Static addresses for infrastructure, DHCP (DORA, UDP 67/68, relay) for clients."]}, {"tip": "Common traps: 172.32.x.x is not private. A /26 has 62 usable hosts, not 64. NAT hides overlapping ranges but doesn't fix them."}]}], "verified": [["IPv4 header is 20 bytes without options; ToS field carries IP precedence/DSCP; TTL and Protocol fields", "p. 44–46"], ["Class D is multicast, Class E reserved", "p. 58"], ["RFC 1918 ranges 10/8, 172.16/12, 192.168/16, and which size of organization tends to use each", "p. 60"], ["NAT vs PAT; static and dynamic NAT; overlapping networks; inside/outside local/global terms", "p. 61–63"], ["Hosts = 2ⁿ − 2; /24 common on LANs, /30 on point-to-point links, /32 on loopbacks", "p. 65–68"], ["Factors for an address plan: number of locations and devices, site requirements, subnet size", "p. 66–67"], ["VLSM: size each subnet to its need; carve site blocks into data, voice, wireless, links and loopbacks", "p. 70–72"], ["Reasons to use loopbacks: always up, router ID, management, IP telephony dial peers, monitoring source", "p. 73"], ["Separate voice subnets for QoS and troubleshooting; overlay subnets use a different private range", "p. 73–74"], ["Large site gets a /20 split into data, voice and wireless /24s", "p. 75–76"], ["Plan for growth; balance scalability against efficiency (the /25 vs /26 example)", "p. 77"], ["New design is cleanest, but avoid readdressing in practice: use another private range or NAT", "p. 78"], ["Summarize a site as 10.10.128.0/18; allocate contiguous blocks per region. (The book labels its regional example blocks /18; the ranges it describes only add up as /10s, which is what this lesson uses.)", "p. 78–80"], ["Public addresses only on internet-facing services; static NAT for servers, PAT for clients", "p. 80–81"], ["Three steps: define standards, plan and allocate, document; standards such as gateway .1/.254, VLAN = third octet, static .1–.15", "p. 81–82"], ["Campus case study: VLAN 11/111 for data and voice, /30 links from 10.10.2.0/24, loopbacks from 10.10.1.0/24", "p. 83–85"], ["Static addressing for infrastructure, DHCP for clients; DORA; UDP 67/68; relay agents; where to place DHCP servers", "p. 86–89"]], "course": ["Determining the summary mask by \"subtracting the differing octet and rounding up to a power of 2\" (the lesson explains the exact form)", "Naming DHCP ranges in DNS by location", "\"User subnets from 10.x.x.x/24\" as a standard (the book recommends /24s for users without naming a range)", "Readdressing as the cleanest fix for overlapping ranges (the book agrees it's cleanest but recommends avoiding it)", "/31 point-to-point links"]}, "Designing Enterprise Campus LAN": {"mins": 13, "intro": "A campus network is the wired network across a site's buildings. This lesson covers the three-layer model it's built on, where VLANs should live, the four ways to build the access layer, sizing for small and medium campuses, PoE, and a quick look at cloud models.", "parts": [{"h": "Three layers, three jobs", "b": [{"p": "Cisco's campus design splits the switches into three layers, each with one main job. It's like a road network: local streets (access), main roads that connect neighbourhoods and enforce the rules (distribution), and the motorway between them all (core)."}, {"dia": "<svg viewBox=\"0 0 360 218\" role=\"img\" aria-label=\"Three-layer campus hierarchy: core, distribution and access switches\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><line class=\"d-ln\" x1=\"40\" y1=\"96\" x2=\"100\" y2=\"34\"/><line class=\"d-ln\" x1=\"40\" y1=\"96\" x2=\"150\" y2=\"34\"/><line class=\"d-ln\" x1=\"90\" y1=\"96\" x2=\"100\" y2=\"34\"/><line class=\"d-ln\" x1=\"90\" y1=\"96\" x2=\"150\" y2=\"34\"/><line class=\"d-ln\" x1=\"160\" y1=\"96\" x2=\"100\" y2=\"34\"/><line class=\"d-ln\" x1=\"160\" y1=\"96\" x2=\"150\" y2=\"34\"/><line class=\"d-ln\" x1=\"210\" y1=\"96\" x2=\"100\" y2=\"34\"/><line class=\"d-ln\" x1=\"210\" y1=\"96\" x2=\"150\" y2=\"34\"/><line class=\"d-ln\" x1=\"100\" y1=\"34\" x2=\"150\" y2=\"34\"/><line class=\"d-ln d-dash\" x1=\"30\" y1=\"158\" x2=\"40\" y2=\"96\"/><line class=\"d-ln d-dash\" x1=\"30\" y1=\"158\" x2=\"90\" y2=\"96\"/><line class=\"d-ln d-dash\" x1=\"65\" y1=\"158\" x2=\"40\" y2=\"96\"/><line class=\"d-ln d-dash\" x1=\"65\" y1=\"158\" x2=\"90\" y2=\"96\"/><line class=\"d-ln d-dash\" x1=\"100\" y1=\"158\" x2=\"40\" y2=\"96\"/><line class=\"d-ln d-dash\" x1=\"100\" y1=\"158\" x2=\"90\" y2=\"96\"/><line class=\"d-ln d-dash\" x1=\"150\" y1=\"158\" x2=\"160\" y2=\"96\"/><line class=\"d-ln d-dash\" x1=\"150\" y1=\"158\" x2=\"210\" y2=\"96\"/><line class=\"d-ln d-dash\" x1=\"185\" y1=\"158\" x2=\"160\" y2=\"96\"/><line class=\"d-ln d-dash\" x1=\"185\" y1=\"158\" x2=\"210\" y2=\"96\"/><line class=\"d-ln d-dash\" x1=\"220\" y1=\"158\" x2=\"160\" y2=\"96\"/><line class=\"d-ln d-dash\" x1=\"220\" y1=\"158\" x2=\"210\" y2=\"96\"/><line class=\"d-ln\" x1=\"40\" y1=\"96\" x2=\"90\" y2=\"96\"/><line class=\"d-ln\" x1=\"160\" y1=\"96\" x2=\"210\" y2=\"96\"/><rect class=\"d-rt\" x=\"86\" y=\"26\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M92 32h16M92 37h16\"/><rect class=\"d-rt\" x=\"136\" y=\"26\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M142 32h16M142 37h16\"/><rect class=\"d-rt\" x=\"26\" y=\"88\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M32 94h16M32 99h16\"/><rect class=\"d-rt\" x=\"76\" y=\"88\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M82 94h16M82 99h16\"/><rect class=\"d-rt\" x=\"146\" y=\"88\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M152 94h16M152 99h16\"/><rect class=\"d-rt\" x=\"196\" y=\"88\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M202 94h16M202 99h16\"/><rect class=\"d-rt\" x=\"16\" y=\"150\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M22 156h16M22 161h16\"/><rect class=\"d-rt\" x=\"51\" y=\"150\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M57 156h16M57 161h16\"/><rect class=\"d-rt\" x=\"86\" y=\"150\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M92 156h16M92 161h16\"/><rect class=\"d-rt\" x=\"136\" y=\"150\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M142 156h16M142 161h16\"/><rect class=\"d-rt\" x=\"171\" y=\"150\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M177 156h16M177 161h16\"/><rect class=\"d-rt\" x=\"206\" y=\"150\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M212 156h16M212 161h16\"/><text class=\"d-h\" x=\"250\" y=\"32\">CORE<\/text><text class=\"d-s\" x=\"250\" y=\"46\">fast transport<\/text><text class=\"d-h\" x=\"250\" y=\"94\">DISTRIBUTION<\/text><text class=\"d-s\" x=\"250\" y=\"108\">policy, routing<\/text><text class=\"d-h\" x=\"250\" y=\"156\">ACCESS<\/text><text class=\"d-s\" x=\"250\" y=\"170\">users plug in<\/text><text class=\"d-s\" x=\"65\" y=\"186\" text-anchor=\"middle\">building 1<\/text><text class=\"d-s\" x=\"185\" y=\"186\" text-anchor=\"middle\">building 2<\/text><text class=\"d-s\" x=\"180\" y=\"210\" text-anchor=\"middle\">Solid = routed (Layer 3) links · dashed = Layer 2 trunks<\/text><\/svg>"}, {"tbl": [["Layer", "Job", "Typical features"], ["Core (backbone)", "Move traffic between distribution blocks as fast and reliably as possible", "Redundancy, low latency, consistent diameter; no CPU-heavy filtering"], ["Distribution", "Aggregate access switches and apply policy", "Routing between VLANs, route summarization, ACLs, QoS policy, FHRPs"], ["Access", "Connect users and devices", "Layer 2 switching, PoE, port security, QoS marking, voice VLANs"]]}, {"p": "The benefits are cost savings, a design that's easy to understand, modular growth (add another identical block), and better fault isolation. The layers don't have to be separate boxes. Small sites often collapse the core and distribution into one switch pair."}]}, {"h": "Local versus end-to-end VLANs", "b": [{"p": "A VLAN is a group of ports that share one broadcast domain, usually one IP subnet. The design question is how far a VLAN should stretch."}, {"tbl": [["", "Local VLANs (recommended)", "End-to-end VLANs"], ["Span", "One wiring closet or switch block", "The whole campus"], ["When a user moves", "They get a new VLAN and subnet at the new location", "They keep the same VLAN everywhere"], ["Pros", "Scalable, predictable traffic flow, easy troubleshooting, small failure domains, fast convergence", "Users keep their VLAN anywhere"], ["Cons", "—", "Hard to scale and manage; large broadcast and STP domains"]]}, {"p": "With local VLANs, the Layer 2/Layer 3 boundary sits at the distribution layer, which is where summaries, QoS and segmentation get applied."}, {"check": [0, 4]}]}, {"h": "Four ways to build the access layer", "b": [{"p": "The big decision is where Layer 2 stops and routing begins. Each option moves that line or changes how redundancy works:"}, {"dia": "<svg viewBox=\"0 0 360 316\" role=\"img\" aria-label=\"The four access-layer designs: traditional Layer 2, updated Layer 2, Layer 3 and hybrid\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"4\" y=\"12\" text-anchor=\"start\">TRADITIONAL LAYER 2<\/text><line class=\"d-ln d-dash\" x1=\"50\" y1=\"46\" x2=\"126\" y2=\"46\"/><line class=\"d-ln d-dash\" x1=\"50\" y1=\"112\" x2=\"50\" y2=\"46\"/><line class=\"d-ln d-dash\" x1=\"126\" y1=\"112\" x2=\"50\" y2=\"46\"/><line class=\"d-ln d-red\" x1=\"50\" y1=\"112\" x2=\"126\" y2=\"46\"/><line class=\"d-ln d-red\" x1=\"126\" y1=\"112\" x2=\"126\" y2=\"46\"/><text class=\"d-s\" x=\"88\" y=\"138\" text-anchor=\"middle\">STP blocks one uplink<\/text><rect class=\"d-rt\" x=\"36\" y=\"38\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M42 44h16M42 49h16\"/><rect class=\"d-rt\" x=\"112\" y=\"38\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M118 44h16M118 49h16\"/><rect class=\"d-rt\" x=\"36\" y=\"104\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M42 110h16M42 115h16\"/><rect class=\"d-rt\" x=\"112\" y=\"104\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M118 110h16M118 115h16\"/><text class=\"d-h\" x=\"184\" y=\"12\" text-anchor=\"start\">UPDATED LAYER 2<\/text><rect class=\"d-box d-boxa\" x=\"208\" y=\"30\" width=\"120\" height=\"32\" rx=\"3\"/><line class=\"d-ln d-dash\" x1=\"230\" y1=\"112\" x2=\"230\" y2=\"46\"/><line class=\"d-ln d-dash\" x1=\"230\" y1=\"112\" x2=\"306\" y2=\"46\"/><line class=\"d-ln d-dash\" x1=\"306\" y1=\"112\" x2=\"230\" y2=\"46\"/><line class=\"d-ln d-dash\" x1=\"306\" y1=\"112\" x2=\"306\" y2=\"46\"/><text class=\"d-s\" x=\"268\" y=\"138\" text-anchor=\"middle\">pair = one logical switch<\/text><rect class=\"d-rt\" x=\"216\" y=\"38\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M222 44h16M222 49h16\"/><rect class=\"d-rt\" x=\"292\" y=\"38\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M298 44h16M298 49h16\"/><rect class=\"d-rt\" x=\"216\" y=\"104\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M222 110h16M222 115h16\"/><rect class=\"d-rt\" x=\"292\" y=\"104\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M298 110h16M298 115h16\"/><text class=\"d-h\" x=\"4\" y=\"166\" text-anchor=\"start\">LAYER 3 (ROUTED)<\/text><line class=\"d-ln\" x1=\"50\" y1=\"200\" x2=\"126\" y2=\"200\"/><line class=\"d-ln\" x1=\"50\" y1=\"266\" x2=\"50\" y2=\"200\"/><line class=\"d-ln\" x1=\"50\" y1=\"266\" x2=\"126\" y2=\"200\"/><line class=\"d-ln\" x1=\"126\" y1=\"266\" x2=\"50\" y2=\"200\"/><line class=\"d-ln\" x1=\"126\" y1=\"266\" x2=\"126\" y2=\"200\"/><text class=\"d-s\" x=\"88\" y=\"292\" text-anchor=\"middle\">gateway on access switch<\/text><rect class=\"d-rt\" x=\"36\" y=\"192\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M42 198h16M42 203h16\"/><rect class=\"d-rt\" x=\"112\" y=\"192\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M118 198h16M118 203h16\"/><rect class=\"d-rt\" x=\"36\" y=\"258\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M42 264h16M42 269h16\"/><rect class=\"d-rt\" x=\"112\" y=\"258\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M118 264h16M118 269h16\"/><text class=\"d-h\" x=\"184\" y=\"166\" text-anchor=\"start\">HYBRID<\/text><line class=\"d-ln d-dash\" x1=\"230\" y1=\"200\" x2=\"306\" y2=\"200\"/><line class=\"d-ln\" x1=\"230\" y1=\"266\" x2=\"230\" y2=\"200\"/><line class=\"d-ln\" x1=\"230\" y1=\"266\" x2=\"306\" y2=\"200\"/><line class=\"d-ln d-dash\" x1=\"306\" y1=\"266\" x2=\"230\" y2=\"200\"/><line class=\"d-ln d-red\" x1=\"306\" y1=\"266\" x2=\"306\" y2=\"200\"/><text class=\"d-s\" x=\"268\" y=\"292\" text-anchor=\"middle\">mixed; STP still runs<\/text><rect class=\"d-rt\" x=\"216\" y=\"192\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M222 198h16M222 203h16\"/><rect class=\"d-rt\" x=\"292\" y=\"192\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M298 198h16M298 203h16\"/><rect class=\"d-rt\" x=\"216\" y=\"258\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M222 264h16M222 269h16\"/><rect class=\"d-rt\" x=\"292\" y=\"258\" width=\"28\" height=\"16\" rx=\"2\"/><path class=\"d-x\" d=\"M298 264h16M298 269h16\"/><text class=\"d-s\" x=\"180\" y=\"308\" text-anchor=\"middle\">Solid = routed · dashed = Layer 2 · red = blocked by STP<\/text><\/svg>"}, {"tbl": [["Design", "Where routing starts", "Uplinks", "Key point"], ["Traditional Layer 2", "Distribution (with HSRP/VRRP)", "802.1Q trunks; STP blocks one per VLAN", "Simple, but half the uplinks sit idle and convergence waits on STP and FHRP timers"], ["Updated Layer 2", "Distribution, now one logical switch (VSS, StackWise Virtual or StackWise)", "Multichassis EtherChannel (MEC); both active", "No STP blocking and no FHRP needed. Load sharing comes from the EtherChannel hash."], ["Layer 3 (routed access)", "Access switch", "Routed links with ECMP", "Fastest convergence (under 200 ms). No STP or FHRP, but a VLAN can't span access switches."], ["Hybrid", "Some VLANs at access, some at distribution", "Mixed", "Used when a VLAN must span closets (e.g. sensors or security devices). Downside: STP is back."]]}, {"p": "Why is routed access so fast? Each access switch has two equal-cost routes up, both in its CEF forwarding table. If a link dies, the switch just drops that entry and keeps forwarding on the other one. It doesn't wait for anything to recalculate."}, {"tip": "In both Layer 2 designs the distribution switches are the default gateways, and the access-to-distribution links are Layer 2 trunks. In the Layer 3 design the access switch is the gateway."}, {"check": [5, 6, 2, 7, 1, 8, 9]}]}, {"h": "Sizing the campus", "b": [{"tbl": [["Size", "End devices", "Typical design"], ["Small", "Fewer than 200", "Core and distribution collapsed into one switch (or pair). A low-end multilayer switch is enough."], ["Medium", "200 to 1,000", "Access switches connecting to a pair of campus distribution switches"], ["Large", "Thousands, several buildings", "Full three layers with a separate core"]]}, {"check": [10]}]}, {"h": "Power over Ethernet", "b": [{"p": "PoE sends power down the same cable as the data, so phones, access points and cameras don't need a power outlet. The switch is the power sourcing equipment (PSE), and the device is the powered device (PD). Some power is lost in the cable, so the device gets less than the switch sends:"}, {"tbl": [["Standard", "At the switch", "At the device", "Pairs"], ["PoE (802.3af)", "15.4 W", "12.95 W", "2"], ["PoE+ (802.3at)", "30 W", "25.5 W", "2"], ["Cisco UPOE", "60 W", "51 W", "4"], ["Cisco UPOE+", "90 W", "71.3 W", "4"]]}, {"p": "Two Cisco resilience features matter when a switch restarts:"}, {"ul": ["Perpetual PoE keeps power flowing to devices while the switch's control plane reloads, so phones stay up.", "Fast PoE restores power quickly when the switch is powered up, before the operating system has fully booted."]}, {"p": "Wake on LAN (WoL) is the reverse idea: a \"magic packet\" switches on a sleeping PC so it can be patched. To send it from another subnet, routers must allow directed broadcasts."}, {"check": [12]}]}, {"h": "A word on cloud", "b": [{"p": "The course also touches on cloud models, because campus users increasingly reach applications that aren't in the building:"}, {"ul": ["Public cloud: a provider's shared service anyone can sign up for, such as Dropbox or WordPress hosting. Security is shared between the provider and the customer.", "Private cloud: cloud-style infrastructure run for one organization. That organization is responsible for all of its security.", "Hybrid cloud: a mix of the two."]}, {"check": [3, 11]}]}, {"h": "Key takeaways", "b": [{"ul": ["Core = fast transport. Distribution = policy, inter-VLAN routing and summarization. Access = user ports and edge features. Small sites collapse core and distribution.", "Local VLANs are recommended: scalable, predictable and easy to troubleshoot. End-to-end VLANs follow the user but don't scale.", "Traditional Layer 2: STP blocks an uplink; gateways and FHRP at distribution.", "Updated Layer 2: VSS or StackWise makes the distribution pair one switch; MEC uses both uplinks; no FHRP.", "Layer 3 access: the access switch is the gateway; ECMP and CEF give sub-200 ms recovery.", "Hybrid: mixed, and its downside is STP.", "Small campus under 200 devices; medium 200 to 1,000.", "PoE 15.4 W, PoE+ 30 W, UPOE 60 W, UPOE+ 90 W at the switch. Perpetual PoE survives a control-plane reload."]}, {"tip": "Common traps: routed access, not VSS, is the sub-200 ms answer. MEC load sharing uses EtherChannel hashing, not STP. A private cloud's owner handles all of its security."}]}], "verified": [["Hierarchical model benefits: cost savings, ease of understanding, modular growth, fault isolation", "p. 382–383"], ["Core: fast transport, redundancy, low latency, consistent diameter, no CPU-heavy processing", "p. 383–385"], ["Distribution: policy, summarization, inter-VLAN routing, QoS and security; access: Layer 2, PoE, port security, marking", "p. 385–387"], ["Local VLANs recommended (scalable, predictable, faster convergence, easier troubleshooting); end-to-end VLANs follow the user but don't scale", "p. 394"], ["PoE 15.4/12.95 W, PoE+ 30/25.5 W, UPOE 60/51 W, UPOE+ 90/71.3 W; WoL needs directed broadcasts across routers", "p. 401–402"], ["Access designs: traditional Layer 2 (STP blocks, distribution gateways), updated Layer 2 with VSS and MEC (no FHRP), Layer 3 (access gateways, no FHRP), hybrid (STP remains)", "p. 424–426"], ["Stacking makes one logical switch whose uplinks can form MECs", "p. 428"], ["CEF keeps a second equal-cost entry so traffic continues without waiting for routing convergence", "p. 394"], ["Medium campus 200 to 1,000 devices; small under 200", "p. 448–449"]], "course": ["Sub-200 ms recovery figure for routed access", "StackWise as the MEC-hashing example", "Perpetual PoE and Fast PoE", "Public and private cloud examples and security responsibility"]}, "Discovering Service Provider-Managed VPNs": {"mins": 15, "intro": "Most enterprises rent their WAN from a service provider. This lesson covers how to choose a WAN service, the transport options, how an MPLS Layer 3 VPN works inside (VRFs, RDs, RTs, MP-BGP), and what happens when you run OSPF, EIGRP or BGP across one.", "parts": [{"h": "Choosing a WAN service", "b": [{"p": "The first question is always what's available. A design means nothing if no provider offers that service at your sites, and rural sites have far fewer options than big cities. After availability comes cost. Then the technical decision points:"}, {"ul": ["SLA: what the provider guarantees (uptime, latency, loss).", "Scalability: whether the service can grow with you.", "Convergence: how quickly connectivity recovers after a failure."]}, {"check": [1, 0, 2, 23]}]}, {"h": "Transport options", "b": [{"tbl": [["Option", "What it is"], ["Layer 2 VPN (VPWS, VPLS)", "The provider extends an Ethernet segment between sites. VPWS is point-to-point; VPLS is multipoint, so all sites look like one VLAN. You run your own routing; more expensive."], ["MPLS Layer 3 VPN", "The provider routes your traffic between sites. Cheaper and more scalable; your routers exchange routes with the provider's."], ["Metro Ethernet", "Ethernet handoff across a metro area, 100 Mbps to 10 Gbps and up"], ["SONET/SDH", "Circuit-based optical rings with self-healing; OC-3 is 155 Mbps, OC-12 is 622 Mbps"], ["DWDM", "Many wavelengths of light on one fibre pair, each like several 10 Gbps links. High-capacity private transport between data centres in a metro area."], ["Dark fibre", "Unlit fibre you light yourself. You control the framing and must design your own redundancy."], ["4G/5G", "Cellular, as a primary or backup link"]]}, {"check": [24]}]}, {"h": "Inside an MPLS Layer 3 VPN", "b": [{"p": "MPLS forwards packets by short labels instead of looking up the destination at every hop. There are three router roles:"}, {"dia": "<svg viewBox=\"0 0 360 154\" role=\"img\" aria-label=\"MPLS Layer 3 VPN: customer edge routers connect to provider edge routers holding VRFs, joined across label-switching P routers, with MP-BGP between the PEs\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><rect class=\"d-box\" x=\"98\" y=\"22\" width=\"164\" height=\"96\" rx=\"3\"/><text class=\"d-s\" x=\"180\" y=\"16\" text-anchor=\"middle\">Provider MPLS network<\/text><line class=\"d-ln\" x1=\"30\" y1=\"80\" x2=\"120\" y2=\"80\"/><line class=\"d-ln\" x1=\"120\" y1=\"80\" x2=\"180\" y2=\"80\"/><line class=\"d-ln\" x1=\"180\" y1=\"80\" x2=\"240\" y2=\"80\"/><line class=\"d-ln\" x1=\"240\" y1=\"80\" x2=\"330\" y2=\"80\"/><path class=\"d-ln d-dash\" d=\"M120 68 Q180 30 240 68\"/><text class=\"d-s\" x=\"180\" y=\"44\" text-anchor=\"middle\">MP-BGP (VPNv4)<\/text><circle class=\"d-rt\" cx=\"30\" cy=\"80\" r=\"10\"/><path class=\"d-x\" d=\"M25 77h10M25 83h10\"/><text class=\"d-t\" x=\"30\" y=\"106\" text-anchor=\"middle\">CE<\/text><text class=\"d-s\" x=\"30\" y=\"64\" text-anchor=\"middle\">Site A<\/text><circle class=\"d-rt\" cx=\"120\" cy=\"80\" r=\"10\"/><path class=\"d-x\" d=\"M115 77h10M115 83h10\"/><text class=\"d-t\" x=\"120\" y=\"106\" text-anchor=\"middle\">PE<\/text><circle class=\"d-rt\" cx=\"180\" cy=\"80\" r=\"10\"/><path class=\"d-x\" d=\"M175 77h10M175 83h10\"/><text class=\"d-t\" x=\"180\" y=\"106\" text-anchor=\"middle\">P<\/text><circle class=\"d-rt\" cx=\"240\" cy=\"80\" r=\"10\"/><path class=\"d-x\" d=\"M235 77h10M235 83h10\"/><text class=\"d-t\" x=\"240\" y=\"106\" text-anchor=\"middle\">PE<\/text><circle class=\"d-rt\" cx=\"330\" cy=\"80\" r=\"10\"/><path class=\"d-x\" d=\"M325 77h10M325 83h10\"/><text class=\"d-t\" x=\"330\" y=\"106\" text-anchor=\"middle\">CE<\/text><text class=\"d-s\" x=\"330\" y=\"64\" text-anchor=\"middle\">Site B<\/text><text class=\"d-s\" x=\"120\" y=\"122\" text-anchor=\"middle\">VRFs<\/text><text class=\"d-s\" x=\"180\" y=\"122\" text-anchor=\"middle\">labels only<\/text><text class=\"d-s\" x=\"240\" y=\"122\" text-anchor=\"middle\">VRFs<\/text><text class=\"d-s\" x=\"180\" y=\"146\" text-anchor=\"middle\">CE peers only with its PE; P routers never see customer routes<\/text><\/svg>"}, {"tbl": [["Router", "Where", "Job"], ["CE (customer edge)", "Your site", "Peers only with its PE (static, OSPF, EIGRP or BGP). Never with other CEs or P routers."], ["PE (provider edge)", "Provider's edge", "Holds a VRF for each customer, learns the CE's routes into it, and carries them to other PEs with MP-BGP"], ["P (provider)", "Provider core", "Just swaps labels. No VRFs and no customer routes."]]}, {"p": "Three mechanisms keep customers apart:"}, {"ul": ["VRF: a separate routing table per customer on the PE, so two customers can both use 10.0.0.0/8.", "Route distinguisher (RD): a 64-bit value added in front of each IPv4 prefix to make a 96-bit VPNv4 route, so MP-BGP can carry overlapping prefixes without confusing them.", "Route target (RT): a BGP extended community. PEs export routes with certain RTs and import routes with matching RTs, which decides which VRFs get which routes (and builds extranets)."]}, {"tip": "The RD makes routes unique; the RT decides where they go."}, {"p": "MPLS separates customers logically with VRFs and labels, but it doesn't encrypt anything. Traffic crosses the provider's network in the clear, so add IPsec or GETVPN if you need confidentiality."}, {"p": "The trade-off for simplicity: the provider runs your WAN routing, so convergence and reliability aren't under your control, and you depend on the provider."}, {"check": [3, 4, 10, 5, 11, 12, 13, 14, 15, 6]}]}, {"h": "OSPF across MPLS", "b": [{"p": "When every site runs OSPF, the MPLS VPN acts as a super backbone: an extra layer above each site's area 0 that joins them. Within each site, area 0 is still the backbone every area connects to."}, {"p": "The PEs behave like ABRs on that super backbone. MP-BGP carries enough OSPF detail (as extended communities: the area, the route type and the metric type, E1 or E2) for the far PE to rebuild the route correctly. Routes that were intra-area at one site arrive at the other as interarea routes: Type 3 summary LSAs."}, {"tip": "Strictly, Cisco's OSPF extended communities are Domain ID, Route Type and Router ID, with area and metric type inside the Route Type field. The course answer is area number, route type, and metric type."}, {"p": "That causes a problem with a backdoor link: a direct link between two sites that bypasses the MPLS VPN, often kept as a backup. Over the backdoor, routes stay intra-area. OSPF always prefers intra-area over interarea before it even compares cost, so traffic takes the backdoor even when MPLS is cheaper."}, {"dia": "<svg viewBox=\"0 0 360 160\" role=\"img\" aria-label=\"Two OSPF sites joined by an MPLS super backbone and a direct backdoor link, with a sham link between the PEs\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><rect class=\"d-box\" x=\"8\" y=\"8\" width=\"110\" height=\"120\" rx=\"3\"/><text class=\"d-s\" x=\"14\" y=\"20\" text-anchor=\"start\">Site A, area 0<\/text><rect class=\"d-box\" x=\"242\" y=\"8\" width=\"110\" height=\"120\" rx=\"3\"/><text class=\"d-s\" x=\"248\" y=\"20\" text-anchor=\"start\">Site B, area 0<\/text><circle class=\"d-rt\" cx=\"64\" cy=\"100\" r=\"10\"/><path class=\"d-x\" d=\"M59 97h10M59 103h10\"/><circle class=\"d-rt\" cx=\"296\" cy=\"100\" r=\"10\"/><path class=\"d-x\" d=\"M291 97h10M291 103h10\"/><text class=\"d-t\" x=\"64\" y=\"124\" text-anchor=\"middle\">CE<\/text><text class=\"d-t\" x=\"296\" y=\"124\" text-anchor=\"middle\">CE<\/text><circle class=\"d-rt\" cx=\"150\" cy=\"52\" r=\"10\"/><path class=\"d-x\" d=\"M145 49h10M145 55h10\"/><circle class=\"d-rt\" cx=\"210\" cy=\"52\" r=\"10\"/><path class=\"d-x\" d=\"M205 49h10M205 55h10\"/><text class=\"d-t\" x=\"150\" y=\"76\" text-anchor=\"middle\">PE<\/text><text class=\"d-t\" x=\"210\" y=\"76\" text-anchor=\"middle\">PE<\/text><line class=\"d-ln\" x1=\"72\" y1=\"93\" x2=\"140\" y2=\"58\"/><line class=\"d-ln\" x1=\"220\" y1=\"58\" x2=\"288\" y2=\"93\"/><line class=\"d-ln\" x1=\"160\" y1=\"52\" x2=\"200\" y2=\"52\"/><path class=\"d-ln d-dash\" d=\"M150 40 Q180 14 210 40\"/><text class=\"d-s\" x=\"180\" y=\"22\" text-anchor=\"middle\">sham link<\/text><line class=\"d-ln d-red\" x1=\"74\" y1=\"100\" x2=\"286\" y2=\"100\"/><text class=\"d-s\" x=\"180\" y=\"116\" text-anchor=\"middle\">backdoor link (intra-area)<\/text><text class=\"d-s\" x=\"180\" y=\"88\" text-anchor=\"middle\">MPLS super backbone<\/text><text class=\"d-s\" x=\"180\" y=\"152\" text-anchor=\"middle\">Without the sham link, MPLS routes arrive as Type 3 and lose to the backdoor<\/text><\/svg>"}, {"p": "The fix is a sham link: a logical intra-area link between the two PEs. Now the MPLS path is intra-area too, and OSPF compares the two paths by cost on equal terms."}, {"check": [7, 8, 9, 18, 19, 20]}]}, {"h": "EIGRP and BGP across MPLS", "b": [{"p": "EIGRP: if sites use different AS numbers, routes redistributed through MP-BGP arrive at the remote site as EIGRP external routes, with administrative distance 170 (internal is 90). If all sites use the same AS, the BGP cost community can keep them internal."}, {"p": "BGP: with eBGP between CE and PE, the AS path does loop prevention: a router rejects any route that already has its own AS number in the path. If every site uses the same private AS, each site sees its own number in routes from the others and drops them. Two fixes:"}, {"ul": ["as-override on the PE replaces the customer's AS number in the outbound AS path with the provider's.", "allowas-in on the CE tells it to accept routes containing its own AS number."]}, {"check": [16, 17, 21, 22]}]}, {"h": "Key takeaways", "b": [{"ul": ["Check availability first, then cost. Technical decision points: SLA, scalability, convergence.", "VPWS point-to-point and VPLS multipoint are Layer 2; MPLS L3 VPN is routed by the provider. DWDM = many wavelengths for metro data-centre links.", "CE peers only with PE; PE holds VRFs and runs MP-BGP; P swaps labels.", "VRF isolates, RD makes VPNv4 routes unique, RT controls import/export. MPLS doesn't encrypt.", "Downside: provider dependency; convergence isn't yours.", "OSPF: the MPLS super backbone sits above area 0; PE-generated routes are Type 3. A backdoor wins because it's intra-area; a sham link fixes that.", "EIGRP across different AS numbers = external (AD 170). Same BGP AS at every site: as-override on the PE or allowas-in on the CE."]}, {"tip": "Common traps: P routers don't hold customer routes. RD isn't RT. OSPF compares route type before cost."}]}], "verified": [["Technology availability limits WAN choice; major cities have more options", "p. 473"], ["Layer 2 VPN (VPLS, VPWS) lets you run your own IGP; more expensive; Layer 3 cheaper and more scalable", "p. 474"], ["CE, PE and P router roles", "p. 475–476"], ["Metro Ethernet 100 Mbps to 10 Gbps; SONET/SDH rings, OC-3 155 Mbps, OC-12 622 Mbps", "p. 476–478"], ["DWDM multiple wavelengths per fibre; dark fibre framing and redundancy designed by the enterprise", "p. 478–479"], ["VPLS: multipoint Layer 2 domain; BGP for large VPLS domains", "p. 494"], ["MPLS L3 VPN uses BGP; SP manages routing; VRF per VPN; labels keep overlapping addresses apart; encryption can be added", "p. 495–496"], ["GETVPN for encryption on private WANs", "p. 497"]], "course": ["Availability, cost, SLA, scalability and convergence as decision points", "Route distinguisher and route target", "OSPF super backbone, Type 3 LSAs, backdoor links and sham links", "OSPF extended communities", "EIGRP external routes across MPLS and the cost community", "as-override and allowas-in"]}};

  <div class="secnav"><button type="button" class="tool" id="gBack">← All sections</button></div>
  ${lessonTabs(name)}
  <div class="gsec lsn">
    <h2>${esc(s.name)}<small>Lesson · about ${L.mins} min</small></h2>
    ${k===0?`<p class="tsub" style="font-size:.95rem">${esc(L.intro)}</p>`:''}
    <details class="fold ltoc"><summary>Contents · part ${k+1} of ${n}</summary><ol>${L.parts.map((p,i)=>`<li class="${i<=(S.lread[name]||0)?'done':''}"><button type="button" data-p="${i}" class="${i===k?'cur':''}">${esc(p.h)}</button></li>`).join('')}<li><button type="button" data-p="ver">Checked against the Cert Guide</button></li></ol></details>
    <div class="lprog"><i style="width:${(k+1)/n*100}%"></i></div>
    <span class="lmeta">PART ${k+1} OF ${n}</span>
    <h3 class="lh">${esc(part.h)}</h3>
    ${part.b.map(b=>lBlock(b,s)).join('')}
    ${last&&L.verified?`<details class="fold lver" id="lver"><summary>Checked against the Cert Guide</summary>
      <p class="tsub">Each point below was checked against the ENSLD 300-420 Official Cert Guide (PDF page numbers).</p>
      <ul>${L.verified.map(v=>`<li>${esc(v[0])} <span class="pg">${esc(v[1])}</span></li>`).join('')}</ul>
      ${L.course&&L.course.length?`<p class="tsub" style="margin-top:6px">Not covered in the Cert Guide. These come from the course material and its practice questions:</p><ul>${L.course.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:''}</details>`:''}
  </div>
  <div class="secnav">${k>0?`<button type="button" class="tool" id="lPrev">← ${esc(L.parts[k-1].h)}</button>`:'<span></span>'}
    ${last?`<button type="button" class="go" id="lDone" style="flex:0 1 auto">Go to the questions →</button>`:`<button type="button" class="go" id="lNext" style="flex:0 1 auto">Next: ${esc(L.parts[k+1].h)} →</button>`}</div>`;
  $('gBack').onclick=()=>{S.gsec=null;save();renderGuide();goTo(0)};
  const go=i=>{S.lpart[name]=i;save();renderLesson(name);goTo(0)};
  if($('lPrev'))$('lPrev').onclick=()=>go(k-1);
  if($('lNext'))$('lNext').onclick=()=>go(k+1);
  if($('lDone'))$('lDone').onclick=()=>{S.gtab[name]='qs';save();renderGuide();goTo(0)};
  g.querySelectorAll('.ltoc button').forEach(b=>b.onclick=()=>{if(b.dataset.p==='ver'){go(n-1);setTimeout(()=>{const v=$('lver');if(v){v.open=true;jumpTo('lver')}},50)}else go(+b.dataset.p)});
  g.querySelectorAll('.ltab').forEach(b=>b.onclick=()=>{S.gtab[name]=b.dataset.t;save();renderGuide();goTo(0)});
}

renderGuide();setView(S.view);
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></body></html>
