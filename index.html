// ----- lessons -----
const LESSONS={"OSPF Design": {"mins": 18, "intro": "How OSPF scales, and the design choices the exam asks about: areas, LSA types, stub area flavours, where to put the ABR, and how to keep a big OSPF network stable.", "parts": [{"h": "How OSPF works, in two minutes", "b": [{"p": "OSPF is a link-state interior gateway protocol. Instead of passing routing tables around like a distance-vector protocol, each router describes its own links in link-state advertisements (LSAs) and floods them to the other routers in its area."}, {"p": "Every router in an area ends up with an identical copy of that information, the link-state database (LSDB). Each router then runs Dijkstra's shortest path first (SPF) algorithm on its own copy to build a loop-free tree of best paths, and that becomes its routing table."}, {"ul": ["OSPFv2 is for IPv4; OSPFv3 is for IPv6 (and can now carry IPv4 too). The design ideas are the same in both.", "It runs directly over IP (protocol 89) and uses multicast: 224.0.0.5 for all OSPF routers and 224.0.0.6 for the DR and BDR (FF02::5 and FF02::6 in OSPFv3).", "The metric is cost. By default cost = 100 Mbps ÷ interface bandwidth, never lower than 1.", "Hellos every 10 seconds on broadcast and point-to-point links (30 on NBMA). Administrative distance is 110."]}, {"tip": "The default reference bandwidth makes every link of 100 Mbps or faster cost 1, so OSPF can't tell a 1 Gbps link from a 100 Gbps one. Raise the reference bandwidth, and do it the same on every router."}]}, {"h": "Why areas exist", "b": [{"p": "In one big area, every router stores every LSA and reruns SPF whenever any link anywhere changes. As the network grows, that costs memory, CPU and bandwidth, and one unstable link can keep the whole network busy."}, {"p": "Areas fix this by splitting the network into a two-level hierarchy. Area 0, the backbone, sits at the top, and every other area attaches to it. Traffic between two non-backbone areas always crosses Area 0."}, {"ul": ["Detailed topology (Type 1 and 2 LSAs) stays inside its area, so each LSDB is smaller.", "A change in one area triggers a full SPF only in that area. Other areas just see a changed summary.", "Less flooding, because LSAs don't cross area borders in detail.", "Area borders are where you can summarize, which shrinks routing tables everywhere else."]}, {"dia": "<svg viewBox=\"0 0 360 296\" role=\"img\" aria-label=\"Multi-area OSPF: Area 0 with two ABRs, a stub area and an NSSA with an ASBR\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><rect class=\"d-box d-boxa\" x=\"60\" y=\"8\" width=\"240\" height=\"72\" rx=\"3\"/><text class=\"d-s\" x=\"66\" y=\"20\" text-anchor=\"start\">Area 0 (backbone)<\/text><line class=\"d-ln\" x1=\"180\" y1=\"44\" x2=\"110\" y2=\"80\"/><line class=\"d-ln\" x1=\"180\" y1=\"44\" x2=\"250\" y2=\"80\"/><circle class=\"d-rt\" cx=\"180\" cy=\"44\" r=\"10\"/><path class=\"d-x\" d=\"M175 41h10M175 47h10\"/><text class=\"d-t\" x=\"180\" y=\"29\" text-anchor=\"middle\">Backbone<\/text><rect class=\"d-box\" x=\"8\" y=\"104\" width=\"164\" height=\"124\" rx=\"3\"/><text class=\"d-s\" x=\"14\" y=\"116\" text-anchor=\"start\">Area 1 (stub)<\/text><rect class=\"d-box\" x=\"188\" y=\"104\" width=\"164\" height=\"124\" rx=\"3\"/><text class=\"d-s\" x=\"194\" y=\"116\" text-anchor=\"start\">Area 2 (NSSA)<\/text><line class=\"d-ln\" x1=\"110\" y1=\"80\" x2=\"60\" y2=\"156\"/><line class=\"d-ln\" x1=\"250\" y1=\"80\" x2=\"300\" y2=\"156\"/><circle class=\"d-rt\" cx=\"110\" cy=\"80\" r=\"10\"/><path class=\"d-x\" d=\"M105 77h10M105 83h10\"/><text class=\"d-t\" x=\"94\" y=\"84\" text-anchor=\"end\">ABR 1<\/text><circle class=\"d-rt\" cx=\"250\" cy=\"80\" r=\"10\"/><path class=\"d-x\" d=\"M245 77h10M245 83h10\"/><text class=\"d-t\" x=\"266\" y=\"84\">ABR 2<\/text><circle class=\"d-rt\" cx=\"60\" cy=\"156\" r=\"10\"/><path class=\"d-x\" d=\"M55 153h10M55 159h10\"/><text class=\"d-t\" x=\"60\" y=\"178\" text-anchor=\"middle\">Internal<\/text><circle class=\"d-rt\" cx=\"300\" cy=\"156\" r=\"10\"/><path class=\"d-x\" d=\"M295 153h10M295 159h10\"/><text class=\"d-t\" x=\"300\" y=\"178\" text-anchor=\"middle\">ASBR<\/text><text class=\"d-t d-redt\" x=\"92\" y=\"124\">Type 3<\/text><text class=\"d-t d-redt\" x=\"284\" y=\"138\" text-anchor=\"end\">Type 7<\/text><text class=\"d-s\" x=\"16\" y=\"202\">Type 1 and 2 stay inside.<\/text><text class=\"d-s\" x=\"16\" y=\"214\">Gets Type 3 + default, no Type 5.<\/text><text class=\"d-s\" x=\"196\" y=\"202\">Local externals<\/text><text class=\"d-s\" x=\"196\" y=\"214\">enter as Type 7.<\/text><line class=\"d-ln d-dash\" x1=\"300\" y1=\"180\" x2=\"300\" y2=\"236\"/><rect class=\"d-cloud\" x=\"248.0\" y=\"237\" width=\"104\" height=\"26\" rx=\"13\"/><text class=\"d-t\" x=\"300\" y=\"254\" text-anchor=\"middle\">External routes<\/text><text class=\"d-s\" x=\"16\" y=\"276\" text-anchor=\"start\">ABRs pass summaries (Type 3) between areas.<\/text><text class=\"d-s\" x=\"16\" y=\"288\" text-anchor=\"start\">ABR 2 turns Type 7 into Type 5 for the rest of the domain.<\/text><\/svg>"}, {"p": "What actually limits OSPF scale comes down to router resources (memory, CPU and interface bandwidth), driven by:"}, {"ul": ["the number of prefixes,", "how often links flap,", "how many neighbours each router has,", "how many routers share an area."]}, {"check": [1, 5, 13]}]}, {"h": "Router roles", "b": [{"tbl": [["Role", "What it is"], ["Internal router", "Every interface is in one area. Keeps one LSDB."], ["Backbone router", "At least one interface in Area 0."], ["ABR (area border router)", "Interfaces in Area 0 and at least one other area. Keeps a separate LSDB for each area and advertises summaries (Type 3) between them."], ["ASBR (AS boundary router)", "Redistributes external routes (static, EIGRP, BGP and so on) into OSPF."]]}, {"p": "One router can hold several roles at once. A router with interfaces in Area 0 and Area 1 that also redistributes a static route is a backbone router, an ABR and an ASBR."}, {"check": [8, 9]}]}, {"h": "The LSA types you must know", "b": [{"p": "The exam expects you to know LSAs by number and by name."}, {"tbl": [["Type", "Name", "Who sends it", "How far it goes"], ["1", "Router", "Every router", "Its own area"], ["2", "Network", "The DR on a multi-access segment", "Its own area"], ["3", "Summary (network)", "ABR", "Into other areas: inter-area routes"], ["4", "ASBR summary", "ABR", "Tells other areas how to reach the ASBR"], ["5", "AS external", "ASBR", "The whole OSPF domain, except stub-type areas"], ["7", "NSSA external", "ASBR inside an NSSA", "Only the NSSA. The ABR translates it to Type 5."]]}, {"p": "External routes come in two flavours. E2, the default, keeps the cost set at redistribution and ignores the internal path to the ASBR. E1 adds the internal cost to reach the ASBR, which is better when there are several exit points and you want the closest one used."}, {"check": [14]}]}, {"h": "Stub, totally stubby and NSSA", "b": [{"p": "A branch area with one way out doesn't need the full list of every external route. Special area types cut LSAs and replace them with a default route."}, {"tbl": [["Area type", "Blocks", "Gets instead", "Can have an ASBR?"], ["Normal", "Nothing", "Everything (1, 2, 3, 4, 5)", "Yes"], ["Stub", "Type 4 and 5 (externals)", "Type 3 + default from the ABR", "No"], ["Totally stubby (Cisco)", "Type 3, 4 and 5", "Just a default from the ABR", "No"], ["NSSA", "Type 4 and 5", "Type 3. Default only if configured", "Yes, using Type 7"], ["Totally NSSA (Cisco)", "Type 3, 4 and 5", "A default from the ABR", "Yes, using Type 7"]]}, {"ul": ["If several ABRs serve a stub area, they all inject a default, and traffic goes to the closest one.", "Area 0 can never be a stub, and stub areas can't carry virtual links.", "NSSA is the answer whenever a branch must redistribute something local, such as a static route or a small EIGRP island, but should still be protected from the domain's Type 5 externals."]}, {"tip": "Stub areas still see inter-area (Type 3) routes. Only totally stubby areas drop those too. The exam loves asking which routes a totally stubby area doesn't get: both external and inter-area."}, {"check": [0, 7, 16]}]}, {"h": "Designing areas well", "b": [{"p": "Good OSPF design is mostly about where you draw the area borders and how addressing lines up with them."}, {"ul": ["Give each area a contiguous address block. Then the ABR can advertise one summary instead of dozens of routes, and a flap inside the area is hidden behind it.", "Summarize at the ABRs, which in a campus usually means the distribution layer.", "Keep the backbone small and stable, with as few routers in Area 0 as you can.", "Don't redistribute connected routes such as loopbacks as externals when a network statement or passive interface will do. It adds external LSAs for no reason.", "Avoid virtual links. They patch an area that has lost its connection to Area 0, but they're a repair, not a design."]}, {"p": "Hub-and-spoke WANs get their own rule: put the area boundary at the hub. The hub is the ABR, and each spoke (with its WAN link) sits in a non-backbone area. A flapping spoke link then only disturbs its own area, and the small branch router runs SPF for just its own area."}, {"dia": "<svg viewBox=\"0 0 360 206\" role=\"img\" aria-label=\"Hub-and-spoke OSPF: area boundary at the hub versus one big Area 0\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><text class=\"d-h\" x=\"8\" y=\"14\" text-anchor=\"start\">RECOMMENDED<\/text><rect class=\"d-box d-boxa\" x=\"4\" y=\"22\" width=\"166\" height=\"44\" rx=\"3\"/><text class=\"d-s\" x=\"10\" y=\"34\" text-anchor=\"start\">Area 0<\/text><circle class=\"d-rt\" cx=\"87\" cy=\"46\" r=\"10\"/><path class=\"d-x\" d=\"M82 43h10M82 49h10\"/><text class=\"d-t\" x=\"102\" y=\"50\">Hub (ABR)<\/text><rect class=\"d-box\" x=\"4\" y=\"76\" width=\"54\" height=\"92\" rx=\"3\"/><text class=\"d-s\" x=\"31\" y=\"162\" text-anchor=\"middle\">Area 1<\/text><line class=\"d-ln\" x1=\"87\" y1=\"56\" x2=\"31\" y2=\"120\"/><circle class=\"d-rt\" cx=\"31\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M26 117h10M26 123h10\"/><rect class=\"d-box\" x=\"60\" y=\"76\" width=\"54\" height=\"92\" rx=\"3\"/><text class=\"d-s\" x=\"87\" y=\"162\" text-anchor=\"middle\">Area 2<\/text><line class=\"d-ln\" x1=\"87\" y1=\"56\" x2=\"87\" y2=\"120\"/><circle class=\"d-rt\" cx=\"87\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M82 117h10M82 123h10\"/><rect class=\"d-box\" x=\"116\" y=\"76\" width=\"54\" height=\"92\" rx=\"3\"/><text class=\"d-s\" x=\"143\" y=\"162\" text-anchor=\"middle\">Area 3<\/text><line class=\"d-ln\" x1=\"87\" y1=\"56\" x2=\"143\" y2=\"120\"/><circle class=\"d-rt\" cx=\"143\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M138 117h10M138 123h10\"/><text class=\"d-s\" x=\"87\" y=\"186\" text-anchor=\"middle\">One area per spoke and WAN link<\/text><text class=\"d-s\" x=\"87\" y=\"198\" text-anchor=\"middle\">A flap stays in that area<\/text><text class=\"d-h\" x=\"194\" y=\"14\" text-anchor=\"start\">AVOID<\/text><rect class=\"d-box d-boxa\" x=\"190\" y=\"22\" width=\"166\" height=\"146\" rx=\"3\"/><text class=\"d-s\" x=\"196\" y=\"34\" text-anchor=\"start\">Area 0 (everything)<\/text><circle class=\"d-rt\" cx=\"273\" cy=\"46\" r=\"10\"/><path class=\"d-x\" d=\"M268 43h10M268 49h10\"/><text class=\"d-t\" x=\"288\" y=\"50\">Hub<\/text><line class=\"d-ln\" x1=\"273\" y1=\"56\" x2=\"217\" y2=\"120\"/><circle class=\"d-rt\" cx=\"217\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M212 117h10M212 123h10\"/><line class=\"d-ln\" x1=\"273\" y1=\"56\" x2=\"273\" y2=\"120\"/><circle class=\"d-rt\" cx=\"273\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M268 117h10M268 123h10\"/><line class=\"d-ln\" x1=\"273\" y1=\"56\" x2=\"329\" y2=\"120\"/><circle class=\"d-rt\" cx=\"329\" cy=\"120\" r=\"10\"/><path class=\"d-x\" d=\"M324 117h10M324 123h10\"/><path class=\"d-ln d-red\" d=\"M230 92l10 10M240 92l-10 10\"/><text class=\"d-s\" x=\"273\" y=\"186\" text-anchor=\"middle\">Any spoke flap floods everyone<\/text><text class=\"d-s\" x=\"273\" y=\"198\" text-anchor=\"middle\">and reruns SPF everywhere<\/text><\/svg>"}, {"p": "Don't lump all branches into one big area either. That brings back the original problem, with every branch flap felt by every branch."}, {"tbl": [["Command", "Where", "Summarizes"], ["area 1 range 10.20.0.0 255.255.252.0", "ABR", "Inter-area routes from Area 1 (Type 3)"], ["summary-address 192.168.8.0 255.255.252.0", "ASBR", "External routes being redistributed (Type 5/7)"]]}, {"check": [2, 10, 21, 22, 15]}]}, {"h": "Neighbours, DRs and network types", "b": [{"p": "Every adjacency costs hellos, database exchanges and flooding. On a shared segment with many routers, a full mesh of adjacencies would be wasteful, so OSPF elects a designated router (DR) and a backup (BDR)."}, {"ul": ["Every other router (a DROTHER) forms full adjacencies only with the DR and BDR, sending updates to 224.0.0.6. The DR then floods them to everyone on 224.0.0.5.", "The DR also originates the segment's Type 2 network LSA.", "Election: highest interface priority wins (default 1); a tie goes to the highest router ID. Priority 0 means never DR or BDR.", "The election isn't pre-emptive. A better router added later doesn't take over until the DR and BDR both fail. If the DR fails, the BDR is promoted."]}, {"p": "For a router with many neighbours, the design advice is to spread the load: if one router sits on several LAN segments, it shouldn't be DR on all of them. Once the number of adjacencies gets large, go hierarchical."}, {"p": "On hub-and-spoke (NBMA-style) WANs, use the point-to-multipoint network type. It needs no DR, treats each spoke as a separate link to the hub, and avoids the DR problems a broadcast type causes when spokes can't reach each other."}, {"check": [17, 6, 3]}]}, {"h": "Fast, stable convergence", "b": [{"p": "OSPF's own hellos detect a dead neighbour in tens of seconds by default. Tuning them down costs CPU, because they run in the control plane. The better tool is BFD."}, {"ul": ["BFD (Bidirectional Forwarding Detection) is a lightweight hello that detects a forwarding failure in under a second and tells OSPF immediately.", "It isn't tied to one protocol: the same mechanism serves OSPF, EIGRP, IS-IS and BGP. Parts of it can run in hardware, so it's lighter than aggressive routing timers.", "Graceful restart (also called NSF) keeps packets forwarding on known routes while a router switches to its standby supervisor, so neighbours don't reconverge needlessly."]}, {"p": "Two lesser-known protections from the course:"}, {"ul": ["OSPF database protection (max-lsa) caps the number of non-self-generated LSAs a router will accept, so a flood of LSAs (from a misconfiguration, say) can't exhaust its memory.", "OSPF flood reduction sets the DoNotAge bit, so unchanged LSAs aren't re-flooded every 30 minutes. That's useful on stable links where refresh traffic is just overhead."]}, {"p": "When something is wrong, the symptom to look for is neighbours repeatedly changing state along with frequent SPF runs. That points to an unstable link or a control-plane problem."}, {"check": [11, 4, 12, 18]}]}, {"h": "Areas are not security", "b": [{"p": "It's tempting to think putting Finance in Area 20 and Employees in Area 10 separates them. It doesn't. Areas divide routing information, not traffic: routers still know how to reach every prefix, and packets flow between areas freely."}, {"p": "To enforce separation you need a firewall or ACLs, placed on the actual forwarding path between the zones. A firewall can only inspect traffic that passes through it."}, {"check": [19, 20]}]}, {"h": "Key takeaways", "b": [{"ul": ["Areas exist to limit LSDB size, SPF runs and flooding, and to make summarization possible. Everything connects through Area 0.", "Know the LSAs: 1 router, 2 network (DR), 3 summary (ABR), 4 ASBR summary, 5 external, 7 NSSA external.", "Stub blocks externals. Totally stubby blocks externals and inter-area routes. NSSA blocks externals but allows a local ASBR using Type 7.", "Use contiguous addressing per area, and summarize at the ABR with area range (summary-address is for externals on an ASBR).", "In hub-and-spoke designs, put the ABR at the hub, give each spoke its own area, and use point-to-multipoint.", "Use BFD for sub-second detection rather than aggressive hello timers.", "Areas aren't a security boundary; use firewalls or ACLs."]}, {"tip": "Common traps: an ABR keeps a database for every area it's in, not just Area 0. Stub areas still receive Type 3. A new higher-priority router doesn't steal the DR role."}]}], "verified": [["Link-state, identical LSDB per area, SPF; IP protocol 89; multicast 224.0.0.5/224.0.0.6", "p. 259, 262, 267"], ["Cost = 10^8 ÷ bandwidth, minimum 1; raise the reference bandwidth on all routers", "p. 259–260"], ["Hello 10 s (30 s on NBMA)", "p. 260"], ["Benefits of areas: fewer SPF runs, less flooding, summarization at ABRs, topology hiding; Area 0 required", "p. 263"], ["Hub-and-spoke: area boundary at the hub; don't put all branches in one area", "p. 264"], ["Router types; an ABR keeps an LSDB for each of its areas", "p. 265–266, 276"], ["DR/BDR: priority default 1, tie goes to highest router ID, 0 = never; not pre-emptive; DR sends Type 2", "p. 266–267"], ["LSA types 1–5 and 7 and their flooding scope; E1 vs E2, E2 by default", "p. 268–270"], ["Stub, totally stubby, NSSA and totally NSSA behaviour; NSSA gets no default unless configured", "p. 270–272"], ["Virtual links are a temporary fix through a transit area", "p. 272"], ["Summarize at the distribution layer; assign addresses so they can be summarized", "p. 303–304"], ["BFD: sub-second, protocol-independent, less CPU than tuned timers; GR/NSF keeps forwarding during switchover", "p. 311–312"], ["OSPFv3 keeps the same areas, router types and LSA ideas; FF02::5/FF02::6", "p. 274–276"]], "course": ["OSPF scalability factors (memory, CPU, bandwidth; prefixes, flaps, neighbours, routers per area)", "Point-to-multipoint recommended for hub-and-spoke", "Database protection (max-lsa) and flood reduction (DoNotAge)", "Keep the backbone small; don't redistribute connected loopbacks", "area range vs summary-address commands"]}, "Designing an IPv4 Address Plan": {"mins": 17, "intro": "How to build an IPv4 address plan that scales: subnetting and VLSM, a hierarchy that summarizes cleanly, addressing standards, voice and overlay subnets, NAT, and how addresses get handed out.", "parts": [{"h": "What a good address plan does", "b": [{"p": "An address plan is the foundation everything else sits on. Routing summaries, firewall rules, QoS policies and troubleshooting all get easier or harder depending on how addresses were laid out."}, {"p": "A good plan does four things:"}, {"ul": ["Gives every device an address, including the things nobody thinks of at first: phones, wireless, cameras, badge readers, building systems, loopbacks and management.", "Leaves room to grow. Sites get new services all the time, so size subnets for where they'll be, not where they are.", "Lets you summarize, so each site or region is advertised as one route.", "Makes traffic types easy to tell apart, so filters and QoS can match a whole range instead of individual hosts."]}, {"p": "The first step is the topology. Before choosing a single subnet, count the locations, the devices per location, and what each site needs (data, voice, wireless, video and so on)."}, {"tip": "Balance growth against waste. For 50 users, a /26 (62 hosts) is tight and a /25 (126) leaves room, but oversizing every subnet burns the space you'll later want for voice or video."}, {"check": [0]}]}, {"h": "IPv4 essentials", "b": [{"p": "A quick refresher on the pieces the exam expects you to know cold."}, {"ul": ["An IPv4 address is 32 bits, written as four decimal octets (10.1.1.1).", "The header is 20 bytes without options. Key fields: TTL (decremented by each router, packet dropped at 0), Protocol (what's inside, such as 6 for TCP or 89 for OSPF), and the ToS byte.", "The ToS byte (now called the DiffServ field) carries QoS markings. DSCP uses its upper 6 bits.", "Old classful ranges still show up in questions: Class D (224 to 239) is multicast, and Class E (240 and up) is reserved."]}, {"p": "RFC 1918 reserves three ranges for private use. They aren't routed on the internet, so you reach the internet through NAT."}, {"tbl": [["Range", "Prefix", "Typical use"], ["10.0.0.0 to 10.255.255.255", "10.0.0.0/8", "Large enterprises: room for a full hierarchy"], ["172.16.0.0 to 172.31.255.255", "172.16.0.0/12", "Mid-size networks, or a second range alongside 10/8"], ["192.168.0.0 to 192.168.255.255", "192.168.0.0/16", "Small sites and home routers"]]}, {"tip": "172.16.0.0/12 stops at 172.31. An address like 172.32.1.1 is public, and that's a classic distractor."}, {"check": [11, 12, 13]}]}, {"h": "Subnetting and VLSM", "b": [{"p": "A subnet mask splits an address into a network part and a host part. With n host bits you get 2ⁿ − 2 usable hosts, since the all-zeros address is the subnet itself and the all-ones address is the broadcast."}, {"tbl": [["Prefix", "Mask", "Usable hosts", "Typical use"], ["/22", "255.255.252.0", "1,022", "Large LAN"], ["/23", "255.255.254.0", "510", "Large LAN"], ["/24", "255.255.255.0", "254", "Standard user VLAN"], ["/25", "255.255.255.128", "126", "Floor with room to grow"], ["/26", "255.255.255.192", "62", "Small LAN"], ["/27", "255.255.255.224", "30", "Small LAN"], ["/28", "255.255.255.240", "14", "Small device group"], ["/30", "255.255.255.252", "2", "Router-to-router link"], ["/32", "255.255.255.255", "1 (the address itself)", "Loopback"]]}, {"p": "Variable-length subnet masking (VLSM) means using different mask lengths inside the same network, sizing each subnet to what it actually needs. You carve a big block into site blocks, then carve each site block into data, voice, wireless, point-to-point and loopback subnets."}, {"ul": ["Point-to-point links get a /30 (two usable addresses). Many platforms also support /31, which saves two more.", "Loopbacks get a /32: one address that identifies the router."]}, {"p": "Loopbacks are worth their own reserved range. They never go down as long as the router has any working path, so they're the right address for router IDs, management access, monitoring sources, BGP peerings and voice gateways (for example, dial peers)."}, {"check": [17, 14, 8, 4]}]}, {"h": "Build it as a hierarchy", "b": [{"p": "The single most important rule: give each part of the network one contiguous block, and carve smaller blocks out of it. Company, then region, then site, then VLAN."}, {"dia": "<svg viewBox=\"0 0 360 240\" role=\"img\" aria-label=\"Hierarchical IPv4 allocation: company /8, regional /10s, a site /20, and /24 VLANs\"><defs><marker id=\"ar\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L8 4L0 8z\" class=\"d-arh\"/><\/marker><\/defs><rect class=\"d-box d-boxa\" x=\"105.0\" y=\"6\" width=\"150\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"180\" y=\"20\" text-anchor=\"middle\">10.0.0.0/8<\/text><text class=\"d-s\" x=\"180\" y=\"33\" text-anchor=\"middle\">Whole company<\/text><line class=\"d-ln\" x1=\"180\" y1=\"40\" x2=\"64\" y2=\"64\"/><rect class=\"d-box\" x=\"10.0\" y=\"64\" width=\"108\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"64\" y=\"78\" text-anchor=\"middle\">10.0.0.0/10<\/text><text class=\"d-s\" x=\"64\" y=\"91\" text-anchor=\"middle\">Americas<\/text><line class=\"d-ln\" x1=\"180\" y1=\"40\" x2=\"180\" y2=\"64\"/><rect class=\"d-box\" x=\"126.0\" y=\"64\" width=\"108\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"180\" y=\"78\" text-anchor=\"middle\">10.64.0.0/10<\/text><text class=\"d-s\" x=\"180\" y=\"91\" text-anchor=\"middle\">Europe<\/text><line class=\"d-ln\" x1=\"180\" y1=\"40\" x2=\"296\" y2=\"64\"/><rect class=\"d-box\" x=\"242.0\" y=\"64\" width=\"108\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"296\" y=\"78\" text-anchor=\"middle\">10.128.0.0/10<\/text><text class=\"d-s\" x=\"296\" y=\"91\" text-anchor=\"middle\">Asia-Pacific<\/text><line class=\"d-ln\" x1=\"64\" y1=\"98\" x2=\"64\" y2=\"120\"/><rect class=\"d-box\" x=\"10.0\" y=\"120\" width=\"108\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"64\" y=\"134\" text-anchor=\"middle\">10.0.16.0/20<\/text><text class=\"d-s\" x=\"64\" y=\"147\" text-anchor=\"middle\">Ottawa site<\/text><line class=\"d-ln\" x1=\"64\" y1=\"154\" x2=\"70\" y2=\"178\"/><rect class=\"d-box\" x=\"20.0\" y=\"178\" width=\"100\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"70\" y=\"192\" text-anchor=\"middle\">10.0.16.0/24<\/text><text class=\"d-s\" x=\"70\" y=\"205\" text-anchor=\"middle\">Data<\/text><line class=\"d-ln\" x1=\"64\" y1=\"154\" x2=\"180\" y2=\"178\"/><rect class=\"d-box\" x=\"130.0\" y=\"178\" width=\"100\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"180\" y=\"192\" text-anchor=\"middle\">10.0.20.0/24<\/text><text class=\"d-s\" x=\"180\" y=\"205\" text-anchor=\"middle\">Voice<\/text><line class=\"d-ln\" x1=\"64\" y1=\"154\" x2=\"290\" y2=\"178\"/><rect class=\"d-box\" x=\"240.0\" y=\"178\" width=\"100\" height=\"34\" rx=\"3\"/><text class=\"d-t\" x=\"290\" y=\"192\" text-anchor=\"middle\">10.0.24.0/24<\/text><text class=\"d-s\" x=\"290\" y=\"205\" text-anchor=\"middle\">Wireless<\/text><text class=\"d-s\" x=\"130\" y=\"134\">The site advertises one route (its /20);<\/text><text class=\"d-s\" x=\"130\" y=\"146\">the region advertises one /10.<\/text><text class=\"d-s\" x=\"180\" y=\"232\" text-anchor=\"middle\">Each level owns one contiguous block, so each level can be summarized<\/text><\/svg>"}, {"p": "Compare that with a network where subnets were handed out as needed: 10.10.4.0/24 in Asia, 10.10.6.0/24 in the Americas, 10.10.8.0/24 in Europe. Nothing can be summarized, routing tables grow with every new subnet, and nobody can tell where a subnet lives just by looking at it."}, {"p": "A typical large site might get a /20, which is sixteen /24s. A common pattern is four for data, four for voice, four for wireless, and the rest for links, loopbacks and management. Matching the subnet to the VLAN number (10.10.150.0 for VLAN 150) makes the plan almost self-documenting."}, {"p": "Worked example: 16 branches share a /16, and each needs up to 12 /24 networks. Twelve rounds up to sixteen (a power of two), and sixteen /24s make a /20. Sixteen /20s fit exactly in a /16, so each branch gets one /20 and is advertised as a single route."}, {"check": [15, 19, 2, 7]}]}, {"h": "Summarization", "b": [{"p": "A summary replaces a run of contiguous subnets with one shorter prefix. It shrinks routing tables, cuts update traffic, and hides flaps inside the summarized block."}, {"p": "To work out a summary by hand:"}, {"ul": ["Find the first octet where the first and last subnets differ.", "Count how many values that octet spans (last − first + 1) and round up to a power of two. That tells you how many bits to take off.", "Check that the first subnet sits on that boundary (it's a multiple of the block size). If it doesn't, one summary won't cover the range exactly."]}, {"tbl": [["Range", "Differing octet", "Span", "Summary"], ["10.3.8.0 to 10.3.15.0", "3rd: 8 to 15", "8 = 2³, take 3 bits off /24", "10.3.8.0/21"], ["192.168.8.0 to 192.168.11.0", "3rd: 8 to 11", "4 = 2², take 2 bits off /24", "192.168.8.0/22"], ["10.10.128.0 to 10.10.191.0", "3rd: 128 to 191", "64 = 2⁶, take 6 bits off /24", "10.10.128.0/18"]]}, {"p": "The last row is the Cert Guide's site example: data, voice, wireless, badge and server subnets spread across 10.10.130 to 10.10.176 all sit inside 10.10.128.0/18, so the whole site is advertised as one route, provided the site owns that entire block."}, {"tip": "The course phrases the method as \"subtract the first octet that is different and round up to a power of 2\". Strictly it's last − first + 1 (8 to 15 is eight values, not seven), but rounding up to the power of two gives the same mask either way."}, {"check": [1]}]}, {"h": "Standards and the three-step process", "b": [{"p": "The Cert Guide frames an address plan as three steps:"}, {"ul": ["Define addressing standards.", "Plan the IPv4 range and allocate it.", "Document the plan."]}, {"p": "Standards are the conventions everyone follows, so anyone can read an address and know what it is. Common ones:"}, {"ul": ["The default gateway is always .1 (or always .254).", "The VLAN number matches the third octet (VLAN 150 uses 10.10.150.0).", "Reserve the low addresses (say .1 to .15) for static devices and give the rest to the DHCP pool.", "User subnets come from 10.x.x.x and are /24s, with a parallel /24 for voice.", "Name DHCP-assigned ranges in DNS by location (bldg2-floor3), since the host addresses inside them keep changing."]}, {"p": "In the Cert Guide's campus case study, floor 1 of building A gets VLAN 11 with 10.10.11.0/24 for data and VLAN 111 with 10.10.111.0/24 for voice. Building B uses the 20s and 120s. Point-to-point links come from 10.10.2.0/24 as /30s, loopbacks from 10.10.1.0/24 as /32s, and 10.10.3.0/24 is set aside for access control."}, {"check": [6]}]}, {"h": "Voice and overlay subnets", "b": [{"p": "IP phones belong in their own VLAN and subnet, separate from the PCs. It makes QoS simple (match the whole voice subnet), lets you filter what can reach the phones, and makes troubleshooting easier."}, {"p": "But what if the existing plan has no spare subnets left for voice? That's where overlay subnets come in. You add a second, separate private range on top of the existing plan, for example 172.16.x.x for voice alongside 10.x.x.x for data, instead of readdressing the data network."}, {"ul": ["The requirement: an extra private address space that isn't used anywhere else.", "The benefit: scalability in a network that was never designed for the new service.", "A bonus: a different range for each traffic type makes filters and QoS rules easy to write."]}, {"check": [3, 10]}]}, {"h": "Public addresses, NAT and PAT", "b": [{"p": "Inside the enterprise, use private addresses. Use public addresses only where something faces the internet: public web and DNS servers, e-commerce, and VPN termination."}, {"ul": ["Static NAT (one-to-one) is for internal servers that must be reachable from outside.", "PAT (many-to-one, using port numbers) is for users browsing out. One public address can carry thousands of sessions.", "DMZ servers can simply be given public addresses, which avoids NAT for them altogether."]}, {"tbl": [["NAT term", "Meaning"], ["Inside local", "The real (usually private) address of your host"], ["Inside global", "What your host is translated to on the outside"], ["Outside global", "The real address of the remote host on the internet"], ["Outside local", "How that remote host appears from inside your network"]]}, {"p": "Overlapping addresses happen in mergers, when both companies used the same private ranges. Readdressing is the cleanest fix because it removes the overlap for good. In practice, NAT is often used as a workaround, or the new network is given a different private range, because readdressing a live network is disruptive."}, {"tip": "If the question asks for the cleanest solution to overlap, the answer is readdressing. If it asks what avoids readdressing, it's NAT or another private range."}, {"check": [16, 5, 9]}]}, {"h": "Handing out addresses", "b": [{"p": "Infrastructure gets static addresses: routers, switches, servers, printers, anything you need to manage at a fixed address. End devices (PCs, phones, wireless clients, even access points) get theirs from DHCP."}, {"p": "The DHCP exchange is DORA:"}, {"ul": ["Discover: the client broadcasts to 255.255.255.255 looking for a server.", "Offer: a server offers an address, lease time and options.", "Request: the client asks for (accepts) that offer.", "Acknowledge: the server confirms the lease. A NAK means it refused."]}, {"p": "DHCP runs over UDP, with the server on port 67 and the client on port 68. Routers don't forward broadcasts, so when the server is on another subnet, the client's gateway acts as a relay agent (ip helper-address on Cisco). Place DHCP servers in the data centre or server farm, and at branches."}, {"check": [18]}]}, {"h": "Key takeaways", "b": [{"ul": ["Start from the topology: count locations, devices and services, then size for growth.", "Know the RFC 1918 ranges: 10/8, 172.16/12 (ends at 172.31) and 192.168/16.", "Hosts = 2ⁿ − 2. Use /30 (or /31) for point-to-point links and /32 for loopbacks; /24 for user VLANs.", "Allocate hierarchically with contiguous blocks (company, region, site, VLAN) so each level summarizes to one route.", "To summarize, find the differing octet, round its span up to a power of two, and take that many bits off.", "Set standards (gateway .1, VLAN = third octet, a static range) and document the plan.", "Put voice on separate subnets. Overlay subnets need an extra private range and avoid readdressing.", "Private addresses inside. Static NAT for servers, PAT for users, public addresses in the DMZ. Readdressing is the cleanest fix for overlap.", "Static addresses for infrastructure, DHCP (DORA, UDP 67/68, relay) for clients."]}, {"tip": "Common traps: 172.32.x.x is not private. A /26 has 62 usable hosts, not 64. NAT hides overlapping ranges but doesn't fix them."}]}], "verified": [["IPv4 header is 20 bytes without options; ToS field carries IP precedence/DSCP; TTL and Protocol fields", "p. 44–46"], ["Class D is multicast, Class E reserved", "p. 58"], ["RFC 1918 ranges 10/8, 172.16/12, 192.168/16, and which size of organization tends to use each", "p. 60"], ["NAT vs PAT; static and dynamic NAT; overlapping networks; inside/outside local/global terms", "p. 61–63"], ["Hosts = 2ⁿ − 2; /24 common on LANs, /30 on point-to-point links, /32 on loopbacks", "p. 65–68"], ["Factors for an address plan: number of locations and devices, site requirements, subnet size", "p. 66–67"], ["VLSM: size each subnet to its need; carve site blocks into data, voice, wireless, links and loopbacks", "p. 70–72"], ["Reasons to use loopbacks: always up, router ID, management, IP telephony dial peers, monitoring source", "p. 73"], ["Separate voice subnets for QoS and troubleshooting; overlay subnets use a different private range", "p. 73–74"], ["Large site gets a /20 split into data, voice and wireless /24s", "p. 75–76"], ["Plan for growth; balance scalability against efficiency (the /25 vs /26 example)", "p. 77"], ["New design is cleanest, but avoid readdressing in practice: use another private range or NAT", "p. 78"], ["Summarize a site as 10.10.128.0/18; allocate contiguous blocks per region. (The book labels its regional example blocks /18; the ranges it describes only add up as /10s, which is what this lesson uses.)", "p. 78–80"], ["Public addresses only on internet-facing services; static NAT for servers, PAT for clients", "p. 80–81"], ["Three steps: define standards, plan and allocate, document; standards such as gateway .1/.254, VLAN = third octet, static .1–.15", "p. 81–82"], ["Campus case study: VLAN 11/111 for data and voice, /30 links from 10.10.2.0/24, loopbacks from 10.10.1.0/24", "p. 83–85"], ["Static addressing for infrastructure, DHCP for clients; DORA; UDP 67/68; relay agents; where to place DHCP servers", "p. 86–89"]], "course": ["Determining the summary mask by \"subtracting the differing octet and rounding up to a power of 2\" (the lesson explains the exact form)", "Naming DHCP ranges in DNS by location", "\"User subnets from 10.x.x.x/24\" as a standard (the book recommends /24s for users without naming a range)", "Readdressing as the cleanest fix for overlapping ranges (the book agrees it's cleanest but recommends avoiding it)", "/31 point-to-point links"]}};
S.gtab=S.gtab||{};S.lpart=S.lpart||{};S.lread=S.lread||{};
function lessonTabs(name){if(!LESSONS[name])return'';const t=S.gtab[name]==='qs'?'qs':'lesson';
  return `<div class="ltabs"><button type="button" class="ltab" data-t="lesson" aria-pressed="${t==='lesson'}">Lesson</button><button type="button" class="ltab" data-t="qs" aria-pressed="${t==='qs'}">Questions (${DATA[SECBY[name]].qs.length})</button></div>`}
function lBlock(b,s){
  if(b.p)return `<p class="lp">${esc(b.p)}</p>`;
  if(b.ul)return `<ul class="lu">${b.ul.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(b.tbl)return `<div class="ltbl"><table><thead><tr>${b.tbl[0].map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${b.tbl.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(b.dia)return `<div class="dia">${b.dia}</div>`;
  if(b.tip)return `<p class="ctip"><b>Exam tip</b>${esc(b.tip)}</p>`;
  if(b.check)return `<div class="lcheck"><span class="label">Check yourself</span>${b.check.map(i=>{const c=s.qs[i];if(!c)return'';
    return `<details class="gq"><summary><h3><span class="n">Q${i+1}</span><span>${esc(c.card||c.q)}${c.dup?'':starBtn(cid(s.name,i,c.q))}</span></h3>${c.dia?`<div class="dia">${c.dia}</div>`:''}<span class="tapr">Show answer</span></summary>${qBody(c.ca?Object.assign({},c,{a:c.ca}):c,'')}</details>`}).join('')}</div>`;
  return '';
}
function renderLesson(name){
  const g=$('guide'),si=SECBY[name],s=DATA[si],L=LESSONS[name],n=L.parts.length;
  let k=Math.min(S.lpart[name]||0,n-1);S.lread[name]=Math.max(S.lread[name]||0,k);save();
  const part=L.parts[k],last=k===n-1;
  g.innerHTML=`
  <div class="secnav"><button type="button" class="tool" id="gBack">← All sections</button></div>
  ${lessonTabs(name)}
  <div class="gsec lsn">
    <h2>${esc(s.name)}<small>Lesson · about ${L.mins} min</small></h2>
    ${k===0?`<p class="tsub" style="font-size:.95rem">${esc(L.intro)}</p>`:''}
    <details class="fold ltoc"><summary>Contents · part ${k+1} of ${n}</summary><ol>${L.parts.map((p,i)=>`<li class="${i<=(S.lread[name]||0)?'done':''}"><button type="button" data-p="${i}" class="${i===k?'cur':''}">${esc(p.h)}</button></li>`).join('')}<li><button type="button" data-p="ver">Checked against the Cert Guide</button></li></ol></details>
    <div class="lprog"><i style="width:${(k+1)/n*100}%"></i></div>
    <span class="lmeta">PART ${k+1} OF ${n}</span>
    <h3 class="lh">${esc(part.h)}</h3>
    ${part.b.map(b=>lBlock(b,s)).join('')}
    ${last&&L.verified?`<details class="fold lver" id="lver"><summary>Checked against the Cert Guide</summary>
      <p class="tsub">Each point below was checked against the ENSLD 300-420 Official Cert Guide (PDF page numbers).</p>
      <ul>${L.verified.map(v=>`<li>${esc(v[0])} <span class="pg">${esc(v[1])}</span></li>`).join('')}</ul>
      ${L.course&&L.course.length?`<p class="tsub" style="margin-top:6px">Not covered in the Cert Guide. These come from the course material and its practice questions:</p><ul>${L.course.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:''}</details>`:''}
  </div>
  <div class="secnav">${k>0?`<button type="button" class="tool" id="lPrev">← ${esc(L.parts[k-1].h)}</button>`:'<span></span>'}
    ${last?`<button type="button" class="go" id="lDone" style="flex:0 1 auto">Go to the questions →</button>`:`<button type="button" class="go" id="lNext" style="flex:0 1 auto">Next: ${esc(L.parts[k+1].h)} →</button>`}</div>`;
  $('gBack').onclick=()=>{S.gsec=null;save();renderGuide();goTo(0)};
  const go=i=>{S.lpart[name]=i;save();renderLesson(name);goTo(0)};
  if($('lPrev'))$('lPrev').onclick=()=>go(k-1);
  if($('lNext'))$('lNext').onclick=()=>go(k+1);
  if($('lDone'))$('lDone').onclick=()=>{S.gtab[name]='qs';save();renderGuide();goTo(0)};
  g.querySelectorAll('.ltoc button').forEach(b=>b.onclick=()=>{if(b.dataset.p==='ver'){go(n-1);setTimeout(()=>{const v=$('lver');if(v){v.open=true;jumpTo('lver')}},50)}else go(+b.dataset.p)});
  g.querySelectorAll('.ltab').forEach(b=>b.onclick=()=>{S.gtab[name]=b.dataset.t;save();renderGuide();goTo(0)});
}

renderGuide();setView(S.view);
